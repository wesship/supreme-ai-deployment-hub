# Supabase configuration for local development
# For complete reference, see https://supabase.com/docs/guides/cli/config
project_id = "supreme-ai-deployment-hub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
port = 54327
vector_port = 54328

[functions.ai-router]
verify_jwt = true

[functions.tars-plan]
verify_jwt = true

[functions.tars-summarize]
verify_jwt = true

[functions.tars-followup]
verify_jwt = true

# enqueue-task intentionally bypasses platform JWT verification because it is
# an external integration webhook that authenticates every request with
# HERMES_WEBHOOK_SECRET using HMAC-SHA256 before any privileged write.
[functions.enqueue-task]
verify_jwt = false
