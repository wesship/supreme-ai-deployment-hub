# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "devonn-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54323
max_header_length = 4096

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54325

[edge_runtime]
enabled = true
port = 54326
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
vector_port = 54328

[functions.ai-router]
verify_jwt = true

[functions.tars-plan]
verify_jwt = true

[functions.tars-summarize]
verify_jwt = true

[functions.tars-followup]
verify_jwt = true

# enqueue-task intentionally uses verify_jwt=false because it is a public
# integration webhook that performs its own HMAC-SHA256 authentication.
[functions.enqueue-task]
verify_jwt = false
