<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3VONN Portable AI</title><style>body{font-family:system-ui;margin:0;background:#0b0d10;color:#f5f5f5}main{max-width:760px;margin:8vh auto;padding:24px}textarea{width:100%;min-height:120px;background:#151920;color:#fff;border:1px solid #343943;border-radius:12px;padding:14px;box-sizing:border-box}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer}.status{margin-bottom:20px;opacity:.8}.answer{white-space:pre-wrap;margin-top:20px;padding:16px;background:#151920;border-radius:12px}</style></head><body><main><h1>D3VONN Portable AI</h1><div id="status" class="status">Checking local engine…</div><textarea id="message" placeholder="Ask your local AI…"></textarea><button id="send">Run Offline</button><div id="answer" class="answer"></div></main><script>const $=id=>document.getElementById(id);async function health(){try{const r=await fetch('http://127.0.0.1:8787/health');const x=await r.json();$('status').textContent=`Local engine: ${x.ok?'READY':'OFFLINE'} · voice: ${x.voice?'READY':'not configured'}`}catch(e){$('status').textContent='Local engine not running'}}$('send').onclick=async()=>{const message=$('message').value.trim();if(!message)return;$('answer').textContent='Thinking locally…';try{const r=await fetch('http://127.0.0.1:8787/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const x=await r.json();$('answer').textContent=x.message||x.error}catch(e){$('answer').textContent='Unable to reach the local engine.'}};health();</script></body></html>
