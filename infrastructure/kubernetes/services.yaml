apiVersion: v1
kind: Service
metadata:
  name: d3vonn-backend-service
  namespace: d3vonn
spec:
  type: LoadBalancer
  selector:
    app: d3vonn-backend
  ports:
    - port: 80
      targetPort: 8000 
---
apiVersion: v1
kind: Service
metadata:
  name: d3vonn-frontend-service
  namespace: d3vonn
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: d3vonn-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
