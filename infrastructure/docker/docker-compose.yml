version: '3.9'

# Devonn.AI — Local Development Stack
#
# Services:
#   frontend  — Vite dev server (hot reload)
#   backend   — FastAPI Python API
#   db        — PostgreSQL (mirrors Supabase schema locally)
#   redis     — Cache / session store
#   mailhog   — Local SMTP for email testing
#
# Usage:
#   docker compose up              # start all services
#   docker compose up frontend     # start frontend only
#   docker compose logs -f backend # tail backend logs
#   docker compose down -v         # stop and remove volumes

services:

  # ── Frontend (Vite + React) ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder          # use the builder stage for hot reload
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules      # prevent host node_modules from overriding
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - d3vonn-net

  # ── Backend (FastAPI Python) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app         # hot reload via uvicorn --reload
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://d3vonn:d3vonn_secret@db:5432/d3vonn_dev
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - d3vonn-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: d3vonn
      POSTGRES_PASSWORD: d3vonn_secret
      POSTGRES_DB: d3vonn_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations on first start
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - d3vonn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d3vonn -d d3vonn_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - d3vonn-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MailHog (local email testing) ───────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025 to view emails
    networks:
      - d3vonn-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  d3vonn-net:
    driver: bridge
