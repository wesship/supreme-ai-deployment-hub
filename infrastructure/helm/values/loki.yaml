# loki.yaml — Devonn.AI Production Log Aggregation
# Upgrades from SingleBinary/filesystem (dev-only) to SimpleScalable/S3 (production)
#
# Install: helm upgrade --install loki grafana/loki \
#            -n monitoring -f helm-values/loki.yaml

deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2

  # ── Production: use S3 instead of local filesystem ──────────────────────────
  storage:
    type: s3
    s3:
      region: us-east-1
      bucketnames: d3vonn-loki-logs
      # Uses IRSA (IAM Roles for Service Accounts) — no static credentials needed
      insecure: false

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # Retain logs for 30 days
    retention_period: 720h
    # Prevent a single tenant from flooding the system
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_series: 10000

  compactor:
    retention_enabled: true
    delete_request_store: s3

# ── Read/Write/Backend components ─────────────────────────────────────────────
read:
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

write:
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

backend:
  replicas: 2
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

# ── Promtail sidecar for Kubernetes pod log collection ─────────────────────────
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-gateway/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          # Parse JSON logs from the backend
          - json:
              expressions:
                level: level
                message: message
                timestamp: timestamp
          - labels:
              level:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

monitoring:
  selfMonitoring:
    enabled: true
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: true

test:
  enabled: false
