# =============================================================================
# D3VONN.IO — Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── Prometheus Self-Monitoring ─────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - job_name: "d3vonn-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          environment: "production"

  # ── Node Exporter (Host Metrics) ──────────────────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "hostinger-vps"

  # ── cAdvisor (Container Metrics) ──────────────────────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── Redis ──────────────────────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "redis"

  # ── Nginx (via stub_status module) ─────────────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:8080"]
        labels:
          service: "nginx"
