apiVersion: apps/v1
kind: Deployment
metadata:
  name: d3vonn-api
  namespace: d3vonn
  labels:
    app: d3vonn-api
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: argocd
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: d3vonn-api
  template:
    metadata:
      labels:
        app: d3vonn-api
      annotations:
        # Tetragon tracing enabled
        tetragon.cilium.io/trace: "true"
        # Falco monitoring enabled
        falco.security.io/monitor: "true"
    spec:
      serviceAccountName: d3vonn-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: Localhost
          localhostProfile: d3vonn-api.json
      containers:
        - name: api
          image: ghcr.io/wesship/d3vonn-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
