---
# Governance Engine: runs ArbitrationEngine and PolicyResolutionGraph
# Single-writer, multi-reader pattern; decisions are deterministic and logged
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-engine
  namespace: d3vonn-prod
  labels:
    app: governance-engine
    app.kubernetes.io/component: governance-engine
    app.kubernetes.io/part-of: d3vonn-platform
    version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: governance-engine
  template:
    metadata:
      labels:
        app: governance-engine
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: governance-engine
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: governance-engine
      containers:
        - name: governance-engine
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/governance-engine:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
            - name: metrics
              containerPort: 9090
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8082"
            - name: POLICY_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: d3vonn-platform-secrets
                  key: policy-store-url
            - name: AUDIT_LOG_URL
              valueFrom:
                secretKeyRef:
                  name: d3vonn-platform-secrets
                  key: audit-log-url
            - name: DECISION_CACHE_TTL_MS
              value: "5000"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policy-cache
              mountPath: /var/cache/policy
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy-cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-engine
  namespace: d3vonn-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: governance-engine
  namespace: d3vonn-prod
  labels:
    app: governance-engine
spec:
  selector:
    app: governance-engine
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: governance-engine
  namespace: d3vonn-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: governance-engine
