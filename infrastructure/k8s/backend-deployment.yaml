apiVersion: apps/v1
kind: Deployment
metadata:
  name: d3vonn-backend
  namespace: d3vonn
  labels:
    app: d3vonn-backend
    version: "1.0.0"
    tier: backend
  annotations:
    # Phase 5 hardening: added securityContext, resource limits, probes, and topology spread
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d3vonn-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: d3vonn-backend
        version: "1.0.0"
    spec:
      # ── Security: non-root, read-only filesystem ──────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # ── Spread pods across AZs for HA ─────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: d3vonn-backend

      # ── Service account with IRSA for AWS access ──────────────────────────
      serviceAccountName: d3vonn-backend-sa

      # ── Graceful shutdown ─────────────────────────────────────────────────
      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          image: ghcr.io/wesship/d3vonn-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          # ── Container security ────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # ── Resource budgets ──────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Health probes ─────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # ── Environment ───────────────────────────────────────────────────
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: d3vonn-secrets
                  key: database-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: d3vonn-secrets
                  key: openai-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: d3vonn-secrets
                  key: jwt-secret

          # ── Writable tmp dir (read-only root fs) ──────────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
# Horizontal Pod Autoscaler — scales 2–10 replicas based on CPU/memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: d3vonn-backend-hpa
  namespace: d3vonn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: d3vonn-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget — ensures at least 1 pod is always available during node drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: d3vonn-backend-pdb
  namespace: d3vonn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: d3vonn-backend
