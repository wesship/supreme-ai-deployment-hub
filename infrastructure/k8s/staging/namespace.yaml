apiVersion: v1
kind: Namespace
metadata:
  name: d3vonn-staging
  labels:
    environment: staging
    managed-by: d3vonn-platform
    tier: pre-production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: d3vonn-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
