<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title desc">
  <title id="title">D3VONN.IO Enterprise Intelligence Core</title>
  <desc id="desc">Official D3VONN.IO logo displayed inside the Hermes-linked command core panel.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#1f8cff" stop-opacity="0.32" />
      <stop offset="46%" stop-color="#0a4fa6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020b1c" stop-opacity="0" />
    </radialGradient>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.55 0 0 0 0 1 0 0 0 0.72 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="720" fill="#020b1c" />
  <rect width="480" height="720" fill="url(#coreGlow)" />
  <image
    href="/d3vonn-logo.webp?v=20260713"
    x="34"
    y="86"
    width="412"
    height="548"
