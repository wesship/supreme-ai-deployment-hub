    <g><rect x="628" y="272" width="104" height="56" rx="14" fill="url(#node)" stroke="#3b82f6" stroke-opacity="0.5"/><text x="680" y="296">GUARDIAN</text><text x="680" y="314" font-size="9" font-weight="500" fill="#93c5fd">SAFETY</text></g>
    <g><rect x="208" y="372" width="104" height="56" rx="14" fill="url(#node)" stroke="#3b82f6" stroke-opacity="0.5"/><text x="260" y="396">WORKFLOWS</text><text x="260" y="414" font-size="9" font-weight="500" fill="#93c5fd">AUTOMATION</text></g>
