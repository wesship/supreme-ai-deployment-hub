    <path d="M400 240 L120 300"/><path d="M400 240 L680 300"/>
    <path d="M400 240 L260 400"/><path d="M400 240 L540 400"/>
    <path d="M170 120 L630 120" stroke-dasharray="4 6" stroke-opacity="0.25"/>
    <path d="M120 300 L260 400" stroke-dasharray="4 6" stroke-opacity="0.25"/>
    <path d="M680 300 L540 400" stroke-dasharray="4 6" stroke-opacity="0.25"/>
