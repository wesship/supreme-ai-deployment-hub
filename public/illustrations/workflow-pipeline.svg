<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none" role="img" aria-label="Automated business workflow pipeline from goal to measurable outcome">
  <defs>
    <radialGradient id="g3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#020817"/>
  <rect width="800" height="300" fill="url(#g3)"/>
  <g stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)">
    <path d="M188 150 H236"/><path d="M388 150 H436"/><path d="M588 150 H636"/>
  </g>
  <g font-family="Inter, sans-serif" text-anchor="middle">
    <rect x="48" y="106" width="140" height="88" rx="16" fill="#0b1220" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="118" y="142" font-size="13" font-weight="800" fill="#dbeafe">GOAL</text>
    <text x="118" y="162" font-size="9.5" font-weight="500" fill="#93c5fd">business objective</text>
    <rect x="248" y="106" width="140" height="88" rx="16" fill="#0b1220" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="318" y="142" font-size="13" font-weight="800" fill="#dbeafe">PLAN</text>
    <text x="318" y="162" font-size="9.5" font-weight="500" fill="#93c5fd">Hermes task graph</text>
    <rect x="448" y="106" width="140" height="88" rx="16" fill="#0b1220" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="518" y="142" font-size="13" font-weight="800" fill="#dbeafe">EXECUTE</text>
    <text x="518" y="162" font-size="9.5" font-weight="500" fill="#93c5fd">agents + approvals</text>
    <rect x="648" y="106" width="140" height="88" rx="16" fill="#0b1220" stroke="#22c55e" stroke-opacity="0.55"/>
    <text x="718" y="142" font-size="13" font-weight="800" fill="#bbf7d0">OUTCOME</text>
    <text x="718" y="162" font-size="9.5" font-weight="500" fill="#86efac">measured + logged</text>
  </g>
  <g fill="#60a5fa">
    <circle cx="212" cy="150" r="3"><animate attributeName="cx" values="196;228;196" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="412" cy="150" r="3"><animate attributeName="cx" values="396;428;396" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="150" r="3"><animate attributeName="cx" values="596;628;596" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
