<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 389" role="img" aria-labelledby="title desc">
  <title id="title">D3VONN.IO — One Platform. Infinite Intelligence.</title>
  <desc id="desc">Official approved D3VONN.IO chrome-blue winged helmet landscape logo with the One Platform. Infinite Intelligence. slogan.</desc>
  <defs>
    <linearGradient id="sloganPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020816" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#061735" stop-opacity="0.99"/>
      <stop offset="1" stop-color="#020816" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="/d3vonn-logo.webp?v=20260714-approved" x="0" y="0" width="1170" height="389" preserveAspectRatio="xMidYMid meet"/>
  <rect x="326" y="224" width="812" height="118" rx="8" fill="url(#sloganPanel)"/>
  <line x1="370" y1="252" x2="515" y2="252" stroke="#40cfff" stroke-width="2" opacity="0.8"/>
  <line x1="948" y1="252" x2="1093" y2="252" stroke="#40cfff" stroke-width="2" opacity="0.8"/>
  <text x="732" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="3.2" fill="#eaf8ff" filter="url(#textGlow)">ONE PLATFORM. INFINITE INTELLIGENCE.</text>
</svg>
