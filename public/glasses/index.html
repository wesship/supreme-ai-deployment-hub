<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=600,height=600,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>D3VONN Glass</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 600px; min-height: 600px; background: #000; color: #fff; }
    main { width: 600px; min-height: 600px; padding: 42px; display: flex; flex-direction: column; justify-content: space-between; }
    header { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { font-size: 25px; font-weight: 900; letter-spacing: .18em; }
    .eyebrow, footer { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; color: rgba(255,255,255,.45); }
    .status { border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; }
    .current { padding: 38px 0; }
    h1 { margin: 12px 0 0; font-size: 42px; line-height: 1.05; }
    .sub { color: rgba(255,255,255,.5); font-size: 14px; }
    nav { display: grid; gap: 10px; }
    button { appearance: none; width: 100%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: #fff; padding: 17px 20px; display: flex; justify-content: space-between; font-size: 14px; text-align: left; }
    button:focus, button.focus { outline: 2px solid #fff; outline-offset: 2px; background: #fff; color: #000; }
    button strong { font-size: 11px; letter-spacing: .2em; }
    footer { text-align: center; padding-top: 24px; }
  </style>
</head>
<body>
<main aria-label="D3VONN Ray-Ban Display Web App">
  <header><div><div class="brand">D3VONN</div><div class="eyebrow">Wearable OS</div></div><div class="status" id="status">offline</div></header>
  <section class="current" aria-live="polite"><div class="eyebrow">Current</div><h1 id="message">D3VONN ready</h1><p class="sub">PRIMETIME · HNF Radio</p></section>
  <nav aria-label="D3VONN actions">
    <button class="focus" data-action="ask"><strong>ASK</strong><span>Ask D3VONN</span></button>
    <button data-action="play"><strong>PLAY</strong><span>HNF Radio</span></button>
    <button data-action="next"><strong>NEXT</strong><span>Next PRIMETIME</span></button>
    <button data-action="alerts"><strong>ALERT</strong><span>Notifications</span></button>
  </nav>
  <footer>D-pad ready · Consent-gated · No privileged secrets</footer>
</main>
<script>
  const buttons = [...document.querySelectorAll('button')];
  const message = document.getElementById('message');
  const status = document.getElementById('status');
  let index = 0;
  const apiBase = (window.D3VONN_API_BASE || '').replace(/\/$/, '');
  status.textContent = apiBase ? 'online' : 'local';
  function focusButton() { buttons.forEach((b, i) => b.classList.toggle('focus', i === index)); buttons[index].focus({ preventScroll: true }); }
  async function activate(action) {
    message.textContent = action === 'ask' ? 'Listening…' : action === 'play' ? 'HNF Radio' : action === 'next' ? 'PRIMETIME queued' : 'No new alerts';
    if (action !== 'ask' || !apiBase) return;
    try {
      const event = { event_id: crypto.randomUUID(), event_type: 'audio.command', occurred_at: new Date().toISOString(), source: { adapter: 'meta-display-webapp', device_id: 'display-webapp', session_id: crypto.randomUUID() }, correlation_id: crypto.randomUUID(), privacy: { classification: 'user_private', consent: true }, payload: { command: 'ask_d3vonn' }, capabilities: ['microphone','speaker'], audit: { policy_version: 'wearable-v1', trace_id: crypto.randomUUID() } };
      const response = await fetch(apiBase + '/api/v1/vision/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(event) });
      if (!response.ok) throw new Error('API');
    } catch { status.textContent = 'offline'; message.textContent = 'API unavailable'; }
  }
  buttons.forEach((button, i) => button.addEventListener('click', () => { index = i; focusButton(); activate(button.dataset.action); }));
  window.addEventListener('keydown', event => { if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { index = (index + 1) % buttons.length; focusButton(); } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { index = (index - 1 + buttons.length) % buttons.length; focusButton(); } else if (event.key === 'Enter') activate(buttons[index].dataset.action); });
</script>
</body>
</html>
