<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Preview the D3VONN wearable display interface for glanceable, governed AI actions. Hardware and backend integrations remain certification-gated."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="D3VONN Wearable Display Preview" />
    <meta
      property="og:description"
      content="A keyboard-operable preview of D3VONN's glanceable wearable interface."
    />
    <meta property="og:url" content="https://www.d3vonn.io/glasses/" />
    <link rel="canonical" href="https://www.d3vonn.io/glasses/" />
    <link rel="icon" type="image/svg+xml" href="/d3vonn-icon.svg?v=20260724-official" />
    <link rel="stylesheet" href="/glasses/glasses.css" />
    <title>D3VONN Wearable Display Preview</title>
  </head>
  <body>
    <a class="skip-link" href="#wearable-actions">Skip to wearable actions</a>
    <main id="main-content" aria-labelledby="display-title">
      <header class="display-header">
        <div>
          <p class="brand">D3VONN</p>
          <p class="eyebrow">Wearable OS</p>
        </div>
        <p class="status" data-status>Simulator</p>
      </header>

      <section class="current" aria-live="polite" aria-atomic="true">
        <p class="eyebrow">Preview response</p>
        <h1 id="display-title" data-message>D3VONN ready</h1>
        <p class="detail" data-detail>
          Choose an action to inspect its certification boundary. No device or backend action is sent.
        </p>
      </section>

      <nav id="wearable-actions" class="actions" aria-label="Wearable display preview actions">
        <button type="button" class="action is-active" data-action="ask" aria-current="true">
          <strong>ASK</strong><span>Ask D3VONN</span>
        </button>
        <button type="button" class="action" data-action="radio" tabindex="-1">
          <strong>PLAY</strong><span>HNF Radio</span>
        </button>
        <button type="button" class="action" data-action="primetime" tabindex="-1">
          <strong>NEXT</strong><span>PRIMETIME</span>
        </button>
        <button type="button" class="action" data-action="alerts" tabindex="-1">
          <strong>ALERT</strong><span>Notifications</span>
        </button>
      </nav>

      <footer>
        <p>Arrow keys + Enter · Local preview only</p>
        <a href="/privacy">Privacy</a>
      </footer>
    </main>
    <script src="/glasses/glasses.js" defer></script>
  </body>
</html>
