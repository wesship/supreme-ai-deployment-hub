# ArgoCD Application manifest for D3VONN.IO
# Deploy with: kubectl apply -f gitops/argocd/application.yaml
# Requires: ArgoCD installed in argocd namespace
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devonn-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Link back to this repository for traceability
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: devonn-ai
  source:
    repoURL: https://github.com/wesship/supreme-ai-deployment-hub
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
      jsonnet: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: devonn-ai
  syncPolicy:
    automated:
      prune: true        # Remove resources no longer in Git
      selfHeal: true     # Auto-correct drift from desired state
      allowEmpty: false  # Never sync an empty app
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Allow HPA to manage replicas
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devonn-ai
  namespace: argocd
spec:
  description: D3VONN.IO production platform
  sourceRepos:
    - https://github.com/wesship/supreme-ai-deployment-hub
  destinations:
    - namespace: devonn-ai
      server: https://kubernetes.default.svc
    - namespace: devonn-ai-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: kyverno.io
      kind: ClusterPolicy
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota  # Prevent quota changes via GitOps
  roles:
    - name: ci-deployer
      description: CI/CD pipeline deployment role
      policies:
        - p, proj:devonn-ai:ci-deployer, applications, sync, devonn-ai/*, allow
        - p, proj:devonn-ai:ci-deployer, applications, get, devonn-ai/*, allow
      jwtTokens: []
