# Falco Runtime Behavioral Detection Rules — Devonn.AI Platform
# https://falco.org/docs/rules/
#
# These rules detect anomalous behavior in the Devonn.AI API container
# and alert on potential exploitation, container escape, or data exfiltration.
#
# Severity levels: EMERGENCY, ALERT, CRITICAL, ERROR, WARNING, NOTICE, INFO, DEBUG

# ── Macros ────────────────────────────────────────────────────────────────
- macro: d3vonn_api_container
  condition: container.name startswith "d3vonn-api"

- macro: d3vonn_allowed_processes
  condition: >
    proc.name in (python3, uvicorn, gunicorn, nginx, node)

- macro: d3vonn_allowed_write_dirs
  condition: >
    fd.name startswith /tmp or
    fd.name startswith /var/log/d3vonn or
    fd.name startswith /app/logs

- macro: d3vonn_allowed_outbound_ports
  condition: fd.sport in (443, 80, 5432, 6379, 8000, 8080)

# ── Critical Rules ────────────────────────────────────────────────────────

# Detect shell spawned inside Devonn API container (RCE indicator)
- rule: Shell Spawned in Devonn API Container
  desc: >
    A shell process was spawned inside the Devonn API container.
    This is a strong indicator of Remote Code Execution (RCE) or container compromise.
    Distroless containers should never have shell access.
  condition: >
    d3vonn_api_container and
    spawned_process and
    proc.name in (bash, sh, zsh, dash, fish, tcsh, ksh, ash)
  output: >
    Shell spawned in Devonn API container
    (user=%user.name container=%container.name image=%container.image.repository
     proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
  priority: CRITICAL
  tags: [container, shell, rce, d3vonn]

# Detect unexpected process execution
- rule: Unexpected Process in Devonn Container
  desc: >
    A process not in the allowed list was executed inside the Devonn API container.
    This may indicate exploitation or malicious code injection.
  condition: >
    d3vonn_api_container and
    spawned_process and
    not d3vonn_allowed_processes
  output: >
    Unexpected process in Devonn container
    (user=%user.name container=%container.name proc=%proc.name
     parent=%proc.pname cmdline=%proc.cmdline image=%container.image.repository)
  priority: ERROR
  tags: [container, process, d3vonn]

# Detect write to sensitive filesystem locations
- rule: Write to Sensitive Path in Devonn Container
  desc: >
    A file write was detected to a sensitive filesystem path inside the Devonn container.
    Legitimate writes should only occur to /tmp and /app/logs.
  condition: >
    d3vonn_api_container and
    open_write and
    not d3vonn_allowed_write_dirs and
    not fd.name startswith /proc and
    not fd.name startswith /dev
  output: >
    Sensitive path write in Devonn container
    (user=%user.name container=%container.name file=%fd.name
     proc=%proc.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, filesystem, d3vonn]

# Detect privilege escalation attempt
- rule: Privilege Escalation Attempt in Devonn Container
  desc: >
    A setuid/setgid call was detected in the Devonn container.
    The container should run as nonroot (uid 65532) and never escalate privileges.
  condition: >
    d3vonn_api_container and
    evt.type in (setuid, setgid, setreuid, setregid) and
    user.uid != 65532
  output: >
    Privilege escalation attempt in Devonn container
    (user=%user.name uid=%user.uid container=%container.name
     proc=%proc.name syscall=%evt.type)
  priority: CRITICAL
  tags: [container, privilege-escalation, d3vonn]

# Detect outbound connection to unexpected port
- rule: Unexpected Outbound Connection from Devonn Container
  desc: >
    An outbound network connection was made to an unexpected port from the Devonn container.
    This may indicate data exfiltration or C2 communication.
  condition: >
    d3vonn_api_container and
    outbound and
    not d3vonn_allowed_outbound_ports
  output: >
    Unexpected outbound connection from Devonn container
    (user=%user.name container=%container.name
     connection=%fd.name proc=%proc.name)
  priority: ERROR
  tags: [container, network, exfiltration, d3vonn]

# Detect container namespace escape attempt
- rule: Container Namespace Escape Attempt
  desc: >
    A syscall associated with container escape was detected.
    This includes ptrace, mount, and unshare operations.
  condition: >
    d3vonn_api_container and
    evt.type in (ptrace, mount, umount2, unshare, clone) and
    evt.dir = <
  output: >
    Container escape attempt detected
    (user=%user.name container=%container.name proc=%proc.name
     syscall=%evt.type args=%evt.args)
  priority: EMERGENCY
  tags: [container, escape, d3vonn]

# Detect sensitive file reads (credential theft)
- rule: Sensitive File Read in Devonn Container
  desc: >
    A read of a sensitive file was detected inside the Devonn container.
    This may indicate credential harvesting.
  condition: >
    d3vonn_api_container and
    open_read and
    fd.name in (/etc/shadow, /etc/passwd, /root/.ssh/id_rsa,
                /root/.aws/credentials, /var/run/secrets/kubernetes.io/serviceaccount/token)
  output: >
    Sensitive file read in Devonn container
    (user=%user.name container=%container.name file=%fd.name proc=%proc.name)
  priority: CRITICAL
  tags: [container, credentials, d3vonn]

# ── Warning Rules ─────────────────────────────────────────────────────────

# Detect high-frequency file writes (potential ransomware/log flooding)
- rule: High Frequency File Writes in Devonn Container
  desc: >
    An unusually high number of file write operations was detected.
    This may indicate log flooding, ransomware, or disk exhaustion attack.
  condition: >
    d3vonn_api_container and
    open_write and
    fd.name startswith /tmp
  output: >
    High frequency writes to /tmp in Devonn container
    (user=%user.name container=%container.name file=%fd.name proc=%proc.name)
  priority: WARNING
  tags: [container, filesystem, d3vonn]
  rate: 10/60  # Alert at most 10 times per 60 seconds

# Detect package manager execution (should never happen in distroless)
- rule: Package Manager in Devonn Container
  desc: >
    A package manager was executed inside the Devonn container.
    Distroless images should never have pip, apt, or npm available.
  condition: >
    d3vonn_api_container and
    spawned_process and
    proc.name in (pip, pip3, apt, apt-get, npm, yarn, curl, wget)
  output: >
    Package manager executed in Devonn container
    (user=%user.name container=%container.name proc=%proc.name cmdline=%proc.cmdline)
  priority: ERROR
  tags: [container, package-manager, d3vonn]
