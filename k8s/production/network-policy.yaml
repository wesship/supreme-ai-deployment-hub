---
# Default deny-all ingress and egress within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devonn-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# MCP Gateway: accepts traffic from agent-executor and ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-gateway
  namespace: devonn-prod
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent-executor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: governance-engine
      ports:
        - port: 8082
    - to:
        - podSelector:
            matchLabels:
              app: observability-collector
      ports:
        - port: 4317
        - port: 4318
---
# Agent Executor: calls MCP Gateway and Governance Engine; receives from API gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-executor
  namespace: devonn-prod
spec:
  podSelector:
    matchLabels:
      app: agent-executor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: devonn-backend
      ports:
        - port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: mcp-gateway
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: governance-engine
      ports:
        - port: 8082
    - to:
        - podSelector:
            matchLabels:
              app: observability-collector
      ports:
        - port: 4317
        - port: 4318
---
# Governance Engine: accepts from mcp-gateway and agent-executor only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-governance-engine
  namespace: devonn-prod
spec:
  podSelector:
    matchLabels:
      app: governance-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-gateway
        - podSelector:
            matchLabels:
              app: agent-executor
      ports:
        - port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              app: observability-collector
      ports:
        - port: 4317
        - port: 4318
---
# Observability Collector: accepts OTLP from all platform services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-collector
  namespace: devonn-prod
spec:
  podSelector:
    matchLabels:
      app: observability-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 4317
        - port: 4318
        - port: 8083
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
