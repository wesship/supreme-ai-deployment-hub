apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devonn-agent-orchestrator-hpa
  namespace: ai-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devonn-agent-orchestrator
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
