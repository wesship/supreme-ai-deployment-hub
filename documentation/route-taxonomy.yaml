# D3VONN Route Taxonomy v1.0
# Classifies all frontend routes into four categories for navigation,
# access control, and Hermes reasoning.
---
version: "1.0"
last_updated: "2026-06-30"

# ─────────────────────────────────────────────────────────────────
# Category Definitions
# ─────────────────────────────────────────────────────────────────
categories:
  platform:
    description: Core platform functionality — dashboards, agents, workflows, knowledge, security ops.
    access: authenticated
    nav_group: Platform Console

  company:
    description: Public-facing company pages — about, contact, legal, pricing.
    access: public
    nav_group: Company

  developers:
    description: Developer tools and integrations — API docs, MCP, SDK, diagnostics.
    access: authenticated
    nav_group: Developers

  enterprise:
    description: Enterprise features — admin, governance, sovereignty, multi-tenant ops.
    access: admin
    nav_group: Enterprise

# ─────────────────────────────────────────────────────────────────
# Route Catalog
# ─────────────────────────────────────────────────────────────────
routes:

