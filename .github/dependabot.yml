version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "security"
      - "auto-merge"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: scope
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      ui-components:
        patterns:
          - "lucide-react"
          - "@radix-ui/*"
      vitest-ecosystem:
        patterns:
          - "vitest"
          - "@vitest/*"
      stryker-ecosystem:
        patterns:
          - "@stryker-mutator/*"
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
    # Ignore major/minor bumps for infrastructure-critical packages
    ignore:
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "canvas"
        update-types: ["version-update:semver-major"]

  # ── pip (Python backend) ───────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "python"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "python"

  - package-ecosystem: "pip"
    directory: "/models/llm/mistral-7b"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ml-models"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "security"
      - "auto-merge"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
