version: 2
updates:
  # ── npm (frontend + workspace root) ───────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "security"
      - "auto-merge"
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      ui-components:
        patterns:
          - "lucide-react"
          - "@radix-ui/*"
      vitest-ecosystem:
        patterns:
          - "vitest"
          - "@vitest/*"
      stryker-ecosystem:
        patterns:
          - "@stryker-mutator/*"
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "esbuild"
    # Ignore major bumps for build-tool and infrastructure-critical packages
    # to prevent breaking changes from auto-merging
    ignore:
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "canvas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]

  # ── pip (Python backend — FastAPI proxy + app routers) ────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]

  # ── pip (root — devonn coordinator scripts) ───────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "python"

  # ── pip (ML model inference — Mistral-7B) ─────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/models/llm/mistral-7b"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ml-models"
    # torch and transformers major bumps require manual validation
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "security"
      - "auto-merge"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
