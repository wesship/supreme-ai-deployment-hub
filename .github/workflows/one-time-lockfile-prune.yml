name: One-time lockfile prune

on:
  push:
    branches: [main]
    paths:
      - '.github/remediation/dependency-lock-prune-20260721.trigger'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/dependency-audit-20260721
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: package.json

      - name: Regenerate lockfile from scratch
        shell: bash
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify high and critical vulnerabilities
        run: pnpm audit --audit-level high

      - name: Verify stale vulnerable snapshots are absent
        shell: bash
        run: |
          ! grep -q "tar@7.5.16" pnpm-lock.yaml
          ! grep -q "js-yaml@4.2.0" pnpm-lock.yaml
          ! grep -q "protobufjs@7.6.4" pnpm-lock.yaml
          ! grep -q "brace-expansion@1.1.15" pnpm-lock.yaml

      - name: Run production build
        run: pnpm run build

      - name: Commit pruned lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(security): prune stale vulnerable lockfile snapshots'
          git push origin HEAD:fix/dependency-audit-20260721
