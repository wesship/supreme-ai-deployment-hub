name: D3VONN.IO Launch Readiness

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or staging URL to audit
        required: true
        default: https://d3vonn.io
        type: string
      browser:
        description: Browser project
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - mobile-chrome
      check_production_secrets:
        description: Validate production credential and configuration presence without printing values
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: d3vonn-launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-preflight:
    name: Production Secret Preflight
    if: inputs.check_production_secrets
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate required GitHub environment entries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST || secrets.HOSTINGER_VPS_HOST || secrets.VPS_HOST }}
          HOSTINGER_VPS_USER: ${{ vars.HOSTINGER_VPS_USER || secrets.HOSTINGER_VPS_USER || secrets.ROOT }}
          HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
        run: node scripts/validate-secret-inventory.mjs config/required-secrets.json production github

  live-functional-audit:
    name: Live Functional Audit (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install selected Playwright browser
        run: pnpm exec playwright install --with-deps "${{ inputs.browser == 'mobile-chrome' && 'chromium' || inputs.browser }}"
      - name: Audit live D3VONN.IO functions
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          BROWSER: ${{ inputs.browser }}
        run: pnpm exec playwright test tests/e2e/production-interaction-audit.spec.ts --project="${{ inputs.browser }}" --reporter=github,html
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-launch-readiness-${{ inputs.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
