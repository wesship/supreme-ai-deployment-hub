name: One-shot repair transitive lockfile

on:
  push:
    branches:
      - security/repair-transitive-lockfile
    paths:
      - '.github/workflows/one-shot-repair-transitive-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-repair-transitive-lockfile
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/repair-transitive-lockfile
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm

      - name: Add security overrides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['fast-uri'] = '3.1.5';
          pkg.pnpm.overrides['ip-address'] = '10.3.1';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/one-shot-repair-transitive-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/one-shot-repair-transitive-lockfile.yml
          git commit -m 'fix(security): upgrade vulnerable transitive packages'
          git push origin HEAD:security/repair-transitive-lockfile
