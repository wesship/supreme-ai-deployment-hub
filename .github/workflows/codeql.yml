name: CodeQL SAST

# Run static application security testing before merge, weekly, or on demand.
# Ordinary main-branch pushes are intentionally excluded to prevent duplicate
# post-merge security fan-out while preserving required security coverage.
# SARIF is enforced locally so High/Critical findings cannot pass merely because
# repository-native code scanning is unavailable or disabled.

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js (JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies (JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile

      - name: Setup Python (Python analysis)
        if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies (Python analysis)
        if: matrix.language == 'python'
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - build
              - .next
              - coverage
              - test-results
              - '**/*.test.ts'
              - '**/*.spec.ts'
              - '**/__tests__/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff0a06e83cb2de871e5a09832bc6a81e7276941f

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          category: /language:${{ matrix.language }}
          upload: false
          output: sarif-results
          add-snippet: true

      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          retention-days: 14

      - name: Enforce High and Critical CodeQL findings
        run: node scripts/enforce-codeql-sarif.js sarif-results
