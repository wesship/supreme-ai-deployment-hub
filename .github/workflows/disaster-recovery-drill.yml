name: Disaster Recovery Drill

on:
  workflow_dispatch:
    inputs:
      drill_type:
        description: 'Drill type'
        required: true
        default: 'application'
        type: choice
        options: [application, database, network, full]
      dry_run:
        description: 'Dry run only'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: disaster-recovery-drill
  cancel-in-progress: false

jobs:
  control:
    name: Manual DR Drill Control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Disaster recovery drills are manual-only."
          echo "Type: ${{ github.event.inputs.drill_type }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
