name: Voice Studio Mount Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/pages/VoiceStudio.tsx'
      - 'src/components/voice/**'
      - 'src/components/ai/ConversationalVoiceControls.tsx'
      - 'src/contexts/**'
      - 'tests/e2e/voice-studio-mount.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/voice-studio-mount.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-studio-mount-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mount-guard:
    name: Voice Studio remains mounted
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise Voice Studio through the post-idle mount transition
        env:
          CI: 'true'
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
        run: pnpm exec playwright test tests/e2e/voice-studio-mount.spec.ts --project=chromium

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-studio-mount-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
