name: PRIMETIME Supabase Rollout

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options: [staging, production]
      mode:
        description: Preview or apply pending migrations
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      confirmation:
        description: Type APPLY_PRIMETIME for apply mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: primetime-supabase-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollout:
    name: ${{ inputs.mode }} PRIMETIME on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate protected operation
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing Supabase environment secret::${secret_name} is not configured for GitHub environment '${{ inputs.target }}'."
              missing=1
            fi
          done
          (( missing == 0 ))
          if [[ "${{ inputs.mode }}" == "apply" && "${{ inputs.confirmation }}" != "APPLY_PRIMETIME" ]]; then
            echo "::error title=Invalid confirmation::Apply mode requires APPLY_PRIMETIME."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify CLI version
        run: test "$(supabase --version)" = "2.109.1"

      - name: Link protected target
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        run: supabase migration list --linked

      - name: Lint linked schema
        run: supabase db lint --linked --level warning

      - name: Preview exact pending migration order
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply exact repository migration history
        if: inputs.mode == 'apply'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration history after apply
        if: inputs.mode == 'apply'
        run: supabase migration list --linked

      - name: Write rollout summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PRIMETIME Supabase Rollout"
            echo ""
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            if [[ "${{ inputs.mode }}" == "preview" ]]; then
              echo "No database changes were applied."
            else
              echo "Protected migration application was requested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
