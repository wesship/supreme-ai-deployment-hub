name: Genesis Platform Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/genesis/**"
      - "backend/tests/test_genesis_platform.py"
      - "src/lib/genesisApi.ts"
      - "src/pages/GenesisCommandCenter.tsx"
      - "src/App.tsx"
      - "supabase/migrations/20260725193000_genesis_platform_foundation.sql"
      - ".github/workflows/genesis-platform-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Creator UI
        run: pnpm typecheck

      - name: Build frontend
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_ENVIRONMENT: production
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Compile Genesis backend
        run: python -m compileall -q backend/genesis

      - name: Run Genesis tests
        run: python -m pytest backend/tests/test_genesis_platform.py -q
