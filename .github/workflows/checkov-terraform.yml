name: Checkov Terraform Assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/checkov-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/checkov-terraform.yml'
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: checkov-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Terraform policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check 'checkov==3.3.8'

      - name: Generate JSON policy report
        id: scan
        shell: bash
        run: |
          set +e
          checkov \
            --directory src/data/manifest/terraform \
            --framework terraform \
            --skip-download \
            --compact \
            --output json > checkov-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s checkov-results.json
          exit 0

      - name: Generate SARIF report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          checkov \
            --directory src/data/manifest/terraform \
            --framework terraform \
            --skip-download \
            --compact \
            --soft-fail \
            --output sarif > checkov-results.sarif

      - name: Summarize and enforce policy results
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path('checkov-results.json').read_text(encoding='utf-8'))
          reports = payload if isinstance(payload, list) else [payload]

          failed = []
          passed = 0
          skipped = 0
          parsing_errors = 0
          for report in reports:
              summary = report.get('summary', {}) or {}
              passed += int(summary.get('passed', 0) or 0)
              skipped += int(summary.get('skipped', 0) or 0)
              parsing_errors += int(summary.get('parsing_errors', 0) or 0)
              for check in (report.get('results', {}) or {}).get('failed_checks', []) or []:
                  failed.append({
                      'id': check.get('check_id', 'unknown'),
                      'name': check.get('check_name', 'unknown'),
                      'resource': check.get('resource', 'unknown'),
                      'file': check.get('file_path', 'unknown'),
                      'lines': '-'.join(str(value) for value in check.get('file_line_range', []) if value is not None) or 'unknown',
                  })

          failed.sort(key=lambda row: (row['file'], row['lines'], row['id']))
          output = Path('checkov-failures.md')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('## Checkov Terraform results\n\n')
              handle.write(f'- Passed checks: **{passed}**\n')
              handle.write(f'- Failed checks: **{len(failed)}**\n')
              handle.write(f'- Skipped checks: **{skipped}**\n')
              handle.write(f'- Parsing errors: **{parsing_errors}**\n\n')
              if failed:
                  handle.write('| Policy | Resource | File | Lines | Description |\n')
                  handle.write('|---|---|---|---:|---|\n')
                  for row in failed:
                      description = row['name'].replace('|', '\\|').replace('\n', ' ')
                      handle.write(
                          f"| {row['id']} | {row['resource']} | {row['file']} | "
                          f"{row['lines']} | {description} |\n"
                      )
              else:
                  handle.write('No failed Terraform policies detected.\n')

          report = output.read_text(encoding='utf-8')
          print(report)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(report)

          if parsing_errors:
              print(f'::error::{parsing_errors} Terraform parsing errors detected')
              sys.exit(1)
          if failed:
              print(f'::error::{len(failed)} Checkov policy failures detected')
              sys.exit(1)
          PY

      - name: Preserve Checkov reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkov-terraform-${{ github.run_id }}
          path: |
            checkov-results.json
            checkov-results.sarif
            checkov-failures.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: checkov-results.sarif
          category: checkov-terraform
