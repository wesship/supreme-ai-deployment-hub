name: SDK NanoID Repair Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sdk-nanoid-repair-bootstrap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: security/sdk-nanoid-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Regenerate dependency graph
        working-directory: sdk
        run: npm install

      - name: Verify NanoID is patched
        working-directory: sdk
        run: |
          node -e "const p=require('./node_modules/nanoid/package.json'); const [a,b,c]=p.version.split('.').map(Number); if (a < 3 || (a === 3 && (b < 3 || (b === 3 && c < 18)))) { console.error('nanoid remains vulnerable:', p.version); process.exit(1) } console.log('nanoid', p.version)"
          npm ls nanoid

      - name: Typecheck
        working-directory: sdk
        run: npm run typecheck

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Audit
        working-directory: sdk
        run: npm audit --audit-level=high

      - name: Commit regenerated dependency files to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/package.json sdk/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
          else
            git commit -m 'fix(sdk): repair nanoid dependency chain'
            git push origin HEAD:security/sdk-nanoid-repair
          fi

      - name: SDK tests (diagnostic)
        continue-on-error: true
        working-directory: sdk
        run: npm test
