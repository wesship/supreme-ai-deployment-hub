name: D3VONN.IO Backend API Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * 1'

permissions:
  contents: read

concurrency:
  group: d3vonn-backend-production-audit
  cancel-in-progress: true

jobs:
  backend-api-audit:
    name: Backend API Certification (chromium)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production backend API certification
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: https://d3vonn.io
          API_BASE_URL: https://api.d3vonn.io
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/e2e/backend-production-audit.spec.ts --project=chromium --reporter=github,html --trace=off
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-backend-api-audit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
