name: D3VONN.IO Backend API Audit

# Production certification for the permanent branded API hostname.
# Re-certification target: authoritative Supabase OCC token validation.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d3vonn-backend-api-audit.yml'
      - 'backend/railway_app.py'
      - 'backend/auth/**'
      - 'backend/intelligence/**'
      - 'tests/e2e/backend-production-audit.spec.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: d3vonn-backend-production-audit-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  backend-api-audit:
    name: Branded API Certification (chromium)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Probe DNS and public API routes
        run: |
          set -u
          : > /tmp/api-probes.txt
          dns_json="$(curl --silent --show-error --max-time 20 'https://cloudflare-dns.com/dns-query?name=api.d3vonn.io&type=CNAME' -H 'accept: application/dns-json' || true)"
          printf 'DNS CNAME -> %s\n' "$dns_json" | tee -a /tmp/api-probes.txt
          for base in https://api.d3vonn.io https://devonn-ai-api-production.up.railway.app; do
            printf 'BASE %s\n' "$base" | tee -a /tmp/api-probes.txt
            for path in /health /health/ready /health/deployment /api/v1/health /api/v1/ops/health /api/deploy/probe; do
              body_file="$(mktemp)"
              code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 20 --output "$body_file" --write-out '%{http_code}' "${base}${path}" || printf '000')"
              body="$(tr '\n' ' ' < "$body_file" | cut -c1-500)"
              printf '%s -> HTTP %s | %s\n' "$path" "$code" "$body" | tee -a /tmp/api-probes.txt
              rm -f "$body_file"
            done
          done
      - name: Run branded backend API certification
        id: certification
        continue-on-error: true
        env:
          CI: 'true'
          E2E_DISABLE_CREDENTIAL_TRACING: '1'
          PLAYWRIGHT_BASE_URL: https://d3vonn.io
          API_BASE_URL: https://api.d3vonn.io
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          rm -rf playwright-report test-results
          pnpm exec playwright test tests/e2e/backend-production-audit.spec.ts --project=chromium --reporter=github,line --trace=off
      - name: Publish branded certification result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.certification.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Branded Backend API Audit ${OUTCOME}: ${HEAD_SHA:0:7}"
          probes="$(cat /tmp/api-probes.txt 2>/dev/null || true)"
          body=$(cat <<EOF
          Branded endpoint certification outcome: **${OUTCOME}**

          Run: ${RUN_URL}
          Commit: ${HEAD_SHA}

          DNS and public route probes:
          \`\`\`
          ${probes}
          \`\`\`

          No Playwright report, trace, screenshot, or test artifact is uploaded. Protected values remain masked and are not printed.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
      - name: Enforce certification result
        if: steps.certification.outcome != 'success'
        run: exit 1
