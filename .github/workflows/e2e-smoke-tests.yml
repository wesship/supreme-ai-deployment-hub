name: E2E Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-smoke-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  smoke-test-api:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set environment URLs
        id: env-config
        run: |
          if [ "$ENV" = "staging" ]; then
            echo "api_url=${{ vars.STAGING_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ vars.PRODUCTION_API_URL || 'https://api.d3vonn.io' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Health check with SLO assertion
        id: health-check
        run: |
          API_URL="${{ steps.env-config.outputs.api_url }}"

          if [ -z "$API_URL" ]; then
            echo "::notice::API URL not configured for $ENV - skipping live smoke tests"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          API_URL="${API_URL%/}"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -sS -o /tmp/health-response.json -w "%{http_code}" \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 \
            "$API_URL/health" || true)
          END=$(date +%s%3N)
          LATENCY=$((END - START))

          HTTP_CODE="${HTTP_CODE:-000}"
          echo "HTTP Status: $HTTP_CODE"
          echo "Latency: ${LATENCY}ms"
          echo "latency=${LATENCY}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed: HTTP $HTTP_CODE at $API_URL/health"
            cat /tmp/health-response.json 2>/dev/null || true
            exit 1
          fi

          if [ "$LATENCY" -gt 5000 ]; then
            echo "::warning::Health check SLO breach: ${LATENCY}ms > 5000ms threshold"
          fi

          echo "Health check passed: HTTP $HTTP_CODE in ${LATENCY}ms"

      - name: API endpoint smoke tests
        if: steps.health-check.outputs.skipped != 'true'
        env:
          API_URL: ${{ steps.env-config.outputs.api_url }}
        run: |
          API_URL="${API_URL%/}"
          PASS=0
          FAIL=0

          run_test() {
            local name="$1"
            local url="$2"
            local expected_code="$3"

            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --retry 2 --retry-delay 1 --retry-all-errors --max-time 15 \
              "$url" || true)
            HTTP_CODE="${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "$expected_code" ]; then
              echo "  PASS: $name (HTTP $HTTP_CODE)"
              PASS=$((PASS + 1))
            else
              echo "  FAIL: $name (expected $expected_code, got $HTTP_CODE)"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "Running smoke tests against $API_URL..."
          run_test "Health endpoint" "$API_URL/health" "200"
          run_test "Live health endpoint" "$API_URL/health/live" "200"
          run_test "OpenAPI schema" "$API_URL/api/openapi.json" "200"
          run_test "404 handling" "$API_URL/nonexistent-endpoint-xyz" "404"

          echo ""
          echo "Results: $PASS passed, $FAIL failed"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL smoke test(s) failed"
            exit 1
          fi

      - name: Create incident issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const env = process.env.ENV || 'production';
            const title = `[INCIDENT] Smoke test failure on ${env} - ${new Date().toISOString().split('T')[0]}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,smoke-test-failure'
            });
            const existing = issues.data.find(i => i.title.includes(`on ${env}`));
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Smoke test still failing at ${new Date().toISOString()}. Run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## Smoke Test Failure\n\n**Environment:** ${env}\n**Time:** ${new Date().toISOString()}\n**Run:** ${runUrl}\n\n### Next Steps\n1. Check the failing workflow logs\n2. Verify deployment health in the target environment\n3. Escalate if not resolved within 15 minutes`,
                labels: ['incident', 'smoke-test-failure', 'priority:high']
              });
            }
