name: E2E Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-smoke-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  smoke-test-api:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set environment URLs
        id: env-config
        run: |
          if [ "$ENV" = "staging" ]; then
            echo "api_url=${{ vars.STAGING_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ vars.PRODUCTION_API_URL || 'https://api.d3vonn.io' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Health check with SLO assertion
        id: health-check
        run: |
          API_URL="${{ steps.env-config.outputs.api_url }}"
          if [ -z "$API_URL" ]; then
            echo "::notice::API URL not configured for $ENV - skipping live smoke tests"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          API_URL="${API_URL%/}"
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -sS -o /tmp/health-response.json -w "%{http_code}" \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 \
            "$API_URL/health" || true)
          END=$(date +%s%3N)
          LATENCY=$((END - START))
          HTTP_CODE="${HTTP_CODE:-000}"

          echo "HTTP Status: $HTTP_CODE"
          echo "Latency: ${LATENCY}ms"
          echo "latency=${LATENCY}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed: HTTP $HTTP_CODE at $API_URL/health"
            cat /tmp/health-response.json 2>/dev/null || true
            exit 1
          fi

          if [ "$LATENCY" -gt 5000 ]; then
            echo "::warning::Health check SLO breach: ${LATENCY}ms > 5000ms threshold"
          fi

      - name: API endpoint smoke tests
        if: steps.health-check.outputs.skipped != 'true'
        env:
          API_URL: ${{ steps.env-config.outputs.api_url }}
        run: |
          set -u
          API_URL="${API_URL%/}"
          FAIL=0

          check_200() {
            local name="$1"
            local url="$2"
            local code
            code=$(curl -sS -o /tmp/smoke-body -w "%{http_code}" \
              --retry 2 --retry-delay 1 --retry-all-errors --max-time 15 \
              "$url" || true)
            code="${code:-000}"
            if [ "$code" = "200" ]; then
              echo "PASS: $name ($url -> HTTP 200)"
            else
              echo "FAIL: $name ($url -> HTTP $code)"
              head -c 500 /tmp/smoke-body 2>/dev/null || true
              echo
              FAIL=$((FAIL + 1))
            fi
          }

          check_200 "Primary health" "$API_URL/health"

          LIVE_CODE=$(curl -sS -o /tmp/live-body -w "%{http_code}" --max-time 15 "$API_URL/health/live" || true)
          LIVE_CODE="${LIVE_CODE:-000}"
          if [ "$LIVE_CODE" = "200" ]; then
            echo "PASS: Liveness endpoint"
          else
            echo "::warning::Optional liveness endpoint returned HTTP $LIVE_CODE"
          fi

          OPENAPI_OK=false
          for path in /api/openapi.json /openapi.json; do
            code=$(curl -sS -o /tmp/openapi-body -w "%{http_code}" --max-time 15 "$API_URL$path" || true)
            if [ "$code" = "200" ]; then
              echo "PASS: OpenAPI schema at $path"
              OPENAPI_OK=true
              break
            fi
          done
          if [ "$OPENAPI_OK" != "true" ]; then
            echo "::warning::OpenAPI schema is not publicly exposed at the standard paths"
          fi

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL required smoke test(s) failed"
            exit 1
          fi

      - name: Create incident issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const env = process.env.ENV || 'production';
            const title = `[INCIDENT] Smoke test failure on ${env} - ${new Date().toISOString().split('T')[0]}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,smoke-test-failure'
            });
            const existing = issues.data.find(i => i.title.includes(`on ${env}`));
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Smoke test still failing at ${new Date().toISOString()}. Run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## Smoke Test Failure\n\n**Environment:** ${env}\n**Time:** ${new Date().toISOString()}\n**Run:** ${runUrl}`,
                labels: ['incident', 'smoke-test-failure', 'priority:high']
              });
            }
