name: Apply Command Center RC1 Migration

on:
  push:
    branches:
      - feat/rc1-command-center-modernization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc1-command-center-modernization
          fetch-depth: 0

      - name: Apply Command Center route migration
        run: node scripts/migrate-command-center-rc1.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/migrate-command-center-rc1.mjs
          rm .github/workflows/apply-command-center-rc1-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/migrate-command-center-rc1.mjs .github/workflows/apply-command-center-rc1-migration.yml
          git commit -m "feat(command-center): route operator surfaces through RC1 shell"
          git push origin feat/rc1-command-center-modernization
