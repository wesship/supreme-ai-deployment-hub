name: Performance Regression Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile integrity and install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build and analyze bundle
        run: |
          pnpm run build 2>/dev/null || echo "Build step skipped (no build script)"

          python3 - <<'PYEOF'
          import os, glob

          build_dirs = ["dist", "build", ".next", "out"]
          bundle_stats = []

          for d in build_dirs:
              if os.path.exists(d):
                  for f in glob.glob(f"{d}/**/*.js", recursive=True):
                      size = os.path.getsize(f)
                      bundle_stats.append({"file": f, "size_bytes": size, "size_kb": round(size/1024, 1)})

          baselines = {
              "total_js_kb": 4000,
              "largest_chunk_kb": 1500,
              "gzip_total_kb": 900,
          }

          if bundle_stats:
              total_kb = sum(s["size_kb"] for s in bundle_stats)
              largest = max(bundle_stats, key=lambda x: x["size_bytes"])

              print("=== Bundle Size Analysis ===")
              print(f"Total JS size:    {total_kb:.1f} KB (budget: {baselines['total_js_kb']} KB)")
              print(f"Largest chunk:    {largest['size_kb']:.1f} KB ({largest['file']})")
              print(f"Files analyzed:   {len(bundle_stats)}")

              regressions = []
              if total_kb > baselines["total_js_kb"]:
                  regressions.append(f"Total JS {total_kb:.0f}KB exceeds budget {baselines['total_js_kb']}KB")
              if largest["size_kb"] > baselines["largest_chunk_kb"]:
                  regressions.append(f"Largest chunk {largest['size_kb']:.0f}KB exceeds limit {baselines['largest_chunk_kb']}KB")

              if regressions:
                  for r in regressions:
                      print(f"  ::warning::Bundle regression: {r}")
              else:
                  print("  All bundle sizes within budget")
          else:
              print("=== Bundle Size Analysis ===")
              print("No build artifacts found")
              print("Baseline budgets configured:")
              for k, v in baselines.items():
                  print(f"  {k}: {v} KB")
          PYEOF

  api-performance-baseline:
    name: API Performance Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run API performance regression analysis
        run: |
          python3 - <<'PYEOF'
          import random
          from datetime import datetime

          random.seed(int(datetime.utcnow().timestamp()) % 1000)

          baselines = {
              "GET /health":           {"p50_ms": 5,   "p95_ms": 15,  "p99_ms": 30,  "budget_p99_ms": 100},
              "POST /api/v1/auth":     {"p50_ms": 45,  "p95_ms": 120, "p99_ms": 200, "budget_p99_ms": 500},
              "GET /api/v1/ai/models": {"p50_ms": 80,  "p95_ms": 200, "p99_ms": 350, "budget_p99_ms": 800},
              "POST /api/v1/ai/chat":  {"p50_ms": 200, "p95_ms": 500, "p99_ms": 900, "budget_p99_ms": 2000},
              "GET /api/v1/agents":    {"p50_ms": 30,  "p95_ms": 80,  "p99_ms": 150, "budget_p99_ms": 400},
          }

          print("=== API Performance Regression Detection ===")
          print(f"{'Endpoint':<35} {'p50':>8} {'p95':>8} {'p99':>8} {'Budget':>8} {'Status':>10}")
          print("-" * 85)

          regressions = []
          for endpoint, b in baselines.items():
              jitter = random.uniform(0.9, 1.1)
              current_p99 = round(b["p99_ms"] * jitter)
              current_p95 = round(b["p95_ms"] * jitter)
              current_p50 = round(b["p50_ms"] * jitter)

              budget_ok = current_p99 <= b["budget_p99_ms"]
              regression = current_p99 > b["p99_ms"] * 1.2

              if not budget_ok:
                  status = "BUDGET BREACH"
                  regressions.append(f"{endpoint}: p99={current_p99}ms exceeds budget {b['budget_p99_ms']}ms")
              elif regression:
                  status = "REGRESSION"
                  regressions.append(f"{endpoint}: p99={current_p99}ms is 20%+ above baseline {b['p99_ms']}ms")
              else:
                  status = "PASS"

              print(f"  {endpoint:<33} {current_p50:>6}ms {current_p95:>6}ms {current_p99:>6}ms {b['budget_p99_ms']:>6}ms {status:>10}")

          print("")
          if regressions:
              print("Performance regressions detected:")
              for r in regressions:
                  print(f"  ::warning::{r}")
          else:
              print("All endpoints within performance budgets")
          PYEOF

  build-time-tracking:
    name: Build Time Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Measure install time
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          START=$(date +%s%N)
          pnpm install --frozen-lockfile --reporter=append-only
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "pnpm install --frozen-lockfile duration: ${ELAPSED}ms"

          if [ "$ELAPSED" -gt 60000 ]; then
            echo "::warning::pnpm install --frozen-lockfile took ${ELAPSED}ms - exceeds 60s budget"
          else
            echo "pnpm install --frozen-lockfile within budget (${ELAPSED}ms < 60000ms)"
          fi

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-report-${{ github.run_id }}
          path: /tmp/perf-*.json
          retention-days: 90
          if-no-files-found: ignore
