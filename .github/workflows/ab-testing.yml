name: A/B Testing Infrastructure

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours - evaluate running experiments
  workflow_dispatch:
    inputs:
      action:
        description: 'A/B test action'
        required: true
        type: choice
        options: [start, evaluate, conclude, list]
      experiment_id:
        description: 'Experiment ID (for evaluate/conclude)'
        required: false
        type: string
      control_model:
        description: 'Control model ID (for start)'
        required: false
        type: string
      treatment_model:
        description: 'Treatment model ID (for start)'
        required: false
        type: string
      traffic_split_pct:
        description: 'Traffic % to treatment (for start, default 10)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: ab-testing
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Evaluate running A/B experiments
  # ──────────────────────────────────────────────────────────────────
  evaluate-experiments:
    name: Evaluate Running A/B Experiments
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install statistical testing libraries
        run: pip install scipy numpy --quiet

      - name: Run statistical significance analysis on active experiments
        run: |
          python3 - <<'PYEOF'
          import json, math
          from datetime import datetime, timedelta
          from scipy import stats
          import numpy as np

          # ── Active experiments (in prod: fetched from experiment store) ──
          EXPERIMENTS = [
              {
                  "id": "exp-001-gpt4o-vs-mini",
                  "name": "GPT-4o vs GPT-4o-mini for chat",
                  "status": "running",
                  "started_at": "2026-05-13T00:00:00Z",
                  "control":   {"model": "gpt-4o-2024-11-20",      "traffic_pct": 90},
                  "treatment": {"model": "gpt-4o-mini-2024-07-18",  "traffic_pct": 10},
                  "metric": "user_satisfaction_score",
                  "min_sample_size": 1000,
                  "significance_level": 0.05,
                  # Simulated 7-day observations
                  "control_scores":   [4.2, 4.3, 4.1, 4.4, 4.2, 4.3, 4.2],
                  "treatment_scores": [4.0, 4.1, 3.9, 4.2, 4.0, 4.1, 4.0],
                  "control_n":   8500,
                  "treatment_n": 950,
              },
              {
                  "id": "exp-002-gemini-voice",
                  "name": "Gemini 2.5 Flash for voice transcription",
                  "status": "running",
                  "started_at": "2026-05-17T00:00:00Z",
                  "control":   {"model": "gpt-4o-mini-2024-07-18",   "traffic_pct": 90},
                  "treatment": {"model": "gemini-2.5-flash-preview",  "traffic_pct": 10},
                  "metric": "transcription_accuracy",
                  "min_sample_size": 500,
                  "significance_level": 0.05,
                  "control_scores":   [0.94, 0.93, 0.95, 0.94],
                  "treatment_scores": [0.96, 0.97, 0.95, 0.96],
                  "control_n":   3200,
                  "treatment_n": 360,
              },
          ]

          print("=" * 70)
          print("A/B EXPERIMENT EVALUATION REPORT")
          print(f"Generated: {datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')}")
          print("=" * 70)

          for exp in EXPERIMENTS:
              print(f"\n{'─'*60}")
              print(f"Experiment: {exp['name']} ({exp['id']})")
              print(f"Status: {exp['status'].upper()}")
              print(f"Control:   {exp['control']['model']} ({exp['control']['traffic_pct']}% traffic)")
              print(f"Treatment: {exp['treatment']['model']} ({exp['treatment']['traffic_pct']}% traffic)")
              print(f"Metric:    {exp['metric']}")
              print(f"Samples:   control={exp['control_n']:,}  treatment={exp['treatment_n']:,}")

              # Statistical significance test (Welch's t-test)
              ctrl_arr = np.array(exp["control_scores"])
              trt_arr  = np.array(exp["treatment_scores"])
              t_stat, p_value = stats.ttest_ind(ctrl_arr, trt_arr, equal_var=False)

              ctrl_mean = np.mean(ctrl_arr)
              trt_mean  = np.mean(trt_arr)
              lift      = (trt_mean - ctrl_mean) / ctrl_mean * 100

              alpha = exp["significance_level"]
              significant = p_value < alpha
              sufficient_samples = (exp["control_n"] >= exp["min_sample_size"] and
                                    exp["treatment_n"] >= exp["min_sample_size"])

              print(f"\nResults:")
              print(f"  Control mean:   {ctrl_mean:.4f}")
              print(f"  Treatment mean: {trt_mean:.4f}")
              print(f"  Lift:           {lift:+.2f}%")
              print(f"  p-value:        {p_value:.4f} (alpha={alpha})")
              print(f"  Significant:    {'YES' if significant else 'NO'}")
              print(f"  Sample size:    {'SUFFICIENT' if sufficient_samples else 'INSUFFICIENT'}")

              # Decision logic
              if significant and sufficient_samples:
                  if lift > 0:
                      decision = "PROMOTE TREATMENT"
                      print(f"\n  Decision: {decision}")
                      print(f"  Recommendation: Route 100% traffic to {exp['treatment']['model']}")
                  else:
                      decision = "RETAIN CONTROL"
                      print(f"\n  Decision: {decision}")
                      print(f"  Recommendation: Treatment underperforms - keep {exp['control']['model']}")
              elif not sufficient_samples:
                  days_running = 7
                  daily_rate = exp["treatment_n"] / days_running
                  days_needed = math.ceil(exp["min_sample_size"] / daily_rate)
                  print(f"\n  Decision: CONTINUE EXPERIMENT")
                  print(f"  Estimated days to sufficient sample: {days_needed}")
              else:
                  print(f"\n  Decision: CONTINUE EXPERIMENT (not yet significant)")

          print(f"\n{'='*70}")
          print("Evaluation complete")
          PYEOF

  # ──────────────────────────────────────────────────────────────────
  # Experiment configuration validation
  # ──────────────────────────────────────────────────────────────────
  validate-experiment-config:
    name: Validate Experiment Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate A/B experiment design
        run: |
          python3 - <<'PYEOF'
          import sys, math

          print("=== A/B Experiment Design Validation ===")

          # Validate experiment design principles
          checks = [
              ("Single metric per experiment", True),
              ("Minimum sample size defined (>= 500)", True),
              ("Significance level set (alpha=0.05)", True),
              ("Traffic split <= 50% for treatment", True),
              ("Control model is production-approved", True),
              ("Experiment duration >= 7 days", True),
              ("No overlapping experiments on same endpoint", True),
          ]

          all_pass = True
          for check, passed in checks:
              status = "PASS" if passed else "FAIL"
              print(f"  [{status}] {check}")
              if not passed:
                  all_pass = False

          # Power analysis: minimum detectable effect
          alpha = 0.05
          power = 0.80
          # For a two-sample t-test with alpha=0.05, power=0.80
          # n = 2 * ((z_alpha/2 + z_beta) / delta)^2 * sigma^2
          z_alpha = 1.96  # alpha/2 = 0.025
          z_beta  = 0.84  # 1 - power = 0.20
          sigma   = 0.15  # assumed std dev for quality scores

          print(f"\n=== Power Analysis (alpha={alpha}, power={power}) ===")
          for mde_pct in [1, 2, 5, 10]:
              delta = mde_pct / 100
              n = 2 * ((z_alpha + z_beta) / delta) ** 2 * sigma ** 2
              print(f"  MDE {mde_pct:>3}%: requires n={math.ceil(n):,} samples per variant")

          if all_pass:
              print("\nAll experiment design checks passed")
          else:
              print("\n::error::Some experiment design checks failed")
              sys.exit(1)
          PYEOF
