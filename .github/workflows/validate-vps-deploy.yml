name: Validate VPS deployment

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'deploy/vps/**'
      - '.github/workflows/validate-vps-deploy.yml'

permissions:
  contents: read

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare example production env
        run: cp deploy/vps/env/.env.example deploy/vps/env/.env.production

      - name: Validate Docker Compose config
        run: docker compose --env-file deploy/vps/env/.env.production -f deploy/vps/docker-compose.yml config

      - name: Ensure frontend env does not expose known secrets
        run: |
          ! grep -E '^VITE_.*(SECRET|SERVICE_ROLE|TOKEN|PASSWORD|PRIVATE)=' deploy/vps/env/.env.example || \
            (echo 'Secret-like VITE_* variable found in .env.example' && exit 1)
