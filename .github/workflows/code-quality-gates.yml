name: Code Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b01235470b1f1e74b32c5c6e4b9a8a7e5b7  # v4.1.0
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

      - name: Run ESLint on app source
        run: npx eslint src --ext .ts,.tsx,.js,.jsx --no-error-on-unmatched-pattern --quiet
