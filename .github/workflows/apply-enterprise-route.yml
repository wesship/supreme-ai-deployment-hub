name: Apply Enterprise Route Migration

on:
  push:
    branches:
      - feat/rc1-enterprise-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc1-enterprise-migration
          fetch-depth: 0

      - name: Apply enterprise route
        run: node scripts/add-enterprise-route.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/add-enterprise-route.mjs
          rm .github/workflows/apply-enterprise-route.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/add-enterprise-route.mjs .github/workflows/apply-enterprise-route.yml
          git commit -m "feat(enterprise): add enterprise trust route"
          git push origin feat/rc1-enterprise-migration
