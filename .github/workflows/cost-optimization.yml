name: Cost Optimization

# Runs Infracost on Terraform PRs when INFRACOST_API_KEY is configured.
# Missing cost-reporting secrets produce advisory notices instead of blocking release gates.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'infra/**'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infracost:
    name: Terraform Cost Estimate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check Infracost secret availability
        id: infracost-secret
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::warning::INFRACOST_API_KEY is not configured; skipping advisory cost estimate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base branch
        if: steps.infracost-secret.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Infracost
        if: steps.infracost-secret.outputs.enabled == 'true'
        uses: infracost/actions/setup@d5dd739fb5eae81f31bf09fea5c290186a91964a
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate for base branch
        if: steps.infracost-secret.outputs.enabled == 'true'
        run: |
          infracost breakdown \
            --path terraform/ \
            --format json \
            --out-file /tmp/infracost-base.json

      - name: Checkout PR branch
        if: steps.infracost-secret.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Infracost cost estimate for PR branch
        if: steps.infracost-secret.outputs.enabled == 'true'
        run: |
          infracost breakdown \
            --path terraform/ \
            --format json \
            --out-file /tmp/infracost-pr.json

      - name: Post cost diff comment on PR
        if: steps.infracost-secret.outputs.enabled == 'true'
        run: |
          infracost diff \
            --path /tmp/infracost-pr.json \
            --compare-to /tmp/infracost-base.json \
            --format github-comment \
            --github-token ${{ github.token }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }}

      - name: Advisory cost summary
        if: steps.infracost-secret.outputs.enabled != 'true'
        run: |
          echo "## Cost Optimization" >> "$GITHUB_STEP_SUMMARY"
          echo "Infracost was skipped because INFRACOST_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "This is advisory and does not block release convergence." >> "$GITHUB_STEP_SUMMARY"

  weekly-cost-report:
    name: Weekly Cost Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check weekly report secrets
        id: weekly-secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          SLACK_WEBHOOK_COSTS: ${{ secrets.SLACK_WEBHOOK_COSTS }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$SLACK_WEBHOOK_COSTS" ]; then
            echo "::warning::AWS_ROLE_ARN or SLACK_WEBHOOK_COSTS missing; skipping weekly cost report."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.weekly-secrets.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Generate weekly cost report
        if: steps.weekly-secrets.outputs.enabled == 'true'
        id: cost-report
        run: |
          python3 - <<'EOF'
          import boto3
          from datetime import datetime, timedelta

          ce = boto3.client('ce', region_name='us-east-1')
          end = datetime.utcnow().strftime('%Y-%m-%d')
          start = (datetime.utcnow() - timedelta(days=7)).strftime('%Y-%m-%d')

          response = ce.get_cost_and_usage(
              TimePeriod={'Start': start, 'End': end},
              Granularity='MONTHLY',
              Metrics=['UnblendedCost'],
              GroupBy=[{'Type': 'DIMENSION', 'Key': 'SERVICE'}]
          )

          total = 0
          services = []
          for result in response['ResultsByTime']:
              for group in result['Groups']:
                  cost = float(group['Metrics']['UnblendedCost']['Amount'])
                  if cost > 0.01:
                      services.append({'service': group['Keys'][0], 'cost': cost})
                      total += cost

          services.sort(key=lambda x: x['cost'], reverse=True)
          report = f"*Weekly AWS Cost Report* ({start} → {end})\nTotal: *${total:.2f}*\n\nTop services:\n"
          for s in services[:8]:
              report += f"  • {s['service']}: ${s['cost']:.2f}\n"

          with open('/tmp/cost_report.txt', 'w') as f:
              f.write(report)
          EOF
          {
            echo "report<<EOF"
            cat /tmp/cost_report.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post cost report to Slack
        if: steps.weekly-secrets.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_COSTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📊 ${{ steps.cost-report.outputs.report }}"
            }
