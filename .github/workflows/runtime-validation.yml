name: Runtime Validation Harness

on:
  push:
    branches: [main]
    paths:
      - "runtime-validation/**"
      - "src/__tests__/runtime/**"
      - "src/lib/mcp/**"
      - "vitest.config.ts"
  pull_request:
    branches: [main]
    paths:
      - "runtime-validation/**"
      - "src/__tests__/runtime/**"
      - "src/lib/mcp/**"
      - "vitest.config.ts"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Specific scenario to run (leave blank for all)"
        required: false
        default: ""

# Principle: governance is external - this workflow runs in an isolated
# environment with no production credentials and no deployment permissions.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  runtime-validation:
    name: Runtime Validation Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run runtime validation scenarios
        id: run-scenarios
        run: |
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            npx vitest run "runtime-validation/scenarios/${{ github.event.inputs.scenario }}" \
              --reporter=verbose \
              --reporter=json \
              --outputFile=runtime-validation/reports/results.json
          else
            npx vitest run runtime-validation/scenarios/ \
              --reporter=verbose \
              --reporter=json \
              --outputFile=runtime-validation/reports/results.json
          fi

      - name: Parse scenario results
        if: always()
        run: |
          if [ -f runtime-validation/reports/results.json ]; then
            python3 - << 'PYEOF'
          import json, sys
          data = json.load(open("runtime-validation/reports/results.json"))
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          failed = data.get("numFailedTests", 0)
          pending = data.get("numPendingTests", 0)
          print(f"Runtime Validation Results (Wave 27+28+29+30+31):")
          print(f"  Total:   {total}")
          print(f"  Passed:  {passed}")
          print(f"  Failed:  {failed}")
          print(f"  Pending: {pending} (todo - future waves)")
          if failed > 0:
            print(f"\nFAILED SCENARIOS:")
            for suite in data.get("testResults", []):
              for test in suite.get("assertionResults", []):
                if test.get("status") == "failed":
                  print(f"  - {test.get('fullName')}")
                  for msg in test.get("failureMessages", []):
                    print(f"    {msg[:200]}")
            sys.exit(1)
          PYEOF
          fi

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-validation-report-${{ github.run_number }}
          path: runtime-validation/reports/results.json
          retention-days: 30

  # Wave 28: Memory continuity drift gate
  memory-continuity-gate:
    name: Memory Continuity Gate (Wave 28)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run memory continuity scenarios
        run: |
          npx vitest run runtime-validation/scenarios/memory-continuity.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile=runtime-validation/reports/memory-continuity-results.json

      - name: Assert zero drift in clean scenarios
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
            data = json.load(open("runtime-validation/reports/memory-continuity-results.json"))
          except FileNotFoundError:
            print("No memory continuity results found.")
            sys.exit(1)
          failed = data.get("numFailedTests", 0)
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          print(f"Memory Continuity Gate:")
          print(f"  Scenarios: {total}")
          print(f"  Passed:    {passed}")
          print(f"  Failed:    {failed}")
          if failed > 0:
            print("MEMORY CONTINUITY GATE FAILED: drift or recovery failures detected.")
            sys.exit(1)
          print("Memory continuity gate PASSED: no drift, full recovery verified.")
          PYEOF

      - name: Upload memory continuity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: memory-continuity-report-${{ github.run_number }}
          path: runtime-validation/reports/memory-continuity-results.json
          retention-days: 30

  # Wave 29: Failure recovery & replay integrity gate
  failure-recovery-gate:
    name: Failure Recovery Gate (Wave 29)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run failure recovery and replay integrity scenarios
        run: |
          npx vitest run runtime-validation/scenarios/failure-recovery-replay.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile=runtime-validation/reports/failure-recovery-results.json

      - name: Assert all failure recovery scenarios pass
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
            data = json.load(open("runtime-validation/reports/failure-recovery-results.json"))
          except FileNotFoundError:
            print("No failure recovery results found.")
            sys.exit(1)
          failed = data.get("numFailedTests", 0)
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          print(f"Failure Recovery Gate (Wave 29):")
          print(f"  Scenarios: {total}")
          print(f"  Passed:    {passed}")
          print(f"  Failed:    {failed}")
          if failed > 0:
            print("FAILURE RECOVERY GATE FAILED: recovery or replay integrity violations detected.")
            for suite in data.get("testResults", []):
              for test in suite.get("assertionResults", []):
                if test.get("status") == "failed":
                  print(f"  - {test.get('fullName')}")
            sys.exit(1)
          print("Failure recovery gate PASSED: crash recovery, replay idempotency, and causal integrity verified.")
          PYEOF

      - name: Upload failure recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: failure-recovery-report-${{ github.run_number }}
          path: runtime-validation/reports/failure-recovery-results.json
          retention-days: 30

  # Wave 30: Governance arbitration gate
  governance-arbitration-gate:
    name: Governance Arbitration Gate (Wave 30)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run governance arbitration scenarios
        run: |
          npx vitest run runtime-validation/scenarios/governance-arbitration-wave30.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile=runtime-validation/reports/governance-arbitration-results.json

      - name: Assert governance arbitration correctness
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
            data = json.load(open("runtime-validation/reports/governance-arbitration-results.json"))
          except FileNotFoundError:
            print("No governance arbitration results found.")
            sys.exit(1)
          failed = data.get("numFailedTests", 0)
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          print(f"Governance Arbitration Gate (Wave 30):")
          print(f"  Scenarios: {total}")
          print(f"  Passed:    {passed}")
          print(f"  Failed:    {failed}")
          if failed > 0:
            print("GOVERNANCE ARBITRATION GATE FAILED: authority correctness violations detected.")
            for suite in data.get("testResults", []):
              for test in suite.get("assertionResults", []):
                if test.get("status") == "failed":
                  print(f"  - {test.get('fullName')}")
                  for msg in test.get("failureMessages", []):
                    print(f"    {msg[:200]}")
            sys.exit(1)
          print("Governance arbitration gate PASSED: conflict resolution, authority hierarchy, and decision reproducibility verified.")
          PYEOF

      - name: Upload governance arbitration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: governance-arbitration-report-${{ github.run_number }}
          path: runtime-validation/reports/governance-arbitration-results.json
          retention-days: 30

  # Wave 31: Observability intelligence gate
  observability-intelligence-gate:
    name: Observability Intelligence Gate (Wave 31)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run observability intelligence scenarios
        run: |
          npx vitest run runtime-validation/scenarios/observability-intelligence.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile=runtime-validation/reports/observability-intelligence-results.json

      - name: Assert observability intelligence correctness
        run: |
          python3 - << 'PYEOF'
          import json, sys
          try:
            data = json.load(open("runtime-validation/reports/observability-intelligence-results.json"))
          except FileNotFoundError:
            print("No observability intelligence results found.")
            sys.exit(1)
          failed = data.get("numFailedTests", 0)
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          print(f"Observability Intelligence Gate (Wave 31):")
          print(f"  Scenarios: {total}")
          print(f"  Passed:    {passed}")
          print(f"  Failed:    {failed}")
          if failed > 0:
            print("OBSERVABILITY INTELLIGENCE GATE FAILED: observability graph, telemetry, correlation, or health scoring errors detected.")
            for suite in data.get("testResults", []):
              for test in suite.get("assertionResults", []):
                if test.get("status") == "failed":
                  print(f"  - {test.get('fullName')}")
                  for msg in test.get("failureMessages", []):
                    print(f"    {msg[:200]}")
            sys.exit(1)
          print("Observability intelligence gate PASSED: cross-wave correlation, telemetry, and health scoring verified.")
          PYEOF

      - name: Upload observability intelligence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: observability-intelligence-report-${{ github.run_number }}
          path: runtime-validation/reports/observability-intelligence-results.json
          retention-days: 30

  # Harness integrity check - verify the harness primitives themselves are valid TypeScript
  harness-typecheck:
    name: Harness TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck harness primitives
        run: |
          # Note: full project typecheck via `npx tsc --noEmit` is the authoritative check
          npx tsc --noEmit 2>&1 | grep -E "error TS" | grep "runtime-validation" || echo "No harness type errors"

  # Summary gate - required status check
  runtime-validation-gate:
    name: Runtime Validation Gate
    needs:
      - runtime-validation
      - memory-continuity-gate
      - failure-recovery-gate
      - governance-arbitration-gate
      - observability-intelligence-gate
      - harness-typecheck
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check gate status
        run: |
          if [ "${{ needs.runtime-validation.result }}" != "success" ]; then
            echo "Runtime validation scenarios FAILED"
            exit 1
          fi
          if [ "${{ needs.memory-continuity-gate.result }}" != "success" ]; then
            echo "Memory continuity gate FAILED"
            exit 1
          fi
          if [ "${{ needs.failure-recovery-gate.result }}" != "success" ]; then
            echo "Failure recovery gate FAILED"
            exit 1
          fi
          if [ "${{ needs.governance-arbitration-gate.result }}" != "success" ]; then
            echo "Governance arbitration gate FAILED"
            exit 1
          fi
          if [ "${{ needs.observability-intelligence-gate.result }}" != "success" ]; then
            echo "Observability intelligence gate FAILED"
            exit 1
          fi
          if [ "${{ needs.harness-typecheck.result }}" != "success" ]; then
            echo "Harness typecheck FAILED"
            exit 1
          fi
          echo "Runtime Validation Gate: PASSED"
          echo "All scenarios green. Memory continuity verified. Failure recovery verified."
          echo "Governance arbitration verified. Observability intelligence verified. Harness integrity confirmed."
