name: Commit Lint

# Validates that commits unique to a PR follow the repository's commit policy.
# Supports standard Conventional Commits plus Devonn wave/phase commit families.

on:
  pull_request:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags
          BASE_SHA="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}")"
          echo "Linting commits unique to the PR from ${BASE_SHA} to ${{ github.event.pull_request.head.sha }}"
          npx commitlint \
            --config commitlint.config.cjs \
            --from "${BASE_SHA}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
