name: Commit Lint

# Validates that all commit messages in a PR follow Conventional Commits format.
# This is required for semantic-release to correctly determine version bumps.
# The repo already has commitlint.config.js - this workflow enforces it in CI.

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so commitlint can check all commits in the PR
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install commitlint
        run: |
          npm install --save-dev \
            @commitlint/cli \
            @commitlint/config-conventional

      - name: Validate PR commits
        run: |
          # Lint all commits from the base branch to the PR head
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
