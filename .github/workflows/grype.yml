name: Grype Vulnerability Assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements*.txt'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements*.txt'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependency SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_VERSION: '0.112.0'
      GRYPE_LINUX_AMD64_SHA256: 'acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate repository SBOM
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b
        with:
          path: '.'
          format: spdx-json
          output-file: repository-sbom.spdx.json
          upload-artifact: false

      - name: Install pinned Grype CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${GRYPE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" grype
          install -m 0755 grype /usr/local/bin/grype
          grype version

      - name: Run deterministic Grype scan
        shell: bash
        run: |
          set -euo pipefail
          grype "sbom:repository-sbom.spdx.json" --output json > grype-results.json
          grype "sbom:repository-sbom.spdx.json" --output sarif > grype-results.sarif

      - name: Summarize and enforce high-severity findings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path('grype-results.json').read_text(encoding='utf-8'))
          rows = []
          for match in payload.get('matches') or []:
              vulnerability = match.get('vulnerability') or {}
              severity = str(vulnerability.get('severity') or '').lower()
              if severity not in {'high', 'critical'}:
                  continue
              artifact = match.get('artifact') or {}
              fixes = (vulnerability.get('fix') or {}).get('versions') or []
              locations = ', '.join(
                  str(location.get('path') or '')
                  for location in (artifact.get('locations') or [])
                  if isinstance(location, dict) and location.get('path')
              ) or 'unknown'
              rows.append((
                  severity.upper(),
                  str(artifact.get('name') or 'unknown'),
                  str(artifact.get('version') or 'unknown'),
                  str(vulnerability.get('id') or 'unknown'),
                  ', '.join(str(version) for version in fixes) or 'No fixed version reported',
                  locations,
              ))

          rows.sort(key=lambda row: (row[0] != 'CRITICAL', row[1], row[3]))
          output = Path('grype-high-findings.md')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('## Grype high and critical findings\n\n')
              if not rows:
                  handle.write('No high or critical findings detected.\n')
              else:
                  handle.write('| Severity | Package | Installed | Advisory | Fixed version | Location |\n')
                  handle.write('|---|---|---:|---|---|---|\n')
                  for row in rows:
                      handle.write('| ' + ' | '.join(row) + ' |\n')

          report = output.read_text(encoding='utf-8')
          print(report)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(report)

          if rows:
              print(f'::error::{len(rows)} high or critical vulnerability findings detected')
              sys.exit(1)
          PY

      - name: Preserve vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grype-reports-${{ github.run_id }}
          path: |
            repository-sbom.spdx.json
            grype-results.sarif
            grype-results.json
            grype-high-findings.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('grype-results.sarif') != '' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: grype-results.sarif
          category: grype
