name: Grype Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_DB_AUTO_UPDATE: 'true'
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: '120h'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Preserve Grype SARIF artifact
        if: always() && steps.grype.outputs.sarif != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grype-sarif-${{ github.run_id }}
          path: ${{ steps.grype.outputs.sarif }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish SARIF to GitHub code scanning
        if: always() && steps.grype.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

      - name: Enforce Grype result
        if: steps.grype.outcome == 'failure'
        run: |
          echo 'Grype reported high-severity findings or failed operationally. Review the preserved SARIF artifact and scanner logs.'
          exit 1
