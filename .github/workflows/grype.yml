name: Grype Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_DB_AUTO_UPDATE: 'true'
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: '120h'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enforce high-severity vulnerability threshold
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          output-format: table
