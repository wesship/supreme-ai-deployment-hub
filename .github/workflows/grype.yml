name: Grype Vulnerability Assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/requirements*.txt'
      - '.github/workflows/grype.yml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate SARIF report
        id: sarif
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          path: '.'
          fail-build: false
          severity-cutoff: negligible
          output-format: sarif

      - name: Generate JSON report
        id: json
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          path: '.'
          fail-build: false
          severity-cutoff: negligible
          output-format: json

      - name: Summarize high and critical findings
        if: always() && steps.json.outputs.json != ''
        continue-on-error: true
        env:
          GRYPE_JSON: ${{ steps.json.outputs.json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['GRYPE_JSON'])
          payload = json.loads(report_path.read_text(encoding='utf-8'))
          rows = []
          for match in payload.get('matches', []):
              vulnerability = match.get('vulnerability', {})
              severity = str(vulnerability.get('severity', '')).lower()
              if severity not in {'high', 'critical'}:
                  continue
              artifact = match.get('artifact', {})
              fix = vulnerability.get('fix', {}) or {}
              rows.append({
                  'severity': severity.upper(),
                  'package': artifact.get('name', 'unknown'),
                  'installed': artifact.get('version', 'unknown'),
                  'id': vulnerability.get('id', 'unknown'),
                  'fixed': ', '.join(fix.get('versions', [])) or 'No fixed version reported',
                  'location': ', '.join(
                      location.get('path', '')
                      for location in artifact.get('locations', [])
                      if location.get('path')
                  ) or 'unknown',
              })

          rows.sort(key=lambda row: (row['severity'] != 'CRITICAL', row['package'], row['id']))
          output = Path('grype-high-findings.md')
          with output.open('w', encoding='utf-8') as handle:
              handle.write('## Grype high and critical findings\n\n')
              if not rows:
                  handle.write('No high or critical findings detected.\n')
              else:
                  handle.write('| Severity | Package | Installed | Advisory | Fixed version | Location |\n')
                  handle.write('|---|---|---:|---|---|---|\n')
                  for row in rows:
                      handle.write(
                          f"| {row['severity']} | {row['package']} | {row['installed']} | "
                          f"{row['id']} | {row['fixed']} | {row['location']} |\n"
                      )
          print(output.read_text(encoding='utf-8'))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(output.read_text(encoding='utf-8'))
          PY

      - name: Preserve vulnerability reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grype-reports-${{ github.run_id }}
          path: |
            ${{ steps.sarif.outputs.sarif }}
            ${{ steps.json.outputs.json }}
            grype-high-findings.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: always() && steps.sarif.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: ${{ steps.sarif.outputs.sarif }}
          category: grype

      - name: Enforce high-severity threshold
        if: always()
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          output-format: table
