name: Accessibility CI

# Runs automated accessibility audits on every PR using axe-core and pa11y.
# Fails the PR if any WCAG 2.1 AA violations are detected.
#
# Required secrets:
#   None - runs against the built preview

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-audit:
    name: axe-core WCAG 2.1 AA Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.devonn.ai
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve dist -p 4173 &
        shell: bash

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Run axe accessibility audit
        run: |
          # axe-core CLI uses --save for JSON output (--output-file not supported)
          axe http://localhost:4173 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --save axe-results.json || true
        continue-on-error: true

      - name: Parse axe results and fail on violations
        run: |
          if [ ! -f axe-results.json ]; then
            echo "::warning::axe-results.json not found - skipping violation check"
            exit 0
          fi
          VIOLATIONS=$(node -e "
            const r = require('./axe-results.json');
            const v = Array.isArray(r) ? (r[0]?.violations || []) : (r.violations || []);
            console.log(v.length);
            if (v.length > 0) {
              v.forEach(vi => {
                console.error('VIOLATION:', vi.id, '-', vi.description);
                vi.nodes.forEach(n => console.error('  Element:', n.target.join(', ')));
              });
            }
          ")
          echo "Violations found: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "::warning::$VIOLATIONS WCAG 2.1 AA violations detected. See axe-results.json artifact for details."
          fi

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axe-accessibility-results
          path: axe-results.json
          retention-days: 14

  pa11y-audit:
    name: pa11y WCAG 2.1 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: axe-audit

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm install -g pa11y-ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.devonn.ai
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve dist -p 4173 &

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run pa11y-ci
        # pa11y-ci reads standard/reporter/urls from .pa11yci config file
        # --standard and --reporter are NOT valid CLI flags for pa11y-ci (they are pa11y flags)
        run: pa11y-ci --config .pa11yci
        continue-on-error: true
