name: Accessibility CI

# Runs automated accessibility audits on every PR using axe-core and pa11y.
# Fails the PR if any WCAG 2.1 AA violations are detected.
#
# Required secrets:
#   None - runs against the built preview

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe-audit:
    name: axe-core WCAG 2.1 AA Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve -s dist -p 4173 &
        shell: bash

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Run axe accessibility audit
        run: |
          # axe-core CLI uses --save for JSON output (--output-file not supported)
          axe http://localhost:4173 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --load-delay 1000 \
            --save axe-results.json || true
        continue-on-error: true

      - name: Parse axe results and fail on violations
        run: |
          if [ ! -f axe-results.json ]; then
            echo "::warning::axe-results.json not found - skipping violation check"
            exit 0
          fi
          VIOLATIONS=$(node -e "
            const r = require('./axe-results.json');
            const v = Array.isArray(r) ? (r[0]?.violations || []) : (r.violations || []);
            console.log(v.length);
            if (v.length > 0) {
              v.forEach(vi => {
                console.error('VIOLATION:', vi.id, '-', vi.description);
                vi.nodes.forEach(n => console.error('  Element:', n.target.join(', ')));
              });
            }
          ")
          echo "Violations found: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "::error::$VIOLATIONS WCAG 2.1 AA violations detected. See axe-results.json artifact for details."
            exit 1
          fi

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axe-accessibility-results
          path: axe-results.json
          retention-days: 14

  pa11y-audit:
    name: pa11y WCAG 2.1 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && npm install -g pa11y-ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve -s dist -p 4173 &

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run pa11y-ci and capture diagnostics
        id: pa11y
        shell: bash
        run: |
          set +e
          pa11y-ci --config .pa11yci --json > pa11y-results.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const path = 'pa11y-results.json';
          if (!fs.existsSync(path)) {
            console.error('pa11y-results.json was not created');
            process.exit(0);
          }
          const raw = fs.readFileSync(path, 'utf8').trim();
          if (!raw) {
            console.error('pa11y-results.json is empty');
            process.exit(0);
          }
          try {
            const report = JSON.parse(raw);
            let total = 0;
            for (const [url, result] of Object.entries(report)) {
              const issues = Array.isArray(result) ? result : (result.issues || []);
              if (!issues.length) continue;
              console.error(`PA11Y URL: ${url}`);
              for (const issue of issues) {
                total += 1;
                console.error(`  ${issue.code || 'UNKNOWN'}: ${issue.message || 'Accessibility issue'}`);
                console.error(`  Selector: ${issue.selector || 'not provided'}`);
              }
            }
            console.error(`Total pa11y issues: ${total}`);
          } catch (error) {
            console.error('Unable to parse pa11y JSON:', error.message);
            console.error(raw.slice(0, 12000));
          }
          NODE
          exit 0

      - name: Upload pa11y results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pa11y-accessibility-results
          path: pa11y-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on pa11y violations
        if: always()
        run: |
          EXIT_CODE='${{ steps.pa11y.outputs.exit_code }}'
          if [ -z "$EXIT_CODE" ]; then
            echo "::error::pa11y did not report an exit code"
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::pa11y detected accessibility violations. See the pa11y-accessibility-results artifact and diagnostics above."
            exit "$EXIT_CODE"
          fi
