name: Accessibility Audit (Manual)

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail the run when axe or pa11y reports violations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: accessibility-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-audit:
    name: WCAG 2.1 AA Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application once
        run: pnpm build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/d3vonn-preview.log 2>&1 &
          echo $! > /tmp/d3vonn-preview.pid

      - name: Wait for preview server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/d3vonn-preview.log || true
          echo "::error::Preview server did not become ready within 30 seconds"
          exit 1

      - name: Run axe and pa11y audits
        id: audits
        shell: bash
        run: |
          set +e

          pnpm dlx @axe-core/cli http://127.0.0.1:4173 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --save axe-results.json
          AXE_EXIT=$?

          pnpm dlx pa11y-ci --config .pa11yci
          PA11Y_EXIT=$?

          set -e
          echo "axe_exit=${AXE_EXIT}" >> "$GITHUB_OUTPUT"
          echo "pa11y_exit=${PA11Y_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "$AXE_EXIT" -ne 0 ]; then
            echo "::warning::axe reported accessibility violations or an audit error"
          fi
          if [ "$PA11Y_EXIT" -ne 0 ]; then
            echo "::warning::pa11y reported accessibility violations or an audit error"
          fi

      - name: Enforce strict mode
        if: ${{ inputs.strict }}
        env:
          AXE_EXIT: ${{ steps.audits.outputs.axe_exit }}
          PA11Y_EXIT: ${{ steps.audits.outputs.pa11y_exit }}
        run: |
          if [ "$AXE_EXIT" -ne 0 ] || [ "$PA11Y_EXIT" -ne 0 ]; then
            echo "::error::Accessibility audit failed in strict mode"
            exit 1
          fi

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-results-${{ github.run_id }}
          path: |
            axe-results.json
            /tmp/d3vonn-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/d3vonn-preview.pid ]; then
            kill "$(cat /tmp/d3vonn-preview.pid)" 2>/dev/null || true
          fi
