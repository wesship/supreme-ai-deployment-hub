name: Accessibility CI

# Manual WCAG audit. The canonical required PR gate is the only workflow
# permitted to run automatically for every pull request targeting main.
on:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe-audit:
    name: axe-core WCAG 2.1 AA Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve dist -p 4173 &
        shell: bash

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Run axe accessibility audit
        run: |
          axe http://localhost:4173 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --save axe-results.json || true
        continue-on-error: true

      - name: Parse axe results and fail on violations
        run: |
          if [ ! -f axe-results.json ]; then
            echo "::warning::axe-results.json not found - skipping violation check"
            exit 0
          fi
          VIOLATIONS=$(node -e "
            const r = require('./axe-results.json');
            const v = Array.isArray(r) ? (r[0]?.violations || []) : (r.violations || []);
            console.log(v.length);
            if (v.length > 0) {
              v.forEach(vi => {
                console.error('VIOLATION:', vi.id, '-', vi.description);
                vi.nodes.forEach(n => console.error('  Element:', n.target.join(', ')));
              });
            }
          ")
          echo "Violations found: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt "0" ]; then
            echo "::warning::$VIOLATIONS WCAG 2.1 AA violations detected. See axe-results.json artifact for details."
          fi

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axe-accessibility-results
          path: axe-results.json
          retention-days: 14

  pa11y-audit:
    name: pa11y WCAG 2.1 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: axe-audit

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && npm install -g pa11y-ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Start preview server
        run: npx serve dist -p 4173 &

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run pa11y-ci
        run: pa11y-ci --config .pa11yci
        continue-on-error: true
