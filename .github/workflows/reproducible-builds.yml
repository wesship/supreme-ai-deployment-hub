name: Reproducible Builds (Manual Only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reproducible-builds.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: reproducible-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible-build-status:
    name: Reproducible build status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain manual-only mode
        run: |
          echo "Reproducible build verification is manual-only."
          echo "This PR check confirms the workflow remains syntactically valid and self-validating."
          echo "Normal production commits use the core build, Railway, Vercel, and smoke-test lanes."
