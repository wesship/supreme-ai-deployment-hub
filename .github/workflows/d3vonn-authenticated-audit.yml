name: D3VONN.IO Authenticated Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d3vonn-authenticated-audit.yml'
      - 'src/pages/Login.tsx'
      - 'tests/e2e/authenticated-production-audit.spec.ts'
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: d3vonn-authenticated-production-audit
  cancel-in-progress: true

jobs:
  authenticated-audit:
    name: Authentication and Workspace Audit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate protected audit inputs
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${E2E_TEST_EMAIL}" || { echo 'Missing E2E_TEST_EMAIL'; exit 1; }
          test -n "${E2E_TEST_PASSWORD}" || { echo 'Missing E2E_TEST_PASSWORD'; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run protected-route and authenticated production checks
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: https://d3vonn.io
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_DISABLE_CREDENTIAL_TRACING: '1'
        run: |
          set -euo pipefail
          rm -rf playwright-report test-results
          pnpm exec playwright test tests/e2e/authenticated-production-audit.spec.ts \
            --project=chromium \
            --reporter=github,line \
            --trace=off
