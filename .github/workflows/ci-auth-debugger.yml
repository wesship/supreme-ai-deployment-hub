name: CI Auth Debugger

# Diagnoses GitHub auth / checkout (exit code 128) failures by verifying
# the required PATs and tokens exist with the right scopes before any
# heavy workflow runs. Run on-demand or wire as a needs: gate.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

jobs:
  verify-auth:
    name: Verify CI Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GITHUB_TOKEN
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN missing (should be auto-provided)"; exit 1
          fi
          echo "✔ GITHUB_TOKEN present"

      - name: Check GH_PAT (optional but recommended)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT not set — checkout of private submodules/cross-repo will fail with exit 128"
          else
            echo "✔ GH_PAT present"
            # Validate token works and has repo scope
            HTTP=$(curl -s -o /tmp/me.json -w "%{http_code}" \
              -H "Authorization: token $GH_PAT" https://api.github.com/user)
            if [ "$HTTP" != "200" ]; then
              echo "::error::GH_PAT rejected by GitHub API (HTTP $HTTP)"; exit 1
            fi
            SCOPES=$(curl -sI -H "Authorization: token $GH_PAT" \
              https://api.github.com/user | grep -i '^x-oauth-scopes:' || true)
            echo "GH_PAT scopes: $SCOPES"
            echo "$SCOPES" | grep -q 'repo' || {
              echo "::error::GH_PAT missing 'repo' scope"; exit 1; }
          fi

      - name: Test cross-repo checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Verify git identity works
        run: |
          git config user.email "ci@devonn.ai"
          git config user.name  "devonn-ci"
          git rev-parse HEAD && echo "✔ checkout OK"

      - name: Summary
        if: always()
        run: |
          echo "### CI Auth Debugger" >> $GITHUB_STEP_SUMMARY
          echo "- GITHUB_TOKEN: present" >> $GITHUB_STEP_SUMMARY
          echo "- GH_PAT: ${{ secrets.GH_PAT && 'present' || 'MISSING' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Checkout: succeeded" >> $GITHUB_STEP_SUMMARY
