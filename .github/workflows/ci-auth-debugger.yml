name: CI Auth Debugger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-auth:
    name: Verify CI Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manual auth diagnostic
        run: |
          echo "CI Auth Debugger is manual-only during stabilization."
          echo "Use this workflow when diagnosing repository token or checkout issues."

      - name: Checkout smoke test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Verify git identity works
        run: |
          git config user.email "ci@devonn.ai"
          git config user.name "devonn-ci"
          git rev-parse HEAD

      - name: Summary
        if: always()
        run: |
          echo "### CI Auth Debugger" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual diagnostic workflow only." >> "$GITHUB_STEP_SUMMARY"
