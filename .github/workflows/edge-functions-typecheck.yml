name: Edge Functions Typecheck

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-typecheck.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'

jobs:
  deno-check:
    name: Deno typecheck (with npm modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The AWS EKS edge function imports AWS SDK v3 via npm: specifiers.
      # Deno's local typechecker needs them in node_modules to resolve.
      # In the Supabase deploy runtime, npm: is resolved natively — this is
      # purely for local/CI typechecking parity.
      - name: Install AWS SDK deps for typecheck
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save \
            @aws-sdk/client-eks \
            @aws-sdk/client-ec2 \
            @aws-sdk/client-iam \
            @aws-sdk/client-sts \
            @aws-sdk/client-supabase 2>/dev/null || \
          npm install --no-save \
            @aws-sdk/client-eks \
            @aws-sdk/client-ec2 \
            @aws-sdk/client-iam \
            @aws-sdk/client-sts

      - name: Typecheck aws-eks-deploy-v2
        run: |
          deno check --node-modules-dir \
            supabase/functions/aws-eks-deploy-v2/index.ts

      - name: Typecheck other edge functions (best-effort)
        continue-on-error: true
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "::group::$f"
            deno check --node-modules-dir "$f" || true
            echo "::endgroup::"
          done
