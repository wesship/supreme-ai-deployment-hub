name: Edge Functions Typecheck

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-typecheck.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deno-check:
    name: Deno typecheck (with npm modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v1.x

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The AWS EKS edge function imports AWS SDK v3 via esm.sh URLs.
      # Deno v1 resolves these remotely; we just need @types/node for node: builtins.
      - name: Install @types/node for Deno typecheck
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save @types/node 2>/dev/null || \
          npm install --no-save @types/node
        working-directory: supabase/functions

      - name: Cache Deno dependencies for aws-eks-deploy-v2
        continue-on-error: true
        run: deno cache supabase/functions/aws-eks-deploy-v2/index.ts
        env:
          DENO_DIR: .deno-cache

      - name: Typecheck aws-eks-deploy-v2
        run: |
          deno check supabase/functions/aws-eks-deploy-v2/index.ts
        env:
          DENO_DIR: .deno-cache

      - name: Typecheck other edge functions (best-effort)
        continue-on-error: true
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "::group::$f"
            deno check "$f" || true
            echo "::endgroup::"
          done
        env:
          DENO_DIR: .deno-cache
