name: Apply Homepage Shell Migration

on:
  push:
    branches:
      - feat/rc1-homepage-migration
    paths:
      - scripts/apply_homepage_shell_migration.py
      - .github/workflows/apply-homepage-shell-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[homepage-migration-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc1-homepage-migration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration
        run: python scripts/apply_homepage_shell_migration.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_homepage_shell_migration.py
          rm .github/workflows/apply-homepage-shell-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Index.tsx scripts/apply_homepage_shell_migration.py .github/workflows/apply-homepage-shell-migration.yml
          git commit -m "refactor(home): integrate shared homepage shell [homepage-migration-applied]"
          git push origin HEAD:feat/rc1-homepage-migration
