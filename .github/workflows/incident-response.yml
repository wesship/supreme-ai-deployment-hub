name: Incident Response & SLO Enforcement

on:
  workflow_dispatch:
    inputs:
      incident_severity:
        description: 'Incident severity (P1/P2/P3)'
        required: false
        default: 'P2'
      incident_description:
        description: 'Brief incident description'
        required: false
        default: 'Manual incident trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: incident-response
  cancel-in-progress: false

jobs:
  create-incident:
    name: Create Manual Incident
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub incident issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const severity = '${{ github.event.inputs.incident_severity || 'P2' }}';
            const details = '${{ github.event.inputs.incident_description || 'Manual trigger' }}';
            const now = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT ${severity}] ${details}`,
              body: `Detected: ${now}\n\n${details}\n\nThis workflow is manual-only to conserve GitHub Actions minutes.`,
              labels: ['incident']
            });
