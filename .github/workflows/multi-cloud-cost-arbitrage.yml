name: Multi-Cloud Cost Arbitrage

on:
  workflow_dispatch:
    inputs:
      analysis_depth:
        description: 'Analysis depth'
        required: true
        default: 'quick'
        type: choice
        options: [quick, full]

permissions:
  contents: read

concurrency:
  group: cost-arbitrage
  cancel-in-progress: true

jobs:
  control:
    name: Manual Cost Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Multi-cloud cost analysis is manual-only."
          echo "Current production path: Vercel + Railway + Hostinger VPS."
          echo "Analysis depth: ${{ github.event.inputs.analysis_depth }}"
