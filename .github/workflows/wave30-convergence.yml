name: Wave 30 Operational Convergence

on:
  pull_request:
    paths:
      - 'docs/WAVE_30_OPERATIONAL_CONVERGENCE.md'
      - 'scripts/wave30-operational-convergence-check.sh'
      - '.github/workflows/wave30-convergence.yml'
  push:
    branches:
      - release/**
      - wave/**
  workflow_dispatch:

jobs:
  convergence-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Ensure convergence script is executable
        run: chmod +x scripts/wave30-operational-convergence-check.sh

      - name: Run Wave 30 convergence check
        run: scripts/wave30-operational-convergence-check.sh
