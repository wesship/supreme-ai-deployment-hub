name: Wave 30 Operational Convergence

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - wave/**

jobs:
  convergence-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Ensure convergence script is executable
        run: chmod +x scripts/wave30-operational-convergence-check.sh

      - name: Run Wave 30 convergence check
        run: scripts/wave30-operational-convergence-check.sh
