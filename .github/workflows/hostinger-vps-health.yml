name: Hostinger VPS Runner Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: hostinger-vps-runner-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify Hostinger self-hosted runner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Confirm runner health
        shell: bash
        run: |
          set -euo pipefail

          echo "Hostinger VPS runner accepted this GitHub Actions job."
          echo "Host: $(hostname)"
          echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Kernel: $(uname -srmo)"
          echo "Uptime: $(uptime -p)"
          df -h /

          {
            echo "### Hostinger VPS runner healthy"
            echo
            echo "- Runner: ${RUNNER_NAME}"
            echo "- OS: ${RUNNER_OS}"
            echo "- Architecture: ${RUNNER_ARCH}"
            echo "- Host: $(hostname)"
            echo "- Checked at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_STEP_SUMMARY}"
