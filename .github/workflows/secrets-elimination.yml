name: Secrets Elimination & Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # Daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secrets-elimination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret Pattern Scanning (Gitleaks) ────────────────────────────────────
  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history for git log scanning

      - name: Install Gitleaks
        run: |
          VERSION="8.21.2"
          curl -sLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository for secrets
        run: |
          # Scan staged changes on PRs, full repo on push to main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect \
              --source . \
              --log-opts "origin/${{ github.base_ref }}..HEAD" \
              --report-format sarif \
              --report-path /tmp/gitleaks-report.sarif \
              --exit-code 1 || FOUND=$?
          else
            gitleaks detect \
              --source . \
              --report-format sarif \
              --report-path /tmp/gitleaks-report.sarif \
              --exit-code 1 || FOUND=$?
          fi
          
          if [ "${FOUND:-0}" -ne "0" ]; then
            echo "::error::Gitleaks detected potential secrets in the repository"
            cat /tmp/gitleaks-report.sarif | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          runs = data.get('runs', [])
          for run in runs:
              results = run.get('results', [])
              for r in results:
                  msg = r.get('message', {}).get('text', 'unknown')
                  locs = r.get('locations', [])
                  for loc in locs:
                      uri = loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', 'unknown')
                      line = loc.get('physicalLocation', {}).get('region', {}).get('startLine', 0)
                      print(f'  SECRET: {msg} at {uri}:{line}')
          " 2>/dev/null || true
            exit 1
          fi
          echo "No secrets detected by Gitleaks"

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gitleaks-sarif-${{ github.run_id }}
          path: /tmp/gitleaks-report.sarif
          retention-days: 30

  # ── Static Secret Audit ───────────────────────────────────────────────────
  static-secret-audit:
    name: Static Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Audit workflow files for hardcoded credentials
        run: |
          ISSUES=0
          
          # Check for hardcoded AWS keys
          if grep -rE 'AKIA[0-9A-Z]{16}' .github/workflows/ 2>/dev/null; then
            echo "::error::Hardcoded AWS access key found in workflows"
            ISSUES=$((ISSUES + 1))
          fi
          
          # Check for hardcoded GitHub tokens
          if grep -rE 'ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82}' .github/workflows/ 2>/dev/null; then
            echo "::error::Hardcoded GitHub token found in workflows"
            ISSUES=$((ISSUES + 1))
          fi
          
          # Check for hardcoded private keys
          if grep -rE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .github/workflows/ 2>/dev/null; then
            echo "::error::Hardcoded private key found in workflows"
            ISSUES=$((ISSUES + 1))
          fi
          
          # Check for base64-encoded potential secrets
          if grep -rE '[A-Za-z0-9+/]{40,}={0,2}' .github/workflows/ | \
             grep -v 'sha256\|sha1\|base64\|#\|uses:' 2>/dev/null | head -5; then
            echo "::warning::Potential base64-encoded content found - verify these are not secrets"
          fi
          
          if [ "$ISSUES" -eq "0" ]; then
            echo "No hardcoded credentials found in workflow files"
          else
            exit 1
          fi

      - name: Audit source files for credential patterns
        run: |
          ISSUES=0
          
          # Scan source files (excluding node_modules, .git, dist)
          for pattern in \
            'password\s*=\s*["\x27][^\x27"]{8,}["\x27]' \
            'api_key\s*=\s*["\x27][^\x27"]{16,}["\x27]' \
            'secret\s*=\s*["\x27][^\x27"]{16,}["\x27]' \
            'token\s*=\s*["\x27][^\x27"]{16,}["\x27]'; do
            FOUND=$(grep -rniE "$pattern" \
              --include="*.py" --include="*.ts" --include="*.js" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              . 2>/dev/null | grep -v 'test\|spec\|mock\|example\|placeholder' | head -5 || true)
            if [ -n "$FOUND" ]; then
              echo "::warning::Potential hardcoded credential pattern found:"
              echo "$FOUND"
            fi
          done
          
          echo "Static secret audit completed"

      - name: Check .env files are not committed
        run: |
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" \
            ! -path "./.git/*" ! -path "./node_modules/*" 2>/dev/null)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Environment files found in repository (should be in .gitignore):"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "No .env files committed to repository"

      - name: Verify .gitignore covers sensitive files
        run: |
          REQUIRED_PATTERNS=(".env" "*.pem" "*.key" "*.p12" "*.pfx" "secrets.json" ".secrets")
          MISSING=()
          
          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if ! grep -qF "$pattern" .gitignore 2>/dev/null; then
              MISSING+=("$pattern")
            fi
          done
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::.gitignore is missing these sensitive file patterns:"
            printf '  %s\n' "${MISSING[@]}"
            echo "Adding missing patterns to .gitignore..."
            printf '\n# Security: sensitive files (added by secrets-elimination workflow)\n' >> .gitignore
            printf '%s\n' "${MISSING[@]}" >> .gitignore
            echo "Updated .gitignore"
          else
            echo ".gitignore covers all required sensitive file patterns"
          fi

  # ── OIDC Migration Status ─────────────────────────────────────────────────
  oidc-migration-status:
    name: OIDC Migration Status Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Audit workflows for long-lived credential usage
        run: |
          echo "=== OIDC Migration Status ==="
          echo ""
          
          # Count workflows using OIDC (id-token: write)
          OIDC_COUNT=$(grep -rl 'id-token: write' .github/workflows/ | wc -l)
          TOTAL_COUNT=$(ls .github/workflows/*.yml | wc -l)
          
          echo "Workflows with OIDC (id-token: write): ${OIDC_COUNT}/${TOTAL_COUNT}"
          echo ""
          
          # List workflows still using static cloud credentials
          echo "Workflows using static cloud credentials (migration candidates):"
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")
            if grep -qE 'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AZURE_CLIENT_SECRET|GCP_SERVICE_ACCOUNT_KEY' "$wf" 2>/dev/null; then
              echo "  [STATIC] $name"
            fi
          done
          
          echo ""
          echo "Workflows already using OIDC:"
          grep -rl 'id-token: write' .github/workflows/ | while read wf; do
            echo "  [OIDC] $(basename $wf)"
          done
          
          echo ""
          echo "OIDC migration coverage: ${OIDC_COUNT}/${TOTAL_COUNT} workflows"
