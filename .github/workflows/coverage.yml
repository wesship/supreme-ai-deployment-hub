name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: node-22-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-22-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify lockfile integrity (no drift)
        run: git diff --exit-code package-lock.json || (echo "::error::package-lock.json was modified by npm ci - commit the updated lockfile" && exit 1)

      - name: Run unit tests with coverage
        continue-on-error: true
        run: npm run test -- --coverage --reporter=verbose
        env:
          CI: true

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: devonn-ai-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            try {
              const summaryPath = './coverage/coverage-summary.json';
              if (!fs.existsSync(summaryPath)) {
                console.log('No coverage summary found, skipping comment');
                return;
              }

              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const total = summary.total;
              const lines = total.lines.pct.toFixed(1);
              const functions = total.functions.pct.toFixed(1);
              const branches = total.branches.pct.toFixed(1);
              const statements = total.statements.pct.toFixed(1);

              const badge = (pct) => pct >= 80 ? 'PASS' : pct >= 60 ? 'WARN' : 'FAIL';

              const body = [
                '## Test Coverage Report',
                '',
                '| Metric | Coverage | Status |',
                '|--------|----------|--------|',
                `| Lines | ${lines}% | ${badge(lines)} |`,
                `| Functions | ${functions}% | ${badge(functions)} |`,
                `| Branches | ${branches}% | ${badge(branches)} |`,
                `| Statements | ${statements}% | ${badge(statements)} |`,
                '',
                '> Thresholds: Lines >= 70%, Functions >= 70%, Branches >= 60%, Statements >= 70%'
              ].join('\n');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (error) {
              console.log(`Coverage PR comment skipped: ${error.message}`);
            }
            const functions = total.functions.pct.toFixed(1);
            const branches = total.branches.pct.toFixed(1);
            const statements = total.statements.pct.toFixed(1);

            const badge = (pct) => pct >= 80 ? 'PASS' : pct >= 60 ? 'WARN' : 'FAIL';

            const body = [
              '## Test Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              `| Lines | ${lines}% | ${badge(lines)} |`,
              `| Functions | ${functions}% | ${badge(functions)} |`,
              `| Branches | ${branches}% | ${badge(branches)} |`,
              `| Statements | ${statements}% | ${badge(statements)} |`,
              '',
              '> Thresholds: Lines >= 70%, Functions >= 70%, Branches >= 60%, Statements >= 70%'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (error) {
              console.log(`Skipping PR coverage comment: ${error.message}`);
            }
