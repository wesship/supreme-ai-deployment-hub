name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify lockfile integrity
        run: git diff --exit-code pnpm-lock.yaml || (echo "pnpm-lock.yaml changed after pnpm install --frozen-lockfile" && exit 1)

      - name: Run unit tests with coverage
        run: pnpm run test -- --coverage --reporter=verbose
        env:
          CI: true

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ./coverage/coverage-summary.json ]; then
            node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('./coverage/coverage-summary.json','utf8')).total; for (const m of ['lines','functions','branches','statements']) console.log('- '+m+': '+(s[m]?.pct ?? 'n/a')+'%');" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary file not found." >> "$GITHUB_STEP_SUMMARY"
          fi
