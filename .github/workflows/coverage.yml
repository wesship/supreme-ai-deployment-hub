name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify lockfile integrity
        run: git diff --exit-code package-lock.json || (echo "package-lock.json changed after npm ci" && exit 1)

      - name: Run unit tests with coverage
        run: npm run test -- --coverage --reporter=verbose
        env:
          CI: true

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: devonn-ai-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ./coverage/coverage-summary.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8')).total;
            for (const metric of ['lines','functions','branches','statements']) {
              const pct = summary[metric]?.pct ?? 'n/a';
              console.log(`- ${metric}: ${pct}%`);
            }
            NODE
          else
            echo "Coverage summary file not found." >> "$GITHUB_STEP_SUMMARY"
          fi
