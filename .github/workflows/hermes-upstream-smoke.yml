name: Hermes upstream smoke

on:
  pull_request:
    paths:
      - 'deploy/vps/hermes-upstream.env.example'
      - 'deploy/vps/scripts/update-hermes-upstream.sh'
      - 'docs/HERMES_UPSTREAM_RUNTIME.md'
      - 'docs/HERMES_V0_20_5_COMPATIBILITY_MATRIX.md'
      - '.github/workflows/hermes-upstream-smoke.yml'
  workflow_dispatch:

jobs:
  hermes-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Checkout pinned Hermes source
        env:
          HERMES_TAG: v2026.8.19
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent fetch --tags origin "$HERMES_TAG"
          git -C /tmp/hermes-agent checkout --force "$HERMES_TAG"

      - name: Install Hermes in isolated environment
        run: |
          uv venv /tmp/hermes-venv
          uv pip install --python /tmp/hermes-venv/bin/python -e '/tmp/hermes-agent[all]'

      - name: Verify pinned version
        run: |
          /tmp/hermes-venv/bin/hermes --version
          /tmp/hermes-venv/bin/hermes --version | grep -F '0.20.5'

      - name: Verify Hermes configuration surface
        run: /tmp/hermes-venv/bin/hermes config check

      - name: Verify D3VONN Hermes control-plane invariants
        run: |
          test -f backend/hermes/router.py
          test -f backend/hermes/task_engine.py
          test -f backend/hermes/registry.py
          grep -q 'prefix="/api/hermes/tasks"' backend/hermes/router.py
          grep -q 'AGENT_HIERARCHY' backend/hermes/router.py
          grep -q 'v2026.8.19' deploy/vps/hermes-upstream.env.example
