name: One-time lockfile remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/remediation/dependency-audit-20260721.trigger'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/dependency-audit-20260721
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm

      - name: Update vulnerable dependency constraints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          pkg.dependencies.axios = '^1.18.0';
          pkg.dependencies['react-router-dom'] = '^6.30.4';
          pkg.dependencies['js-yaml'] = '^4.3.0';

          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          Object.assign(pkg.pnpm.overrides, {
            'tar': '7.5.20',
            'protobufjs': '7.6.5',
            '@babel/core': '7.29.7',
            'brace-expansion@>=2.0.0': '5.0.7',
            'brace-expansion@<2.0.0': '1.1.16',
            'form-data': '4.0.6',
            'typed-rest-client>qs': '6.15.2'
          });

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify install
        run: pnpm install --frozen-lockfile

      - name: Verify high and critical vulnerabilities are cleared
        run: pnpm audit --audit-level high

      - name: Run production build
        run: pnpm run build

      - name: Commit remediation branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'fix(security): remediate dependency audit findings'
          git push origin HEAD:fix/dependency-audit-20260721
