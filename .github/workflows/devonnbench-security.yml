name: DevonnBench Security Audit

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-security:
    name: Repo security checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: git diff --exit-code pnpm-lock.yaml

      - name: Secret scan
        run: pnpm security:scan

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  devonnbench-security:
    name: DevonnBench API security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Require production security configuration
        env:
          DEVONN_BASE_URL: ${{ secrets.DEVONN_BASE_URL }}
        run: |
          if [ -z "$DEVONN_BASE_URL" ]; then
            echo "::error::DEVONN_BASE_URL is required. Configure it as a production environment secret."
            exit 1
          fi
          case "$DEVONN_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::DEVONN_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

      - name: Install DevonnBench requirements
        run: python -m pip install --requirement requirements-devonnbench.txt

      - name: Run DevonnBench production security smoke
        env:
          DEVONN_BASE_URL: ${{ secrets.DEVONN_BASE_URL }}
          DEVONN_API_TOKEN: ${{ secrets.DEVONN_API_TOKEN }}
          DEVONN_ENV: production
        run: |
          args=(
            run devonnbench/suites/security-smoke.yaml
            --base-url "$DEVONN_BASE_URL"
            --env "$DEVONN_ENV"
            --threshold 100
          )
          if [ -n "$DEVONN_API_TOKEN" ]; then
            args+=(--auth-token "$DEVONN_API_TOKEN")
          fi
          python -m devonnbench.cli "${args[@]}"

      - name: Upload DevonnBench artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devonnbench-security-artifacts-${{ github.sha }}
          path: benchmark-artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
