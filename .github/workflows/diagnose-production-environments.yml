name: Diagnose Production Environments

on:
  push:
    branches:
      - agent/diagnose-production-environments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostinger-runner:
    name: Discover Hostinger self-hosted deployment path
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Report runner deployment prerequisites
        shell: bash
        run: |
          set -u
          echo "RUNNER_OK ${RUNNER_NAME} ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "HOST $(hostname)"
          echo "WORKSPACE ${GITHUB_WORKSPACE}"
          echo "RUNNER_WORKSPACE ${RUNNER_WORKSPACE:-unset}"

          for path in \
            /opt/supreme-ai-deployment-hub \
            /srv/supreme-ai-deployment-hub \
            /root/supreme-ai-deployment-hub \
            /home/*/supreme-ai-deployment-hub
          do
            if [ -d "$path" ]; then
              echo "REPO_PRESENT $path"
            fi
          done

          echo "REPO_SEARCH_BEGIN"
          find /opt /srv /root /home -maxdepth 4 -type d -name supreme-ai-deployment-hub 2>/dev/null | head -20 || true
          echo "REPO_SEARCH_END"

          if [ -x /usr/local/sbin/d3vonn-deploy-release ]; then
            echo "WRAPPER_PRESENT /usr/local/sbin/d3vonn-deploy-release"
            if sudo -n /usr/local/sbin/d3vonn-deploy-release --check; then
              echo "DEPLOY_WRAPPER_OK"
            else
              echo "DEPLOY_WRAPPER_CHECK_FAILED"
            fi
          else
            echo "WRAPPER_ABSENT /usr/local/sbin/d3vonn-deploy-release"
          fi

          if sudo -n true 2>/dev/null; then
            echo "PASSWORDLESS_SUDO_PRESENT"
          else
            echo "PASSWORDLESS_SUDO_ABSENT"
          fi

  uppercase-production:
    name: Inspect Production placement
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL Production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY

  lowercase-production:
    name: Inspect production placement
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY
