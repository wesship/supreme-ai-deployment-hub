name: Diagnose Production Environments

on:
  push:
    branches:
      - agent/diagnose-production-environments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostinger-runner:
    name: Diagnose Hostinger Compose runtime
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Report active Compose project and Nginx health
        shell: bash
        run: |
          set -u
          echo "RUNNER_OK ${RUNNER_NAME} ${RUNNER_OS} ${RUNNER_ARCH}"
          id

          echo "COMPOSE_PROJECTS_BEGIN"
          docker compose ls --format json || true
          echo "COMPOSE_PROJECTS_END"

          for container in d3vonn-backend d3vonn-nginx d3vonn-redis; do
            if docker inspect "$container" >/dev/null 2>&1; then
              echo "CONTAINER_BEGIN $container"
              docker inspect --format 'IMAGE {{.Config.Image}}' "$container"
              docker inspect --format 'WORKING_DIR {{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container"
              docker inspect --format 'CONFIG_FILES {{index .Config.Labels "com.docker.compose.project.config_files"}}' "$container"
              docker inspect --format 'PROJECT {{index .Config.Labels "com.docker.compose.project"}} SERVICE {{index .Config.Labels "com.docker.compose.service"}}' "$container"
              docker inspect --format '{{range .Mounts}}MOUNT {{.Source}} -> {{.Destination}} RW={{.RW}}{{println}}{{end}}' "$container"
              docker inspect --format 'HEALTH {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} STATUS {{.State.Status}}' "$container"
              echo "CONTAINER_END $container"
            fi
          done

          echo "NGINX_HEALTH_LOG_BEGIN"
          docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{.End}} EXIT={{.ExitCode}} {{printf "%q" .Output}}{{println}}{{end}}{{end}}' d3vonn-nginx 2>/dev/null | tail -10 || true
          echo "NGINX_HEALTH_LOG_END"

          echo "NGINX_LOG_BEGIN"
          docker logs --tail 40 d3vonn-nginx 2>&1 | sed -E 's/(Authorization:|Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' || true
          echo "NGINX_LOG_END"

          echo "LOCAL_HEALTH_BEGIN"
          curl -fsS --max-time 5 http://127.0.0.1/health/live || true
          echo
          curl -fsS --max-time 5 http://127.0.0.1/health/ready || true
          echo
          echo "LOCAL_HEALTH_END"

  uppercase-production:
    name: Inspect Production placement
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL Production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY

  lowercase-production:
    name: Inspect production placement
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY
