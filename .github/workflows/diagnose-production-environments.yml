name: Diagnose Production Environments

on:
  push:
    branches:
      - agent/diagnose-production-environments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostinger-runner:
    name: Inspect Hostinger self-hosted permissions
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Report runner deployment permissions
        shell: bash
        run: |
          set -u
          echo "RUNNER_OK ${RUNNER_NAME} ${RUNNER_OS} ${RUNNER_ARCH}"
          echo "HOST $(hostname)"
          id
          groups

          for path in /opt/supreme-ai-deployment-hub /opt/d3vonn/supreme-ai-deployment-hub; do
            if [ -d "$path" ]; then
              stat -c 'PATH %n OWNER %U GROUP %G MODE %A' "$path"
              if [ -w "$path" ]; then
                echo "PATH_WRITABLE $path"
              else
                echo "PATH_READ_ONLY $path"
              fi
              if git -C "$path" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                echo "GIT_REPO $path HEAD $(git -C "$path" rev-parse --short HEAD 2>/dev/null || echo unknown)"
              else
                echo "NOT_GIT_REPO $path"
              fi
            fi
          done

          if command -v docker >/dev/null 2>&1; then
            echo "DOCKER_BINARY $(command -v docker)"
            docker --version || true
            if docker info >/dev/null 2>&1; then
              echo "DOCKER_ACCESS_OK"
              docker ps --format 'CONTAINER {{.Names}} STATUS {{.Status}}' | head -30 || true
            else
              echo "DOCKER_ACCESS_DENIED"
            fi
          else
            echo "DOCKER_BINARY_ABSENT"
          fi

          if docker compose version >/dev/null 2>&1; then
            echo "DOCKER_COMPOSE_OK $(docker compose version --short)"
          else
            echo "DOCKER_COMPOSE_UNAVAILABLE"
          fi

          if [ -r /opt/supreme-ai-deployment-hub/deploy/vps/env/.env.production ]; then
            echo "PRODUCTION_ENV_READABLE"
          else
            echo "PRODUCTION_ENV_NOT_READABLE"
          fi

          if [ -w /opt/supreme-ai-deployment-hub/deploy/vps/env/.env.production ]; then
            echo "PRODUCTION_ENV_WRITABLE"
          else
            echo "PRODUCTION_ENV_NOT_WRITABLE"
          fi

  uppercase-production:
    name: Inspect Production placement
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL Production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY

  lowercase-production:
    name: Inspect production placement
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      HOSTINGER_VPS_HOST_VAR: ${{ vars.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER_VAR: ${{ vars.HOSTINGER_VPS_USER }}
      VITE_VAPI_ASSISTANT_ID: ${{ vars.VITE_VAPI_ASSISTANT_ID }}
      HOSTINGER_VPS_HOST_SECRET: ${{ secrets.HOSTINGER_VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      HOSTINGER_VPS_USER_SECRET: ${{ secrets.HOSTINGER_VPS_USER }}
      ROOT_SECRET: ${{ secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report names-only placement
        run: |
          python - <<'PY'
          import os
          names = (
              'SUPABASE_PROJECT_ID','SUPABASE_PROJECT_REF','PROJECT_ID',
              'HOSTINGER_VPS_HOST_VAR','HOSTINGER_VPS_USER_VAR','VITE_VAPI_ASSISTANT_ID',
              'HOSTINGER_VPS_HOST_SECRET','VPS_HOST','HOSTINGER_VPS_USER_SECRET','ROOT_SECRET',
              'HOSTINGER_VPS_SSH_KEY','VPS_SSH_KEY','VPS_SSH_PRIVATE_KEY',
              'OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY',
          )
          print('ENVIRONMENT_LABEL production')
          for name in names:
              print(f"{'PRESENT' if os.getenv(name, '').strip() else 'ABSENT'} {name}")
          PY
