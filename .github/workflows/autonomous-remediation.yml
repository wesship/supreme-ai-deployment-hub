name: Autonomous Remediation

on:
  workflow_call:
    inputs:
      trigger_type:
        description: 'What triggered remediation'
        required: true
        type: string
      severity:
        description: 'Severity level'
        required: true
        type: string
      affected_service:
        description: 'Affected service'
        required: false
        type: string
        default: 'devonn-api'
      auto_rollback:
        description: 'Automatically rollback if true'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      trigger_type:
        description: 'Remediation trigger type'
        required: true
        default: 'manual-review'
      severity:
        description: 'Severity'
        required: true
        default: 'medium'
      affected_service:
        description: 'Affected service name'
        required: false
        default: 'devonn-api'
      auto_rollback:
        description: 'Execute automatic rollback'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  issues: write

concurrency:
  group: autonomous-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    name: Manual or Explicit Remediation Triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record remediation request
        run: |
          echo "Autonomous remediation no longer runs on a schedule."
          echo "Trigger: ${{ inputs.trigger_type || github.event.inputs.trigger_type }}"
          echo "Severity: ${{ inputs.severity || github.event.inputs.severity }}"
          echo "Service: ${{ inputs.affected_service || github.event.inputs.affected_service }}"
          echo "Auto rollback: ${{ inputs.auto_rollback || github.event.inputs.auto_rollback }}"
