name: Trusted Build Infrastructure (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  trusted-build-status:
    name: Trusted build status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "Trusted build, package publication, and attestations are manual-only."
          echo "Railway and Vercel remain the active production deployment services."
