name: Verify Restricted Hostinger Bootstrap

on:
  push:
    branches:
      - agent/repair-hostinger-deployment
    paths:
      - '.github/workflows/verify-hostinger-bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-hostinger-bootstrap.yml'
      - 'deploy/vps/scripts/d3vonn-deploy-release'

permissions:
  contents: read

concurrency:
  group: verify-restricted-hostinger-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runner privilege reduction
    if: github.event_name == 'push' || (github.head_ref == 'agent/repair-hostinger-deployment' && github.actor == 'wesship')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Verify least-privilege runner state
        shell: bash
        run: |
          set -euo pipefail

          echo "RUNNER ${RUNNER_NAME}"
          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo "github-runner still has docker group membership." >&2
            exit 1
          fi
          echo "OK RUNNER_NOT_IN_DOCKER_GROUP"

          sudo -n /usr/local/sbin/d3vonn-deploy-release --check
          echo "OK RESTRICTED_DEPLOY_WRAPPER"
