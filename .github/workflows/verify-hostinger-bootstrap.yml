name: Verify Restricted Hostinger Bootstrap

on:
  push:
    branches:
      - agent/repair-hostinger-deployment
    paths:
      - '.github/workflows/verify-hostinger-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: verify-restricted-hostinger-bootstrap
  cancel-in-progress: false

jobs:
  verify:
    name: Verify runner privilege reduction
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify least-privilege runner state
        shell: bash
        run: |
          set -euo pipefail

          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo "github-runner still has docker group membership." >&2
            exit 1
          fi

          sudo -n /usr/local/sbin/d3vonn-deploy-release --check

          printf '%s\n' \
            'HOSTINGER_BOOTSTRAP_OK' \
            "runner=${RUNNER_NAME}" \
            "verified_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            > .github/hostinger-bootstrap-status.txt

          git config user.name 'd3vonn-bootstrap[bot]'
          git config user.email '37167955+wesship@users.noreply.github.com'
          git add .github/hostinger-bootstrap-status.txt
          git commit -m 'ci(vps): record restricted runner verification'
          git push origin HEAD:agent/repair-hostinger-deployment
