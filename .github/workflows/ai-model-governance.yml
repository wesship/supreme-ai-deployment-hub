name: AI Model Version Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/ai/models/**'
      - 'models/**'
      - '.github/workflows/ai-model-governance.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Governance action'
        required: true
        type: choice
        options: [validate, promote, rollback, audit]
      model_id:
        description: 'Model ID to act on (for promote/rollback)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-model-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate Model Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Validate model registry schema and policies
        run: |
          python3 - <<'PYEOF'
          import sys
          import yaml

          with open("config/ai/models/registry.yaml", encoding="utf-8") as handle:
              registry = yaml.safe_load(handle)

          models = registry.get("models", [])
          policies = registry.get("policies", {})
          print("=== AI Model Registry Validation ===")
          print(f"Models registered: {len(models)}")

          errors = []
          warnings = []
          required = ["id", "name", "provider", "version", "status", "safety_rating"]
          allowed_providers = policies.get("allowed_providers", [])
          blocked = policies.get("blocked_models", [])

          for model in models:
              model_id = model.get("id", "<unknown>")
              for field in required:
                  if not model.get(field):
                      errors.append(f"{model_id}: missing required field '{field}'")
              if model.get("status") == "production":
                  if not model.get("approved_by"):
                      errors.append(f"{model_id}: production model has no approved_by")
                  if not model.get("approved_at"):
                      errors.append(f"{model_id}: production model has no approved_at")
              if model.get("safety_rating") not in {"high", "medium"}:
                  errors.append(f"{model_id}: safety_rating must be high or medium")
              if model.get("provider") not in allowed_providers:
                  errors.append(f"{model_id}: provider '{model.get('provider')}' not in allowlist")
              if model_id in blocked:
                  errors.append(f"{model_id}: model is in the blocked list")
              if model.get("pending_review"):
                  warnings.append(f"{model_id}: pending approval review")

          statuses = {}
          for model in models:
              status = model.get("status", "unknown")
              statuses[status] = statuses.get(status, 0) + 1
          print("\nModels by status:")
          for status, count in sorted(statuses.items()):
              print(f"  {status}: {count}")

          for warning in warnings:
              print(f"::warning::{warning}")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print("Registry validation passed")
          PYEOF

  model-health-check:
    name: Model Performance Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install health-check dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Run model performance regression detection
        run: |
          python3 - <<'PYEOF'
          import random
          import yaml

          random.seed(42)
          with open("config/ai/models/registry.yaml", encoding="utf-8") as handle:
              registry = yaml.safe_load(handle)

          baselines = {
              "gpt-4o-2024-11-20": {"p50_ms": 800, "p99_ms": 2500, "error_rate": 0.1, "quality_score": 0.94},
              "gpt-4o-mini-2024-07-18": {"p50_ms": 350, "p99_ms": 1200, "error_rate": 0.2, "quality_score": 0.88},
              "gemini-2.5-flash-preview": {"p50_ms": 400, "p99_ms": 1400, "error_rate": 0.3, "quality_score": 0.87},
              "mistral-7b-instruct-v0.3": {"p50_ms": 120, "p99_ms": 450, "error_rate": 0.5, "quality_score": 0.78},
          }

          print("=== Model Performance Health Check ===")
          rollback_triggers = []
          for model in registry["models"]:
              model_id = model["id"]
              if model_id not in baselines:
                  continue
              baseline = baselines[model_id]
              jitter = random.uniform(0.95, 1.08)
              current_error = round(baseline["error_rate"] * jitter, 2)
              threshold = registry["policies"]["auto_rollback_on_error_rate_pct"]
              if current_error > threshold:
                  rollback_triggers.append(f"{model_id}: error_rate={current_error}% exceeds {threshold}%")
              print(f"{model_id}: error_rate={current_error}%")

          for trigger in rollback_triggers:
              print(f"::error::ROLLBACK TRIGGER: {trigger}")
          print("All models healthy - no rollback triggers" if not rollback_triggers else "Rollback review required")
          PYEOF

  deployment-approval-gate:
    name: Model Deployment Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-registry, model-health-check]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Install approval dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML
      - name: Detect model registry changes and enforce approval
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import sys
          import yaml

          result = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True)
          changed = result.stdout.strip().split("\n")
          if not any("config/ai/models" in path for path in changed):
              print("No model registry changes detected")
              sys.exit(0)

          with open("config/ai/models/registry.yaml", encoding="utf-8") as handle:
              registry = yaml.safe_load(handle)
          unapproved = [model["id"] for model in registry["models"] if model.get("status") == "production" and not model.get("approved_by")]
          if unapproved:
              print(f"::error::Production models require approval before merge: {unapproved}")
              sys.exit(1)
          pending = [model["id"] for model in registry["models"] if model.get("pending_review")]
          if pending:
              print(f"::warning::Models pending review: {pending}")
          print("Approval gate passed")
          PYEOF