name: Terraform Autoformat Once

on:
  push:
    branches: [security/checkov-terraform-assurance]
    paths:
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/terraform-autoformat-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/checkov-terraform-assurance
          persist-credentials: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.9.8'
      - name: Format Terraform
        run: terraform fmt -recursive src/data/manifest/terraform
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo 'Terraform is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/manifest/terraform
          git commit -m 'style(terraform): apply canonical formatting'
          git push origin HEAD:security/checkov-terraform-assurance
