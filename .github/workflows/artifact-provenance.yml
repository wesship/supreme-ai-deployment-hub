name: Artifact Provenance & Signing (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  provenance-status:
    name: Provenance status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "Artifact signing and provenance attestations are manual-only."
          echo "Use this workflow only for an intentional release artifact."
