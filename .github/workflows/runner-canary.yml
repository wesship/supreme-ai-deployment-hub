name: Runner Canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runner-canary.yml'

permissions:
  contents: read

concurrency:
  group: runner-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Hosted Runner Canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner started successfully"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          uname -a
          date -u
