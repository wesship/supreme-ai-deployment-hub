name: Load Tests

# Runs k6 load tests against the staging environment after every deploy to main.
# Also runnable manually against any environment.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL for load tests"
        required: true
        default: "https://staging.devonn.ai"
      scenario:
        description: "Test scenario: smoke | load | stress | spike"
        required: true
        default: "smoke"
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: k6 Load Test (${{ github.event.inputs.scenario || 'smoke' }})
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run load test
        run: |
          mkdir -p test-results
          k6 run \
            --env BASE_URL=${{ github.event.inputs.base_url || 'https://staging.devonn.ai' }} \
            --env SCENARIO=${{ github.event.inputs.scenario || 'smoke' }} \
            --out json=test-results/k6-results.json \
            load-tests/api-load-test.js

      - name: Upload k6 results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: k6-load-test-results
          path: test-results/
          retention-days: 30
