name: Voice Certification Status Bridge

on:
  workflow_run:
    workflows:
      - D3VONN Voice Production Certification
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Publish voice production result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          conclusion = os.environ.get("CONCLUSION", "failure")
          if conclusion == "success":
              state = "success"
              description = "Vapi, ElevenLabs, and Hermes certified in production"
          elif conclusion == "cancelled":
              state = "error"
              description = "Voice production certification was cancelled"
          else:
              state = "failure"
              description = "Voice production certification failed; inspect workflow logs"

          payload = json.dumps(
              {
                  "state": state,
                  "context": "voice/production-certification",
                  "description": description[:140],
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode("utf-8")

          url = (
              "https://api.github.com/repos/"
              f"{os.environ['REPOSITORY']}/statuses/{os.environ['HEAD_SHA']}"
          )
          request = urllib.request.Request(url, data=payload, method="POST")
          request.add_header("Authorization", f"Bearer {os.environ['GH_TOKEN']}")
          request.add_header("Accept", "application/vnd.github+json")
          request.add_header("Content-Type", "application/json")
          request.add_header("User-Agent", "d3vonn-voice-certification")
          request.add_header("X-GitHub-Api-Version", "2022-11-28")

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"Unexpected GitHub status response: {response.status}")

          print(f"Published voice production certification status: {state}")
          PY
