name: Hermes VPS Readiness

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "vps"
        type: choice
        options:
          - vps
          - railway
          - render
          - kubernetes
  push:
    branches: [main]
    paths:
      - "docs/HERMES_VPS_ACTIVATION_RUNBOOK.md"
      - "docs/HERMES_SELF_UPDATE_RECENCY_LOOP.md"
      - "config/hermes-version-manifest.example.json"
      - ".github/workflows/hermes-vps-readiness.yml"
      - ".github/workflows/hermes-recency-sync.yml"

permissions:
  contents: read

jobs:
  readiness:
    name: Validate Hermes VPS Readiness Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify required Hermes activation assets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "docs/HERMES_VPS_ACTIVATION_RUNBOOK.md"
            "docs/HERMES_SELF_UPDATE_RECENCY_LOOP.md"
            "config/hermes-version-manifest.example.json"
            ".github/workflows/hermes-recency-sync.yml"
            ".github/workflows/validate-secrets.yml"
          )

          for file in "${required[@]}"; do
            test -f "$file"
            echo "✓ $file"
          done

      - name: Validate Hermes version manifest example
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/hermes-version-manifest.example.json')
          manifest = json.loads(path.read_text())

          required_keys = [
              'service',
              'environment',
              'deploy_target',
              'deployment_id',
              'git_sha',
              'config_version',
              'db_migration_version',
              'kg_schema_version',
              'agent_manifest_version',
              'recency_sync_required',
              'startup_required_checks',
              'blocked_integrations_until_ready'
          ]

          missing = [key for key in required_keys if key not in manifest]
          if missing:
              raise SystemExit(f'Missing manifest keys: {missing}')

          if manifest['service'] != 'hermes':
              raise SystemExit('Manifest service must be hermes')

          if 'vapi' not in manifest['blocked_integrations_until_ready']:
              raise SystemExit('Vapi must remain blocked until Hermes readiness passes')

          print('✓ Hermes version manifest example is valid')
          PY

      - name: Emit VPS activation checklist
        shell: bash
        run: |
          set -euo pipefail

          cat > hermes-vps-readiness-summary.txt <<'EOF'
          Hermes VPS readiness assets are present.

          Tomorrow activation order:
          1. Add VPS env vars, including JWT_SECRET and ENCRYPTION_KEY.
          2. Start Hermes/backend services.
          3. Verify /api/health returns HTTP 200.
          4. Verify Hermes intake -> worker -> callback -> memory/KG write-back.
          5. Run Hermes recency sync.
          6. Connect Vapi and voice only after pass.
          EOF

          cat hermes-vps-readiness-summary.txt

      - name: Upload readiness summary
        uses: actions/upload-artifact@v4
        with:
          name: hermes-vps-readiness-summary
          path: hermes-vps-readiness-summary.txt
          if-no-files-found: error
