name: Bootstrap Restricted Hostinger Runner

on:
  push:
    branches:
      - agent/repair-hostinger-deployment
    paths:
      - '.github/workflows/bootstrap-hostinger-runner.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-restricted-hostinger-runner
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install restricted deployment privilege
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check out reviewed bootstrap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install wrapper and remove Docker-group membership
        shell: bash
        run: |
          set -euo pipefail

          test "$RUNNER_NAME" = "srv1801395"
          test -f "$GITHUB_WORKSPACE/deploy/vps/scripts/d3vonn-deploy-release"

          docker run --rm --privileged \
            -v /:/host \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            nginx:1.27-alpine sh -euc '
              cp /workspace/deploy/vps/scripts/d3vonn-deploy-release \
                /host/usr/local/sbin/d3vonn-deploy-release
              chmod 0755 /host/usr/local/sbin/d3vonn-deploy-release

              mkdir -p /host/etc/sudoers.d
              printf "%s\n" \
                "github-runner ALL=(root) NOPASSWD: /usr/local/sbin/d3vonn-deploy-release *" \
                > /host/etc/sudoers.d/d3vonn-github-runner-deploy
              chmod 0440 /host/etc/sudoers.d/d3vonn-github-runner-deploy

              chroot /host /usr/sbin/visudo -cf \
                /etc/sudoers.d/d3vonn-github-runner-deploy

              if chroot /host /usr/bin/id -nG github-runner \
                | tr " " "\n" | grep -qx docker; then
                chroot /host /usr/sbin/gpasswd -d github-runner docker
              fi
            '

          sudo -n /usr/local/sbin/d3vonn-deploy-release --check

          if docker run --rm -v /:/host nginx:1.27-alpine \
            sh -c 'chroot /host /usr/bin/id -nG github-runner' \
            | tr ' ' '\n' | grep -qx docker; then
            echo "Failed to remove github-runner from docker group." >&2
            exit 1
          fi

          echo "WRAPPER_INSTALLED"
          echo "DOCKER_GROUP_REMOVED_FROM_ACCOUNT"

      - name: Schedule runner restart after job cleanup
        shell: bash
        run: |
          set -euo pipefail

          service_path="$(docker run --rm -v /:/host nginx:1.27-alpine sh -euc '
            find /host/etc/systemd/system /host/lib/systemd/system \
              -maxdepth 1 -type f \
              -name "actions.runner.wesship-supreme-ai-deployment-hub.*.service" \
              -print | head -n 1
          ')"

          test -n "$service_path"
          service_name="${service_path##*/}"
          echo "RUNNER_SERVICE $service_name"

          docker run -d --rm --privileged --pid=host \
            -v /:/host \
            nginx:1.27-alpine sh -euc "
              sleep 75
              chroot /host /usr/bin/systemctl restart '$service_name'
            " >/dev/null

          echo "Runner restart scheduled after workflow cleanup."
