name: D3VONN Required PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-pr-gate:
    name: D3VONN Required PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate lockfile and install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend TypeScript type-check
        run: pnpm typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm test

      - name: Production frontend build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_ENVIRONMENT: production
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Backend syntax check
        run: python -m compileall -q backend

      - name: Backend import check
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: python -c "from backend.main import app; assert app is not None"

      - name: Focused backend tests
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: >-
          python -m pytest
          backend/tests/test_proxy_routes.py
          backend/tests/test_ai_film_provider_adapters.py
          -q

      - name: Secret scan
        run: pnpm security:scan

      - name: Validate workflow YAML structure
        run: |
          python3 - <<'PYEOF'
          import glob
          import re
          import sys
          import yaml

          expression_pattern = re.compile(r'\$\{\{.*?\}\}', re.DOTALL)
          if_pattern = re.compile(r'^(\s*if:\s*)(.*?)(\s*(?:#.*)?)$', re.MULTILINE)

          def normalize_github_syntax(content):
              content = expression_pattern.sub('GITHUB_EXPRESSION', content)

              def replace_if(match):
                  prefix, value, suffix = match.groups()
                  stripped = value.strip()
                  if not stripped or stripped[0] in {'"', "'"}:
                      return match.group(0)
                  return f'{prefix}"GITHUB_CONDITION"{suffix}'

              return if_pattern.sub(replace_if, content)

          errors = []
          workflow_files = sorted(glob.glob('.github/workflows/*.{yml,yaml}'))
          for workflow in workflow_files:
              try:
                  with open(workflow, encoding='utf-8') as handle:
                      yaml.safe_load(normalize_github_syntax(handle.read()))
              except yaml.YAMLError as error:
                  errors.append(f'{workflow}: {error}')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              sys.exit(1)

          print(f'All {len(workflow_files)} workflow files have valid YAML structure.')
          PYEOF

      - name: Validate GitHub Action references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob
          import re
          import sys
          import yaml

          expression_pattern = re.compile(r'\$\{\{.*?\}\}', re.DOTALL)
          if_pattern = re.compile(r'^(\s*if:\s*)(.*?)(\s*(?:#.*)?)$', re.MULTILINE)
          dangerous_refs = {'main', 'master', 'HEAD'}
          sha_pattern = re.compile(r'^[^@\s]+@[0-9a-f]{40}$')
          required_gate = '.github/workflows/required-pr-gate.yml'

          def normalize_github_syntax(content):
              content = expression_pattern.sub('GITHUB_EXPRESSION', content)

              def replace_if(match):
                  prefix, value, suffix = match.groups()
                  stripped = value.strip()
                  if not stripped or stripped[0] in {'"', "'"}:
                      return match.group(0)
                  return f'{prefix}"GITHUB_CONDITION"{suffix}'

              return if_pattern.sub(replace_if, content)

          def collect_uses(value, found):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'uses' and isinstance(child, str):
                          found.append(child)
                      else:
                          collect_uses(child, found)
              elif isinstance(value, list):
                  for child in value:
                      collect_uses(child, found)

          errors = []
          for workflow in sorted(glob.glob('.github/workflows/*.{yml,yaml}')):
              with open(workflow, encoding='utf-8') as handle:
                  parsed = yaml.safe_load(normalize_github_syntax(handle.read())) or {}

              references = []
              collect_uses(parsed, references)
              for reference in references:
                  if reference.startswith('./') or reference.startswith('docker://'):
                      continue
                  if '@' not in reference:
                      errors.append(f'{workflow}: external action has no ref: {reference}')
                      continue

                  ref = reference.rsplit('@', 1)[1]
                  if ref in dangerous_refs:
                      errors.append(f'{workflow}: mutable action ref is not allowed: {reference}')
                  if workflow == required_gate and not sha_pattern.fullmatch(reference):
                      errors.append(f'{workflow}: required-gate action is not pinned to a full SHA: {reference}')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              sys.exit(1)

          print('All workflow action references satisfy the required-gate policy.')
          PYEOF
