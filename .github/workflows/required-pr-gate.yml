name: D3VONN Required PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-pr-gate:
    name: D3VONN Required PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate lockfile and install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend TypeScript type-check
        run: pnpm typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm test

      - name: Production frontend build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_ENVIRONMENT: production
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Backend syntax check
        run: python -m compileall -q backend

      - name: Backend import check
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: python -c "from backend.main import app; assert app is not None"

      - name: Focused backend tests
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: >-
          python -m pytest
          backend/tests/test_proxy_routes.py
          backend/tests/test_ai_film_provider_adapters.py
          tests/test_readiness.py
          -q

      - name: Secret scan
        run: pnpm security:scan

      - name: Validate workflow YAML structure
        run: python3 scripts/validate_workflows.py --mode yaml

      - name: Validate GitHub Action references
        run: python3 scripts/validate_workflows.py --mode actions

      - name: Run CI doctor
        run: pnpm ci:doctor
