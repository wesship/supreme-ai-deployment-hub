name: Chaos Engineering & Resilience Testing

on:
  workflow_dispatch:
    inputs:
      chaos_type:
        description: 'Chaos experiment'
        required: true
        default: 'network-latency'
        type: choice
        options: [network-latency, network-partition, dependency-outage, canary-degradation, all]
      target_environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      dry_run:
        description: 'Dry run only'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chaos-engineering
  cancel-in-progress: false

jobs:
  control:
    name: Manual Chaos Control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Chaos engineering is manual-only."
          echo "Type: ${{ github.event.inputs.chaos_type }}"
          echo "Environment: ${{ github.event.inputs.target_environment }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
