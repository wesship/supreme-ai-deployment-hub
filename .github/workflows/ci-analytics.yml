name: CI Analytics & Failure Intelligence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-analytics
  cancel-in-progress: true

jobs:
  analyze-ci-health:
    name: Analyze CI Health Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain manual-only mode
        run: |
          echo "CI analytics is manual-only to prevent workflow_run recursion and conserve Actions minutes."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
