name: D3VONN Railway Voice Production Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/app/routers/voice_orchestration.py
      - backend/tests/test_voice_orchestration.py
      - backend/tests/test_voice_session.py
      - backend/ai_films/twelvelabs.py
      - .github/workflows/voice-railway-production-certification.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: d3vonn-railway-voice-production
  cancel-in-progress: false

jobs:
  certify:
    name: Certify the live Railway voice backend
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    environment: production
    env:
      VOICE_HEALTH_URL: https://api.d3vonn.io/api/voice/health
      VAPI_WEBHOOK_URL: https://api.d3vonn.io/api/voice/vapi/webhook
      VAPI_WEBHOOK_SECRET: ${{ secrets.VAPI_WEBHOOK_SECRET }}

    steps:
      - name: Check out the exact release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Publish pending certification status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "state": "pending",
              "context": "voice/railway-production-certification",
              "description": "Certifying inline Vapi, Jockey, Railway, and Hermes readiness",
              "target_url": os.environ["RUN_URL"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['SHA']}",
              data=payload,
              method="POST",
          )
          req.add_header("Authorization", f"Bearer {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          req.add_header("User-Agent", "d3vonn-voice-certification")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"Unexpected GitHub status response: {response.status}")
          PY

      - name: Validate certification inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VAPI_WEBHOOK_SECRET:-}" ]]; then
            echo "::error::VAPI_WEBHOOK_SECRET is required in the protected production environment for synthetic webhook certification."
            exit 1
          fi
          case "${VAPI_WEBHOOK_SECRET,,}" in
            paste_*|change_me*|your_*|placeholder*)
              echo "::error::VAPI_WEBHOOK_SECRET still contains a placeholder."
              exit 1
              ;;
          esac
          echo "::add-mask::$VAPI_WEBHOOK_SECRET"
          echo "Protected webhook credential is available without exposing its value."

      - name: Wait for the live Railway voice backend
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT

          ready=false
          for attempt in {1..36}; do
            if curl --fail --silent --show-error "$VOICE_HEALTH_URL" -o "$HEALTH_FILE"; then
              if python3 - "$HEALTH_FILE" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          raise SystemExit(0 if data.get("browser_voice_ready") is True else 1)
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done

          if [[ "$ready" != "true" ]]; then
            echo "::error::The live Railway voice backend did not report browser_voice_ready=true."
            exit 1
          fi

      - name: Certify current voice and Jockey readiness
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT
          curl --fail --silent --show-error "$VOICE_HEALTH_URL" -o "$HEALTH_FILE"

          python3 - "$HEALTH_FILE" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("secrets_exposed") is not False:
              raise SystemExit("Voice health endpoint failed the secret-exposure assertion.")
          if data.get("browser_voice_ready") is not True:
              raise SystemExit(f"Browser voice is not ready: {data}")
          if data.get("film_intelligence_ready") is not True:
              raise SystemExit(
                  "Jockey film intelligence is not ready. Confirm TWELVELABS_API_KEY and "
                  "TWELVELABS_KNOWLEDGE_STORE_ID are set on the live Railway backend."
              )

          checks = data.get("checks") or {}
          required = {
              "vapi_public_configuration",
              "inline_authenticated_sessions",
              "elevenlabs_voice",
              "hermes_internal_adapter",
              "jockey_film_intelligence",
          }
          missing = sorted(name for name in required if checks.get(name) is not True)
          if missing:
              raise SystemExit(f"Voice readiness checks failed: {missing}")

          print("Browser voice, authenticated sessions, Hermes, and Jockey readiness verified.")
          PY

      - name: Certify signed Vapi webhook delivery into Hermes
        shell: bash
        run: |
          set -euo pipefail
          EVENT_ID="voice-railway-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          curl --fail --silent --show-error \
            -X POST "$VAPI_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "x-vapi-secret: $VAPI_WEBHOOK_SECRET" \
            --data "{\"message\":{\"id\":\"$EVENT_ID\",\"type\":\"status-update\",\"status\":\"voice-railway-certified\"}}" \
            -o "$RESPONSE_FILE"

          python3 - "$RESPONSE_FILE" "$EVENT_ID" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("ok") is not True or data.get("event_id") != sys.argv[2]:
              raise SystemExit(f"Authenticated Vapi webhook certification failed: {data}")
          if data.get("hermes_recorded") is not True:
              raise SystemExit(f"Hermes did not record the certified voice event: {data}")
          print("Signed Vapi webhook delivery reached Hermes successfully.")
          PY

      - name: Publish final certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.request

          succeeded = os.environ.get("JOB_STATUS") == "success"
          payload = json.dumps({
              "state": "success" if succeeded else "failure",
              "context": "voice/railway-production-certification",
              "description": (
                  "Inline Vapi, Jockey, Railway, and Hermes certified in production"
                  if succeeded else
                  "Voice production certification failed; open the workflow run"
              ),
              "target_url": os.environ["RUN_URL"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['SHA']}",
              data=payload,
              method="POST",
          )
          req.add_header("Authorization", f"Bearer {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          req.add_header("User-Agent", "d3vonn-voice-certification")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"Unexpected GitHub status response: {response.status}")
          PY
