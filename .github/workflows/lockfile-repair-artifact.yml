name: Lockfile repair artifact (review only)

on:
  pull_request:
    paths:
      - '.github/workflows/lockfile-repair-artifact.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate lockfile (no install scripts)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Show lockfile change summary
        run: git diff --stat -- pnpm-lock.yaml && git diff --check
      - name: Upload generated lockfile for human inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 7
      - name: Verify frozen install on generated lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
