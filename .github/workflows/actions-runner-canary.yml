name: Actions Runner Canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/actions-runner-canary.yml'

permissions:
  contents: read

jobs:
  canary:
    name: GitHub-hosted runner canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner provisioning
        run: |
          echo "GitHub-hosted runner provisioned successfully"
          uname -a
          date -u
