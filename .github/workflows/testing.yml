name: Devonn.AI Testing

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)

      - name: Run npm audit
        run: npm audit --production
        continue-on-error: true

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3   # was @v2 (deprecated)
        continue-on-error: true

  unit-test:
    name: Unit Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Generate coverage report
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: frontend
          name: supreme-hub-node-coverage
          fail_ci_if_error: false

  python-test:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)
      - name: Set up Python
        uses: actions/setup-python@v5      # was @v6 (non-existent)
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx fastapi uvicorn pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Verify OpenAI key is present
        run: test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY is set" || echo "OPENAI_API_KEY not set — skipping key-dependent tests"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run Python tests with coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml:python-coverage.xml \
            --cov-report=term-missing \
            --cov-omit="tests/*,*/__pycache__/*" \
            -v || echo "No Python tests found — skipping"
      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./python-coverage.xml
          flags: backend
          name: supreme-hub-python-coverage
          fail_ci_if_error: false

  extension-test:
    name: Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run extension tests
        run: npm run test:extension
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-results
          path: test-results/
          retention-days: 7

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-test]
    strategy:
      fail-fast: false                     # don't cancel sibling matrix jobs
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4          # was @v6 (non-existent)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run E2E tests (${{ matrix.browser }})
        run: BROWSER=${{ matrix.browser }} npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
