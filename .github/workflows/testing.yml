name: D3VONN.IO Testing

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile integrity
        run: git diff --exit-code pnpm-lock.yaml || (echo "pnpm-lock.yaml drift detected" && exit 1)
      - name: Run app-source linter
        run: pnpm exec eslint src --ext .ts,.tsx,.js,.jsx --no-error-on-unmatched-pattern --quiet

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --prod
        continue-on-error: true
      - name: Run Snyk scan
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  unit-test:
    name: Unit Tests (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm run test
      - name: Generate coverage report
        run: pnpm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: testing-frontend-coverage
          path: coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: frontend
          name: supreme-hub-node-coverage
          fail_ci_if_error: false

  python-test:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx anyio fastapi uvicorn pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
      - name: Verify OpenAI key is present
        run: test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY is set" || echo "OPENAI_API_KEY not set - skipping key-dependent tests"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run Python tests with coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml:python-coverage.xml \
            --cov-report=term-missing \
            --cov-omit="tests/*,*/__pycache__/*" \
            -v || echo "No Python tests found - skipping"
      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./python-coverage.xml
          flags: backend
          name: supreme-hub-python-coverage
          fail_ci_if_error: false

  backend-proxy-test:
    name: Backend Proxy Tests (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint runtime-critical backend errors
        run: ruff check app/ tests/test_proxy_routes.py --select E9,F63,F7,F82 --output-format=github
      - name: Type-check with mypy
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true
      - name: Run proxy route tests
        run: |
          pytest tests/test_proxy_routes.py \
            --cov=app \
            --cov-report=xml:proxy-coverage.xml \
            --cov-report=term-missing \
            -v
      - name: Upload proxy coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-proxy-coverage
          path: backend/proxy-coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  extension-test:
    name: Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run extension tests
        run: pnpm run test:extension
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-test:
    name: Production + auth interaction audit (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [unit-test]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install selected Playwright browser
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Run production and auth interaction audit (${{ matrix.browser }})
        env:
          CI: "true"
          VITE_API_URL: https://api.d3vonn.io
          VITE_RUM_ENABLED: "false"
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
        run: |
          pnpm exec playwright test \
            tests/e2e/production-interaction-audit.spec.ts \
            tests/e2e/specs/auth.spec.ts \
            tests/e2e/specs/navbar-protected-routes.spec.ts \
            --project="${{ matrix.browser }}"
      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-auth-interaction-audit-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
