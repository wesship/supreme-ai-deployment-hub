name: Vault-Backed Secrets Injection

on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      secrets_injected:
        description: Whether secrets were successfully injected from Vault
        value: ${{ jobs.inject-secrets.outputs.injected }}
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication to Vault

concurrency:
  group: vault-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inject-secrets:
    name: Inject Secrets from Vault (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      injected: ${{ steps.inject.outputs.injected }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b4d4bde5b7a4c0c1b5e3c7d5e6f7a  # v4

      - name: Authenticate to HashiCorp Vault via OIDC
        id: vault-auth
        # Requires: VAULT_ADDR repository variable, VAULT_ROLE repository variable
        # Vault must be configured with GitHub Actions JWT auth method
        run: |
          VAULT_ADDR="${{ vars.VAULT_ADDR }}"
          VAULT_ROLE="${{ vars.VAULT_ROLE || 'devonn-ai-ci' }}"

          if [ -z "$VAULT_ADDR" ]; then
            echo "::notice::VAULT_ADDR not configured - using GitHub Secrets fallback"
            echo "vault_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get GitHub OIDC token
          OIDC_TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          # Authenticate to Vault using JWT/OIDC
          VAULT_TOKEN=$(curl -sf \
            -X POST "${VAULT_ADDR}/v1/auth/jwt/login" \
            -d "{\"jwt\": \"${OIDC_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['auth']['client_token'])")

          echo "::add-mask::${VAULT_TOKEN}"
          echo "VAULT_TOKEN=${VAULT_TOKEN}" >> $GITHUB_ENV
          echo "vault_available=true" >> $GITHUB_OUTPUT
          echo "Vault authentication: successful"

      - name: Inject secrets from Vault KV store
        id: inject
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          if [ "${{ steps.vault-auth.outputs.vault_available }}" != "true" ]; then
            echo "Vault not available - GitHub Secrets in use (migration pending)"
            echo "injected=github-secrets" >> $GITHUB_OUTPUT

            # Report which secrets should be migrated to Vault
            python3 - <<'PYEOF'
          secrets_to_migrate = [
              "OPENAI_API_KEY",
              "ANTHROPIC_API_KEY",
              "ELEVENLABS_API_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "SUPABASE_ANON_KEY",
              "DATABASE_URL",
              "REDIS_URL",
              "RENDER_API_KEY",
              "CLOUDFLARE_API_TOKEN",
              "SENTRY_DSN",
          ]
          print("=== Vault Migration Status ===")
          print(f"Secrets pending migration to Vault: {len(secrets_to_migrate)}")
          for s in secrets_to_migrate:
              print(f"  - {s}")
          print("\nActivate by setting VAULT_ADDR and VAULT_ROLE repository variables")
          PYEOF
            exit 0
          fi

          # Read secrets from Vault KV v2
          SECRETS_PATH="secret/data/devonn-ai/ci"
          SECRETS=$(curl -sf \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/${SECRETS_PATH}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin)['data']['data']; print(json.dumps(d))")

          # Inject each secret as masked environment variable
          python3 - <<PYEOF
          import json, os, subprocess

          secrets = json.loads('''${SECRETS}''')
          env_file = os.environ["GITHUB_ENV"]

          with open(env_file, "a") as f:
              for key, value in secrets.items():
                  # Mask the value in logs
                  subprocess.run(["echo", f"::add-mask::{value}"])
                  f.write(f"{key}={value}\n")

          print(f"Injected {len(secrets)} secrets from Vault")
          print("Secret names: " + ", ".join(secrets.keys()))
          PYEOF

          echo "injected=vault" >> $GITHUB_OUTPUT
          echo "Vault secrets injection: complete"

  # Vault Configuration Documentation
  vault-config-docs:
    name: Generate Vault Configuration Guide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b4d4bde5b7a4c0c1b5e3c7d5e6f7a  # v4

      - name: Generate Vault setup documentation
        run: |
          mkdir -p /tmp/vault-docs
          cat > /tmp/vault-docs/vault-setup.md << 'EOF'
          # Vault Setup Guide for Devonn.AI CI/CD

          ## Prerequisites
          - HashiCorp Vault 1.15+ instance (or HCP Vault)
          - GitHub Actions JWT auth method enabled

          ## Step 1: Enable JWT Auth in Vault
          ```bash
          vault auth enable jwt
          vault write auth/jwt/config \
            oidc_discovery_url="https://token.actions.githubusercontent.com" \
            bound_issuer="https://token.actions.githubusercontent.com"
          ```

          ## Step 2: Create Vault Policy
          ```hcl
          # devonn-ai-ci-policy.hcl
          path "secret/data/devonn-ai/ci" {
            capabilities = ["read"]
          }
          path "secret/data/devonn-ai/staging" {
            capabilities = ["read"]
          }
          ```
          ```bash
          vault policy write devonn-ai-ci devonn-ai-ci-policy.hcl
          ```

          ## Step 3: Create Vault Role
          ```bash
          vault write auth/jwt/role/devonn-ai-ci \
            role_type="jwt" \
            bound_audiences="vault" \
            bound_claims_type="glob" \
            bound_claims='{"sub":"repo:wesship/supreme-ai-deployment-hub:*"}' \
            user_claim="sub" \
            policies="devonn-ai-ci" \
            ttl="1h"
          ```

          ## Step 4: Store Secrets in Vault KV
          ```bash
          vault kv put secret/devonn-ai/ci \
            OPENAI_API_KEY="sk-..." \
            ANTHROPIC_API_KEY="sk-ant-..." \
            ELEVENLABS_API_KEY="..." \
            SUPABASE_SERVICE_ROLE_KEY="..." \
            DATABASE_URL="postgresql://..."
          ```

          ## Step 5: Configure GitHub Repository Variables
          Set these repository variables (not secrets):
          - `VAULT_ADDR`: https://your-vault-instance.com
          - `VAULT_ROLE`: devonn-ai-ci

          ## Security Benefits
          - No long-lived static credentials in GitHub Secrets
          - Ephemeral tokens (1h TTL) generated per workflow run
          - Full audit log in Vault for every secret access
          - Automatic rotation without workflow changes
          - Namespace isolation per environment (ci/staging/production)
          EOF
          cat /tmp/vault-docs/vault-setup.md

      - name: Upload Vault documentation
        uses: actions/upload-artifact@ea165f8d65b6b5c9b3e7e7e7e7e7e7e7e7e7e7e7  # v4
        with:
          name: vault-setup-guide-${{ github.run_id }}
          path: /tmp/vault-docs/
          retention-days: 90
