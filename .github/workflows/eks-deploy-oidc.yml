name: EKS Deploy (OIDC + Trivy)

on:
  workflow_dispatch:
    inputs:
      push_to_ecr:
        description: 'Push image to ECR and deploy to EKS'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-deploy
  cancel-in-progress: true

jobs:
  control:
    name: Manual EKS Deployment Control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "EKS deployment is manual-only because Railway is the active backend platform."
          echo "Push to ECR: ${{ github.event.inputs.push_to_ecr }}"
