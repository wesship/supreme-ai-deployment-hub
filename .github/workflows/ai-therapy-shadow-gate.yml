name: AI Therapy Shadow Safety Gate

on:
  pull_request:
    paths:
      - 'docs/ai-therapy/**'
      - 'tests/ai-therapy/**'
      - '.github/workflows/ai-therapy-shadow-gate.yml'
  push:
    branches:
      - feat/ai-therapy-shadow-evidence

jobs:
  shadow-safety-gate:
    name: Shadow safety corpus gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/ai-therapy/shadow-corpus.test.ts --reporter=verbose
