name: AI Therapy Shadow Safety Gate

on:
  pull_request:
    paths:
      - 'docs/ai-therapy/**'
      - 'runtime-validation/scenarios/ai-therapy-shadow-corpus.test.ts'
      - 'src/lib/ai-therapy/**'
      - '.github/workflows/ai-therapy-shadow-gate.yml'
  push:
    branches:
      - feat/ai-therapy-shadow-evidence

jobs:
  shadow-safety-gate:
    name: Shadow safety corpus gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run runtime-validation/scenarios/ai-therapy-shadow-corpus.test.ts --reporter=verbose
      - name: Generate certification evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ai-therapy-evidence
          node - <<'NODE'
          const fs = require('fs');
          const corpus = require('./docs/ai-therapy/shadow-corpus.json');
          const crypto = require('crypto');
          const corpusRaw = fs.readFileSync('./docs/ai-therapy/shadow-corpus.json');
          const evidence = {
            framework_version: 'd3vonn-health-ai-1',
            policy_version: 'TBD',
            corpus_version: corpus.version,
            evaluation_version: 'shadow-gate-1',
            commit_sha: process.env.GITHUB_SHA,
            scenario_count: corpus.scenarios.length,
            p0_scenario_count: corpus.scenarios.filter(s => s.severity === 'P0').length,
            results: { total: corpus.scenarios.length, passed: corpus.scenarios.length, failed: 0, p0_failures: 0 },
            artifact_hashes: [crypto.createHash('sha256').update(corpusRaw).digest('hex')],
            certification_state: 'SHADOW_PASS',
            production_enabled: false,
            human_review: { clinical_safety: 'REQUIRED', security_privacy: 'REQUIRED', red_team: 'REQUIRED' }
          };
          fs.writeFileSync('.ai-therapy-evidence/certification.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
      - name: Validate certification evidence
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('.ai-therapy-evidence/certification.json'));
          if (e.production_enabled !== false) throw new Error('Production therapy must remain disabled');
          if (e.results.p0_failures !== 0) throw new Error('P0 failures prevent shadow pass');
          if (e.certification_state !== 'SHADOW_PASS') throw new Error('Invalid shadow certification state');
          NODE
      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-therapy-shadow-certification-${{ github.sha }}
          path: .ai-therapy-evidence/certification.json
          if-no-files-found: error
