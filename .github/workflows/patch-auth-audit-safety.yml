name: Patch Authenticated Audit Safety

on:
  push:
    branches:
      - ci/harden-authenticated-audit
    paths:
      - '.github/workflows/patch-auth-audit-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/harden-authenticated-audit

      - name: Harden permanent audit and remove temporary workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/d3vonn-authenticated-audit.yml')
          text = path.read_text(encoding='utf-8')

          password_line = next(
              line for line in text.splitlines()
              if line.strip().startswith('E2E_TEST_PASSWORD:')
          )
          text = text.replace(
              password_line + '\n',
              password_line + "\n          E2E_DISABLE_CREDENTIAL_TRACING: '1'\n",
              1,
          )

          old_run = (
              '        run: pnpm exec playwright test '
              'tests/e2e/authenticated-production-audit.spec.ts '
              '--project=chromium --reporter=github,html\n'
          )
          new_run = '''        run: |
          set -euo pipefail
          rm -rf playwright-report test-results
          pnpm exec playwright test tests/e2e/authenticated-production-audit.spec.ts \\
            --project=chromium \\
            --reporter=github,line \\
            --trace=off
'''
          if old_run not in text:
              raise SystemExit('Expected authenticated audit command was not found')
          text = text.replace(old_run, new_run, 1)

          artifact_marker = '      - name: Upload Playwright evidence\n'
          if artifact_marker not in text:
              raise SystemExit('Expected artifact upload step was not found')
          text = text.split(artifact_marker, 1)[0].rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/fresh-authenticated-production-verification.yml').unlink()
          Path('.github/workflows/patch-auth-audit-safety.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci(auth): disable credential-bearing audit artifacts'
          git push origin HEAD:ci/harden-authenticated-audit
