name: D3VONN.IO Credential Certification

on:
  push:
    branches:
      - main
      - agent/end-to-end-credential-certification
      - agent/github-production-vars-fallback
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3vonn-credential-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-certification:
    name: Live Runtime and Provider Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public website
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /dev/null https://www.d3vonn.io/
          echo "OK D3VONN_PUBLIC_SITE"

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://api.d3vonn.io/health --output backend-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("backend-health.json").read_text())
          print("OK D3VONN_BACKEND_HEALTH")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Verify AI Film provider configuration
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://api.d3vonn.io/api/ai-films/providers/health \
            --output provider-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("provider-health.json").read_text())
          capabilities = payload.get("capabilities", {})
          required = ("image", "video", "voice", "email", "commerce_generation", "video_intelligence")
          missing = [name for name in required if not capabilities.get(name)]

          print(json.dumps(payload, indent=2, sort_keys=True))
          for name in required:
              print(f"{'OK' if capabilities.get(name) else 'MISSING'} CAPABILITY_{name.upper()}")

          if missing:
              raise SystemExit(
                  "Required production capabilities are not configured: "
                  + ", ".join(missing)
              )
          PY

      - name: Upload non-secret certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-runtime-provider-certification
          path: |
            backend-health.json
            provider-health.json
          if-no-files-found: warn
          retention-days: 30

  production-secret-preflight:
    name: Protected Production Core Credential Preflight
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || vars.PROJECT_ID || secrets.SUPABASE_PROJECT_REF || 'tjygexesognbkwualywq' }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || vars.PROJECT_ID || secrets.SUPABASE_PROJECT_ID || 'tjygexesognbkwualywq' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID || 'team_MqA4TlHv2PGblpjtakT4de7I' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID || 'prj_q3XjGUI4brXftpMCxp0XSceidhpr' }}
      HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST || secrets.HOSTINGER_VPS_HOST || secrets.VPS_HOST }}
      HOSTINGER_VPS_USER: ${{ vars.HOSTINGER_VPS_USER || secrets.HOSTINGER_VPS_USER || secrets.ROOT }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
    steps:
      - name: Validate core runtime credential and configuration presence without printing values
        run: |
          python - <<'PY'
          import os

          required = (
              "OPENAI_API_KEY",
              "SUPABASE_PROJECT_REF",
              "SUPABASE_PROJECT_ID",
              "SUPABASE_SERVICE_ROLE_KEY",
              "VERCEL_ORG_ID",
              "VERCEL_PROJECT_ID",
              "HOSTINGER_VPS_HOST",
          )
          missing = []
          for name in required:
              present = bool(os.environ.get(name, "").strip())
              print(f"{'OK' if present else 'MISSING'} {name}")
              if not present:
                  missing.append(name)

          print(f"CORE SUMMARY present={len(required) - len(missing)} missing={len(missing)}")
          if missing:
              raise SystemExit("Missing core production entries: " + ", ".join(missing))
          PY

      - name: Report external deployment and recovery credential placement
        run: |
          python - <<'PY'
          import os

          external = (
              "SUPABASE_ACCESS_TOKEN",
              "SUPABASE_DB_PASSWORD",
              "VERCEL_TOKEN",
              "HOSTINGER_VPS_USER",
              "HOSTINGER_VPS_SSH_KEY",
          )
          missing = []
          for name in external:
              present = bool(os.environ.get(name, "").strip())
              print(f"{'PRESENT' if present else 'EXTERNAL_OR_UNVERIFIED'} {name}")
              if not present:
                  missing.append(name)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n## External deployment/recovery credential placement\n\n")
              summary.write("These credentials are tracked separately from live runtime certification. ")
              summary.write("Their values are never printed. The dedicated Validate Required Secrets workflow remains the authoritative placement audit.\n\n")
              summary.write(f"- Present in this GitHub production environment: **{len(external) - len(missing)}/{len(external)}**\n")
              if missing:
                  summary.write("- Not verified in this GitHub environment: **" + ", ".join(missing) + "**\n")
          PY

  provider-contract-tests:
    name: Provider Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install provider test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Require OpenAI key for trusted certification runs
        if: github.actor != 'dependabot[bot]'
        run: |
          test -n "$OPENAI_API_KEY"
          echo "OK OPENAI_API_KEY_PRESENT"

      - name: Record Dependabot secret-validation skip
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "SKIP OPENAI_API_KEY presence validation for Dependabot pull request"
          echo "Protected production secret validation remains enforced on main and workflow_dispatch runs."

      - name: Test provider contracts without failure suppression
        run: |
          pytest backend/tests/test_ai_film_provider_adapters.py \
            --cov=backend.ai_films.providers \
            --cov-report=xml:provider-coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Require coverage artifact
        run: test -s provider-coverage.xml

      - name: Upload provider test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-provider-contract-coverage
          path: provider-coverage.xml
          if-no-files-found: error
          retention-days: 30
