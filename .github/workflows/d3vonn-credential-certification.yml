name: D3VONN.IO Credential Certification

on:
  push:
    branches:
      - agent/end-to-end-credential-certification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3vonn-credential-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-certification:
    name: Live Runtime and Provider Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public website
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /dev/null https://www.d3vonn.io/
          echo "OK D3VONN_PUBLIC_SITE"

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://api.d3vonn.io/health --output backend-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("backend-health.json").read_text())
          print("OK D3VONN_BACKEND_HEALTH")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Verify AI Film provider configuration
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://api.d3vonn.io/ai-films/providers/health \
            --output provider-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("provider-health.json").read_text())
          capabilities = payload.get("capabilities", {})
          required = ("image", "video", "voice", "email")
          missing = [name for name in required if not capabilities.get(name)]

          print(json.dumps(payload, indent=2, sort_keys=True))
          for name in required:
              print(f"{'OK' if capabilities.get(name) else 'MISSING'} CAPABILITY_{name.upper()}")

          if missing:
              raise SystemExit(
                  "Required production capabilities are not configured: "
                  + ", ".join(missing)
              )
          PY

      - name: Upload non-secret certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-runtime-provider-certification
          path: |
            backend-health.json
            provider-health.json
          if-no-files-found: warn
          retention-days: 30

  production-secret-preflight:
    name: Protected Production Secret Preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HOSTINGER_VPS_HOST: ${{ secrets.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER: ${{ secrets.HOSTINGER_VPS_USER }}
      HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
    steps:
      - name: Validate required secret presence without printing values
        run: |
          python - <<'PY'
          import os

          required = (
              "OPENAI_API_KEY",
              "SUPABASE_ACCESS_TOKEN",
              "SUPABASE_DB_PASSWORD",
              "SUPABASE_PROJECT_REF",
              "SUPABASE_PROJECT_ID",
              "SUPABASE_SERVICE_ROLE_KEY",
              "VERCEL_TOKEN",
              "VERCEL_ORG_ID",
              "VERCEL_PROJECT_ID",
              "HOSTINGER_VPS_HOST",
              "HOSTINGER_VPS_USER",
              "HOSTINGER_VPS_SSH_KEY",
          )
          missing = []
          for name in required:
              present = bool(os.environ.get(name, "").strip())
              print(f"{'OK' if present else 'MISSING'} {name}")
              if not present:
                  missing.append(name)

          print(f"SUMMARY present={len(required) - len(missing)} missing={len(missing)}")
          if missing:
              raise SystemExit("Missing protected production secrets: " + ", ".join(missing))
          PY

  strict-python-tests:
    name: Strict Python Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install root Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      - name: Require OpenAI key for owner-branch certification
        run: |
          test -n "$OPENAI_API_KEY"
          echo "OK OPENAI_API_KEY_PRESENT"
      - name: Run tests without failure suppression
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml:python-coverage.xml \
            --cov-report=term-missing \
            -v
      - name: Require coverage artifact
        run: test -s python-coverage.xml
      - name: Upload Python coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-strict-python-coverage
          path: python-coverage.xml
          if-no-files-found: error
          retention-days: 30
