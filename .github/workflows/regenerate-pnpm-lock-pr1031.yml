name: Regenerate pnpm lockfile PR1031

on:
  push:
    branches:
      - fix/ai-films-runtime-mastering-deps
    paths:
      - package.json
      - .github/workflows/regenerate-pnpm-lock-pr1031.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ai-films-runtime-mastering-deps
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Publish tested lockfile commit to temporary tag
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile for tar 7.5.21"
          git tag -f pr1031-lockfile-generated
          git push --force origin refs/tags/pr1031-lockfile-generated
