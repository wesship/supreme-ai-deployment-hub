name: VPS Deploy — D3VONN.IO

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/vps/**'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/manual-vps-release-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy current protected main after validating the runner
        required: true
        default: false
        type: boolean
      run_diagnostics:
        description: Run 502 diagnostics after deployment
        required: true
        default: false
        type: boolean

concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on trusted Hostinger runner
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve protected release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_sha="$(git rev-parse origin/main)"
          git checkout --detach "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "VERIFIED_MAIN_RELEASE $release_sha"

      - name: Validate restricted deployment wrapper
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release --check

      - name: Deploy and validate
        if: github.event_name == 'push' || inputs.deploy == true
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics || false }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release \
            "$GITHUB_WORKSPACE" "$RELEASE_SHA" "$RUN_DIAGNOSTICS"

      - name: Record validation-only result
        if: github.event_name == 'workflow_dispatch' && inputs.deploy != true
        run: echo "VALIDATION_ONLY_OK"
