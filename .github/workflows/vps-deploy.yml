name: VPS Deploy — D3VONN.IO

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/vps/**'
      - '.github/workflows/vps-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Validate only — do not restart containers (safe default)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets are present
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}"            ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}"            ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && missing+=("VPS_SSH_PRIVATE_KEY")
          [ -z "${{ secrets.VPS_KNOWN_HOSTS }}"     ] && missing+=("VPS_KNOWN_HOSTS")
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.skip_deploy }}" = "false" ]; then
            [ -z "${{ secrets.OPENAI_API_KEY }}"    ] && missing+=("OPENAI_API_KEY (required for full deploy)")
            [ -z "${{ secrets.PINECONE_API_KEY }}"  ] && missing+=("PINECONE_API_KEY (required for full deploy)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following repository secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Set them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}"     > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_key
          chmod 600 ~/.ssh/known_hosts

      - name: Pull latest code on VPS
        env:
          REPO_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$REPO_READ_TOKEN" | base64 | tr -d '\n')"
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail
             cd /opt/supreme-ai-deployment-hub
             sudo git -c http.https://github.com/.extraheader='AUTHORIZATION: basic ${AUTH_HEADER}' fetch origin
             sudo git reset --hard origin/main
             echo \"HEAD: \$(git rev-parse --short HEAD)\"
             test -f .github/workflows/vps-deploy.yml \
               && echo \"Workflow file: present\" \
               || echo \"WARNING: vps-deploy.yml not found on this commit\""

      - name: Generate internal secrets and patch .env.production
        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             ENV_FILE=/opt/supreme-ai-deployment-hub/deploy/vps/env/.env.production
             if [ ! -f "$ENV_FILE" ]; then
               sudo cp /opt/supreme-ai-deployment-hub/deploy/vps/env/.env.example "$ENV_FILE"
               echo "Created .env.production from .env.example"
             fi
             set_if_missing() {
               local key="$1"
               local value="$2"
               local current
               current="$(sudo sed -n "s/^${key}=//p" "$ENV_FILE" | tail -n 1)"
               if [ -n "$current" ] && \
                  ! printf "%s" "$current" | grep -Eqi "^(PASTE_|CHANGE_ME|YOUR_|your-|replace-with|placeholder)"; then
                 echo "  PRESERVED: $key"
                 return 0
               fi
               if sudo grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                 sudo sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
               else
                 printf "%s=%s\n" "$key" "$value" | sudo tee -a "$ENV_FILE" > /dev/null
               fi
               echo "  GENERATED: $key"
             }
             echo "=== Internal secrets ==="
             set_if_missing JWT_SECRET           "$(openssl rand -hex 64)"
             set_if_missing ENCRYPTION_KEY       "$(openssl rand -base64 32 | tr -d "\n")"
             set_if_missing API_KEY_VAULT_SECRET "$(openssl rand -hex 64)"
             set_if_missing WS_AUTH_TOKEN        "$(openssl rand -hex 64)"
             set_if_missing REDIS_PASSWORD       "$(openssl rand -hex 32)"
             echo "=== Static config ==="
             set_if_missing PINECONE_INDEX_NAME       "devonn-rag"
             set_if_missing ALLOWED_ORIGINS_RAW       "https://d3vonn.io,https://www.d3vonn.io,https://app.d3vonn.io"
             set_if_missing APP_ENV                   "production"
             set_if_missing ENVIRONMENT               "production"
             set_if_missing LOG_LEVEL                 "INFO"
             set_if_missing DEBUG                     "false"
             set_if_missing REQUIRE_AUTH              "true"
             set_if_missing HERMES_BYPASS             "false"
             set_if_missing POLL_INTERVAL             "30"
             set_if_missing OPENAI_EMBEDDING_MODEL    "text-embedding-3-small"
             set_if_missing RAG_CHUNK_SIZE_CHARS      "1500"
             set_if_missing RAG_CHUNK_OVERLAP_CHARS   "200"
             set_if_missing RAG_MAX_FILE_SIZE_BYTES   "10485760"
             echo "=== Done ==="'

      - name: Inject provider API keys from GitHub Secrets
        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -euo pipefail
             ENV_FILE=/opt/supreme-ai-deployment-hub/deploy/vps/env/.env.production
             inject_if_present() {
               local key=\"\$1\"
               local value=\"\$2\"
               if [ -z \"\$value\" ]; then
                 echo \"  SKIP (not provided): \$key\"
                 return 0
               fi
               if sudo grep -q \"^\${key}=\" \"\$ENV_FILE\" 2>/dev/null; then
                 sudo sed -i \"s|^\${key}=.*|\${key}=\${value}|\" \"\$ENV_FILE\"
               else
                 printf '%s=%s\n' \"\$key\" \"\$value\" | sudo tee -a \"\$ENV_FILE\" > /dev/null
               fi
               echo \"  UPDATED: \$key\"
             }
             echo '=== Provider API keys ==='
             inject_if_present OPENAI_API_KEY            '${{ secrets.OPENAI_API_KEY }}'
             inject_if_present PINECONE_API_KEY          '${{ secrets.PINECONE_API_KEY }}'
             echo '=== Supabase (guarded) ==='
             inject_if_present SUPABASE_URL              '${{ secrets.SUPABASE_URL }}'
             inject_if_present SUPABASE_SERVICE_ROLE_KEY '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}'
             inject_if_present SUPABASE_ANON_KEY         '${{ secrets.SUPABASE_ANON_KEY }}'
             inject_if_present VITE_SUPABASE_URL         '${{ secrets.SUPABASE_URL }}'
             inject_if_present VITE_SUPABASE_ANON_KEY    '${{ secrets.SUPABASE_ANON_KEY }}'
             inject_if_present VITE_SUPABASE_PUBLISHABLE_KEY '${{ secrets.SUPABASE_ANON_KEY }}'
             echo '=== Injection complete ==='"

      - name: Validate environment
        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             cd /opt/supreme-ai-deployment-hub/deploy/vps
             echo "=== Running environment validator ==="
             sudo bash scripts/validate-production-env.sh env/.env.production'

      - name: Deploy (docker compose up)
        if: ${{ github.event_name == 'push' || inputs.skip_deploy == 'false' }}
        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             APP_DIR=/opt/supreme-ai-deployment-hub
             cd "$APP_DIR"
             echo "=== Starting deployment from pre-synced checkout ==="
             sudo env APP_DIR="$APP_DIR" SKIP_GIT_SYNC=true bash deploy/vps/scripts/deploy.sh'

      - name: Verify container health
        if: ${{ github.event_name == 'push' || inputs.skip_deploy == 'false' }}
        run: |
          ssh \
            -i ~/.ssh/vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             cd /opt/supreme-ai-deployment-hub/deploy/vps
             echo "=== Container status ==="
             sudo docker compose --env-file env/.env.production -f docker-compose.yml ps
             echo ""
             echo "=== Backend liveness ==="
             sudo docker exec d3vonn-backend curl -fsS http://localhost:8000/health/live \
               && echo " → LIVE"
             echo ""
             echo "=== Backend readiness ==="
             sudo docker exec d3vonn-backend curl -fsS http://localhost:8000/health/ready
             echo ""
             echo "=== Redis ping ==="
             REDIS_PASSWORD="$(sudo sed -n "s/^REDIS_PASSWORD=//p" env/.env.production | tail -n 1)"
             sudo docker exec d3vonn-redis redis-cli -a "$REDIS_PASSWORD" ping'

      - name: Public endpoint smoke test
        if: ${{ github.event_name == 'push' || inputs.skip_deploy == 'false' }}
        run: |
          sleep 5
          echo "=== Public health check ==="
          curl -fsS https://api.d3vonn.io/health/live  && echo " → /health/live OK"
          curl -fsS https://api.d3vonn.io/health/ready && echo " → /health/ready OK"
