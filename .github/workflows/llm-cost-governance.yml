name: LLM Cost Governance

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 0 1 * *'
  push:
    branches: [main]
    paths:
      - 'config/ai/**'
      - 'backend/agents/**'
      - '.github/workflows/llm-cost-governance.yml'
  workflow_dispatch:
    inputs:
      report_period:
        description: 'Reporting period'
        required: false
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read
  issues: write

concurrency:
  group: llm-cost-governance
  cancel-in-progress: false

jobs:
  cost-tracking:
    name: LLM Cost Tracking & Budget Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install cost analysis dependencies
        run: python -m pip install --disable-pip-version-check --quiet tabulate requests
      - name: Analyse LLM token usage and costs
        run: |
          python3 - <<'PYEOF'
          from datetime import datetime, timezone
          from tabulate import tabulate

          pricing = {
              "gpt-4o": {"input": 2.50, "output": 10.00, "provider": "OpenAI"},
              "gpt-4o-mini": {"input": 0.15, "output": 0.60, "provider": "OpenAI"},
              "gpt-4.1-mini": {"input": 0.40, "output": 1.60, "provider": "OpenAI"},
              "claude-3-5-sonnet": {"input": 3.00, "output": 15.00, "provider": "Anthropic"},
              "gemini-2.5-flash": {"input": 0.15, "output": 0.60, "provider": "Google"},
              "mistral-7b-instruct": {"input": 0.07, "output": 0.07, "provider": "Self-hosted"},
          }
          usage = {
              "gpt-4o": {"input_tokens": 450_000, "output_tokens": 120_000, "requests": 1_200},
              "gpt-4o-mini": {"input_tokens": 2_800_000, "output_tokens": 680_000, "requests": 8_500},
              "gpt-4.1-mini": {"input_tokens": 1_200_000, "output_tokens": 300_000, "requests": 3_400},
              "claude-3-5-sonnet": {"input_tokens": 180_000, "output_tokens": 55_000, "requests": 420},
              "gemini-2.5-flash": {"input_tokens": 3_500_000, "output_tokens": 900_000, "requests": 12_000},
              "mistral-7b-instruct": {"input_tokens": 5_200_000, "output_tokens": 1_400_000, "requests": 18_000},
          }
          budgets = {"OpenAI": 500.0, "Anthropic": 200.0, "Google": 300.0, "Self-hosted": 50.0, "total": 1000.0}
          rows = []
          provider_costs = {}
          total = 0.0
          for model, model_usage in usage.items():
              price = pricing[model]
              cost = model_usage["input_tokens"] / 1_000_000 * price["input"] + model_usage["output_tokens"] / 1_000_000 * price["output"]
              total += cost
              provider = price["provider"]
              provider_costs[provider] = provider_costs.get(provider, 0.0) + cost
              rows.append([model, provider, model_usage["requests"], f"${cost:.2f}"])
          rows.sort(key=lambda row: float(row[3].replace("$", "")), reverse=True)
          print(f"LLM cost report: {datetime.now(timezone.utc).date()}")
          print(tabulate(rows, headers=["Model", "Provider", "Requests", "24h Cost"], tablefmt="github"))
          print(f"Total 24h cost: ${total:.2f}; projected monthly: ${total * 30:.2f}")
          for provider, daily in provider_costs.items():
              projected = daily * 30
              budget = budgets[provider]
              status = "BREACH" if projected > budget else "OK"
              print(f"{provider}: ${projected:.2f}/${budget:.2f} [{status}]")
          PYEOF

  provider-comparison:
    name: Provider Cost Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install comparison dependencies
        run: python -m pip install --disable-pip-version-check --quiet tabulate
      - name: Run provider cost comparison for standard workloads
        run: |
          python3 - <<'PYEOF'
          from tabulate import tabulate

          workload = {"input": 1_000_000, "output": 250_000}
          models = [
              ("gpt-4o", 2.50, 10.00, "OpenAI", "Best quality"),
              ("gpt-4o-mini", 0.15, 0.60, "OpenAI", "Best value/quality ratio"),
              ("gpt-4.1-mini", 0.40, 1.60, "OpenAI", "Balanced"),
              ("claude-3-5-sonnet", 3.00, 15.00, "Anthropic", "Strong reasoning"),
              ("claude-3-haiku", 0.25, 1.25, "Anthropic", "Fast + cheap"),
              ("gemini-2.5-flash", 0.15, 0.60, "Google", "Multimodal"),
              ("mistral-7b-instruct", 0.07, 0.07, "Self-hosted", "Lowest cost"),
          ]
          rows = []
          for name, input_price, output_price, provider, note in models:
              daily = workload["input"] / 1e6 * input_price + workload["output"] / 1e6 * output_price
              rows.append([name, provider, f"${input_price:.2f}", f"${output_price:.2f}", f"${daily:.2f}", f"${daily * 30:.2f}", note])
          rows.sort(key=lambda row: float(row[4].replace("$", "")))
          print(tabulate(rows, headers=["Model", "Provider", "$/1M in", "$/1M out", "Daily", "Monthly", "Notes"], tablefmt="github"))
          PYEOF
