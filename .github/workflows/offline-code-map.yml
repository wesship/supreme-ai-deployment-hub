name: Offline Code Map Viewer
on:
  push:
    branches: [feat/offline-code-map]
    paths: ['tools/code_map/**', '.github/workflows/offline-code-map.yml']
  pull_request:
    paths: ['tools/code_map/**', '.github/workflows/offline-code-map.yml']
permissions:
  contents: read
jobs:
  viewer:
    name: Offline Code Map Desktop and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_MAP_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m unittest discover -s tools/code_map -p 'test_*.py'
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/code_map/smoke_viewer.cjs
