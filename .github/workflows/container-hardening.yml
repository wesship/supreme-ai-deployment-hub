name: Container Hardening

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'backend/**'
      - 'policy/seccomp/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'backend/**'
  schedule:
    - cron: '0 5 * * 1'  # Weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

concurrency:
  group: container-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dockerfile Lint & Security Scan ───────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Lint Dockerfile with Hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint:latest-alpine \
            hadolint \
            --failure-threshold warning \
            --ignore DL3008 \
            --ignore DL3009 \
            - < Dockerfile.hardened
          echo "Dockerfile lint passed"

      - name: Check for non-root USER in Dockerfile
        run: |
          if grep -q "USER nonroot\|USER 65532\|USER nobody" Dockerfile.hardened; then
            echo "PASS: Dockerfile uses non-root user"
          else
            echo "::error::Dockerfile must specify a non-root USER"
            exit 1
          fi

      - name: Check for HEALTHCHECK in Dockerfile
        run: |
          if grep -q "HEALTHCHECK" Dockerfile.hardened; then
            echo "PASS: Dockerfile has HEALTHCHECK"
          else
            echo "::warning::Dockerfile should include a HEALTHCHECK instruction"
          fi

  # ── Container Build & Vulnerability Scan ─────────────────────────────────
  container-scan:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3

      - name: Build hardened container image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6
        with:
          context: .
          file: Dockerfile.hardened
          push: false
          tags: devonn-api:hardened-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/devonn-api.tar

      - name: Load image for scanning
        run: docker load < /tmp/devonn-api.tar

      - name: Scan with Grype (vulnerability scanner)
        run: |
          set -euo pipefail

          # Install Grype
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | \
            sh -s -- -b /usr/local/bin

          # Fail closed on fixable Critical vulnerabilities. The .grype.yaml
          # configuration excludes findings that have no upstream fix.
          grype devonn-api:hardened-${{ github.sha }} \
            --fail-on critical \
            --output table \
            --config .grype.yaml
          echo "Grype scan passed (0 fixable CRITICAL CVEs)"

      - name: Scan with Trivy
        run: |
          set -euo pipefail

          # Install Trivy
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --no-progress \
            --ignore-unfixed \
            --scanners vuln \
            devonn-api:hardened-${{ github.sha }}
          echo "Trivy scan passed (0 fixable CRITICAL CVEs)"

      - name: Check image runs as non-root
        run: |
          USER_ID=$(docker inspect devonn-api:hardened-${{ github.sha }} \
            --format '{{.Config.User}}')
          echo "Container user: ${USER_ID}"
          if [ "$USER_ID" = "nonroot" ] || [ "$USER_ID" = "65532" ]; then
            echo "PASS: Container runs as non-root"
          else
            echo "::warning::Container user is '${USER_ID}' - verify non-root execution"
          fi

      - name: Validate seccomp profile syntax
        run: |
          python3 -c "
          import json
          with open('policy/seccomp/devonn-api.json') as f:
              profile = json.load(f)
          assert 'defaultAction' in profile
          assert 'syscalls' in profile
          syscall_count = sum(len(s['names']) for s in profile['syscalls'])
          print(f'Seccomp profile valid: {syscall_count} allowed syscalls, default: {profile[\"defaultAction\"]}')
          "

      - name: Upload container scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: container-scan-${{ github.run_id }}
          path: /tmp/devonn-api.tar
          retention-days: 7
