name: AI Platform Read-Only Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-platform-readonly-certification.yml'
      - 'backend/main.py'
      - 'backend/app/routers/**'
      - 'backend/rag/**'
      - 'backend/agents/**'
      - 'backend/occ_operator/**'
      - 'backend/hermes/**'
      - 'backend/intelligence/**'
      - 'backend/knowledge/**'
  schedule:
    - cron: '41 10 * * 2'

permissions:
  contents: read

concurrency:
  group: ai-platform-readonly-production-certification
  cancel-in-progress: true

jobs:
  certify:
    name: Route and Runtime Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch production runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://api.d3vonn.io/health/ready > /tmp/health-ready.json
          curl --fail --silent --show-error --max-time 30 \
            https://api.d3vonn.io/api/openapi.json > /tmp/openapi.json

      - name: Validate runtime configuration and route families
        shell: python
        run: |
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health-ready.json').read_text())
          schema = json.loads(Path('/tmp/openapi.json').read_text())

          assert health.get('status') == 'ready', health
          services = health.get('services', {})
          assert services.get('supabase') == 'reachable', services
          assert services.get('redis') == 'reachable', services

          provider_names = ('openai', 'anthropic', 'google_ai')
          configured = [name for name in provider_names if services.get(name) == 'configured']
          assert configured, f'No AI provider configured: {services}'

          paths = set(schema.get('paths', {}))
          required_families = {
              '/api/chat': lambda p: p == '/api/chat',
              '/api/rag/*': lambda p: p.startswith('/api/rag/'),
              '/api/tools/*': lambda p: p.startswith('/api/tools/'),
              '/api/agents/*': lambda p: p.startswith('/api/agents/'),
              '/api/operator/*': lambda p: p.startswith('/api/operator/'),
              '/api/intelligence/*': lambda p: p.startswith('/api/intelligence/'),
              '/api/hermes/*': lambda p: p.startswith('/api/hermes/'),
              '/api/hermes/tasks/*': lambda p: p.startswith('/api/hermes/tasks/'),
              '/api/knowledge/*': lambda p: p.startswith('/api/knowledge/'),
          }

          missing = [label for label, matcher in required_families.items() if not any(matcher(path) for path in paths)]
          assert not missing, f'Missing production route families: {missing}'

          summary = [
              '## AI Platform Read-Only Certification',
              '',
              f'- API status: {health.get("status")}',
              f'- Redis: {services.get("redis")}',
              f'- Supabase: {services.get("supabase")}',
              f'- Configured AI providers: {", ".join(configured)}',
              f'- OpenAPI paths observed: {len(paths)}',
              '- Required route families: all present',
              '- Side effects: none',
              '- Provider model calls: none',
          ]
          Path('/tmp/summary.md').write_text('\n'.join(summary) + '\n')

      - name: Publish certification summary
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/summary.md ]]; then
            cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AI platform read-only certification failed before summary generation.' >> "$GITHUB_STEP_SUMMARY"
          fi
