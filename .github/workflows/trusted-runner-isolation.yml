name: Trusted Runner Isolation

# Runner hardening is expensive and unrelated to ordinary application PRs.
# Run it weekly, manually, or only when runner policy/configuration changes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'policy/runner/**'
      - '.github/workflows/trusted-runner-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'policy/runner/**'
      - '.github/workflows/trusted-runner-isolation.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trusted-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-attestation:
    name: Runner workload attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Harden runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            gcr.io:443

      - name: Validate runner policy exists
        run: test -f policy/runner/hardened-runner-config.yaml

      - name: Record runner attestation
        run: |
          mkdir -p runner-attestation
          cat > runner-attestation/attestation.json <<EOF
          {
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "runner_name": "${{ runner.name }}",
            "github_sha": "${{ github.sha }}",
            "github_run_id": "${{ github.run_id }}",
            "attested_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Validate runner policy
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import yaml

          path = pathlib.Path('policy/runner/hardened-runner-config.yaml')
          config = yaml.safe_load(path.read_text()) or {}
          hardening = config.get('runner_hardening', {})
          policy = hardening.get('egress_policy')
          if policy not in {'audit', 'block'}:
              raise SystemExit(f'Invalid runner egress policy: {policy!r}')
          print(f'Runner policy validated: egress_policy={policy}')
          PYEOF

      - name: Upload runner attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-attestation-${{ github.run_id }}
          path: runner-attestation/
          retention-days: 90
