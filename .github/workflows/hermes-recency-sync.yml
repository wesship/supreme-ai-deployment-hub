name: Hermes Recency Sync Gate

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Hermes recency sync mode"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - dry-run
          - post-deploy
  schedule:
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/HERMES_SELF_UPDATE_RECENCY_LOOP.md"
      - "MASTER_CONTEXT.md"
      - "public/llms.txt"
      - "backend/**"
      - "server/**"
      - "api/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "agents/**"
      - "packages/**"

permissions:
  contents: read

concurrency:
  group: hermes-recency-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recency-sync-gate:
    name: Verify Hermes Recency Sync Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build recency context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "sync_mode=${{ github.event.inputs.sync_mode || 'scheduled-or-push' }}" >> "$GITHUB_OUTPUT"

          git log -1 --pretty=format:'%H%n%an%n%ae%n%s' > hermes-recency-commit.txt
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > hermes-recency-changed-files.txt || true

          echo "Latest commit: $GITHUB_SHA"
          echo "Changed files:"
          cat hermes-recency-changed-files.txt || true

      - name: Verify required contract files
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/HERMES_SELF_UPDATE_RECENCY_LOOP.md
          test -f MASTER_CONTEXT.md
          test -f .github/workflows/validate-secrets.yml

          echo "✓ Hermes recency contract present"
          echo "✓ Required secrets validation workflow present"

      - name: Detect recency-sensitive changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          sensitive=0

          if grep -E '^(MASTER_CONTEXT\.md|public/llms\.txt|(backend|server|api|supabase/functions|supabase/migrations|agents|packages|\.github/workflows)/)' hermes-recency-changed-files.txt >/dev/null 2>&1; then
            sensitive=1
          fi

          echo "sensitive_changes=$sensitive" >> "$GITHUB_OUTPUT"

          if [ "$sensitive" = "1" ]; then
            echo "::notice::Recency-sensitive changes detected. Hermes memory/KG should be refreshed after deploy."
          else
            echo "No recency-sensitive changes detected."
          fi

      - name: Emit Hermes sync payload
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          changed = Path('hermes-recency-changed-files.txt').read_text().splitlines() if Path('hermes-recency-changed-files.txt').exists() else []
          canonical_content = Path('MASTER_CONTEXT.md').read_text(encoding='utf-8')
          version_match = re.search(r'\*\*Context version:\*\*\s*([^\n]+)', canonical_content)
          canonical_version = version_match.group(1).strip() if version_match else 'unversioned'
          canonical_sha256 = hashlib.sha256(canonical_content.encode('utf-8')).hexdigest()
          payload = {
              "sync_type": "repo_recency",
              "source": "github_main",
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "canonical_context_version": canonical_version,
              "canonical_context_sha256": canonical_sha256,
              "changed_files": changed,
              "detected_risks": [],
              "required_actions": [
                  "Verify backend /api/health after deployment",
                  "Verify /api/knowledge/status reports the deployed canonical context version and SHA-256",
                  "Verify Hermes job intake, worker claim, callback completion, and memory write-back"
              ],
              "memory_updates": [
                  f"Refresh Hermes context from MASTER_CONTEXT.md version {canonical_version} ({canonical_sha256})"
              ],
              "kg_updates": [
                  f"Link canonical context {canonical_sha256} and latest operational changes to Hermes graph"
              ],
              "status": "MANUAL_REVIEW" if changed else "COMPLETED"
          }
          print(json.dumps(payload, indent=2))
          Path('hermes-recency-sync-payload.json').write_text(json.dumps(payload, indent=2))
          PY

      - name: Upload recency payload
        uses: actions/upload-artifact@v4
        with:
          name: hermes-recency-sync-payload
          path: hermes-recency-sync-payload.json
          if-no-files-found: error
