name: SBOM & Supply Chain Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Weekly Monday 6 AM UTC
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-frontend:
    name: Generate Frontend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write
      id-token: write      # required by actions/attest-sbom

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate SBOM (CycloneDX)
        run: |
          # --ignore-npm-errors allows SBOM generation even when npm-ls reports
          # peer dependency warnings (exit code 1) - common with React 19 ecosystem
          npx @cyclonedx/cyclonedx-npm \
            --output-file sbom-frontend.json \
            --output-format JSON \
            --ignore-npm-errors || \
          npx @cyclonedx/cyclonedx-npm \
            --output-file sbom-frontend.json \
            --output-format JSON

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-frontend
          path: sbom-frontend.json
          retention-days: 90

      - name: Attest SBOM to GitHub
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6  # v1
        continue-on-error: true   # dist/ may not exist if build step was skipped
        with:
          subject-path: sbom-frontend.json
          sbom-path: sbom-frontend.json

  sbom-backend:
    name: Generate Backend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write
      id-token: write      # required for future attest-sbom support

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install CycloneDX for Python
        run: pip install cyclonedx-bom

      - name: Generate Backend SBOM
        run: |
          cd backend
          cyclonedx-py requirements -i requirements.txt --outfile sbom-backend.json --output-format JSON || \
            cyclonedx-py requirements requirements.txt -o sbom-backend.json || true
          mv sbom-backend.json ../sbom-backend.json 2>/dev/null || true
          # Fallback: create minimal SBOM if cyclonedx-py fails
          if [ ! -f ../sbom-backend.json ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.4","components":[]}' > ../sbom-backend.json
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-backend
          path: sbom-backend.json
          retention-days: 90

  grype-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sbom-frontend, sbom-backend]
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download frontend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sbom-frontend

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a  # v3
        with:
          sbom: sbom-frontend.json
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif

  ossf-scorecard:
    name: OSSF Security Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # OSSF requires specific token permissions
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@dc50aa9510b46c811795eb24b2f1ba02a914e534  # v2.3.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
