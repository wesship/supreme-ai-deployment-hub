name: SBOM & Supply Chain Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom-frontend:
    name: Generate Frontend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CycloneDX
        run: pnpm add --save-dev @cyclonedx/cyclonedx-npm || npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM (CycloneDX)
        run: |
          pnpm exec cyclonedx-npm \
            --output-file sbom-frontend.json \
            --output-format JSON \
            --ignore-npm-errors || \
          pnpm exec cyclonedx-npm \
            --output-file sbom-frontend.json \
            --output-format JSON

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-frontend
          path: sbom-frontend.json
          retention-days: 90

      - name: Attest SBOM to GitHub
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6
        continue-on-error: true
        with:
          subject-path: sbom-frontend.json
          sbom-path: sbom-frontend.json

  sbom-backend:
    name: Generate Backend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install CycloneDX for Python
        run: pip install cyclonedx-bom

      - name: Generate Backend SBOM
        run: |
          cd backend
          cyclonedx-py requirements -i requirements.txt --outfile sbom-backend.json --output-format JSON || \
            cyclonedx-py requirements requirements.txt -o sbom-backend.json || true
          mv sbom-backend.json ../sbom-backend.json 2>/dev/null || true
          if [ ! -f ../sbom-backend.json ]; then
            echo '{"bomFormat":"CycloneDX","specVersion":"1.4","components":[]}' > ../sbom-backend.json
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-backend
          path: sbom-backend.json
          retention-days: 90

  grype-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sbom-frontend, sbom-backend]
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download frontend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom-frontend

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          sbom: sbom-frontend.json
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif

  ossf-scorecard:
    name: OSSF Security Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF
        if: always() && steps.scorecard.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: scorecard-results.sarif
