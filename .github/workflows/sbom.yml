name: SBOM & Supply Chain Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Weekly Monday 6 AM UTC
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-frontend:
    name: Generate Frontend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom-frontend.json --output-format JSON

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: sbom-frontend.json
          retention-days: 90

      - name: Attest SBOM to GitHub
        uses: actions/attest-sbom@v1
        with:
          subject-path: dist/
          sbom-path: sbom-frontend.json

  sbom-backend:
    name: Generate Backend SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CycloneDX for Python
        run: pip install cyclonedx-bom

      - name: Generate Backend SBOM
        run: |
          cd backend
          cyclonedx-py requirements requirements.txt -o sbom-backend.json --format json
          mv sbom-backend.json ../sbom-backend.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.json
          retention-days: 90

  grype-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sbom-frontend, sbom-backend]
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-frontend

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom-frontend.json
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  ossf-scorecard:
    name: OSSF Security Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.3.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
