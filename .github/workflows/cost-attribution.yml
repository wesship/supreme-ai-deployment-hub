name: Cost Attribution & LLM ROI Tracking

on:
  schedule:
    - cron: '0 8 * * 1'   # Weekly Monday 08:00 UTC
    - cron: '0 0 1 * *'   # Monthly 1st at midnight UTC
  workflow_dispatch:
    inputs:
      period:
        description: 'Reporting period'
        required: false
        default: 'weekly'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: write
  issues: write

concurrency:
  group: cost-attribution-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ci-compute-costs:
    name: CI Compute Cost Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip3 install requests

      - name: Analyse CI compute costs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, json, requests
          from datetime import datetime, timedelta

          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "wesship/supreme-ai-deployment-hub")
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          # GitHub Actions pricing: ubuntu-latest = $0.008/min
          COST_PER_MIN = 0.008

          # Fetch recent workflow runs (last 100)
          r = requests.get(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers=headers, timeout=15
          )

          total_ms = 0
          wf_costs = {}
          run_count = 0

          if r.status_code == 200:
              runs = r.json().get("workflow_runs", [])
              run_count = len(runs)
              for run in runs:
                  wf_name = run.get("name", "unknown")
                  # Estimate duration from created_at / updated_at
                  created = run.get("created_at", "")
                  updated = run.get("updated_at", "")
                  if created and updated:
                      try:
                          t0 = datetime.strptime(created, "%Y-%m-%dT%H:%M:%SZ")
                          t1 = datetime.strptime(updated, "%Y-%m-%dT%H:%M:%SZ")
                          dur_min = max(0, (t1 - t0).total_seconds() / 60)
                          cost = dur_min * COST_PER_MIN
                          wf_costs[wf_name] = wf_costs.get(wf_name, 0) + cost
                          total_ms += dur_min
                      except:
                          pass

          total_cost = total_ms * COST_PER_MIN
          top_workflows = sorted(wf_costs.items(), key=lambda x: x[1], reverse=True)[:10]

          print("=== CI COMPUTE COST REPORT ===")
          print(f"Runs analysed:    {run_count}")
          print(f"Total compute:    {total_ms:.1f} minutes")
          print(f"Estimated cost:   ${total_cost:.2f} USD")
          print(f"Cost per run:     ${total_cost/max(run_count,1):.4f} USD")
          print()
          print("Top 10 Most Expensive Workflows:")
          for wf, cost in top_workflows:
              print(f"  ${cost:.4f}  {wf}")

          # Save report
          report = {
              "period": "${{ github.event.inputs.period || 'weekly' }}",
              "generated_at": datetime.utcnow().isoformat(),
              "runs_analysed": run_count,
              "total_compute_minutes": round(total_ms, 2),
              "estimated_cost_usd": round(total_cost, 4),
              "top_workflows": [{"name": n, "cost_usd": round(c, 4)} for n, c in top_workflows],
          }
          with open("/tmp/ci-cost-report.json", "w") as f:
              json.dump(report, f, indent=2)
          print("\nReport saved to /tmp/ci-cost-report.json")
          PYEOF

      - name: Upload CI cost report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-cost-report-${{ github.run_id }}
          path: /tmp/ci-cost-report.json
          retention-days: 90

  llm-roi-tracking:
    name: LLM Cost & ROI Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip3 install requests

      - name: Calculate LLM costs and ROI
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime

          # LLM pricing per 1M tokens (May 2026 estimates)
          LLM_PRICING = {
              "gpt-4.1":            {"input": 2.00,  "output": 8.00},
              "gpt-4.1-mini":       {"input": 0.40,  "output": 1.60},
              "gpt-4.1-nano":       {"input": 0.10,  "output": 0.40},
              "gemini-2.5-flash":   {"input": 0.15,  "output": 0.60},
              "claude-3-5-sonnet":  {"input": 3.00,  "output": 15.00},
              "mistral-7b":         {"input": 0.05,  "output": 0.05},  # self-hosted
          }

          # Simulated usage data (replace with actual telemetry from OTEL/Datadog)
          USAGE_ESTIMATES = {
              "gpt-4.1":           {"input_tokens": 50_000,   "output_tokens": 20_000,  "calls": 100},
              "gpt-4.1-mini":      {"input_tokens": 500_000,  "output_tokens": 200_000, "calls": 2000},
              "gpt-4.1-nano":      {"input_tokens": 1_000_000,"output_tokens": 300_000, "calls": 5000},
              "gemini-2.5-flash":  {"input_tokens": 200_000,  "output_tokens": 80_000,  "calls": 800},
              "mistral-7b":        {"input_tokens": 300_000,  "output_tokens": 100_000, "calls": 1500},
          }

          print("=== LLM COST & ROI REPORT ===")
          print(f"Generated: {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}")
          print()
          print(f"{'Model':<22} {'Calls':>8} {'Input $':>10} {'Output $':>10} {'Total $':>10} {'$/call':>8}")
          print("-" * 72)

          total_cost = 0
          model_costs = []
          for model, usage in USAGE_ESTIMATES.items():
              pricing = LLM_PRICING.get(model, {"input": 0, "output": 0})
              input_cost  = (usage["input_tokens"]  / 1_000_000) * pricing["input"]
              output_cost = (usage["output_tokens"] / 1_000_000) * pricing["output"]
              model_total = input_cost + output_cost
              per_call    = model_total / max(usage["calls"], 1)
              total_cost += model_total
              model_costs.append({
                  "model": model, "calls": usage["calls"],
                  "input_cost": round(input_cost, 4),
                  "output_cost": round(output_cost, 4),
                  "total_cost": round(model_total, 4),
                  "cost_per_call": round(per_call, 6),
              })
              print(f"{model:<22} {usage['calls']:>8,} ${input_cost:>9.4f} ${output_cost:>9.4f} ${model_total:>9.4f} ${per_call:>7.6f}")

          print("-" * 72)
          print(f"{'TOTAL':<22} {'':>8} {'':>10} {'':>10} ${total_cost:>9.4f}")
          print()

          # ROI analysis
          # Assume each LLM call saves 5 minutes of developer time @ $150/hr
          DEVELOPER_HOURLY = 150
          MINUTES_SAVED_PER_CALL = 5
          total_calls = sum(u["calls"] for u in USAGE_ESTIMATES.values())
          time_saved_hrs = (total_calls * MINUTES_SAVED_PER_CALL) / 60
          value_generated = time_saved_hrs * DEVELOPER_HOURLY
          roi = ((value_generated - total_cost) / max(total_cost, 0.01)) * 100

          print(f"ROI Analysis:")
          print(f"  Total LLM calls:      {total_calls:,}")
          print(f"  Developer time saved: {time_saved_hrs:.1f} hours")
          print(f"  Value generated:      ${value_generated:,.2f}")
          print(f"  LLM spend:            ${total_cost:.4f}")
          print(f"  ROI:                  {roi:.0f}%")

          report = {
              "generated_at": datetime.utcnow().isoformat(),
              "models": model_costs,
              "total_cost_usd": round(total_cost, 4),
              "total_calls": total_calls,
              "developer_hours_saved": round(time_saved_hrs, 2),
              "value_generated_usd": round(value_generated, 2),
              "roi_percent": round(roi, 1),
          }
          with open("/tmp/llm-roi-report.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload LLM ROI report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: llm-roi-report-${{ github.run_id }}
          path: /tmp/llm-roi-report.json
          retention-days: 90

  cloud-cost-attribution:
    name: Cloud Spend Attribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip3 install requests boto3

      - name: Attribute cloud costs per service
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          python3 - << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta

          # Service cost model (replace with real AWS Cost Explorer / GCP Billing API calls)
          SERVICES = {
              "devonn-api":          {"compute": 45.20, "storage": 8.50,  "network": 12.30, "team": "backend"},
              "devonn-frontend":     {"compute": 12.00, "storage": 2.10,  "network": 45.80, "team": "frontend"},
              "devonn-ai-pipeline":  {"compute": 89.50, "storage": 15.00, "network": 8.20,  "team": "ai"},
              "devonn-voice":        {"compute": 23.40, "storage": 5.80,  "network": 18.90, "team": "ai"},
              "devonn-db":           {"compute": 38.00, "storage": 42.00, "network": 3.10,  "team": "platform"},
              "devonn-cache":        {"compute": 18.50, "storage": 6.20,  "network": 2.80,  "team": "platform"},
              "devonn-monitoring":   {"compute": 8.90,  "storage": 22.00, "network": 1.50,  "team": "platform"},
          }

          print("=== CLOUD COST ATTRIBUTION REPORT ===")
          print(f"Period: {(datetime.utcnow() - timedelta(days=30)).strftime('%Y-%m-%d')} to {datetime.utcnow().strftime('%Y-%m-%d')}")
          print()
          print(f"{'Service':<28} {'Team':<12} {'Compute':>10} {'Storage':>10} {'Network':>10} {'Total':>10}")
          print("-" * 84)

          team_totals = {}
          grand_total = 0
          service_report = []

          for svc, costs in SERVICES.items():
              total = costs["compute"] + costs["storage"] + costs["network"]
              team = costs["team"]
              team_totals[team] = team_totals.get(team, 0) + total
              grand_total += total
              service_report.append({"service": svc, "team": team, "total_usd": round(total, 2), **{k: round(v, 2) for k, v in costs.items() if k != "team"}})
              print(f"{svc:<28} {team:<12} ${costs['compute']:>9.2f} ${costs['storage']:>9.2f} ${costs['network']:>9.2f} ${total:>9.2f}")

          print("-" * 84)
          print(f"{'TOTAL':<28} {'':12} {'':>10} {'':>10} {'':>10} ${grand_total:>9.2f}")
          print()
          print("By Team:")
          for team, cost in sorted(team_totals.items(), key=lambda x: x[1], reverse=True):
              pct = cost / grand_total * 100
              print(f"  {team:<12} ${cost:>8.2f}  ({pct:.1f}%)")

          # Budget alert
          MONTHLY_BUDGET = 400.0
          if grand_total > MONTHLY_BUDGET * 0.9:
              print(f"\n⚠ WARNING: Spend ${grand_total:.2f} is within 10% of ${MONTHLY_BUDGET:.2f} budget")
          else:
              remaining = MONTHLY_BUDGET - grand_total
              print(f"\n✓ Budget status: ${grand_total:.2f} / ${MONTHLY_BUDGET:.2f} (${remaining:.2f} remaining)")

          report = {
              "generated_at": datetime.utcnow().isoformat(),
              "services": service_report,
              "team_totals": {k: round(v, 2) for k, v in team_totals.items()},
              "grand_total_usd": round(grand_total, 2),
              "monthly_budget_usd": MONTHLY_BUDGET,
              "budget_utilisation_pct": round(grand_total / MONTHLY_BUDGET * 100, 1),
          }
          with open("/tmp/cloud-cost-report.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload cloud cost report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cloud-cost-report-${{ github.run_id }}
          path: /tmp/cloud-cost-report.json
          retention-days: 90
