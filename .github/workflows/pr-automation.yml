name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]
  schedule:
    - cron: '0 9 * * 1'   # Weekly stale PR cleanup on Monday

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Auto-Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Auto-label based on changed files
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const paths = files.map(f => f.filename);
            const labels = new Set();

            // Label rules
            const rules = [
              { pattern: /^\.github\/workflows\//, label: 'ci/cd' },
              { pattern: /^backend\//, label: 'backend' },
              { pattern: /^src\//, label: 'frontend' },
              { pattern: /^policy\//, label: 'security' },
              { pattern: /^gitops\//, label: 'gitops' },
              { pattern: /^compliance\//, label: 'compliance' },
              { pattern: /^config\//, label: 'configuration' },
              { pattern: /package\.json|package-lock\.json/, label: 'dependencies' },
              { pattern: /Dockerfile|docker-compose/, label: 'docker' },
              { pattern: /\.md$/, label: 'documentation' },
              { pattern: /test|spec|__tests__/, label: 'testing' },
            ];

            for (const file of paths) {
              for (const rule of rules) {
                if (rule.pattern.test(file)) {
                  labels.add(rule.label);
                }
              }
            }

            // Size label
            const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            if (totalChanges < 50) labels.add('size/XS');
            else if (totalChanges < 200) labels.add('size/S');
            else if (totalChanges < 500) labels.add('size/M');
            else if (totalChanges < 1000) labels.add('size/L');
            else labels.add('size/XL');

            // Ensure labels exist and apply them
            for (const label of labels) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [label],
                });
              } catch (e) {
                // Label may not exist yet; create it
                try {
                  const colors = {
                    'ci/cd': 'e11d48', 'backend': '7c3aed', 'frontend': '2563eb',
                    'security': 'dc2626', 'gitops': '059669', 'compliance': 'b45309',
                    'configuration': '6b7280', 'dependencies': 'f59e0b', 'docker': '0ea5e9',
                    'documentation': '64748b', 'testing': '10b981',
                    'size/XS': 'c6ef9c', 'size/S': 'a8d5a2', 'size/M': 'f0e68c',
                    'size/L': 'f4a460', 'size/XL': 'ff6347',
                  };
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: colors[label] || 'ededed',
                  });
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: [label],
                  });
                } catch (e2) {
                  console.log(`Could not add label ${label}: ${e2.message}`);
                }
              }
            }

            console.log(`Applied labels: ${[...labels].join(', ')}`);

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR size and warn if too large
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const fileCount = files.length;

            console.log(`PR size: ${totalChanges} changes across ${fileCount} files`);

            if (totalChanges > 1000 || fileCount > 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '## ⚠️ Large PR Warning',
                  '',
                  `This PR contains **${totalChanges} line changes** across **${fileCount} files**.`,
                  '',
                  'Large PRs are harder to review and more likely to introduce bugs. Consider:',
                  '- Breaking this into smaller, focused PRs',
                  '- Separating refactoring from feature changes',
                  '- Using feature flags to merge incrementally',
                  '',
                  '_This is a warning only — the PR can still be merged._',
                ].join('\n'),
              });
            }

  stale-management:
    name: Stale PR & Issue Management
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - name: Mark stale PRs and issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const STALE_DAYS = 30;
            const CLOSE_DAYS = 60;

            // Check open PRs
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });

            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at);
              const daysSinceUpdate = (now - updatedAt) / (1000 * 60 * 60 * 24);

              if (daysSinceUpdate > STALE_DAYS) {
                console.log(`PR #${pr.number} is stale (${Math.floor(daysSinceUpdate)} days)`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['stale'],
                  });
                } catch (e) {
                  console.log(`Could not label PR #${pr.number}: ${e.message}`);
                }
              }
            }

            console.log(`Checked ${prs.length} open PRs for staleness`);

  welcome-contributor:
    name: Welcome First-Time Contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Check if first-time contributor and welcome
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;

            // Check contribution history
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });

            const authorPRs = prs.filter(pr => pr.user.login === author);

            if (authorPRs.length === 1) {
              // This is their first PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  `## 👋 Welcome to the Devonn.AI Platform, @${author}!`,
                  '',
                  'Thank you for your first contribution. Here is what happens next:',
                  '',
                  '1. **Automated checks** will run (quality gates, security scans, tests)',
                  '2. **A reviewer** will be assigned within 24 hours',
                  '3. **Feedback** will be provided via inline comments',
                  '',
                  'Please ensure your PR follows our [contribution guidelines](../CONTRIBUTING.md).',
                  '',
                  '_Automated by Wave 21 PR Automation_',
                ].join('\n'),
              });
            }
