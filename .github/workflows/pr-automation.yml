name: PR Automation

# Scheduled repository hygiene only. Broad pull-request automation is disabled to
# prevent a separate runner from starting for every PR update.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-automation-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  stale-management:
    name: Stale PR & Issue Management
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark stale PRs and issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const STALE_DAYS = 30;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at);
              const daysSinceUpdate = (now - updatedAt) / (1000 * 60 * 60 * 24);
              if (daysSinceUpdate > STALE_DAYS) {
                console.log(`PR #${pr.number} is stale (${Math.floor(daysSinceUpdate)} days)`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['stale'],
                  });
                } catch (error) {
                  console.log(`Could not label PR #${pr.number}: ${error.message}`);
                }
              }
            }
            console.log(`Checked ${prs.length} open PRs for staleness`);
