name: Multi-Region Failover & Backup Verification

on:
  workflow_dispatch:
    inputs:
      trigger_failover:
        description: 'Trigger actual failover'
        required: true
        default: false
        type: boolean
      target_region:
        description: 'Target failover region'
        required: true
        default: 'us-east-1'
        type: choice
        options: [us-east-1, eu-west-1, ap-southeast-1]

permissions:
  contents: read

concurrency:
  group: multi-region-failover
  cancel-in-progress: false

jobs:
  control:
    name: Manual Failover Control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Multi-region failover is manual-only because Railway and Vercel are the active production path."
          echo "Target region: ${{ github.event.inputs.target_region }}"
          echo "Actual failover: ${{ github.event.inputs.trigger_failover }}"
