name: Film Mobile Release Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-film:
    name: Film 390px and 768px
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://api.d3vonn.io
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder_anon_key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
      - name: Run mobile layout and console acceptance
        run: BROWSER=chromium pnpm exec playwright test tests/e2e/film-mobile-release.spec.ts --project=chromium
      - name: Upload screenshots and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: film-mobile-evidence
          path: test-results/
          retention-days: 14
