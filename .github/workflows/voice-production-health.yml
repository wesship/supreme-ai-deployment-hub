name: Voice Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check public Voice Studio
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.d3vonn.io/voice-studio -o /tmp/voice-studio.html
          grep -q 'api.d3vonn.io' /tmp/voice-studio.html

      - name: Check API DNS record and TLS reachability
        shell: bash
        run: |
          set -euo pipefail
          expected="ymvrdxe8.up.railway.app."
          actual="$(dig +short CNAME api.d3vonn.io | tail -n 1 | tr -d '\r')"
          if [ "$actual" != "$expected" ] && [ "$actual" != "${expected%.}" ]; then
            echo "Unexpected api.d3vonn.io CNAME: '$actual' (expected '$expected')"
            exit 1
          fi
          getent ahosts api.d3vonn.io
          curl -fsS --fail-with-body https://api.d3vonn.io/health

      - name: Check voice session protection
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/voice-session.json -w '%{http_code}' -X POST https://api.d3vonn.io/api/voice/session -H 'Content-Type: application/json' -d '{}')"
          case "$status" in
            401|403|503) ;;
            *) echo "Unexpected unauthenticated voice session status: $status"; cat /tmp/voice-session.json; exit 1;;
          esac

      - name: Check production security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://www.d3vonn.io/voice-studio | tee /tmp/voice-headers.txt
          grep -qi '^strict-transport-security:' /tmp/voice-headers.txt
          grep -qi '^x-content-type-options:' /tmp/voice-headers.txt
