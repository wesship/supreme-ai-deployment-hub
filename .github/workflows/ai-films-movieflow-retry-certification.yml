name: AI Films MovieFlow Retry Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ai-films-movieflow-retry-certification.yml
      - scripts/certify_ai_films_movieflow_retry.py
      - backend/ai_films/bootstrap.py
      - backend/ai_films/ingestion.py
      - backend/ai_films/twelvelabs.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/ai-films-movieflow-retry-certification.yml
      - scripts/certify_ai_films_movieflow_retry.py
      - backend/ai_films/bootstrap.py
      - backend/ai_films/ingestion.py
      - backend/ai_films/twelvelabs.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-films-movieflow-retry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    name: Validate MovieFlow certification runner
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR revision without production secrets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate certification runner syntax and import path
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/certify_ai_films_movieflow_retry.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/certify_ai_films_movieflow_retry.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          imports = {
              alias.name
              for node in ast.walk(tree)
              if isinstance(node, ast.Import)
              for alias in node.names
          }
          from_imports = {
              node.module
              for node in ast.walk(tree)
              if isinstance(node, ast.ImportFrom) and node.module
          }
          required = 'backend.ai_films.bootstrap'
          if required not in from_imports:
              raise SystemExit(f'Missing required certification import: {required}')
          print('MovieFlow certification runner is syntactically valid and references the governed bootstrap module.')
          PY

  retry:
    name: Retry Sovereign Signal MovieFlow ingestion
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      RAILWAY_PROJECT_ID: 65a00bf6-1a68-414e-bbe9-a30052595a83
      RAILWAY_SERVICE_ID: 475dde82-373b-4c9f-9fd8-0ffb7a5dc2f0
      RAILWAY_ENVIRONMENT: production
      RAILWAY_PROJECT_TOKEN_PRIMARY: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_TOKEN_FALLBACK: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_SERVICE_TOKEN_FALLBACK: ${{ secrets.RAILWAY_SERVICE_TOKEN }}
      RAILWAY_API_TOKEN_INPUT: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Check out trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve protected Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          token="${RAILWAY_PROJECT_TOKEN_PRIMARY:-}"
          if [ -z "$token" ]; then token="${RAILWAY_PROJECT_TOKEN_FALLBACK:-}"; fi
          if [ -z "$token" ]; then token="${RAILWAY_SERVICE_TOKEN_FALLBACK:-}"; fi
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "RAILWAY_TOKEN=$token" >> "$GITHUB_ENV"
          elif [ -n "${RAILWAY_API_TOKEN_INPUT:-}" ]; then
            echo "::add-mask::$RAILWAY_API_TOKEN_INPUT"
            echo "RAILWAY_API_TOKEN=$RAILWAY_API_TOKEN_INPUT" >> "$GITHUB_ENV"
          else
            echo "Missing Railway production token" >&2
            exit 1
          fi

      - name: Install Railway CLI and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Link live production backend
        shell: bash
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --json

      - name: Run idempotent MovieFlow retry with production environment
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            python -m scripts.certify_ai_films_movieflow_retry
