name: AI Films MovieFlow Retry Certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ai-films-movieflow-retry-certification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-films-movieflow-retry-production
  cancel-in-progress: false

jobs:
  retry:
    name: Retry Sovereign Signal MovieFlow ingestion
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      RAILWAY_PROJECT_ID: 65a00bf6-1a68-414e-bbe9-a30052595a83
      RAILWAY_SERVICE_ID: 475dde82-373b-4c9f-9fd8-0ffb7a5dc2f0
      RAILWAY_ENVIRONMENT: production
      RAILWAY_PROJECT_TOKEN_PRIMARY: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_TOKEN_FALLBACK: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_SERVICE_TOKEN_FALLBACK: ${{ secrets.RAILWAY_SERVICE_TOKEN }}
      RAILWAY_API_TOKEN_INPUT: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve protected Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          token="${RAILWAY_PROJECT_TOKEN_PRIMARY:-}"
          if [ -z "$token" ]; then token="${RAILWAY_PROJECT_TOKEN_FALLBACK:-}"; fi
          if [ -z "$token" ]; then token="${RAILWAY_SERVICE_TOKEN_FALLBACK:-}"; fi
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "RAILWAY_TOKEN=$token" >> "$GITHUB_ENV"
          elif [ -n "${RAILWAY_API_TOKEN_INPUT:-}" ]; then
            echo "::add-mask::$RAILWAY_API_TOKEN_INPUT"
            echo "RAILWAY_API_TOKEN=$RAILWAY_API_TOKEN_INPUT" >> "$GITHUB_ENV"
          else
            echo "Missing Railway production token" >&2
            exit 1
          fi

      - name: Install Railway CLI and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Link live production backend
        shell: bash
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --json

      - name: Run idempotent MovieFlow retry with production environment
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            python - <<'PY'
          import asyncio
          import json
          from backend.ai_films.bootstrap import (
              PROJECT_ID,
              SupabaseFilmBootstrapClient,
              bootstrap_sovereign_signal_movieflow_ingestion,
          )

          async def main():
              before_client = SupabaseFilmBootstrapClient()
              before = await before_client.get_project(PROJECT_ID)
              before_meta = dict((before or {}).get("metadata") or {})
              print(json.dumps({
                  "before_state": before_meta.get("movieflow_ingestion_state"),
                  "before_ready": before_meta.get("movieflow_ingestion_ready_count"),
                  "before_failed": before_meta.get("movieflow_ingestion_failed_count"),
              }))

              await bootstrap_sovereign_signal_movieflow_ingestion()

              after_client = SupabaseFilmBootstrapClient()
              after = await after_client.get_project(PROJECT_ID)
              after_meta = dict((after or {}).get("metadata") or {})
              print(json.dumps({
                  "after_state": after_meta.get("movieflow_ingestion_state"),
                  "after_ready": after_meta.get("movieflow_ingestion_ready_count"),
                  "after_failed": after_meta.get("movieflow_ingestion_failed_count"),
                  "jockey_items": after_meta.get("jockey_store_item_count"),
              }))

              ready = int(after_meta.get("movieflow_ingestion_ready_count") or 0)
              failed = int(after_meta.get("movieflow_ingestion_failed_count") or 0)
              if ready < 1:
                  raise SystemExit(f"MOVIEFLOW_RETRY_NOT_CERTIFIED: ready={ready} failed={failed}")

          asyncio.run(main())
          PY
