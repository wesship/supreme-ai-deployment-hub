name: Autonomous Fix Engine

# HARDENING NOTE: The schedule trigger has been disabled because it was running
# every hour and failing on every tick, consuming GitHub Actions minutes and
# contributing to billing failures. Re-enable only after the fix engine logic
# is validated and the billing issue is resolved.
#
# To re-enable, uncomment the schedule block below and set a sensible interval.
#
# schedule:
#   - cron: '0 */6 * * *'   # every 6 hours (was: every hour - too aggressive)

on:
  workflow_dispatch:          # manual trigger only until stabilized
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no commits)'
        required: false
        default: 'true'
        type: boolean

# Prevent concurrent runs of the fix engine to avoid conflicting commits
concurrency:
  group: autonomous-fix-engine
  cancel-in-progress: false   # let an in-flight fix finish

permissions:
  contents: read

jobs:
  auto-fix:
    name: Autonomous Fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fix engine
        run: |
          echo "Autonomous fix engine triggered manually"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          echo "Fix engine is currently in safe validation mode."
          # Add your actual fix engine invocation here, e.g.:
          # node scripts/auto-fix.cjs --dry-run=${{ github.event.inputs.dry_run }}
