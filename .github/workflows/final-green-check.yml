name: Final Green Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: final-green-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all-systems-go:
    name: All Systems Go
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no .env files committed
        run: |
          if find . -name ".env" -type f | grep -q .; then
            echo "ERROR: .env file found in repository."
            exit 1
          fi

      - name: Verify required scripts exist
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const required = ['lint', 'typecheck', 'test', 'build', 'ci:doctor', 'workflow:audit'];
          const missing = required.filter((name) => !pkg.scripts || !pkg.scripts[name]);
          if (missing.length) {
            console.error(`Missing package scripts: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: CI doctor advisory
        run: pnpm ci:doctor || echo "CI doctor advisory failed; continuing to lint/typecheck/test/build."

      - name: Workflow audit advisory
        run: pnpm workflow:audit || echo "Workflow audit advisory failed; continuing to lint/typecheck/test/build."

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Green Light
        run: |
          echo "✅ Final Green Check completed."
          echo "✅ Install, lint, typecheck, tests, and build all completed."
          echo "✅ Advisory CI doctor/workflow audit output reviewed separately."
