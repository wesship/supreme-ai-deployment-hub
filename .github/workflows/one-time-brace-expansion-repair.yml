name: One-time brace-expansion remediation

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/security-grype-highs-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/security-grype-highs-clean
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Apply secure override
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          delete pkg.pnpm.overrides['brace-expansion@>=2.0.0'];
          delete pkg.pnpm.overrides['brace-expansion@<2.0.0'];
          pkg.pnpm.overrides['brace-expansion'] = '5.0.9';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate dependency graph
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Validate major override
        run: |
          pnpm test
          pnpm run typecheck

      - name: Confirm vulnerable version removed
        run: |
          if grep -nE 'brace-expansion@1\.1\.18|brace-expansion@1\.1\.16' pnpm-lock.yaml; then
            echo '::error::Legacy vulnerable brace-expansion remains in lockfile'
            exit 1
          fi

      - name: Remove one-time files and commit
        run: |
          rm .github/workflows/one-time-brace-expansion-repair.yml
          rm .github/brace-expansion-repair-trigger
          git config user.name 'd3vonn-security-bot'
          git config user.email '37167955+wesship@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/one-time-brace-expansion-repair.yml .github/brace-expansion-repair-trigger
          git commit -m 'fix(security): force secure brace-expansion version'
          git push origin HEAD:fix/security-grype-highs-clean
