name: Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-edge-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'

concurrency:
  group: supabase-edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Verify required function sources
        run: |
          test -f supabase/functions/generate-screenplay/index.ts
          test -f supabase/functions/generate-film/index.ts

      - name: Typecheck all edge functions
        run: |
          set -euo pipefail
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            index_file="$func_dir/index.ts"
            if [ -f "$index_file" ]; then
              echo "Checking: $func_name"
              if [ -f supabase/functions/import_map.json ]; then
                deno check --import-map=supabase/functions/import_map.json "$index_file"
              else
                deno check "$index_file"
              fi
            fi
          done

  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo '::error::SUPABASE_PROJECT_ID is missing'; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@cd9b0fd6c9b461031b64e97090fcbdec9ba23711
        with:
          version: latest

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            [[ "$func_name" == _* ]] && continue
            [ -f "$func_dir/index.ts" ] || continue
            echo "Deploying: $func_name"
            supabase functions deploy "$func_name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          done

      - name: Smoke test film functions
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY" || { echo '::error::SUPABASE_ANON_KEY is missing'; exit 1; }
          base="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          for fn in generate-screenplay generate-film; do
            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://d3vonn.io' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
              "$base/$fn")
            cat /tmp/response.json || true
            [ "$status" = '200' ] || [ "$status" = '204' ] || {
              echo "::error::$fn CORS preflight returned HTTP $status"
              exit 1
            }
          done
