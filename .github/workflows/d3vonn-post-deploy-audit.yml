name: D3VONN.IO Post-Deploy Audit

on:
  workflow_run:
    workflows:
      - Devonn.AI Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d3vonn-post-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  live-functional-audit:
    name: Live Functional Audit (chromium)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Audit deployed D3VONN.IO production
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: https://d3vonn.io
          BROWSER: chromium
        run: pnpm exec playwright test tests/e2e/production-interaction-audit.spec.ts --project=chromium --reporter=github,html
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3vonn-post-deploy-audit-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
