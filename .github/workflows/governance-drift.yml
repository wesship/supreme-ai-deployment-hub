name: Governance Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-drift:
    name: Verify governance manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify required files exist
        shell: bash
        run: |
          set -e
          REQUIRED_FILES=(
            "GOVERNANCE_LOCK_MANIFEST.md"
            "README.md"
            "package.json"
            ".github/workflows/governance-drift.yml"
          )
          missing=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required governance file is missing"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Governance drift detected: required files missing."
            exit 1
          fi

      - name: Detect destructive changes to protected paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA"

          PROTECTED_AUTOGEN=(
            "src/integrations/supabase/client.ts"
            "src/integrations/supabase/types.ts"
            ".env"
          )

          fail=0

          # Auto-generated files must not be edited by hand
          for f in "${PROTECTED_AUTOGEN[@]}"; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -q .; then
              echo "::error file=$f::Auto-generated file edited; revert this change."
              fail=1
            fi
          done

          # Migrations are append-only. Hash-bound exceptions are allowed only
          # when an unapplied migration is proven incompatible with the live schema
          # and would fail before a forward correction could run.
          while IFS=$'\t' read -r status path path2; do
            [ -z "$status" ] && continue

            allowed=0
            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260721190500_supabase_rls_hardening_phase1.sql" ] \
              && [ "$PR_NUMBER" = "501" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "0dacf5a5f4e170df63e109cc9f7038e15c0d8ba1" ] \
                && [ "$head_blob" = "06c7037bb5262216b8804b8df089453c14e3e666" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi
            fi

            # PR #707 repairs two unapplied, policy-only migrations so clean
            # preview databases can replay schemas where optional modules are absent.
            # The exception is limited to the exact reviewed before/after blobs.
            if [ "$status" = "M" ] && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"

              if [ "$path" = "supabase/migrations/20260525053524_a06587cd-ea1b-428b-b2c0-b182d6ac63d8.sql" ] \
                && [ "$base_blob" = "8f505bf6a5eb226099c21d053812b350486fb484" ] \
                && [ "$head_blob" = "f3becd69b213b2b90ed1ff363b52e805a813aaa4" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi

              if [ "$path" = "supabase/migrations/20260528163650_a797cbd3-c11c-4c52-a77f-dcadd8628218.sql" ] \
                && [ "$base_blob" = "e8d9587b832a81db3f240695be8dab637c56253a" ] \
                && [ "$head_blob" = "7976b1bd843f9a321895ad494313da9d28d5466a" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260528_occ_tables.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "ed9d20907758f77f0ac8734db7f63a68a91ff2d4" ] \
                && [ "$head_blob" = "15043ca841fa3d6ce0c853f554a4628636539b8d" ]; then
                echo "Approved one-time OCC compatibility migration correction: $path"
                allowed=1
              fi
            fi

            if [ "$allowed" -ne 1 ]; then
              echo "::error file=$path::Existing migration modified, deleted, or renamed without an exact approved exception ($status)."
              fail=1
            fi
          done < <(
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/**' \
              | awk '$1 == "D" || $1 == "M" || $1 ~ /^R/ { print }'
          )

          # config.toml: project-level settings locked
          if git diff "$BASE_SHA" "$HEAD_SHA" -- supabase/config.toml \
              | grep -E '^[-+]project_id' >/dev/null; then
            echo "::error file=supabase/config.toml::project_id changed; project-level settings are locked."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Governance drift detected."
            exit 1
          fi
          echo "No governance drift detected."

      - name: Summary
        if: always()
        run: echo "Governance manifest verified against GOVERNANCE_LOCK_MANIFEST.md"
