name: Governance Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-drift:
    name: Verify governance manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify required files exist
        shell: bash
        run: |
          set -e
          REQUIRED_FILES=(
            "GOVERNANCE_LOCK_MANIFEST.md"
            "README.md"
            "package.json"
            ".github/workflows/governance-drift.yml"
          )
          missing=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required governance file is missing"
              missing=1
            else
              echo "ok: $f"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Governance drift detected: required files missing."
            exit 1
          fi

      - name: Detect destructive changes to protected paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA"

          PROTECTED_AUTOGEN=(
            "src/integrations/supabase/client.ts"
            "src/integrations/supabase/types.ts"
            ".env"
          )

          fail=0

          # Auto-generated files must not be edited by hand
          for f in "${PROTECTED_AUTOGEN[@]}"; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -q .; then
              echo "::error file=$f::Auto-generated file edited; revert this change."
              fail=1
            fi
          done

          # Migrations are append-only. Hash-bound exceptions are allowed only
          # when an unapplied migration is proven incompatible with the live schema
          # and would fail before a forward correction could run.
          while IFS=$'\t' read -r status path path2; do
            [ -z "$status" ] && continue

            allowed=0

            # PR #903 repairs an unapplied historical agent-mesh migration that
            # cannot replay against the newer workspace-scoped agents table.
            # Allow only this exact reviewed before/after blob pair.
            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260516000001_agent_mesh_schema.sql" ] \
              && [ "$PR_NUMBER" = "903" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "e4681d7efc8b05352f6e65d3294be3c9ae4eefd6" ] \
                && [ "$head_blob" = "f94724037ec5fcb10ae9dd3d74cc6acdafed4696" ]; then
                echo "Approved PR #903 pre-application agent-mesh compatibility correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260721190500_supabase_rls_hardening_phase1.sql" ] \
              && [ "$PR_NUMBER" = "501" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "0dacf5a5f4e170df63e109cc9f7038e15c0d8ba1" ] \
                && [ "$head_blob" = "06c7037bb5262216b8804b8df089453c14e3e666" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi
            fi

            # PR #730 hardens the unapplied AI Film orchestrator migration before
            # its first staging/production rollout. The exception is bound to the
            # exact reviewed before/after blobs so no later mutation is permitted.
            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260803112500_film_orchestrator_core.sql" ] \
              && [ "$PR_NUMBER" = "730" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "762b730972cca384fcd47d9cad156e9890ece593" ] \
                && [ "$head_blob" = "d020e5d0fa90b83ce7a8dc848851e519663dc01f" ]; then
                echo "Approved pre-rollout film ownership hardening: $path"
                allowed=1
              fi
            fi

            # PR #707 repairs two unapplied, policy-only migrations so clean
            # preview databases can replay schemas where optional modules are absent.
            # The exception is limited to the exact reviewed before/after blobs.
            if [ "$status" = "M" ] && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"

              if [ "$path" = "supabase/migrations/20260525053524_a06587cd-ea1b-428b-b2c0-b182d6ac63d8.sql" ] \
                && [ "$base_blob" = "8f505bf6a5eb226099c21d053812b350486fb484" ] \
                && [ "$head_blob" = "f3becd69b213b2b90ed1ff363b52e805a813aaa4" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi

              if [ "$path" = "supabase/migrations/20260528163650_a797cbd3-c11c-4c52-a77f-dcadd8628218.sql" ] \
                && [ "$base_blob" = "e8d9587b832a81db3f240695be8dab637c56253a" ] \
                && [ "$head_blob" = "7976b1bd843f9a321895ad494313da9d28d5466a" ]; then
                echo "Approved one-time migration correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260528_occ_tables.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "ed9d20907758f77f0ac8734db7f63a68a91ff2d4" ] \
                && [ "$head_blob" = "a7a9afcdc68e90b5857ac67753448f3dda73859c" ]; then
                echo "Approved one-time OCC compatibility migration correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260529_hermes_brain.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "a0c6cc854b9eaef5ae77e58f1c16844b6257cb19" ] \
                && [ "$head_blob" = "27566271920acfe811f427914143e153d879b6d1" ]; then
                echo "Approved one-time Hermes vector migration correction: $path"
                allowed=1
              fi
            fi

            # The two unapplied Hermes files formerly shared version 20260529.
            # Accept only the exact content-preserving rename to 202605290001.
            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260529_hermes_brain_additive.sql" ] \
              && [ "$path2" = "supabase/migrations/20260530_hermes_brain_additive.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "4415a15790ed2679f793115de5fc6ccde16884a0" ] \
                && [ "$head_blob" = "1aa03765948d0d15a5bc0e9ccfbaf8a329f5090e" ]; then
                echo "Approved one-time additive Hermes migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            # Some git versions may report the same operation as delete + add.
            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260529_hermes_brain_additive.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/20260530_hermes_brain_additive.sql")"
              if [ "$base_blob" = "4415a15790ed2679f793115de5fc6ccde16884a0" ] \
                && [ "$head_blob" = "1aa03765948d0d15a5bc0e9ccfbaf8a329f5090e" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved one-time additive Hermes migration move: $path"
                allowed=1
              fi
            fi

            # The user_roles migration also shared legacy version 20260529.
            # Accept only the exact content-preserving rename to a unique version.
            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260529_user_roles.sql" ] \
              && [ "$path2" = "supabase/migrations/202605290001_user_roles.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "bc9a2ebc87326dc16f6c3bcd47b73fd9fda66d7b" ] \
                && [ "$head_blob" = "bc9a2ebc87326dc16f6c3bcd47b73fd9fda66d7b" ]; then
                echo "Approved one-time user_roles migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            # Some git versions may report the same operation as delete + add.
            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260529_user_roles.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/202605290001_user_roles.sql")"
              if [ "$base_blob" = "bc9a2ebc87326dc16f6c3bcd47b73fd9fda66d7b" ] \
                && [ "$head_blob" = "bc9a2ebc87326dc16f6c3bcd47b73fd9fda66d7b" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved one-time user_roles migration move: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260530131757_284c8b75-4c2c-4469-9190-b5e19a35dd0f.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "06b6aa345f8e92318d8e9bd1ef815a20bb487171" ] \
                && [ "$head_blob" = "7cbbbbbfc3705f65052011caff246263b4239f7e" ]; then
                echo "Approved one-time Hermes intelligence compatibility correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260622170939_2a94f546-3120-4b67-95cf-c16b5c11ccf8.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "8fc918a425aa032048c4774faf3a1c67ae4f8a18" ] \
                && [ "$head_blob" = "828853ab063b53a656e19e91c1e086de2fb0e11c" ]; then
                echo "Approved one-time optional billing policy compatibility correction: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260625023616_73026400-4e21-4a4e-9b47-7d2c12b75953.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "5b11c2dbda692664d6efdbea098eaeae9d6fa594" ] \
                && [ "$head_blob" = "b42b4dcbaee48d1ee705dae8e2cb480be241b918" ]; then
                echo "Approved one-time optional subscription policy correction: $path"
                allowed=1
              fi
            fi

            # Two D3VONN SOC migrations shared legacy version 20260630.
            # Preserve contents and ordering with unique timestamp versions.
            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260630_d3vonn_soc.sql" ] \
              && [ "$path2" = "supabase/migrations/20260630000000_d3vonn_soc.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "971712230f2315c604a6388433c0086fa7b2772a" ] \
                && [ "$head_blob" = "971712230f2315c604a6388433c0086fa7b2772a" ]; then
                echo "Approved one-time D3VONN migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260630_d3vonn_soc.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/20260630000000_d3vonn_soc.sql")"
              if [ "$base_blob" = "971712230f2315c604a6388433c0086fa7b2772a" ] \
                && [ "$head_blob" = "971712230f2315c604a6388433c0086fa7b2772a" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved one-time D3VONN migration move: $path"
                allowed=1
              fi
            fi

            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260630_d3vonn_soc_v2.sql" ] \
              && [ "$path2" = "supabase/migrations/20260630000001_d3vonn_soc_v2.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "f02ae505c1e326dc7fb8c56675c061117b1fd1b1" ] \
                && [ "$head_blob" = "f02ae505c1e326dc7fb8c56675c061117b1fd1b1" ]; then
                echo "Approved one-time D3VONN migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260630_d3vonn_soc_v2.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/20260630000001_d3vonn_soc_v2.sql")"
              if [ "$base_blob" = "f02ae505c1e326dc7fb8c56675c061117b1fd1b1" ] \
                && [ "$head_blob" = "f02ae505c1e326dc7fb8c56675c061117b1fd1b1" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved one-time D3VONN migration move: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260725225100_restore_hermes_runtime_ledger.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "70f26c4a5ca16745162dd932610600ce6a8310bb" ] \
                && [ "$head_blob" = "459a8d9f6498738945aabbc9e4b1c369934a1312" ]; then
                echo "Approved one-time Hermes ledger compatibility correction: $path"
                allowed=1
              fi
            fi

            # This index migration is applied in staging, where the optional
            # Genesis table exists, but is pending in production and absent in
            # clean previews. The guarded form is behavior-identical in staging.
            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260729130000_add_remaining_public_fk_index.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "b1e88f138ddf9d180761cb01e76e8566e2a31962" ] \
                && [ "$head_blob" = "cbb82f4f6081ce131afa9efbcafcb16090464891" ]; then
                echo "Approved one-time optional Genesis index correction: $path"
                allowed=1
              fi
            fi

            # Production applied this backfill against legacy columns; staging
            # and clean previews use the normalized schema. JSON lookup preserves
            # legacy behavior while tolerating missing optional columns.
            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260801204856_add_event_type_to_agent_activity_logs.sql" ] \
              && [ "$PR_NUMBER" = "707" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "6a59125e85e14fe5838f0dfcc3a50e0f529bb2a3" ] \
                && [ "$head_blob" = "b1e94b21c6f089e3c8dd252162ff47a5c0271a63" ]; then
                echo "Approved one-time agent activity compatibility correction: $path"
                allowed=1
              fi
            fi

            # PR #900 reconciles two duplicate short-version AI Films migrations
            # with content-preserving timestamped renames and makes one unapplied
            # hardening migration clean-preview safe. Every exception is bound to
            # the exact PR, path and reviewed blob identity.
            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260807_ai_film_render_bucket.sql" ] \
              && [ "$path2" = "supabase/migrations/20260807235350_create_ai_film_render_bucket.sql" ] \
              && [ "$PR_NUMBER" = "900" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "434760d575b490110007aaac1e7e3cf40c99ab89" ] \
                && [ "$head_blob" = "434760d575b490110007aaac1e7e3cf40c99ab89" ]; then
                echo "Approved PR #900 AI Films migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260807_ai_film_render_bucket.sql" ] \
              && [ "$PR_NUMBER" = "900" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/20260807235350_create_ai_film_render_bucket.sql")"
              if [ "$base_blob" = "434760d575b490110007aaac1e7e3cf40c99ab89" ] \
                && [ "$head_blob" = "434760d575b490110007aaac1e7e3cf40c99ab89" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved PR #900 AI Films migration move: $path"
                allowed=1
              fi
            fi

            if [[ "$status" =~ ^R ]] \
              && [ "$path" = "supabase/migrations/20260807_extend_ai_film_render_job_contract.sql" ] \
              && [ "$path2" = "supabase/migrations/20260808000023_extend_ai_film_render_job_contract.sql" ] \
              && [ "$PR_NUMBER" = "900" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path2")"
              if [ "$base_blob" = "5f2907ee503ad6fefdb0fe951d4711c60eb11253" ] \
                && [ "$head_blob" = "5f2907ee503ad6fefdb0fe951d4711c60eb11253" ]; then
                echo "Approved PR #900 AI Films contract migration rename: $path -> $path2"
                allowed=1
              fi
            fi

            if [ "$status" = "D" ] \
              && [ "$path" = "supabase/migrations/20260807_extend_ai_film_render_job_contract.sql" ] \
              && [ "$PR_NUMBER" = "900" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:supabase/migrations/20260808000023_extend_ai_film_render_job_contract.sql")"
              if [ "$base_blob" = "5f2907ee503ad6fefdb0fe951d4711c60eb11253" ] \
                && [ "$head_blob" = "5f2907ee503ad6fefdb0fe951d4711c60eb11253" ] \
                && ! git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
                echo "Approved PR #900 AI Films contract migration move: $path"
                allowed=1
              fi
            fi

            if [ "$status" = "M" ] \
              && [ "$path" = "supabase/migrations/20260808235100_restrict_anon_workspace_membership_function.sql" ] \
              && [ "$PR_NUMBER" = "900" ]; then
              base_blob="$(git rev-parse "$BASE_SHA:$path")"
              head_blob="$(git rev-parse "$HEAD_SHA:$path")"
              if [ "$base_blob" = "36018bb97c9bcdf1576b00294fecef4167b58dc8" ] \
                && [ "$head_blob" = "0184e92f20209a81b1362e0b73c2a788e8f2a027" ]; then
                echo "Approved PR #900 clean-preview membership hardening correction: $path"
                allowed=1
              fi
            fi

            if [ "$allowed" -ne 1 ]; then
              echo "::error file=$path::Existing migration modified, deleted, or renamed without an exact approved exception ($status)."
              fail=1
            fi
          done < <(
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/**' \
              | awk '$1 == "D" || $1 == "M" || $1 ~ /^R/ { print }'
          )

          # config.toml: project-level settings locked
          if git diff "$BASE_SHA" "$HEAD_SHA" -- supabase/config.toml \
              | grep -E '^[-+]project_id' >/dev/null; then
            echo "::error file=supabase/config.toml::project_id changed; project-level settings are locked."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Governance drift detected."
            exit 1
          fi
          echo "No governance drift detected."

      - name: Summary
        if: always()
        run: echo "Governance manifest verified against GOVERNANCE_LOCK_MANIFEST.md"