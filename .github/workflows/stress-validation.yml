name: Operational Stress Intelligence

on:
  push:
    branches: [main]
    paths:
      - "stress-validation/**"
      - "src/lib/mcp/**"
  pull_request:
    branches: [main]
    paths:
      - "stress-validation/**"
      - "src/lib/mcp/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  stress-validation:
    name: Operational Stress Validation (LS-1 to LS-6)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stress validation scenarios
        id: run-scenarios
        run: |
          npx vitest run stress-validation/scenarios/ \
            --reporter=verbose \
            --reporter=json \
            --outputFile=stress-validation/reports/results.json

      - name: Parse scenario results
        if: always()
        run: |
          if [ -f stress-validation/reports/results.json ]; then
            python3 - << 'PYEOF'
          import json, sys
          data = json.load(open("stress-validation/reports/results.json"))
          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          failed = data.get("numFailedTests", 0)
          print(f"Operational Stress Intelligence Results:")
          print(f"  Total:   {total}")
          print(f"  Passed:  {passed}")
          print(f"  Failed:  {failed}")
          if failed > 0:
            print(f"\nFAILED SCENARIOS:")
            for suite in data.get("testResults", []):
              for test in suite.get("assertionResults", []):
                if test.get("status") == "failed":
                  print(f"  - {test.get('fullName')}")
                  for msg in test.get("failureMessages", []):
                    print(f"    {msg[:200]}")
            sys.exit(1)
          PYEOF
          fi

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.1.7
        with:
          name: stress-validation-report-${{ github.run_number }}
          path: stress-validation/reports/results.json
          retention-days: 30

  # Summary gate - required status check
  stress-validation-gate:
    name: Operational Stress Gate
    needs:
      - stress-validation
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check gate status
        run: |
          if [ "${{ needs.stress-validation.result }}" != "success" ]; then
            echo "Operational stress scenarios FAILED"
            exit 1
          fi
          echo "Operational Stress Gate PASSED"
