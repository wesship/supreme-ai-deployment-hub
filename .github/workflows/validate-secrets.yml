name: Validate Required Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-secrets.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check Required Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify backend auth secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          missing=()

          [ -z "$JWT_SECRET" ] && missing+=("JWT_SECRET")
          [ -z "$ENCRYPTION_KEY" ] && missing+=("ENCRYPTION_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::CRITICAL — Missing backend auth secrets: ${missing[*]}"
            echo "Backend auth will fail without these."
            exit 1
          fi

          echo "✓ Backend auth secrets present"

      - name: Verify Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()

          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing Vercel secrets: ${missing[*]}"
          else
            echo "✓ Vercel secrets present"
          fi

      - name: Verify Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=()

          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_PROJECT_ID" ] && missing+=("SUPABASE_PROJECT_ID")
          [ -z "$VITE_SUPABASE_URL" ] && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing+=("VITE_SUPABASE_ANON_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing Supabase secrets: ${missing[*]}"
          else
            echo "✓ Supabase secrets present"
          fi

      - name: Verify AI provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::Missing OPENAI_API_KEY"
          else
            echo "✓ OpenAI secret present"
          fi

      - name: Verify security scanning secrets
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          missing=()

          [ -z "$SNYK_TOKEN" ] && missing+=("SNYK_TOKEN")
          [ -z "$CODECOV_TOKEN" ] && missing+=("CODECOV_TOKEN")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing optional security secrets: ${missing[*]}"
          else
            echo "✓ Security scanning secrets present"
          fi

      - name: Verify observability secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing=()

          [ -z "$SENTRY_DSN" ] && missing+=("SENTRY_DSN")
          [ -z "$SENTRY_AUTH_TOKEN" ] && missing+=("SENTRY_AUTH_TOKEN")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing optional observability secrets: ${missing[*]}"
          else
            echo "✓ Observability secrets present"
          fi

      - name: Summary
        run: echo "Required production secrets check completed."
