name: Validate Required Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-secrets.yml"
      - "config/required-secrets.json"
      - "scripts/validate-secret-inventory.mjs"

permissions:
  contents: read

concurrency:
  group: validate-required-secrets-production
  cancel-in-progress: false

jobs:
  validate:
    name: Production GitHub Credential Presence Audit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Check required production entries
        id: required
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          HOSTINGER_VPS_HOST: ${{ vars.HOSTINGER_VPS_HOST || secrets.HOSTINGER_VPS_HOST || secrets.VPS_HOST }}
          HOSTINGER_VPS_USER: ${{ vars.HOSTINGER_VPS_USER || secrets.HOSTINGER_VPS_USER || secrets.ROOT }}
          HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
        run: >-
          node scripts/validate-secret-inventory.mjs
          config/required-secrets.json production github
          --output=artifacts/github-required-presence.json

      - name: Check optional and workflow-specific entries
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_TOKEN_WRITE: ${{ secrets.GH_TOKEN_WRITE }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: >-
          node scripts/validate-secret-inventory.mjs
          config/required-secrets.json production github_optional
          --allow-missing
          --output=artifacts/github-optional-presence.json

      - name: Analyze aliases without exposing values
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          GH_TOKEN_WRITE: ${{ secrets.GH_TOKEN_WRITE }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const inventory = require('./config/required-secrets.json');
          const aliases = inventory.aliases.map((group) => {
            const present_names = group.names.filter((name) => Boolean(process.env[name]?.trim()));
            return {
              id: group.id,
              names: group.names,
              preferred: group.preferred ?? null,
              action: group.action,
              present_names,
              present_count: present_names.length,
              status: present_names.length === 0 ? 'none-present' : present_names.length === 1 ? 'single-present' : 'multiple-present',
            };
          });
          const report = {
            schema_version: 1,
            generated_at: new Date().toISOString(),
            environment: 'production',
            secret_values_included: false,
            aliases,
          };
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/github-secret-aliases.json', `${JSON.stringify(report, null, 2)}\n`);
          for (const group of aliases) {
            console.log(`${group.status.toUpperCase()} ${group.id}: ${group.present_names.join(', ') || 'none'}`);
          }
          console.log('Credential values were not printed or written to the report.');
          NODE

      - name: Publish metadata-only summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const required = JSON.parse(fs.readFileSync('artifacts/github-required-presence.json', 'utf8'));
          const optional = JSON.parse(fs.readFileSync('artifacts/github-optional-presence.json', 'utf8'));
          const aliases = JSON.parse(fs.readFileSync('artifacts/github-secret-aliases.json', 'utf8'));
          console.log('# Production GitHub Credential Presence Audit');
          console.log('');
          console.log(`- Required entries present: **${required.present_count}/${required.record_count}**`);
          console.log(`- Optional/workflow entries present: **${optional.present_count}/${optional.record_count}**`);
          console.log('- Credential values read into the report or printed: **No**');
          console.log('');
          console.log('## Alias state');
          console.log('');
          console.log('| Alias group | State | Present names | Preferred |');
          console.log('|---|---|---|---|');
          for (const group of aliases.aliases) {
            console.log(`| ${group.id} | ${group.status} | ${group.present_names.join(', ') || 'none'} | ${group.preferred || 'canary decision required'} |`);
          }
          NODE

      - name: Upload presence-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-secret-presence-audit
          path: artifacts/*.json
          retention-days: 30

      - name: Enforce required names
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/github-required-presence.json', 'utf8'));
          if (report.missing_count > 0) {
            console.error(`Required production entries missing: ${report.records.filter((record) => !record.present).map((record) => record.name).join(', ')}`);
            process.exit(1);
          }
          console.log('All required production GitHub entries are populated.');
          NODE
