name: Validate Required Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-secrets.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Check Required Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify Vercel secrets
        continue-on-error: true
        run: |
          missing=()
          [ -z "${{ secrets.VERCEL_TOKEN }}" ]       && missing+=("VERCEL_TOKEN")
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ]      && missing+=("VERCEL_ORG_ID")
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]  && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing Vercel secrets: ${missing[*]} (not yet configured)"
          fi
          echo "✓ Vercel secrets present"

      - name: Verify Supabase secrets
        continue-on-error: true
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ]   && missing+=("SUPABASE_PROJECT_ID")
          [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]     && missing+=("VITE_SUPABASE_URL")
          [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] && missing+=("VITE_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing Supabase secrets: ${missing[*]} (not yet configured)"
          fi
          echo "✓ Supabase secrets present"

      - name: Verify OpenAI secret
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::warning::Missing secret: OPENAI_API_KEY (not yet configured)"
          fi
          echo "✓ OpenAI secret present"

      - name: Verify security scanning secrets
        continue-on-error: true
        run: |
          missing=()
          [ -z "${{ secrets.SNYK_TOKEN }}" ]    && missing+=("SNYK_TOKEN")
          [ -z "${{ secrets.CODECOV_TOKEN }}" ] && missing+=("CODECOV_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing optional security secrets: ${missing[*]}"
          else
            echo "✓ Security scanning secrets present"
          fi

      - name: Verify observability secrets
        continue-on-error: true
        run: |
          missing=()
          [ -z "${{ secrets.SENTRY_DSN }}" ]        && missing+=("SENTRY_DSN")
          [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ] && missing+=("SENTRY_AUTH_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing optional observability secrets: ${missing[*]}"
          else
            echo "✓ Observability secrets present"
          fi

      - name: Summary
        continue-on-error: true
        run: echo "All required secrets validated successfully."
