name: Staging Release Gate (Manual Only)

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional staging base URL'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  staging-status:
    name: Staging gate status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          if [ -z "${{ github.event.inputs.staging_url }}" ]; then
            echo "No staging environment is configured."
            echo "Production remains Railway + Vercel with production smoke monitoring."
          else
            echo "Manual staging target: ${{ github.event.inputs.staging_url }}"
          fi
