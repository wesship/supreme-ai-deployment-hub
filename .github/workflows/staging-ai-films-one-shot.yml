name: One-shot Staging AI Films Rollout

on:
  push:
    branches:
      - agent/staging-ai-films-rollout
    paths:
      - .github/workflows/staging-ai-films-one-shot.yml
      - supabase/migrations/**
      - supabase/functions/ai-film-companion/**

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-shot-staging-ai-films-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Apply repository migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      SUPABASE_PROJECT_ID: ypomzwhtaamxdmcwtpyf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate staging boundary and required secrets
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          : > validation.log
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING_SECRET_NAME=${name}" | tee -a validation.log
              echo "::error title=Missing staging environment secret::${name} is not configured in the GitHub staging environment."
              missing=1
            fi
          done
          echo "TARGET_PROJECT_REF=${SUPABASE_PROJECT_ID}" >> validation.log
          (( missing == 0 )) || exit 1

      - name: Install pinned Supabase CLI
        id: setup
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify Supabase CLI version
        id: version
        run: test "$(supabase --version)" = "2.109.1"

      - name: Link staging project
        id: link
        shell: bash
        run: |
          set -o pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee link.log

      - name: Lint current staging schema
        id: lint
        shell: bash
        run: |
          set -o pipefail
          supabase db lint --linked --level warning 2>&1 | tee lint.log

      - name: Preview every missing repository migration
        id: preview
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee preview.log

      - name: Apply every missing repository migration
        id: apply
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee apply.log

      - name: Deploy disabled AI Film companion function
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          supabase functions deploy ai-film-companion --project-ref "$SUPABASE_PROJECT_ID" --use-api 2>&1 | tee deploy.log

      - name: Write rollout summary
        if: always()
        shell: bash
        run: |
          {
            echo "## One-shot Staging AI Films Rollout"
            echo ""
            echo "- Target project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Validate: \`${{ steps.validate.outcome }}\`"
            echo "- Setup CLI: \`${{ steps.setup.outcome }}\`"
            echo "- Link: \`${{ steps.link.outcome }}\`"
            echo "- Lint: \`${{ steps.lint.outcome }}\`"
            echo "- Preview: \`${{ steps.preview.outcome }}\`"
            echo "- Apply: \`${{ steps.apply.outcome }}\`"
            echo "- Deploy function: \`${{ steps.deploy.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report result and diagnostics on health-fix pull request
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const outcomes = [
              ['validate', '${{ steps.validate.outcome }}'],
              ['setup', '${{ steps.setup.outcome }}'],
              ['version', '${{ steps.version.outcome }}'],
              ['link', '${{ steps.link.outcome }}'],
              ['lint', '${{ steps.lint.outcome }}'],
              ['preview', '${{ steps.preview.outcome }}'],
              ['apply', '${{ steps.apply.outcome }}'],
              ['deploy', '${{ steps.deploy.outcome }}'],
            ];
            const logs = ['validation.log', 'link.log', 'lint.log', 'preview.log', 'apply.log', 'deploy.log']
              .filter((path) => fs.existsSync(path))
              .map((path) => `### ${path}\n${fs.readFileSync(path, 'utf8')}`)
              .join('\n\n');
            let safeLogs = logs;
            for (const secret of [process.env.SUPABASE_ACCESS_TOKEN, process.env.SUPABASE_DB_PASSWORD]) {
              if (secret) safeLogs = safeLogs.split(secret).join('[REDACTED]');
            }
            safeLogs = safeLogs.slice(-5000);
            const body = [
              `${icon} **Staging AI Films migration rollout: ${status}**`,
              '',
              `- Project ref: \`${process.env.SUPABASE_PROJECT_ID}\``,
              `- Commit: \`${context.sha}\``,
              '- Mode: repository migrations with `supabase db push --include-all`',
              '',
              ...outcomes.map(([name, outcome]) => `- ${name}: \`${outcome || 'skipped'}\``),
              '',
              status === 'success'
                ? 'The database is ready for post-rollout schema, RLS, and endpoint verification.'
                : 'No production project was targeted. Diagnostic output follows.',
              safeLogs ? `\n<details><summary>Sanitized rollout log tail</summary>\n\n\`\`\`text\n${safeLogs}\n\`\`\`\n</details>` : ''
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 612,
              body,
            });
