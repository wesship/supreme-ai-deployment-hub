name: One-shot Staging AI Films Rollout

on:
  push:
    branches:
      - agent/staging-ai-films-rollout
    paths:
      - .github/workflows/staging-ai-films-one-shot.yml
      - supabase/migrations/**
      - supabase/functions/ai-film-companion/**

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-shot-staging-ai-films-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Apply repository migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      EXPECTED_STAGING_PROJECT_REF: ypomzwhtaamxdmcwtpyf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate staging boundary and required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing staging environment secret::${name} is not configured in the GitHub staging environment."
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1

          if [[ "$SUPABASE_PROJECT_ID" != "$EXPECTED_STAGING_PROJECT_REF" ]]; then
            echo "::error title=Staging project mismatch::Refusing rollout because SUPABASE_PROJECT_ID is not the expected staging project."
            exit 1
          fi

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify Supabase CLI version
        run: test "$(supabase --version)" = "2.109.1"

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Lint current staging schema
        run: supabase db lint --linked --level warning

      - name: Preview every missing repository migration
        run: supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply every missing repository migration
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy disabled AI Film companion function
        run: supabase functions deploy ai-film-companion --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Write rollout summary
        if: always()
        shell: bash
        run: |
          {
            echo "## One-shot Staging AI Films Rollout"
            echo ""
            echo "- Target project: \`$EXPECTED_STAGING_PROJECT_REF\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Migration mode: \`--include-all\`"
            echo "- Edge Function: \`ai-film-companion\` deployed; activation remains controlled by its feature flag/secret."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report result on health-fix pull request
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const body = [
              `${icon} **Staging AI Films migration rollout: ${status}**`,
              '',
              `- Project ref: \`${process.env.EXPECTED_STAGING_PROJECT_REF}\``,
              `- Commit: \`${context.sha}\``,
              '- Mode: repository migrations with `supabase db push --include-all`',
              '- Edge Function: `ai-film-companion` deployment requested',
              '',
              status === 'success'
                ? 'The database is ready for post-rollout schema, RLS, and endpoint verification.'
                : 'Inspect the failed Actions step before retrying; no production project was targeted.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 612,
              body,
            });
