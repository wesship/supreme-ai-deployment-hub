name: Factory Safety Unit Tests

on:
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline factory safety tests
        run: python -m unittest -v factory.test_safety factory.test_approval_binding factory.test_dispatch
