name: Factory Safety Unit Tests

on:
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline factory safety tests
        run: python -m unittest -v factory.test_safety factory.test_approval_binding factory.test_dispatch
