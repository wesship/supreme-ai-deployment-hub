name: D3VONN Beta QA Agent

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target D3VONN web origin
        required: false
        default: https://d3vonn.io
      create_issue_on_failure:
        description: Open or update a GitHub issue when a real failure is detected
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: d3vonn-beta-qa-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-qa-agent:
    name: Beta user journey and AI platform canary
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://d3vonn.io' }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_DISABLE_CREDENTIAL_TRACING: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate protected beta inputs
        run: |
          set -euo pipefail
          test -n "${E2E_TEST_EMAIL}" || { echo 'Missing E2E_TEST_EMAIL'; exit 1; }
          test -n "${E2E_TEST_PASSWORD}" || { echo 'Missing E2E_TEST_PASSWORD'; exit 1; }
          case "${PLAYWRIGHT_BASE_URL}" in
            https://*) ;;
            *) echo 'PLAYWRIGHT_BASE_URL must use HTTPS'; exit 1 ;;
          esac

      - name: Run public health canaries
        id: health
        continue-on-error: true
        run: |
          set -euo pipefail
          api_base="https://api.d3vonn.io"
          for endpoint in /health /health/ready /health/live; do
            code="$(curl --silent --show-error --location --output /tmp/health.json --write-out '%{http_code}' --max-time 20 "${api_base}${endpoint}")"
            test "${code}" = '200' || { echo "${endpoint} returned ${code}"; cat /tmp/health.json; exit 1; }
          done
          web_code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "${PLAYWRIGHT_BASE_URL}")"
          test "${web_code}" = '200' || { echo "Homepage returned ${web_code}"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated beta journeys
        id: journeys
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf playwright-report test-results
          pnpm exec playwright test tests/e2e/authenticated-production-audit.spec.ts \
            --project=chromium \
            --reporter=github,line \
            --trace=off

      - name: Write QA summary
        if: always()
        run: |
          mkdir -p beta-qa-results
          cat > beta-qa-results/summary.md <<EOF
          # D3VONN Beta QA Agent Result

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Target: ${PLAYWRIGHT_BASE_URL}
          - Public health canaries: ${{ steps.health.outcome }}
          - Authenticated user journeys: ${{ steps.journeys.outcome }}
          - Credentials, traces, screenshots, and user content were not uploaded.
          EOF
          cat beta-qa-results/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update beta QA failure issue
        if: ${{ always() && (steps.health.outcome == 'failure' || steps.journeys.outcome == 'failure') && (github.event_name == 'schedule' || inputs.create_issue_on_failure) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='Beta QA Agent: production canary failure'
          body=$(cat <<EOF
          The D3VONN Beta QA Agent detected a production beta-canary failure.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Target: ${PLAYWRIGHT_BASE_URL}
          - Public health: ${{ steps.health.outcome }}
          - Authenticated journeys: ${{ steps.journeys.outcome }}

          No credentials, traces, screenshots, or user content were attached. Review the workflow logs and close this issue only after a clean rerun.
          EOF
          )
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}" --label testing || \
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

      - name: Enforce beta QA result
        if: ${{ always() && (steps.health.outcome == 'failure' || steps.journeys.outcome == 'failure') }}
        run: exit 1
