name: Auto Merge Safe PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge if safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only auto-merge labeled Dependabot or Snyk PRs. No pull-request code is checked out or executed.
    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'snyk-bot')
    steps:
      - name: Approve and merge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67  # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_LABELS: auto-merge
          # Only merge after all branch-protection checks have passed.
          MERGE_REQUIRED_APPROVALS: '0'
          MERGE_RETRY_SLEEP: '60000'
          MERGE_RETRIES: '5'
