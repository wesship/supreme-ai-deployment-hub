name: Auto Merge Safe PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge if safe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only auto-merge PRs that have the 'auto-merge' label AND are from Dependabot or Snyk
    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-merge') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'snyk-bot')
    steps:
      - name: Approve and merge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67  # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_LABELS: auto-merge
          # HARDENING: Only merge when all required status checks pass
          MERGE_REQUIRED_APPROVALS: '0'
          MERGE_RETRY_SLEEP: '60000'
          MERGE_RETRIES: '5'
