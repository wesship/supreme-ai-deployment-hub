name: Auto Merge Safe PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  configure-auto-merge:
    name: Configure native auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Trusted metadata-only context: never check out or execute pull-request code.
    # GitHub enforces every required review and status check before completing auto-merge.
    steps:
      - name: Enable or disable native auto-merge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const label = context.payload.label?.name;
            const labels = new Set(pr.labels.map(({ name }) => name));

            const { node } = await github.graphql(`
              query($pullRequestId: ID!) {
                node(id: $pullRequestId) {
                  ... on PullRequest {
                    number
                    autoMergeRequest { enabledAt }
                  }
                }
              }
            `, { pullRequestId: pr.node_id });

            if (context.payload.action === 'unlabeled' && label === 'auto-merge') {
              if (!node.autoMergeRequest) {
                core.info(`Auto-merge is already disabled for PR #${pr.number}.`);
                return;
              }

              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId
                  }) {
                    pullRequest { number }
                  }
                }
              `, { pullRequestId: pr.node_id });
              core.info(`Disabled native auto-merge for PR #${pr.number}.`);
              return;
            }

            if (pr.draft || !labels.has('auto-merge')) {
              core.info(`PR #${pr.number} is draft or lacks the auto-merge label; no action taken.`);
              return;
            }

            if (node.autoMergeRequest) {
              core.info(`Native auto-merge is already enabled for PR #${pr.number}.`);
              return;
            }

            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest { enabledAt }
                  }
                }
              }
            `, { pullRequestId: pr.node_id });

            core.info(`Enabled native auto-merge for PR #${pr.number}.`);
