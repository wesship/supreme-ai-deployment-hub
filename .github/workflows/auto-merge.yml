name: Auto Merge Safe PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge if safe (${{ matrix.author }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        author: ['dependabot[bot]', 'snyk-bot']
    # Only auto-merge labeled Dependabot or Snyk PRs. No pull-request code is checked out or executed.
    steps:
      - name: Approve and merge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67  # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_LABELS: auto-merge
          MERGE_FILTER_AUTHOR: ${{ matrix.author }}
          # Only merge after all branch-protection checks have passed.
          MERGE_REQUIRED_APPROVALS: '0'
          MERGE_RETRY_SLEEP: '60000'
          MERGE_RETRIES: '5'
