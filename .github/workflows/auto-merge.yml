name: Auto Merge Safe PRs (archived manual lane)

# Automatic merging is intentionally disabled. Enable GitHub's native
# repository auto-merge on an individual reviewed PR instead of running a
# repository-wide workflow on every pull-request event.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Explain canonical merge policy
    runs-on: ubuntu-latest
    steps:
      - name: Merge policy
        run: |
          echo "Repository-wide automatic merging is disabled."
          echo "Use GitHub native auto-merge only after required checks and review policy pass."
          echo "Do not add pull_request or check_suite triggers to this workflow."
