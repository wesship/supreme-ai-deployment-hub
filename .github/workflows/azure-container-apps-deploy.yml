name: Azure Container Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      deploy_region:
        description: 'Azure region for deployment'
        required: true
        default: 'eastus'
        type: choice
        options:
          - eastus
          - westus2
          - westeurope
          - southeastasia

permissions:
  contents: read

jobs:
  manual-azure-deploy:
    name: Manual Azure deployment placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stabilization notice
        run: |
          echo "Azure Container Apps deploy is manual-only during CI stabilization."
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Region: ${{ github.event.inputs.deploy_region }}"
          echo "Use the AWS/Vercel staging path as the production stabilization lane."

      - name: Summary
        run: |
          echo "### Azure Container Apps CI/CD" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual-only during stabilization." >> "$GITHUB_STEP_SUMMARY"
          echo "Target environment: ${{ github.event.inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Target region: ${{ github.event.inputs.deploy_region }}" >> "$GITHUB_STEP_SUMMARY"
