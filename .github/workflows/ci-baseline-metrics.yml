name: CI Baseline Metrics

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect-metrics:
    name: Collect CI Health Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and measure install time
        id: install-time
        run: |
          START=$(date +%s)
          pnpm install --frozen-lockfile 2>&1 | tail -5
          END=$(date +%s)
          DURATION=$((END - START))
          echo "install_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "pnpm install --frozen-lockfile completed in ${DURATION}s"

      - name: Measure build time
        id: build-time
        run: |
          START=$(date +%s)
          npm run build 2>&1 | tail -10 || true
          END=$(date +%s)
          DURATION=$((END - START))
          echo "build_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "Build completed in ${DURATION}s"

      - name: Count test files and estimate coverage
        id: test-metrics
        run: |
          TEST_COUNT=$(find . -name "*.test.*" -o -name "*.spec.*" | grep -v node_modules | wc -l)
          SRC_COUNT=$(find src -name "*.ts" -o -name "*.tsx" 2>/dev/null | grep -v node_modules | wc -l || echo 0)
          echo "test_count=${TEST_COUNT}" >> $GITHUB_OUTPUT
          echo "src_count=${SRC_COUNT}" >> $GITHUB_OUTPUT
          echo "Test files: $TEST_COUNT, Source files: $SRC_COUNT"

      - name: Measure bundle size
        id: bundle-size
        run: |
          if [ -d dist ]; then
            BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
            echo "bundle_size_kb=${BUNDLE_SIZE}" >> $GITHUB_OUTPUT
            echo "Bundle size: ${BUNDLE_SIZE}KB"
          else
            echo "bundle_size_kb=0" >> $GITHUB_OUTPUT
            echo "No dist directory found"
          fi

      - name: Count workflows and check health
        id: workflow-metrics
        run: |
          TOTAL=$(ls .github/workflows/*.yml 2>/dev/null | wc -l)
          YAML_ERRORS=$(python3 -c "
          import yaml, glob, sys
          errors = 0
          for wf in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(wf).read())
              except:
                  errors += 1
          print(errors)
          ")
          echo "workflow_count=${TOTAL}" >> $GITHUB_OUTPUT
          echo "yaml_errors=${YAML_ERRORS}" >> $GITHUB_OUTPUT
          echo "Workflows: $TOTAL, YAML errors: $YAML_ERRORS"

      - name: Check dependency health
        id: dep-health
        run: |
          VULN_COUNT=$(npm audit --json 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              meta = d.get('metadata', {})
              vulns = meta.get('vulnerabilities', {})
              print(sum(vulns.values()))
          except:
              print(0)
          " 2>/dev/null || echo "0")
          echo "vuln_count=${VULN_COUNT}" >> $GITHUB_OUTPUT
          echo "Vulnerabilities: $VULN_COUNT"

      - name: Generate metrics report
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT="${{ github.sha }}"

          cat > /tmp/ci-metrics.json << METRICS_EOF
          {
            "timestamp": "${TIMESTAMP}",
            "commit": "${COMMIT}",
            "branch": "${{ github.ref_name }}",
            "metrics": {
              "install_time_seconds": ${{ steps.install-time.outputs.install_duration }},
              "build_time_seconds": ${{ steps.build-time.outputs.build_duration }},
              "test_file_count": ${{ steps.test-metrics.outputs.test_count }},
              "source_file_count": ${{ steps.test-metrics.outputs.src_count }},
              "bundle_size_kb": ${{ steps.bundle-size.outputs.bundle_size_kb }},
              "workflow_count": ${{ steps.workflow-metrics.outputs.workflow_count }},
              "yaml_errors": ${{ steps.workflow-metrics.outputs.yaml_errors }},
              "vulnerability_count": ${{ steps.dep-health.outputs.vuln_count }}
            },
            "slo_status": {
              "install_time_ok": ${{ steps.install-time.outputs.install_duration < 120 }},
              "build_time_ok": ${{ steps.build-time.outputs.build_duration < 300 }},
              "zero_yaml_errors": ${{ steps.workflow-metrics.outputs.yaml_errors == 0 }},
              "zero_vulns": ${{ steps.dep-health.outputs.vuln_count == 0 }}
            }
          }
          METRICS_EOF

          echo "=== CI Baseline Metrics Report ==="
          cat /tmp/ci-metrics.json | python3 -m json.tool

          # SLO breach detection
          BREACHES=0
          if [ "${{ steps.install-time.outputs.install_duration }}" -gt 120 ]; then
            echo "::warning::SLO BREACH: pnpm install --frozen-lockfile took ${{ steps.install-time.outputs.install_duration }}s (threshold: 120s)"
            BREACHES=$((BREACHES + 1))
          fi
          if [ "${{ steps.workflow-metrics.outputs.yaml_errors }}" -gt 0 ]; then
            echo "::error::SLO BREACH: ${{ steps.workflow-metrics.outputs.yaml_errors }} YAML error(s) in workflows"
            BREACHES=$((BREACHES + 1))
          fi
          if [ "${{ steps.dep-health.outputs.vuln_count }}" -gt 0 ]; then
            echo "::warning::SLO BREACH: ${{ steps.dep-health.outputs.vuln_count }} vulnerability(ies) detected"
            BREACHES=$((BREACHES + 1))
          fi

          echo ""
          echo "Total SLO breaches: $BREACHES"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-metrics-${{ github.sha }}
          path: /tmp/ci-metrics.json
          retention-days: 90
