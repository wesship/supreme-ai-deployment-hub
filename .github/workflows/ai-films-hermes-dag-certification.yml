name: AI Films Hermes DAG Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/ai_films/film_node_contracts.py
      - backend/ai_films/hermes_film_dag.py
      - backend/ai_films/shot_dag_compiler.py
      - backend/ai_films/hermes_workflow_adapter.py
      - backend/ai_films/hermes_film_runtime.py
      - backend/ai_films/hermes_task_event_bridge.py
      - backend/tests/test_ai_films_event_advancement.py
      - .github/workflows/ai-films-hermes-dag-certification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-films-hermes-dag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify event-driven film DAG advancement
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Syntax-check AI Films and Hermes workflow modules
        run: >-
          python -m compileall -q
          backend/ai_films
          backend/hermes/workflows

      - name: Run AI Films event advancement certification
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: python -m pytest backend/tests/test_ai_films_event_advancement.py -q
