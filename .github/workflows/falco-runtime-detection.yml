name: Falco Runtime Behavioral Detection

on:
  push:
    branches: [main]
    paths:
      - 'policy/falco/**'
      - 'Dockerfile*'
  pull_request:
    branches: [main]
    paths:
      - 'policy/falco/**'
      - 'Dockerfile*'
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: falco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Falco Rules Validation ────────────────────────────────────────────────
  validate-falco-rules:
    name: Validate Falco Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Falco (for rule validation)
        run: |
          # Add Falco repository
          curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] \
            https://download.falco.org/packages/deb stable main" | \
            sudo tee -a /etc/apt/sources.list.d/falcosecurity.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends falco 2>/dev/null || \
            echo "Falco package install attempted (kernel module may not load in CI)"

      - name: Validate Falco rules syntax with falcoctl
        run: |
          # Install falcoctl for rule validation without kernel module
          VERSION="0.11.0"
          curl -sLo falcoctl.tar.gz \
            "https://github.com/falcosecurity/falcoctl/releases/download/v${VERSION}/falcoctl_${VERSION}_linux_amd64.tar.gz"
          tar xzf falcoctl.tar.gz falcoctl
          sudo mv falcoctl /usr/local/bin/
          falcoctl version

      - name: Lint Falco rules with Python validator
        run: |
          python3 - <<'PYEOF'
          import yaml, sys, os

          rules_file = "policy/falco/devonn-rules.yaml"
          
          with open(rules_file) as f:
              content = f.read()
          
          # Parse YAML
          try:
              docs = list(yaml.safe_load_all(content))
              print(f"YAML parse: OK ({len(docs)} documents)")
          except Exception as e:
              print(f"YAML parse error: {e}")
              sys.exit(1)
          
          # Validate rule structure
          rules = [d for d in docs if d and d.get('rule')]
          macros = [d for d in docs if d and d.get('macro')]
          
          print(f"Rules: {len(rules)}")
          print(f"Macros: {len(macros)}")
          
          required_fields = ['rule', 'desc', 'condition', 'output', 'priority']
          errors = []
          
          for rule in rules:
              for field in required_fields:
                  if field not in rule:
                      errors.append(f"Rule '{rule.get('rule', 'unknown')}' missing field: {field}")
              
              # Validate priority is a known Falco level
              valid_priorities = ['EMERGENCY', 'ALERT', 'CRITICAL', 'ERROR', 'WARNING', 'NOTICE', 'INFO', 'DEBUG']
              if rule.get('priority') not in valid_priorities:
                  errors.append(f"Rule '{rule.get('rule')}' has invalid priority: {rule.get('priority')}")
          
          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)
          
          print("\nAll Falco rules are structurally valid")
          print("\nRule summary:")
          for rule in rules:
              print(f"  [{rule['priority']:10}] {rule['rule']}")
          PYEOF

      - name: Check rule coverage for critical threat categories
        run: |
          python3 - <<'PYEOF'
          import yaml

          with open("policy/falco/devonn-rules.yaml") as f:
              docs = list(yaml.safe_load_all(f.read()))
          
          rules = [d for d in docs if d and d.get('rule')]
          all_tags = set()
          for r in rules:
              all_tags.update(r.get('tags', []))
          
          required_categories = {
              'shell': 'Shell/RCE detection',
              'privilege-escalation': 'Privilege escalation',
              'network': 'Network anomaly / exfiltration',
              'credentials': 'Credential theft',
              'escape': 'Container escape',
          }
          
          missing = []
          for tag, desc in required_categories.items():
              if tag in all_tags:
                  print(f"COVERED: {desc} ({tag})")
              else:
                  missing.append(f"{desc} ({tag})")
                  print(f"MISSING: {desc} ({tag})")
          
          if missing:
              print(f"\nWarning: {len(missing)} threat categories not covered")
          else:
              print(f"\nAll {len(required_categories)} critical threat categories are covered")
          PYEOF

      - name: Upload Falco rules artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: falco-rules-${{ github.run_id }}
          path: policy/falco/
          retention-days: 30

  # ── Falco Deployment Configuration ───────────────────────────────────────
  falco-deploy-config:
    name: Generate Falco Deployment Config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate Falco Helm values for Kubernetes deployment
        run: |
          mkdir -p /tmp/falco-deploy
          cat > /tmp/falco-deploy/falco-values.yaml << 'EOF'
          # Falco Helm values for Devonn.AI platform
          # Deploy with: helm install falco falcosecurity/falco -f falco-values.yaml

          # Use eBPF probe (preferred over kernel module for modern kernels)
          driver:
            kind: ebpf

          # Custom rules
          customRules:
            devonn-rules.yaml: |
              # Rules loaded from policy/falco/devonn-rules.yaml

          # Alert output configuration
          falco:
            grpc:
              enabled: true
            grpcOutput:
              enabled: true
            jsonOutput: true
            jsonIncludeOutputProperty: true
            logLevel: info
            priority: warning

          # Falcosidekick for alert routing
          falcosidekick:
            enabled: true
            config:
              slack:
                webhookurl: ""  # Set via Kubernetes secret
                minimumpriority: error
              webhook:
                address: ""     # Set to your alerting endpoint
                minimumpriority: warning
          EOF
          
          cat /tmp/falco-deploy/falco-values.yaml
          echo "Falco Helm values generated"

      - name: Generate Falco Kubernetes DaemonSet manifest
        run: |
          cat > /tmp/falco-deploy/falco-daemonset.yaml << 'EOF'
          # Falco DaemonSet for Devonn.AI platform
          # Runs Falco on every node to monitor container behavior
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: falco
            namespace: falco-system
            labels:
              app: falco
              platform: devonn-ai
          spec:
            selector:
              matchLabels:
                app: falco
            template:
              metadata:
                labels:
                  app: falco
              spec:
                serviceAccountName: falco
                hostNetwork: true
                hostPID: true
                tolerations:
                  - effect: NoSchedule
                    key: node-role.kubernetes.io/control-plane
                containers:
                  - name: falco
                    image: falcosecurity/falco-no-driver:0.39.2
                    securityContext:
                      privileged: true
                    volumeMounts:
                      - name: falco-rules
                        mountPath: /etc/falco/rules.d
                      - name: proc
                        mountPath: /host/proc
                        readOnly: true
                      - name: boot
                        mountPath: /host/boot
                        readOnly: true
                    env:
                      - name: FALCO_GRPC_ENABLED
                        value: "true"
                      - name: FALCO_JSON_OUTPUT
                        value: "true"
                volumes:
                  - name: falco-rules
                    configMap:
                      name: devonn-falco-rules
                  - name: proc
                    hostPath:
                      path: /proc
                  - name: boot
                    hostPath:
                      path: /boot
          EOF
          echo "Falco DaemonSet manifest generated"

      - name: Upload Falco deployment config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: falco-deploy-config-${{ github.run_id }}
          path: /tmp/falco-deploy/
          retention-days: 30
