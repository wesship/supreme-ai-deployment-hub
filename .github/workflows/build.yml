name: CI - Hardened Build Pipeline

# Comprehensive build validation retained for explicit use. Ordinary pull
# requests are validated by required-pr-gate.yml to avoid duplicate installs,
# tests, coverage generation, and builds.
on:
  workflow_dispatch:

concurrency:
  group: hardened-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: git diff --exit-code pnpm-lock.yaml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint src --ext .ts,.tsx,.js,.jsx --no-error-on-unmatched-pattern --quiet

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardened-build-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardened-build-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run backend tests
        run: |
          if [ -d backend/tests ]; then
            pytest backend/tests -v
          elif [ -d tests ]; then
            pytest tests -v
          else
            echo "No Python test directory found."
          fi
