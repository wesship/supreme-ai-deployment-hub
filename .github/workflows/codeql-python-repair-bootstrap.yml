name: One-shot CodeQL Python Repair Bootstrap

on:
  push:
    branches:
      - security/enforce-codeql-sarif
    paths:
      - '.github/workflows/codeql-python-repair-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/enforce-codeql-sarif
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Apply exact CodeQL repairs
        run: python scripts/apply_codeql_python_repairs.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/final_voice_activation.py \
            scripts/security_audit.py \
            backend/ai_films/assembly_worker.py \
            backend/railway_app.py \
            backend/tests/test_ai_film_drive_picker.py \
            backend/tests/test_cors_config.py \
            src/main.py \
            backend/app/routers/tools.py \
            backend/app/routers/chat.py \
            backend/intelligence/workflows/engine.py \
            backend/intelligence/memory/memory.py \
            backend/intelligence/orchestration/orchestrator.py \
            backend/app/routers/proxy_vault.py \
            backend/app/routers/rag.py \
            backend/hermes/task_engine.py \
            backend/app/routers/voice_orchestration.py
          git commit -m "fix(security): repair Python CodeQL high-severity findings"
          git push origin HEAD:security/enforce-codeql-sarif
