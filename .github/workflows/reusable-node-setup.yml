name: Reusable Node.js Setup

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      run-install:
        description: 'Whether to run pnpm install --frozen-lockfile'
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for pnpm commands'
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  setup:
    name: Setup Node.js ${{ inputs.node-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ inputs.node-version }}-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ inputs.node-version }}-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ inputs.run-install }}
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        if: ${{ inputs.run-install }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          git diff --exit-code pnpm-lock.yaml || (
            echo "::error::pnpm-lock.yaml drift detected" && exit 1
          )
