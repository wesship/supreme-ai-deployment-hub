name: Reusable Node.js Setup

# Reusable workflow for consistent Node.js setup with dependency caching.
# Call this from other workflows to avoid duplicating setup logic.
#
# Usage:
#   jobs:
#     my-job:
#       uses: ./.github/workflows/reusable-node-setup.yml
#       with:
#         node-version: '22'
#         run-install: true

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      run-install:
        description: 'Whether to run pnpm install --frozen-lockfile'
        type: boolean
        default: true
      working-directory:
        description: 'Working directory for npm commands'
        type: string
        default: '.'
    outputs:
      cache-hit:
        description: 'Whether the npm cache was hit'
        value: ${{ jobs.setup.outputs.cache-hit }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup Node.js ${{ inputs.node-version }}
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js ${{ inputs.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Cache node_modules
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ~/.npm
          key: node-${{ inputs.node-version }}-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-${{ inputs.node-version }}-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ inputs.run-install && steps.cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ inputs.working-directory }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
        with:
          version: 9

        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity (no drift)
        if: ${{ inputs.run-install }}
        working-directory: ${{ inputs.working-directory }}
        run: git diff --exit-code package-lock.json || (echo "::error::package-lock.json drifted" && exit 1)
