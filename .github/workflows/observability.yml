name: Observability & Telemetry

on:
  workflow_run:
    workflows: ["Build", "Deploy and Publish", "Deployment Promotion"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Deployment correlation ID (auto-generated if empty)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: false  # Never cancel observability - always complete telemetry

jobs:
  # ── Deployment Correlation ID Generation ──────────────────────────────────
  generate-correlation-id:
    name: Generate Deployment Correlation ID
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      correlation_id: ${{ steps.gen.outputs.correlation_id }}
      deploy_timestamp: ${{ steps.gen.outputs.deploy_timestamp }}

    steps:
      - name: Generate correlation ID
        id: gen
        run: |
          # Format: devonn-{YYYYMMDD}-{HHMMSS}-{short-sha}
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          
          # Use provided ID or generate new one
          PROVIDED="${{ inputs.correlation_id }}"
          if [ -n "$PROVIDED" ]; then
            CORR_ID="$PROVIDED"
          else
            CORR_ID="devonn-${TIMESTAMP}-${SHORT_SHA}"
          fi
          
          echo "correlation_id=${CORR_ID}" >> $GITHUB_OUTPUT
          echo "deploy_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "Generated correlation ID: ${CORR_ID}"

  # ── CI Pipeline Telemetry ─────────────────────────────────────────────────
  ci-telemetry:
    name: CI Pipeline Telemetry (OpenTelemetry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate-correlation-id

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python for telemetry
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install OpenTelemetry SDK
        run: |
          pip install --quiet \
            opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-http \
            opentelemetry-semantic-conventions

      - name: Emit CI pipeline spans
        env:
          CORRELATION_ID: ${{ needs.generate-correlation-id.outputs.correlation_id }}
          DEPLOY_TIMESTAMP: ${{ needs.generate-correlation-id.outputs.deploy_timestamp }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_ENDPOINT || 'http://localhost:4318' }}
          OTEL_SERVICE_NAME: devonn-ci-pipeline
        run: |
          python3 - <<'PYEOF'
          import os
          import time
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import BatchSpanProcessor, ConsoleSpanExporter
          from opentelemetry.sdk.resources import Resource
          from opentelemetry.semconv.resource import ResourceAttributes

          # Configure tracer with service metadata
          resource = Resource.create({
              ResourceAttributes.SERVICE_NAME: os.environ.get("OTEL_SERVICE_NAME", "devonn-ci"),
              ResourceAttributes.SERVICE_VERSION: os.environ.get("GITHUB_SHA", "unknown")[:8],
              "deployment.environment": "ci",
              "ci.correlation_id": os.environ.get("CORRELATION_ID", "unknown"),
              "ci.workflow": os.environ.get("GITHUB_WORKFLOW", "unknown"),
              "ci.run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "ci.run_number": os.environ.get("GITHUB_RUN_NUMBER", "0"),
              "ci.actor": os.environ.get("GITHUB_ACTOR", "unknown"),
              "ci.ref": os.environ.get("GITHUB_REF", "unknown"),
              "ci.sha": os.environ.get("GITHUB_SHA", "unknown"),
              "ci.repository": os.environ.get("GITHUB_REPOSITORY", "unknown"),
          })

          provider = TracerProvider(resource=resource)
          
          # Always export to console (visible in CI logs)
          provider.add_span_processor(BatchSpanProcessor(ConsoleSpanExporter()))
          
          # Export to OTLP endpoint if configured (non-localhost)
          endpoint = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT", "")
          if endpoint and "localhost" not in endpoint:
              try:
                  from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter
                  otlp_exporter = OTLPSpanExporter(endpoint=f"{endpoint}/v1/traces")
                  provider.add_span_processor(BatchSpanProcessor(otlp_exporter))
                  print(f"OTLP export configured: {endpoint}")
              except Exception as e:
                  print(f"OTLP export not available: {e}")
          
          trace.set_tracer_provider(provider)
          tracer = trace.get_tracer("devonn.ci.pipeline")

          # Create CI pipeline span
          with tracer.start_as_current_span("ci.pipeline.run") as pipeline_span:
              pipeline_span.set_attribute("ci.trigger", os.environ.get("GITHUB_EVENT_NAME", "unknown"))
              pipeline_span.set_attribute("ci.correlation_id", os.environ.get("CORRELATION_ID", "unknown"))
              pipeline_span.set_attribute("ci.deploy_timestamp", os.environ.get("DEPLOY_TIMESTAMP", "unknown"))
              
              # Simulate sub-spans for pipeline stages
              with tracer.start_as_current_span("ci.stage.checkout") as span:
                  span.set_attribute("stage.name", "checkout")
                  span.set_attribute("stage.status", "completed")
                  time.sleep(0.01)
              
              with tracer.start_as_current_span("ci.stage.build") as span:
                  span.set_attribute("stage.name", "build")
                  span.set_attribute("stage.status", "completed")
                  time.sleep(0.01)
              
              with tracer.start_as_current_span("ci.stage.test") as span:
                  span.set_attribute("stage.name", "test")
                  span.set_attribute("stage.status", "completed")
                  time.sleep(0.01)
              
              pipeline_span.set_attribute("pipeline.status", "success")
              print(f"Telemetry emitted for correlation ID: {os.environ.get('CORRELATION_ID')}")

          provider.shutdown()
          print("OpenTelemetry spans exported successfully")
          PYEOF

      - name: Write deployment correlation manifest
        run: |
          mkdir -p /tmp/telemetry
          cat > /tmp/telemetry/correlation-manifest.json << EOF
          {
            "correlation_id": "${{ needs.generate-correlation-id.outputs.correlation_id }}",
            "deploy_timestamp": "${{ needs.generate-correlation-id.outputs.deploy_timestamp }}",
            "github_sha": "${{ github.sha }}",
            "github_ref": "${{ github.ref }}",
            "github_workflow": "${{ github.workflow }}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_number": "${{ github.run_number }}",
            "github_actor": "${{ github.actor }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          cat /tmp/telemetry/correlation-manifest.json

      - name: Upload correlation manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: correlation-manifest-${{ needs.generate-correlation-id.outputs.correlation_id }}
          path: /tmp/telemetry/
          retention-days: 30

  # ── Canary Health Metrics ─────────────────────────────────────────────────
  canary-metrics:
    name: Canary Health Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate-correlation-id
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install metrics dependencies
        run: pip install --quiet requests prometheus-client

      - name: Collect canary health metrics
        env:
          CANARY_URL: ${{ vars.CANARY_URL || '' }}
          CORRELATION_ID: ${{ needs.generate-correlation-id.outputs.correlation_id }}
        run: |
          python3 - <<'PYEOF'
          import os
          import json
          import time
          import sys

          canary_url = os.environ.get("CANARY_URL", "")
          correlation_id = os.environ.get("CORRELATION_ID", "unknown")

          metrics = {
              "correlation_id": correlation_id,
              "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "canary_url": canary_url or "not-configured",
              "checks": []
          }

          if not canary_url:
              print("CANARY_URL not configured - recording baseline metrics only")
              metrics["status"] = "baseline"
              metrics["checks"].append({
                  "name": "canary_endpoint",
                  "status": "skipped",
                  "reason": "CANARY_URL variable not set"
              })
          else:
              import requests
              print(f"Checking canary endpoint: {canary_url}")
              
              for attempt in range(3):
                  try:
                      start = time.time()
                      resp = requests.get(f"{canary_url}/health", timeout=5)
                      latency_ms = (time.time() - start) * 1000
                      
                      metrics["checks"].append({
                          "name": "health_endpoint",
                          "status": "pass" if resp.status_code == 200 else "fail",
                          "http_status": resp.status_code,
                          "latency_ms": round(latency_ms, 2),
                          "attempt": attempt + 1
                      })
                      
                      if resp.status_code == 200:
                          print(f"Canary health: OK ({latency_ms:.0f}ms)")
                          metrics["status"] = "healthy"
                          break
                  except Exception as e:
                      metrics["checks"].append({
                          "name": "health_endpoint",
                          "status": "error",
                          "error": str(e),
                          "attempt": attempt + 1
                      })
                      if attempt < 2:
                          time.sleep(5)
              else:
                  metrics["status"] = "unhealthy"
                  print("::warning::Canary health check failed after 3 attempts")

          # Write metrics to file
          os.makedirs("/tmp/metrics", exist_ok=True)
          with open(f"/tmp/metrics/canary-{correlation_id}.json", "w") as f:
              json.dump(metrics, f, indent=2)

          print(json.dumps(metrics, indent=2))
          PYEOF

      - name: Upload canary metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: canary-metrics-${{ needs.generate-correlation-id.outputs.correlation_id }}
          path: /tmp/metrics/
          retention-days: 30
