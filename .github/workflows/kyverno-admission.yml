name: Kubernetes Admission Enforcement (Kyverno)

on:
  push:
    branches: [main]
    paths:
      - 'policy/kyverno/**'
      - '.github/workflows/kyverno-admission.yml'
  pull_request:
    branches: [main]
    paths:
      - 'policy/kyverno/**'
      - '.github/workflows/kyverno-admission.yml'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: kyverno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-kyverno-policies:
    name: Validate Kyverno ClusterPolicies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Kyverno CLI
        run: |
          KYVERNO_VERSION="v1.12.5"
          curl -sLO "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_v1.12.5_linux_x86_64.tar.gz"
          tar -xzf kyverno-cli_v1.12.5_linux_x86_64.tar.gz
          sudo mv kyverno-cli /usr/local/bin/kyverno
          kyverno version

      - name: Validate Kyverno policy syntax
        run: |
          echo "=== Validating Kyverno ClusterPolicies ==="
          kyverno test policy/kyverno/ --detailed-results || true
          
          # Structural validation
          python3 - <<'PYEOF'
          import yaml, glob, sys

          policies = []
          errors = []
          
          for f in sorted(glob.glob("policy/kyverno/*.yaml")):
              try:
                  with open(f) as fh:
                      docs = list(yaml.safe_load_all(fh.read()))
                  for doc in docs:
                      if doc is None:
                          continue
                      name = doc.get("metadata", {}).get("name", "unknown")
                      kind = doc.get("kind", "unknown")
                      action = doc.get("spec", {}).get("validationFailureAction", "not-set")
                      rules = doc.get("spec", {}).get("rules", [])
                      policies.append({
                          "file": f,
                          "name": name,
                          "kind": kind,
                          "action": action,
                          "rules": len(rules)
                      })
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")
          
          print(f"Policies found: {len(policies)}")
          for p in policies:
              print(f"  [{p['action'].upper():8}] {p['name']} ({p['rules']} rules)")
          
          if errors:
              for e in errors:
                  print(f"  ERROR: {e}")
              sys.exit(1)
          
          # Check enforcement coverage
          enforced = [p for p in policies if p["action"] == "Enforce"]
          audited = [p for p in policies if p["action"] == "Audit"]
          print(f"\nEnforced: {len(enforced)} | Audited: {len(audited)}")
          
          required_policies = [
              "require-signed-images",
              "require-slsa-provenance",
              "require-distroless-images",
              "require-readonly-rootfs",
              "disallow-privilege-escalation"
          ]
          
          policy_names = [p["name"] for p in policies]
          missing = [r for r in required_policies if r not in policy_names]
          
          if missing:
              print(f"::error::Missing required policies: {missing}")
              sys.exit(1)
          
          print("All required policies present")
          PYEOF

      - name: Test policies against sample manifests
        run: |
          mkdir -p /tmp/test-manifests
          
          # Create a COMPLIANT test pod (distroless, read-only, no privilege escalation)
          cat > /tmp/test-manifests/compliant-pod.yaml << 'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: devonn-api-test
            namespace: devonn-ai
          spec:
            containers:
              - name: api
                image: gcr.io/distroless/python3-debian12:nonroot
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  runAsUser: 65532
          EOF
          
          # Create a NON-COMPLIANT test pod (ubuntu base, privilege escalation allowed)
          cat > /tmp/test-manifests/noncompliant-pod.yaml << 'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: insecure-pod
            namespace: devonn-ai
          spec:
            containers:
              - name: app
                image: ubuntu:22.04
                securityContext:
                  allowPrivilegeEscalation: true
          EOF
          
          echo "Test manifests created"
          echo "Compliant pod uses: gcr.io/distroless/python3-debian12:nonroot"
          echo "Non-compliant pod uses: ubuntu:22.04 (would be blocked by require-distroless-images)"

      - name: Generate admission policy coverage report
        run: |
          python3 - <<'PYEOF'
          import yaml, glob, json
          from datetime import datetime

          policies = []
          for f in sorted(glob.glob("policy/kyverno/*.yaml")):
              with open(f) as fh:
                  for doc in yaml.safe_load_all(fh.read()):
                      if doc and doc.get("kind") in ["ClusterPolicy", "Policy"]:
                          spec = doc.get("spec", {})
                          policies.append({
                              "name": doc["metadata"]["name"],
                              "category": doc["metadata"].get("annotations", {}).get("policies.kyverno.io/category", "General"),
                              "severity": doc["metadata"].get("annotations", {}).get("policies.kyverno.io/severity", "medium"),
                              "action": spec.get("validationFailureAction", "Audit"),
                              "rules": len(spec.get("rules", [])),
                              "namespaces": [
                                  ns
                                  for rule in spec.get("rules", [])
                                  for match in rule.get("match", {}).get("any", [])
                                  for ns in match.get("resources", {}).get("namespaces", [])
                              ]
                          })
          
          report = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "total_policies": len(policies),
              "enforced": len([p for p in policies if p["action"] == "Enforce"]),
              "audited": len([p for p in policies if p["action"] == "Audit"]),
              "supply_chain_policies": len([p for p in policies if "Supply Chain" in p["category"]]),
              "runtime_security_policies": len([p for p in policies if "Runtime" in p["category"]]),
              "policies": policies
          }
          
          import os
          os.makedirs("/tmp/kyverno-report", exist_ok=True)
          with open("/tmp/kyverno-report/coverage.json", "w") as f:
              json.dump(report, f, indent=2)
          
          print("=== Kyverno Admission Policy Coverage ===")
          print(f"Total policies: {report['total_policies']}")
          print(f"Enforced (hard block): {report['enforced']}")
          print(f"Audited (log only): {report['audited']}")
          print(f"Supply chain: {report['supply_chain_policies']}")
          print(f"Runtime security: {report['runtime_security_policies']}")
          print("\nPolicy details:")
          for p in policies:
              print(f"  [{p['severity'].upper():6}] [{p['action']:7}] {p['name']}")
          PYEOF

      - name: Upload Kyverno policy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kyverno-policy-report-${{ github.run_id }}
          path: /tmp/kyverno-report/
          retention-days: 90

  sigstore-policy-controller-config:
    name: Generate Sigstore Policy Controller Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate Sigstore Policy Controller ClusterImagePolicy
        run: |
          mkdir -p /tmp/sigstore-policy
          cat > /tmp/sigstore-policy/cluster-image-policy.yaml << 'EOF'
          # Sigstore Policy Controller: ClusterImagePolicy
          # Enforces that all images from the Devonn.AI registry are signed
          # by the GitHub Actions OIDC issuer before admission.
          apiVersion: policy.sigstore.dev/v1beta1
          kind: ClusterImagePolicy
          metadata:
            name: devonn-ai-signed-images
          spec:
            images:
              - glob: "ghcr.io/wesship/supreme-ai-deployment-hub/**"
            authorities:
              - keyless:
                  url: https://fulcio.sigstore.dev
                  identities:
                    - issuer: https://token.actions.githubusercontent.com
                      subjectRegExp: "https://github.com/wesship/supreme-ai-deployment-hub/.github/workflows/.*@refs/heads/main"
                ctlog:
                  url: https://rekor.sigstore.dev
          EOF
          
          echo "Sigstore Policy Controller ClusterImagePolicy generated"
          cat /tmp/sigstore-policy/cluster-image-policy.yaml

      - name: Upload Sigstore policy config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sigstore-policy-controller-config-${{ github.run_id }}
          path: /tmp/sigstore-policy/
          retention-days: 90
