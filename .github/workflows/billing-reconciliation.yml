name: Billing Reconciliation Audit (Manual Only)

on:
  workflow_dispatch:
    inputs:
      period:
        description: Reconciliation period label
        required: false
        default: monthly
        type: choice
        options:
          - weekly
          - monthly
      alert_threshold_pct:
        description: Simulation threshold percentage
        required: false
        default: '10'
      acknowledge_simulation:
        description: Confirm that this workflow uses sample data only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: billing-reconciliation-manual
  cancel-in-progress: true

jobs:
  simulation-notice:
    name: Billing Simulation Notice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify simulation acknowledgement
        env:
          ACKNOWLEDGED: ${{ github.event.inputs.acknowledge_simulation }}
        run: |
          if [ "$ACKNOWLEDGED" != "true" ]; then
            echo "This workflow does not read live provider billing data."
            echo "Re-run it and acknowledge that all values are simulated."
            exit 1
          fi

      - name: Generate sample reconciliation report
        env:
          PERIOD: ${{ github.event.inputs.period }}
          ALERT_THRESHOLD_PCT: ${{ github.event.inputs.alert_threshold_pct }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          threshold = float(os.environ.get("ALERT_THRESHOLD_PCT", "10"))
          period = os.environ.get("PERIOD", "monthly")

          sample_items = {
              "OpenAI API": {"budget": 120.00, "actual": 134.20},
              "ElevenLabs Voice": {"budget": 60.00, "actual": 67.80},
              "GitHub Actions": {"budget": 30.00, "actual": 22.40},
              "Supabase": {"budget": 25.00, "actual": 25.00},
          }

          alerts = []
          for name, values in sample_items.items():
              variance_pct = ((values["actual"] - values["budget"]) / values["budget"]) * 100
              if variance_pct > threshold:
                  alerts.append({
                      "item": name,
                      "budget": values["budget"],
                      "actual": values["actual"],
                      "variance_pct": round(variance_pct, 1),
                  })

          report = {
              "mode": "simulation",
              "warning": "This report contains sample values and is not sourced from live provider billing APIs.",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "period": period,
              "threshold_pct": threshold,
              "sample_items": sample_items,
              "alerts": alerts,
          }

          with open("billing-reconciliation-simulation.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)

          print(report["warning"])
          print(json.dumps(report, indent=2))
          PYEOF

      - name: Upload simulation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: billing-reconciliation-simulation-${{ github.run_id }}
          path: billing-reconciliation-simulation.json
          retention-days: 30
