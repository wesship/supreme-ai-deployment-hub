name: Stale PR Cleanup

# Automatically marks bot-generated Draft PRs as stale after 7 days
# and closes them after 14 days if no activity.
# This prevents the current backlog of 29 open PRs from growing indefinitely.

on:
  schedule:
    # Run every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: stale-cleanup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stale:
    name: Mark and Close Stale PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Mark stale bot PRs
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Only target PRs (not issues)
          only-pr-labels: ''
          days-before-issue-stale: -1    # never stale issues
          days-before-issue-close: -1    # never close issues

          # PRs: stale after 7 days, closed after 14 days of inactivity
          days-before-pr-stale: 7
          days-before-pr-close: 7        # 7 more days after stale = 14 days total

          stale-pr-label: 'stale'
          close-pr-label: 'auto-closed'

          stale-pr-message: |
            This pull request has been automatically marked as **stale** because it
            has had no activity for 7 days. It will be closed in 7 more days unless
            it is updated or the `stale` label is removed.

            If this PR is still relevant, please:
            - Rebase it on `main`
            - Add a comment explaining the current status
            - Remove the `stale` label

          close-pr-message: |
            This pull request has been automatically **closed** due to 14 days of
            inactivity. If this fix is still needed, please open a new PR.

          # Only stale PRs from known bots - never stale human PRs
          # Remove this filter if you want all PRs to be subject to staleness
          only-labels: ''
          exempt-pr-labels: 'pinned,security,do-not-close'

          # Limit to 30 operations per run to avoid rate limiting
          operations-per-run: 30
