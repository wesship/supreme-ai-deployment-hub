name: Bundle Size Check

# Tracks JavaScript bundle size on every PR and fails if it exceeds the budget.
# Posts a comment on the PR showing the size diff vs the base branch.
# Prevents accidental bundle bloat from sneaking into production.

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PR branch bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Measure PR bundle size
        id: pr-size
        run: |
          TOTAL=$(find dist/assets -name "*.js" -not -name "*.map" \
            | xargs wc -c | tail -1 | awk '{print $1}')
          TOTAL_KB=$(echo "scale=1; $TOTAL/1024" | bc)
          TOTAL_GZIP=$(find dist/assets -name "*.js" -not -name "*.map" \
            | xargs gzip -c | wc -c)
          TOTAL_GZIP_KB=$(echo "scale=1; $TOTAL_GZIP/1024" | bc)
          echo "total_kb=$TOTAL_KB" >> $GITHUB_OUTPUT
          echo "gzip_kb=$TOTAL_GZIP_KB" >> $GITHUB_OUTPUT
          echo "PR bundle: ${TOTAL_KB}KB raw, ${TOTAL_GZIP_KB}KB gzip"

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-branch

      - name: Build base branch bundle
        working-directory: base-branch
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Measure base bundle size
        id: base-size
        working-directory: base-branch
        run: |
          TOTAL=$(find dist/assets -name "*.js" -not -name "*.map" \
            | xargs wc -c | tail -1 | awk '{print $1}')
          TOTAL_KB=$(echo "scale=1; $TOTAL/1024" | bc)
          TOTAL_GZIP=$(find dist/assets -name "*.js" -not -name "*.map" \
            | xargs gzip -c | wc -c)
          TOTAL_GZIP_KB=$(echo "scale=1; $TOTAL_GZIP/1024" | bc)
          echo "total_kb=$TOTAL_KB" >> $GITHUB_OUTPUT
          echo "gzip_kb=$TOTAL_GZIP_KB" >> $GITHUB_OUTPUT
          echo "Base bundle: ${TOTAL_KB}KB raw, ${TOTAL_GZIP_KB}KB gzip"

      - name: Enforce bundle size budget
        run: |
          PR_KB=${{ steps.pr-size.outputs.gzip_kb }}
          BUDGET_KB=500
          if (( $(echo "$PR_KB > $BUDGET_KB" | bc -l) )); then
            echo "::error::Bundle size ${PR_KB}KB (gzip) exceeds budget of ${BUDGET_KB}KB"
            exit 1
          fi
          echo "Bundle size ${PR_KB}KB is within the ${BUDGET_KB}KB budget."

      - name: Comment bundle size diff on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prKb   = '${{ steps.pr-size.outputs.gzip_kb }}';
            const baseKb = '${{ steps.base-size.outputs.gzip_kb }}';
            const diff   = (parseFloat(prKb) - parseFloat(baseKb)).toFixed(1);
            const sign   = diff > 0 ? '+' : '';
            const emoji  = diff > 10 ? '🔴' : diff > 0 ? '🟡' : '🟢';

            const body = [
              '## Bundle Size Report',
              '',
              `| | Gzip Size |`,
              `|---|---|`,
              `| Base (\`${{ github.base_ref }}\`) | ${baseKb} KB |`,
              `| PR (\`${{ github.head_ref }}\`) | ${prKb} KB |`,
              `| Diff | ${emoji} ${sign}${diff} KB |`,
              '',
              `> Budget: **500 KB** (gzip). ${parseFloat(prKb) <= 500 ? '✅ Within budget.' : '❌ Exceeds budget.'}`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
