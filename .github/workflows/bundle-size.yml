name: Bundle Size Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-size:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Measure bundle size
        run: |
          TOTAL=$(find dist/assets -name "*.js" -not -name "*.map" | xargs wc -c | tail -1 | awk '{print $1}')
          TOTAL_KB=$(echo "scale=1; $TOTAL/1024" | bc)
          echo "Bundle size: ${TOTAL_KB}KB raw"
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle size: ${TOTAL_KB}KB raw" >> "$GITHUB_STEP_SUMMARY"
          echo "- Advisory mode enabled during stabilization." >> "$GITHUB_STEP_SUMMARY"
