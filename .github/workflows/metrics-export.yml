name: Platform Metrics Export (Datadog / Grafana / Prometheus)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: metrics-export
  cancel-in-progress: true

jobs:
  collect-and-export:
    name: Collect Platform Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report workflow inventory
        run: |
          echo "Platform metrics export is manual-only to conserve GitHub Actions minutes."
          echo "Workflow count: $(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)"
          echo "Commit: $GITHUB_SHA"
