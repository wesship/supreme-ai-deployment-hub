name: DORA Metrics Tracking (Manual Only)

on:
  workflow_dispatch:
    inputs:
      period_days:
        description: 'Analysis period in days'
        required: false
        default: '30'

permissions:
  contents: read
  pull-requests: read

jobs:
  dora-status:
    name: DORA metrics status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "DORA metrics reporting is manual-only."
          echo "Analysis period: ${{ github.event.inputs.period_days }} days"
