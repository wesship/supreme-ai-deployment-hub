name: GitOps State Reconciliation

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Reconciliation action'
        required: false
        default: 'detect'
        type: choice
        options: [detect, diff, sync, rollback]

permissions:
  contents: read
  deployments: write

concurrency:
  group: gitops-reconciliation
  cancel-in-progress: true

jobs:
  reconcile-control:
    name: Manual GitOps Reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record requested action
        run: |
          echo "GitOps reconciliation is manual-only because Railway and Vercel are the active production path."
          echo "Requested action: ${{ github.event.inputs.action }}"
