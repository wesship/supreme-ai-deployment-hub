name: Validate Action References

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sha-pins:
    name: Validate Action SHA Pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Detect invalid or dangerous action references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob
          import re
          import sys

          errors = []
          uses_pattern = re.compile(r'^\s*uses:\s*([^\s#]+)', re.MULTILINE)
          full_sha = re.compile(r'^[0-9a-fA-F]{40}$')
          core_actions_requiring_sha = {
              'actions/checkout',
              'actions/setup-node',
              'actions/setup-python',
          }

          for workflow in sorted(glob.glob('.github/workflows/*.{yml,yaml}')):
              with open(workflow, encoding='utf-8') as handle:
                  content = handle.read()

              for match in uses_pattern.finditer(content):
                  reference = match.group(1)
                  if reference.startswith('./') or reference.startswith('docker://'):
                      continue
                  if '@' not in reference:
                      errors.append(f'{workflow}: action reference has no ref: {reference}')
                      continue

                  action, ref = reference.rsplit('@', 1)
                  if ref in {'main', 'master', 'HEAD'}:
                      errors.append(f'{workflow}: mutable branch reference is forbidden: {reference}')
                      continue
                  if re.fullmatch(r'[0-9a-fA-F]{7,39}', ref):
                      errors.append(f'{workflow}: abbreviated SHA is forbidden: {reference}')
                      continue
                  if full_sha.fullmatch(ref) and len(set(ref.lower())) <= 2:
                      errors.append(f'{workflow}: suspicious/fake SHA: {reference}')
                      continue
                  if action in core_actions_requiring_sha and not full_sha.fullmatch(ref):
                      errors.append(
                          f'{workflow}: core bootstrap action must use a full immutable 40-character commit SHA: {reference}'
                      )

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              sys.exit(1)

          print('Action references passed mutable-branch checks and core bootstrap actions are SHA-pinned.')
          PYEOF

      - name: Validate workflow YAML structure
        run: |
          python3 - <<'PYEOF'
          import glob
          import re
          import sys
          import yaml

          expression_pattern = re.compile(r'\$\{\{.*?\}\}', re.DOTALL)
          if_pattern = re.compile(r'^(\s*if:\s*)(.*?)(\s*(?:#.*)?)$', re.MULTILINE)

          def normalize_github_syntax(content):
              content = expression_pattern.sub('GITHUB_EXPRESSION', content)

              def replace_if(match):
                  prefix, value, suffix = match.groups()
                  stripped = value.strip()
                  if not stripped or stripped[0] in {'"', "'"}:
                      return match.group(0)
                  return f'{prefix}"GITHUB_CONDITION"{suffix}'

              return if_pattern.sub(replace_if, content)

          errors = []
          workflow_files = sorted(glob.glob('.github/workflows/*.{yml,yaml}'))
          for workflow in workflow_files:
              try:
                  with open(workflow, encoding='utf-8') as handle:
                      yaml.safe_load(normalize_github_syntax(handle.read()))
              except yaml.YAMLError as error:
                  errors.append(f'{workflow}: {error}')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              sys.exit(1)

          print(f'All {len(workflow_files)} workflow files have valid YAML structure.')
          PYEOF
