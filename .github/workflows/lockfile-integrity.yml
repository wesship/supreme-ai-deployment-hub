name: Lockfile Integrity

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'

permissions:
  contents: read

jobs:
  lockfile-check:
    name: Verify pnpm lockfile integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml has drifted from package.json."
            echo "::error::Run 'pnpm install' locally and commit the updated lockfile."
            git diff --stat pnpm-lock.yaml
            exit 1
          fi
          echo "PNPM lockfile integrity verified."

      - name: Validate dependency tree
        run: |
          pnpm list --depth=0 || {
            echo "::error::Dependency tree validation failed."
            exit 1
          }
