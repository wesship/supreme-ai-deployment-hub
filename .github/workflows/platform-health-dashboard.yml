name: Platform Health Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-health-dashboard
  cancel-in-progress: true

jobs:
  health-dashboard:
    name: Generate Health Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health
        run: |
          set -e
          curl -fsS --max-time 15 https://api.d3vonn.io/health
          echo
          echo "Platform health dashboard is manual-only to conserve GitHub Actions minutes."
