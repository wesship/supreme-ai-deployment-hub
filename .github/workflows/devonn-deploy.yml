name: Devonn Deploy
on:
  push:
    branches: [main]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Build image
        continue-on-error: true
        run: |
          if [ -d "./scaffold/devonn-coordinator" ]; then
            docker build -t devonn-coordinator ./scaffold/devonn-coordinator
          else
            echo "::warning::scaffold/devonn-coordinator not found - skipping build"
          fi
      - name: Push to ECR
        continue-on-error: true
        run: |
          echo "TODO: add ECR push - requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets"
      - name: Trigger Supreme Hub
        continue-on-error: true
        run: |
          curl -X POST http://deploy.devonn.ai/api/v1/deploy \
            -H "Content-Type: application/json" \
            -d '{"service_name":"devonn-coordinator"}' || true
