name: Devonn Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0
      - name: Build image
        continue-on-error: true
        run: |
          if [ -d "./scaffold/devonn-coordinator" ]; then
            docker build -t devonn-coordinator ./scaffold/devonn-coordinator
          else
            echo "::warning::scaffold/devonn-coordinator not found - skipping build"
          fi
      - name: Push to ECR
        continue-on-error: true
        run: |
          echo "TODO: add ECR push - requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets"
      - name: Trigger Supreme Hub
        continue-on-error: true
        run: |
          curl -X POST http://deploy.devonn.ai/api/v1/deploy \
            -H "Content-Type: application/json" \
            -d '{"service_name":"devonn-coordinator"}' || true
