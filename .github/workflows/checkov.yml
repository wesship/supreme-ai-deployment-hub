name: Checkov Infrastructure Security

on:
  push:
    branches: [main]
    paths:
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/checkov.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/checkov.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Terraform configurations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate Checkov JSON report
        uses: bridgecrewio/checkov-action@803f802e15372b44bfa1045780e9427936ab2f5b
        with:
          directory: src/data/manifest/terraform
          framework: terraform
          soft_fail: true
          output_format: json
          output_file_path: checkov-results.json

      - name: Preserve Checkov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkov-results-${{ github.run_id }}
          path: checkov-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Checkov policies
        uses: bridgecrewio/checkov-action@803f802e15372b44bfa1045780e9427936ab2f5b
        with:
          directory: src/data/manifest/terraform
          framework: terraform
          soft_fail: false
          output_format: cli
