name: One-time security lockfile repair

on:
  push:
    branches:
      - dependabot/npm_and_yarn/vitest-ecosystem-a9b49fbdc9
    paths:
      - '.github/workflows/one-time-security-lockfile-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dependabot/npm_and_yarn/vitest-ecosystem-a9b49fbdc9
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Apply secure overrides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          delete pkg.pnpm.overrides['brace-expansion@>=2.0.0'];
          delete pkg.pnpm.overrides['brace-expansion@<2.0.0'];
          pkg.pnpm.overrides['brace-expansion'] = '5.0.8';
          pkg.pnpm.overrides['sharp'] = '0.35.0';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Remove one-time workflow and commit repair
        run: |
          rm .github/workflows/one-time-security-lockfile-repair.yml
          git config user.name 'd3vonn-security-bot'
          git config user.email '37167955+wesship@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/one-time-security-lockfile-repair.yml
          git commit -m 'fix(security): update vulnerable transitive dependencies'
          git push origin HEAD:dependabot/npm_and_yarn/vitest-ecosystem-a9b49fbdc9
