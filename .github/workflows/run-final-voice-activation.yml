name: Run Final Voice Activation

on:
  pull_request:
    paths:
      - .github/voice-activation.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-final-voice-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Activate and certify production voice
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VAPI_PRIVATE_KEY_PRIMARY: ${{ secrets.VAPI_PRIVATE_KEY }}
      VAPI_PRIVATE_KEY_FALLBACK: ${{ secrets.VAPI_API_KEY }}
      VAPI_WEBHOOK_SECRET_INPUT: ${{ secrets.VAPI_WEBHOOK_SECRET }}
      VAPI_ASSISTANT_ID_SECRET: ${{ secrets.VAPI_ASSISTANT_ID }}
      VAPI_ASSISTANT_ID_VAR: ${{ vars.VAPI_ASSISTANT_ID }}
      ELEVENLABS_API_KEY_INPUT: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID_INPUT: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
      ELEVENLABS_VOICE_ID_INPUT: ${{ secrets.ELEVENLABS_VOICE_ID }}
      RAILWAY_PROJECT_TOKEN_PRIMARY: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_TOKEN_FALLBACK: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_SERVICE_TOKEN_FALLBACK: ${{ secrets.RAILWAY_SERVICE_TOKEN }}
      RAILWAY_API_TOKEN_INPUT: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Check out release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve aliases and mask credentials
        shell: bash
        run: |
          set -euo pipefail
          VAPI_PRIVATE_KEY="${VAPI_PRIVATE_KEY_PRIMARY:-${VAPI_PRIVATE_KEY_FALLBACK:-}}"
          VAPI_ASSISTANT_ID="${VAPI_ASSISTANT_ID_SECRET:-${VAPI_ASSISTANT_ID_VAR:-8491eea7-e385-426b-8cdc-3e2aaf9a4cbf}}"
          VAPI_WEBHOOK_SECRET="${VAPI_WEBHOOK_SECRET_INPUT:-}"
          ELEVENLABS_API_KEY="${ELEVENLABS_API_KEY_INPUT:-}"
          ELEVENLABS_DEFAULT_VOICE_ID="${ELEVENLABS_DEFAULT_VOICE_ID_INPUT:-${ELEVENLABS_VOICE_ID_INPUT:-21m00Tcm4TlvDq8ikWAM}}"
          RAILWAY_TOKEN="${RAILWAY_PROJECT_TOKEN_PRIMARY:-${RAILWAY_PROJECT_TOKEN_FALLBACK:-${RAILWAY_SERVICE_TOKEN_FALLBACK:-}}}"
          RAILWAY_API_TOKEN="${RAILWAY_API_TOKEN_INPUT:-}"

          if [[ -z "$VAPI_WEBHOOK_SECRET" ]]; then
            VAPI_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          fi

          if [[ -n "$RAILWAY_TOKEN" && -n "$RAILWAY_API_TOKEN" ]]; then
            echo "::error::Both RAILWAY_TOKEN and RAILWAY_API_TOKEN are set. Only one may be used."
            exit 1
          fi

          for value in "$VAPI_PRIVATE_KEY" "$VAPI_WEBHOOK_SECRET" "$ELEVENLABS_API_KEY" "$RAILWAY_TOKEN" "$RAILWAY_API_TOKEN"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done

          {
            echo "VAPI_PRIVATE_KEY=$VAPI_PRIVATE_KEY"
            echo "VAPI_ASSISTANT_ID=$VAPI_ASSISTANT_ID"
            echo "VAPI_WEBHOOK_SECRET=$VAPI_WEBHOOK_SECRET"
            echo "ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY"
            echo "ELEVENLABS_DEFAULT_VOICE_ID=$ELEVENLABS_DEFAULT_VOICE_ID"
            if [[ -n "$RAILWAY_TOKEN" ]]; then
              echo "RAILWAY_TOKEN=$RAILWAY_TOKEN"
            elif [[ -n "$RAILWAY_API_TOKEN" ]]; then
              echo "RAILWAY_API_TOKEN=$RAILWAY_API_TOKEN"
            fi
          } >> "$GITHUB_ENV"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version

      - name: Execute final activation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/final_voice_activation.py

      - name: Upload non-secret certification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-voice-activation-result
          path: voice-activation-result.json
          if-no-files-found: ignore
          retention-days: 7
