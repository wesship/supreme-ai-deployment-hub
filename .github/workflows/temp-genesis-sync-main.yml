name: Temporary Genesis Main Sync

on:
  push:
    branches:
      - feat/genesis-platform-foundation

permissions:
  contents: write

concurrency:
  group: temp-genesis-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Genesis branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/genesis-platform-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "chore(genesis): synchronize with main"
          git rm .github/workflows/temp-genesis-sync-main.yml
          git commit -m "ci(genesis): remove temporary sync workflow"
          git push origin HEAD:refs/heads/feat/genesis-platform-foundation
