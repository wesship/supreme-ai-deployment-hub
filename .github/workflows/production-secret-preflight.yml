name: Production Secret Preflight

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
  VAPI_WEBHOOK_SECRET: ${{ secrets.VAPI_WEBHOOK_SECRET }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
  CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}

jobs:
  preflight:
    name: Validate production secret placement
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Assert required secrets are present and plausible
        shell: bash
        run: |
          set -Eeuo pipefail

          fail=0

          require_nonempty() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "::error title=Missing production secret::$name is empty or unavailable in the production environment"
              fail=1
            else
              echo "✓ $name is present"
            fi
          }

          require_prefix() {
            local name="$1"
            local prefix="$2"
            local value="${!name:-}"
            [[ -z "$value" ]] && return
            if [[ "$value" != "$prefix"* ]]; then
              echo "::error title=Unexpected secret shape::$name does not match the expected prefix"
              fail=1
            else
              echo "✓ $name matches expected shape"
            fi
          }

          require_email() {
            local name="$1"
            local value="${!name:-}"
            [[ -z "$value" ]] && return
            if [[ ! "$value" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
              echo "::error title=Unexpected email shape::$name is not a plausible email address"
              fail=1
            else
              echo "✓ $name is a plausible email address"
            fi
          }

          for name in \
            OPENAI_API_KEY \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_ID \
            SUPABASE_DB_PASSWORD \
            PINECONE_API_KEY \
            VAPI_API_KEY \
            VAPI_WEBHOOK_SECRET \
            ELEVENLABS_API_KEY \
            RESEND_API_KEY \
            CONTACT_FROM_EMAIL \
            CONTACT_TO_EMAIL
          do
            require_nonempty "$name"
          done

          require_prefix OPENAI_API_KEY "sk-"
          require_prefix RESEND_API_KEY "re_"
          require_email CONTACT_FROM_EMAIL
          require_email CONTACT_TO_EMAIL

          if [[ ${#VAPI_WEBHOOK_SECRET} -lt 24 ]]; then
            echo "::error title=Weak webhook secret::VAPI_WEBHOOK_SECRET must be at least 24 characters"
            fail=1
          else
            echo "✓ VAPI_WEBHOOK_SECRET has adequate length"
          fi

          if [[ "$fail" -ne 0 ]]; then
            echo "Production secret preflight failed closed. No secret values were printed."
            exit 1
          fi

          echo "Production secret placement and basic shape checks passed."
