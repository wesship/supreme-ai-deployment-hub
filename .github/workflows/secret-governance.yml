name: Secret Governance Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "config/secret-inventory.json"
      - "scripts/audit-secret-inventory.mjs"
      - "supabase/migrations/*secrets_vault*.sql"
      - ".github/workflows/secret-governance.yml"
      - "src/pages/security/SecretsVault.tsx"
      - "src/App.tsx"
  push:
    branches: [main]
    paths:
      - "config/secret-inventory.json"
      - "scripts/audit-secret-inventory.mjs"
      - "supabase/migrations/*secrets_vault*.sql"
      - ".github/workflows/secret-governance.yml"
      - "src/pages/security/SecretsVault.tsx"
      - "src/App.tsx"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-audit:
    name: Metadata Inventory & Reference Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Validate inventory policy and scan references
        run: node scripts/audit-secret-inventory.mjs --strict --output=artifacts/secret-inventory-audit.json

      - name: Upload metadata-only audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-inventory-audit
          path: artifacts/secret-inventory-audit.json
          retention-days: 90

      - name: Job summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require('./artifacts/secret-inventory-audit.json');
          console.log('# D3VONN Secret Governance');
          console.log(`- Inventory records: ${report.record_count}`);
          console.log(`- Repository files scanned: ${report.scanned_file_count}`);
          console.log(`- Policy violations: ${report.violation_count}`);
          console.log(`- Records with no detected reference: ${report.warning_count}`);
          console.log('- Secret values read or printed: **No**');
          NODE

  sync-production-metadata:
    name: Sync Reference Metadata to Production Vault
    if: github.event_name != 'pull_request'
    needs: inventory-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Scan and sync metadata only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-secret-inventory.mjs --strict --sync-supabase
