name: Devonn.AI Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # don't cancel in-flight deploys

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy - ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          echo "name=$ENV" >> $GITHUB_OUTPUT
          case "$ENV" in
            development) echo "api_url=http://localhost:8000" >> $GITHUB_OUTPUT ;;
            staging)     echo "api_url=https://staging-api.devonn.ai" >> $GITHUB_OUTPUT ;;
            *)           echo "api_url=https://api.devonn.ai" >> $GITHUB_OUTPUT ;;
          esac

      - name: Validate OpenAI API Key
        if: steps.env.outputs.name == 'production'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is not set for production deploy"
            exit 1
          fi
          echo "OPENAI_API_KEY is present"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Build extension
        run: npm run build -- --mode ${{ steps.env.outputs.name }}
        env:
          NODE_ENV: ${{ steps.env.outputs.name }}
          VITE_API_URL: ${{ steps.env.outputs.api_url }}

      - name: Package extension
        run: |
          cd dist
          zip -r ../devonn-ai-${{ steps.env.outputs.name }}.zip .

      - name: Upload to Chrome Web Store
        if: steps.env.outputs.name == 'production'
        continue-on-error: true
        run: node scripts/upload-to-chrome-webstore.cjs
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          ZIP_PATH: devonn-ai-${{ steps.env.outputs.name }}.zip
          PUBLISH_EXTENSION: 'true'

      - name: Create GitHub Release
        if: steps.env.outputs.name == 'production'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: devonn-ai-${{ steps.env.outputs.name }}.zip
          name: Release ${{ github.ref_name }}
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3  # v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Deploy ${{ job.status }}* - `${{ steps.env.outputs.name }}` | Branch: `${{ github.ref_name }}` | Actor: `${{ github.actor }}` | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify deployment
        continue-on-error: true
        run: echo "Smoke test placeholder - add real verification here"
