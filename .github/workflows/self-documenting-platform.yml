name: Self-Documenting Platform

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'src/**'
      - 'policy/**'
      - 'api/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  generate-architecture-docs:
    name: Generate Architecture Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip3 install pyyaml

      - name: Generate ARCHITECTURE.md
        run: |
          python3 - << 'PYEOF'
          import glob
          from datetime import datetime, timezone
          from pathlib import Path
          import yaml

          workflows = sorted(glob.glob('.github/workflows/*.yml'))
          rows = []
          for wf_path in workflows:
              try:
                  data = yaml.safe_load(Path(wf_path).read_text()) or {}
                  name = data.get('name', Path(wf_path).name)
                  jobs = data.get('jobs', {}) if isinstance(data.get('jobs', {}), dict) else {}
                  triggers = data.get('on', {})
                  if isinstance(triggers, dict):
                      trigger_text = ', '.join(str(k) for k in triggers.keys())
                  else:
                      trigger_text = str(triggers or '')
                  rows.append((name, Path(wf_path).name, trigger_text, len(jobs)))
              except Exception as exc:
                  print(f'WARN: unable to catalogue {wf_path}: {type(exc).__name__}')

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          lines = [
              '# D3VONN.IO Platform Architecture',
              '',
              f'> Auto-generated on {now} by the Self-Documenting Platform workflow.',
              '',
              '## Overview',
              '',
              'This document inventories the repository workflow surface used to build, secure, verify, and operate D3VONN.IO.',
              '',
              f'**Total Workflows:** {len(workflows)}  ',
              f'**Catalogued Workflows:** {len(rows)}  ',
              f'**Last Updated:** {now}',
              '',
              '## Workflow Catalog',
              '',
              '| Workflow | File | Triggers | Jobs |',
              '|---|---|---|---:|',
          ]
          for name, filename, triggers, jobs in sorted(rows, key=lambda row: row[0].lower()):
              lines.append(f'| {name} | `{filename}` | {triggers} | {jobs} |')

          lines += [
              '',
              '## Governance',
              '',
              '- Generated documentation is retained as a workflow artifact and may be published to `automation/self-documenting-platform` when repository rules allow a normal push.',
              '- Changes to `main` still require the repository normal pull-request and required-check path.',
              '- Repository policy may prohibit GitHub Actions from updating the automation branch; that protected outcome does not make documentation generation itself fail.',
              '',
          ]
          Path('ARCHITECTURE.md').write_text('\n'.join(lines))
          print(f'Generated ARCHITECTURE.md with {len(rows)} workflow entries')
          PYEOF

      - name: Retain generated architecture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-architecture
          path: ARCHITECTURE.md
          if-no-files-found: error

      - name: Publish architecture update branch
        id: publish
        env:
          UPDATE_BRANCH: automation/self-documenting-platform
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ARCHITECTURE.md

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No changes to ARCHITECTURE.md"
            exit 0
          fi

          git checkout -B "$UPDATE_BRANCH"
          git commit -m "docs: auto-update ARCHITECTURE.md [skip ci]"

          if git push origin HEAD:"$UPDATE_BRANCH"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Published documentation update to $UPDATE_BRANCH"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Repository rules prevented the normal branch push; generated documentation is retained as an artifact."
            echo "::notice title=Protected documentation publication::ARCHITECTURE.md was generated successfully, but repository rules blocked updating $UPDATE_BRANCH."
          fi

      - name: Report review path
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/self-documenting-platform
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" != "true" ]; then
            echo "Generated documentation is available in the workflow artifact; no branch publication occurred."
            exit 0
          fi

          count="$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "$count" != "0" ]; then
            echo "Existing documentation PR is open and the branch was refreshed."
            exit 0
          fi

          echo "No open documentation PR exists for $UPDATE_BRANCH."
          echo "Repository policy currently prevents GitHub Actions from creating pull requests."
          echo "The generated branch is published successfully and remains behind normal PR review before main."
          echo "::notice title=Self-documenting review required::Open a PR from automation/self-documenting-platform to main when review is desired."
