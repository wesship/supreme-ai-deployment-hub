name: Apply AI Films Shell Migration

on:
  push:
    branches:
      - feat/rc1-ai-films-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/rc1-ai-films-migration
          fetch-depth: 0

      - name: Apply route migration
        run: node scripts/migrate-ai-films-shell.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/migrate-ai-films-shell.mjs
          rm .github/workflows/apply-ai-films-shell-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/migrate-ai-films-shell.mjs .github/workflows/apply-ai-films-shell-migration.yml
          git commit -m "feat(film): route AI Films through RC1 shell"
          git push origin feat/rc1-ai-films-migration
