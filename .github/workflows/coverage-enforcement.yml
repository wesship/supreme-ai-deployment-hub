name: Coverage Enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run coverage when script exists
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage -- --coverage.reporter=json --coverage.reporter=text
          else
            echo "No test:coverage script detected."
          fi

      - name: Validate coverage artifact if present
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          summary = 'coverage/coverage-summary.json'
          if not os.path.exists(summary):
              print('Coverage summary not found; advisory pass.')
              sys.exit(0)
          data = json.load(open(summary))
          total = data.get('total', {})
          thresholds = {'lines': 70, 'functions': 70, 'branches': 60, 'statements': 70}
          failures = []
          for metric, threshold in thresholds.items():
              pct = total.get(metric, {}).get('pct')
              if pct is None:
                  continue
              print(f'{metric}: {pct}% threshold={threshold}%')
              if pct < threshold:
                  failures.append(f'{metric} {pct}% below {threshold}%')
          if failures:
              print('Coverage gate failed: ' + ', '.join(failures))
              sys.exit(1)
          print('Coverage gate passed.')
          PYEOF
