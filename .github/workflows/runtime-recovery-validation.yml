name: Runtime Recovery Validation

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'wave/**'
    paths:
      - 'services/runtime-recovery/**'
      - 'vitest.runtime-recovery.config.ts'
      - '.github/workflows/runtime-recovery-validation.yml'
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'services/runtime-recovery/**'
      - 'vitest.runtime-recovery.config.ts'
      - '.github/workflows/runtime-recovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery-tests:
    name: Runtime recovery resilience tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck runtime recovery layer
        run: npx tsc --noEmit

      - name: Run runtime recovery tests
        run: npx vitest --config vitest.runtime-recovery.config.ts run

      - name: Recovery validation summary
        run: |
          echo 'Validated:'
          echo '- worker crash recovery simulation'
          echo '- stale execution handling'
          echo '- replay safety checks'
          echo '- retry governance'
          echo '- DLQ routing'
          echo '- runtime telemetry lineage'
