name: Release

# Automated semantic versioning and CHANGELOG generation.
# Triggered only on pushes to main (after PR merge).
# Uses conventional commits to determine version bump:
#   feat: → minor bump (1.x.0)
#   fix:  → patch bump (1.0.x)
#   feat!: or BREAKING CHANGE → major bump (x.0.0)

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight release

permissions:
  contents: write        # to push tags and create releases
  pull-requests: write   # to comment on PRs
  issues: write          # to comment on issues
  id-token: write        # for npm provenance (optional)

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if CI passed - require the build job to succeed first
    # (configure this as a branch protection required status check)
    steps:
      - name: Checkout repository (full history for semantic-release)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0        # semantic-release needs full git history
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN_WRITE || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Check release prerequisites
        id: prereq
        env:
          GH_TOKEN_WRITE_VALUE: ${{ secrets.GH_TOKEN_WRITE }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_TOKEN_WRITE_VALUE}" ] || [ -n "${GH_PAT_VALUE}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "::warning::Neither GH_TOKEN_WRITE nor GH_PAT is set - skipping semantic-release to avoid push permission error"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        # Skip if no write-capable token is configured

      - name: Run Semantic Release
        if: steps.prereq.outputs.skip == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_WRITE || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          # Uncomment if publishing to npm:
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # Post-release: run deployment smoke tests against the new production build
  post-release-smoke:
    name: Post-Release Smoke Tests
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run deployment smoke tests
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://devonn.ai
        run: npx playwright test tests/e2e/deployment-smoke.spec.ts --project=chromium

      - name: Upload smoke test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: post-release-smoke-results
          path: test-results/
          retention-days: 7
