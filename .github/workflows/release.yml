name: Release

# Automated semantic versioning and CHANGELOG generation.
# Triggered only on pushes to main (after PR merge).

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (full history for semantic-release)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install semantic-release plugins
        continue-on-error: true  # May fail if lockfile is frozen; plugins should be in package.json
        run: |
          pnpm add --save-dev \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Check release prerequisites
        id: prereq
        env:
          GH_TOKEN_WRITE_VALUE: ${{ secrets.GH_TOKEN_WRITE }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_TOKEN_WRITE_VALUE}" ] || [ -n "${GH_PAT_VALUE}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "::warning::Neither GH_TOKEN_WRITE nor GH_PAT is set - skipping semantic-release to avoid push permission error"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Semantic Release
        if: steps.prereq.outputs.skip == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_WRITE || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

  post-release-smoke:
    name: Post-Release Smoke Tests
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.release.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deployment smoke tests
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://devonn.ai
        run: pnpm exec playwright test tests/e2e/deployment-smoke.spec.ts --project=chromium

      - name: Upload smoke test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post-release-smoke-results
          path: test-results/
          retention-days: 7
