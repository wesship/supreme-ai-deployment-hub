name: Terraform Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: terraform-validation
  cancel-in-progress: true

jobs:
  control:
    name: Manual Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Terraform validation is manual-only because the active production path does not use Terraform-managed AWS infrastructure."
          echo "Environment: ${{ github.event.inputs.environment }}"
