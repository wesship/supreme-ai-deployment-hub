name: Deprecated Route 53 DNS Records

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'This workflow is deprecated. Use Hostinger + Vercel DNS setup for d3vonn.io.'
        required: false
        default: 'deprecated'

permissions:
  contents: read

jobs:
  deprecated:
    name: Deprecated DNS workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop obsolete devonn.ai DNS workflow
        run: |
          echo "This workflow is intentionally disabled."
          echo "devonn.ai is expired. d3vonn.io is the canonical domain."
          echo "d3vonn.io uses Hostinger DNS and Vercel frontend hosting."
          echo "Required Hostinger records:"
          echo "  A     @      76.76.21.21"
          echo "  CNAME www    cname.vercel-dns.com"
          echo "  CNAME app    cname.vercel-dns.com"
          echo "Do not recreate Vercel or Route 53 records for devonn.ai. Use d3vonn.io instead."
          exit 1
