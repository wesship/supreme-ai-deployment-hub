name: Deprecated Route 53 DNS Records

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'This workflow is deprecated. Use Hostinger + Lovable DNS setup for d3vonn.io.'
        required: false
        default: 'deprecated'

permissions:
  contents: read

jobs:
  deprecated:
    name: Deprecated DNS workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop obsolete devonn.ai DNS workflow
        run: |
          echo "This workflow is intentionally disabled."
          echo "devonn.ai is expired and no longer canonical."
          echo "d3vonn.io uses Hostinger DNS and Lovable frontend hosting."
          echo "Required Hostinger records:"
          echo "  A   @       185.158.133.1"
          echo "  A   www     185.158.133.1"
          echo "  TXT _lovable <value shown by Lovable>"
          echo "Do not recreate Vercel or Route 53 records for devonn.ai."
          exit 1
