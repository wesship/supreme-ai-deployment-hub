name: eBPF Deep Runtime Telemetry (Cilium Tetragon)

on:
  push:
    branches: [main]
    paths:
      - 'policy/tetragon/**'
      - '.github/workflows/ebpf-telemetry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'policy/tetragon/**'
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      telemetry_mode:
        description: 'Telemetry analysis mode'
        required: false
        default: 'validate'
        type: choice
        options:
          - validate
          - simulate
          - report

permissions:
  contents: read
  security-events: write

concurrency:
  group: ebpf-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tetragon-policies:
    name: Validate Tetragon TracingPolicies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate TracingPolicy YAML structure
        run: |
          python3 - <<'PYEOF'
          import yaml, glob, sys

          policies = []
          errors = []

          for f in sorted(glob.glob("policy/tetragon/*.yaml")):
              try:
                  with open(f) as fh:
                      docs = list(yaml.safe_load_all(fh.read()))
                  for doc in docs:
                      if doc is None:
                          continue
                      name = doc.get("metadata", {}).get("name", "unknown")
                      kind = doc.get("kind", "unknown")
                      kprobes = doc.get("spec", {}).get("kprobes", [])
                      
                      # Count action types
                      actions = []
                      for kp in kprobes:
                          for sel in kp.get("selectors", []):
                              for act in sel.get("matchActions", []):
                                  actions.append(act.get("action", "Post"))
                      
                      policies.append({
                          "name": name,
                          "kind": kind,
                          "kprobes": len(kprobes),
                          "actions": actions
                      })
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print(f"=== Tetragon TracingPolicy Validation ===")
          print(f"Policies found: {len(policies)}")
          for p in policies:
              sigkill_count = p["actions"].count("Sigkill")
              post_count = p["actions"].count("Post")
              print(f"  {p['name']}: {p['kprobes']} kprobes | {post_count} Post | {sigkill_count} Sigkill")

          # Coverage check
          required_coverage = [
              "process-ancestry",
              "network-topology",
              "sensitive-file-access",
              "privilege-escalation",
              "syscall-anomaly"
          ]

          policy_names = [p["name"] for p in policies]
          missing = [r for r in required_coverage if not any(r in n for n in policy_names)]
          if missing:
              print(f"::warning::Missing coverage areas: {missing}")
          else:
              print("Full threat coverage: process, network, file, privilege, syscall")
          PYEOF

      - name: Simulate process ancestry graph
        run: |
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timedelta
          import random

          # Simulate a process ancestry graph for the Devonn.AI API container
          # This represents what Tetragon would capture in production
          
          base_time = datetime.utcnow()
          
          process_tree = {
              "container": "devonn-api",
              "namespace": "devonn-ai",
              "captured_at": base_time.isoformat() + "Z",
              "process_ancestry": [
                  {
                      "pid": 1,
                      "ppid": 0,
                      "exe": "/usr/bin/python3",
                      "args": ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"],
                      "user": "nonroot (65532)",
                      "start_time": (base_time - timedelta(hours=2)).isoformat() + "Z",
                      "status": "running",
                      "threat_level": "normal"
                  }
              ],
              "network_connections": [
                  {"dst_ip": "10.96.0.1", "dst_port": 443, "protocol": "TCP", "purpose": "K8s API server", "status": "allowed"},
                  {"dst_ip": "10.96.10.5", "dst_port": 5432, "protocol": "TCP", "purpose": "PostgreSQL", "status": "allowed"},
                  {"dst_ip": "10.96.10.6", "dst_port": 6379, "protocol": "TCP", "purpose": "Redis", "status": "allowed"},
                  {"dst_ip": "api.openai.com", "dst_port": 443, "protocol": "TCP", "purpose": "OpenAI API", "status": "allowed"}
              ],
              "anomalies_detected": [],
              "threat_summary": {
                  "critical": 0,
                  "high": 0,
                  "medium": 0,
                  "low": 0
              }
          }
          
          import os
          os.makedirs("/tmp/tetragon-report", exist_ok=True)
          with open("/tmp/tetragon-report/process-ancestry.json", "w") as f:
              json.dump(process_tree, f, indent=2)
          
          print("=== Simulated Process Ancestry Graph ===")
          print(f"Container: {process_tree['container']}")
          print(f"Namespace: {process_tree['namespace']}")
          print(f"Root process: {process_tree['process_ancestry'][0]['exe']}")
          print(f"Network connections: {len(process_tree['network_connections'])}")
          print(f"Anomalies: {sum(process_tree['threat_summary'].values())}")
          print("Status: CLEAN - no suspicious activity detected")
          PYEOF

      - name: Generate eBPF telemetry deployment manifests
        run: |
          mkdir -p /tmp/tetragon-deploy
          
          cat > /tmp/tetragon-deploy/tetragon-helm-values.yaml << 'EOF'
          # Cilium Tetragon Helm values for Devonn.AI cluster
          # Deploy with: helm install tetragon cilium/tetragon -n kube-system -f tetragon-helm-values.yaml
          
          tetragon:
            enabled: true
            image:
              repository: quay.io/cilium/tetragon
              tag: v1.2.0
            
            # Export events to stdout for log aggregation (Fluentd/Loki/Datadog)
            exportFilename: /var/run/cilium/tetragon/tetragon.log
            
            # Enable process ancestry tracking
            enableProcessAncestors: true
            
            # Enable network observability
            enableNetworkObservability: true
            
            # gRPC server for real-time event streaming
            grpc:
              enabled: true
              address: "localhost:54321"
            
            # Resource limits
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          
          # Apply TracingPolicies from policy/tetragon/
          tracingPolicies:
            - name: devonn-process-ancestry
              namespace: devonn-ai
            - name: devonn-network-topology
              namespace: devonn-ai
            - name: devonn-sensitive-file-access
              namespace: devonn-ai
            - name: devonn-privilege-escalation
              namespace: devonn-ai
            - name: devonn-syscall-anomaly
              namespace: devonn-ai
          EOF
          
          echo "Tetragon Helm values generated"
          cat /tmp/tetragon-deploy/tetragon-helm-values.yaml

      - name: Upload telemetry reports and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ebpf-telemetry-${{ github.run_id }}
          path: |
            /tmp/tetragon-report/
            /tmp/tetragon-deploy/
          retention-days: 30
