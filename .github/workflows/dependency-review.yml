name: Dependency Review

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements*.txt'
      - 'backend/requirements*.txt'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dependency Review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          allow-ghsas: ''
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          show-patched-versions: true
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

      - name: Persist dependency-review diagnostics
        if: always()
        shell: bash
        env:
          COMMENT_CONTENT: ${{ steps.review.outputs.comment-content }}
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
          DENIED_CHANGES: ${{ steps.review.outputs.denied-changes }}
        run: |
          set -euo pipefail
          printf '%s\n' "${COMMENT_CONTENT:-No summary returned.}" > dependency-review-summary.md
          printf '%s\n' "${VULNERABLE_CHANGES:-[]}" | jq . > dependency-review-vulnerable.json
          printf '%s\n' "${INVALID_LICENSE_CHANGES:-[]}" | jq . > dependency-review-invalid-licenses.json
          printf '%s\n' "${DENIED_CHANGES:-[]}" | jq . > dependency-review-denied.json
          {
            echo '## Dependency Review diagnostics'
            echo
            cat dependency-review-summary.md
            echo
            echo '### Vulnerable changes'
            echo '```json'
            cat dependency-review-vulnerable.json
            echo '```'
            echo '### Invalid license changes'
            echo '```json'
            cat dependency-review-invalid-licenses.json
            echo '```'
            echo '### Denied changes'
            echo '```json'
            cat dependency-review-denied.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency-review diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-review-diagnostics-${{ github.run_id }}
          path: |
            dependency-review-summary.md
            dependency-review-vulnerable.json
            dependency-review-invalid-licenses.json
            dependency-review-denied.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce dependency-review result
        if: steps.review.outcome == 'failure'
        run: |
          echo '::error::Dependency Review action failed. See action log and diagnostics artifact.'
          exit 1
