name: Dependency Review

# Blocks PRs that introduce dependencies with known HIGH or CRITICAL CVEs.
# Uses the GitHub Dependency Review Action which reads the GitHub Advisory Database.
#
# Docs: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'requirements-devonn.txt'
      - 'backend/requirements.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          # Block PRs with HIGH or CRITICAL severity vulnerabilities
          fail-on-severity: high
          # Allow specific advisories if needed (add GHSA IDs here)
          allow-ghsas: ''
          # Comment on the PR with a summary of new dependencies
          comment-summary-in-pr: always
          # Deny packages with incompatible licenses
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
