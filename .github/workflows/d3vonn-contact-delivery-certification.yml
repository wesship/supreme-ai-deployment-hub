name: D3VONN.IO Contact Delivery Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d3vonn-contact-delivery-certification.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: d3vonn-contact-delivery-certification
  cancel-in-progress: false

jobs:
  contact-delivery:
    name: Verify production contact provider acceptance
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Send uniquely tagged production contact canary
        env:
          CONTACT_ENDPOINT: https://api.d3vonn.io/contact
        run: |
          set -euo pipefail
          tag="D3VONN-CONTACT-CERT-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CONTACT_CANARY_TAG=$tag" >> "$GITHUB_ENV"
          payload=$(jq -n \
            --arg name "D3VONN.IO Production Certification" \
            --arg email "wesship8@gmail.com" \
            --arg subject "$tag" \
            --arg message "Protected production contact delivery certification. Tag: $tag" \
            '{name:$name,email:$email,subject:$subject,message:$message,website:""}')

          response_file=$(mktemp)
          status=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$CONTACT_ENDPOINT")

          echo "HTTP status: $status"
          test "$status" = "202" || {
            echo "Contact endpoint did not return HTTP 202"
            jq -c '{status,error,detail}' "$response_file" 2>/dev/null || true
            exit 1
          }

          jq -e '.status == "sent"' "$response_file" >/dev/null || {
            echo "Contact endpoint did not confirm provider acceptance"
            jq -c '{status,error,detail}' "$response_file" 2>/dev/null || true
            exit 1
          }

          provider_id=$(jq -r '.id // .message_id // .provider_id // "not-returned"' "$response_file")
          echo "CONTACT_PROVIDER_ID=$provider_id" >> "$GITHUB_ENV"
          echo "Provider acceptance confirmed"

      - name: Publish certification evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          ## Contact delivery certification
          - Status: **${JOB_STATUS}**
          - Run: ${run_url}
          - Commit: \`${GITHUB_SHA}\`
          - Canary tag: \`${CONTACT_CANARY_TAG:-not-generated}\`
          - Provider identifier: \`${CONTACT_PROVIDER_ID:-not-returned}\`
          - Mailbox receipt: requires confirmation of the exact canary tag
          EOF
          )
          gh issue comment 599 --repo "$GITHUB_REPOSITORY" --body "$body"
