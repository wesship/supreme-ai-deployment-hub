name: Security Hardening

# Comprehensive security checks:
# - Dependency review (new vulnerabilities in PRs; requires GitHub Advanced Security)
# - Action SHA pinning audit
# - pnpm security audit
# - Branch protection status check
#
# Runs on every PR to main and weekly for ongoing monitoring.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # GitHub's dependency review API is available to private repositories only
    # when GitHub Advanced Security is licensed. Set the repository variable
    # ENABLE_DEPENDENCY_REVIEW=true after GHAS is enabled.
    if: "github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense
          comment-summary-in-pr: always

  action-pin-audit:
    name: Audit Action SHA Pinning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Count tag-pinned vs SHA-pinned actions
        run: |
          echo "Scanning .github/workflows for action pin types..."
          TAG_PINNED=$(grep -rh 'uses:' .github/workflows/ | grep -v '#' | grep -oP '@[a-zA-Z0-9._/-]+' | grep -v '@[0-9a-f]\{7,40\}' | wc -l || echo "0")
          SHA_PINNED=$(grep -rh 'uses:' .github/workflows/ | grep -v '#' | grep -oP '@[0-9a-f]{7,40}' | wc -l || echo "0")
          TOTAL=$((TAG_PINNED + SHA_PINNED))
          echo "Action pin audit:"
          echo "  Tag-pinned (e.g. @v4): $TAG_PINNED"
          echo "  SHA-pinned (e.g. @abc1234): $SHA_PINNED"
          echo "  Total: $TOTAL"
          if [ "$TAG_PINNED" -gt "0" ]; then
            echo "::warning::$TAG_PINNED actions use tag pins. Consider SHA pinning for supply-chain security."
            echo "::warning::Use https://github.com/mheap/pin-github-action to automate SHA pinning."
          fi

  npm-security-audit:
    name: pnpm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          pnpm audit --json > pnpm-audit.json 2>/dev/null || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' pnpm-audit.json 2>/dev/null || echo "0")
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' pnpm-audit.json 2>/dev/null || echo "0")
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' pnpm-audit.json 2>/dev/null || echo "0")
          LOW=$(jq '.metadata.vulnerabilities.low // 0' pnpm-audit.json 2>/dev/null || echo "0")
          echo "pnpm audit results:"
          echo "  Critical: $CRITICAL"
          echo "  High:     $HIGH"
          echo "  Moderate: $MODERATE"
          echo "  Low:      $LOW"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities. Run 'pnpm audit --fix'."
            exit 1
          elif [ "$HIGH" -gt "0" ]; then
            echo "::warning::Found $HIGH high severity vulnerabilities. Review and update when possible."
          else
            echo "No critical or high severity vulnerabilities found."
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pnpm-audit-${{ github.sha }}
          path: pnpm-audit.json
          retention-days: 30

  branch-protection-check:
    name: Verify Branch Protection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Check branch protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="main"
          echo "Checking branch protection for $REPO/$BRANCH..."
          PROTECTION=$(gh api "repos/$REPO/branches/$BRANCH/protection" 2>/dev/null || echo '{}')
          if echo "$PROTECTION" | jq -e '.url' > /dev/null 2>&1; then
            echo "Branch protection is active on '$BRANCH'"
            FORCE_PUSH=$(echo "$PROTECTION" | jq -r '.allow_force_pushes.enabled // true')
            DELETIONS=$(echo "$PROTECTION" | jq -r '.allow_deletions.enabled // true')
            REQUIRED_REVIEWS=$(echo "$PROTECTION" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')
            echo "  Force pushes allowed: $FORCE_PUSH"
            echo "  Deletions allowed: $DELETIONS"
            echo "  Required reviews: $REQUIRED_REVIEWS"
            if [ "$FORCE_PUSH" = "true" ]; then
              echo "::warning::Force pushes are allowed on main - consider disabling"
            fi
          else
            echo "::error::Branch 'main' has NO protection rules configured!"
            exit 1
          fi
