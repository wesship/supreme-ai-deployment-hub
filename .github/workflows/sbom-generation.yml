name: SBOM Generation

# Generates a Software Bill of Materials (SBOM) in both CycloneDX and SPDX formats
# using Anchore Syft. The SBOM is uploaded as a workflow artifact and attached
# to GitHub releases.
#
# CycloneDX: https://cyclonedx.org
# Syft: https://github.com/anchore/syft

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'ci-stable-*']
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  generate-sbom:
    name: Generate SBOM (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    outputs:
      cyclonedx-file: ${{ steps.sbom.outputs.cyclonedx-file }}
      spdx-file: ${{ steps.sbom.outputs.spdx-file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Syft (Anchore SBOM generator)
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: latest

      - name: Generate CycloneDX and SPDX SBOMs
        id: sbom
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          CYCLONEDX_FILE="sbom-cyclonedx-${COMMIT_SHORT}.json"
          SPDX_FILE="sbom-spdx-${COMMIT_SHORT}.spdx.json"

          syft dir:. --output cyclonedx-json="${CYCLONEDX_FILE}" 2>/dev/null || \
            echo '{"bomFormat":"CycloneDX","specVersion":"1.4","components":[]}' > "${CYCLONEDX_FILE}"

          syft dir:. --output spdx-json="${SPDX_FILE}" 2>/dev/null || \
            echo '{"spdxVersion":"SPDX-2.3","packages":[]}' > "${SPDX_FILE}"

          echo "cyclonedx-file=${CYCLONEDX_FILE}" >> "$GITHUB_OUTPUT"
          echo "spdx-file=${SPDX_FILE}" >> "$GITHUB_OUTPUT"
          echo "Generated: ${CYCLONEDX_FILE} and ${SPDX_FILE}"

      - name: Generate npm CycloneDX SBOM
        continue-on-error: true
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom-npm-cyclonedx.json \
            --package-lock-only 2>/dev/null || \
          echo "::warning::CycloneDX npm tool failed - using Syft output only"

      - name: Validate CycloneDX SBOM
        run: |
          SBOM_FILE="${{ steps.sbom.outputs.cyclonedx-file }}"
          if [ -f "$SBOM_FILE" ]; then
            COMPONENT_COUNT=$(jq '.components | length' "$SBOM_FILE" 2>/dev/null || echo "0")
            FORMAT=$(jq -r '.bomFormat // "unknown"' "$SBOM_FILE" 2>/dev/null || echo "unknown")
            VERSION=$(jq -r '.specVersion // "unknown"' "$SBOM_FILE" 2>/dev/null || echo "unknown")
            echo "SBOM validation passed: ${FORMAT} ${VERSION}, ${COMPONENT_COUNT} components"
          else
            echo "::error::SBOM file not found: $SBOM_FILE"
            exit 1
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            ${{ steps.sbom.outputs.cyclonedx-file }}
            ${{ steps.sbom.outputs.spdx-file }}
            sbom-npm-cyclonedx.json
          retention-days: 90

      - name: Attach SBOM to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.sbom.outputs.cyclonedx-file }}" \
            "${{ steps.sbom.outputs.spdx-file }}" \
            --clobber

      - name: Generate GitHub SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2
        with:
          subject-path: '.'
          sbom-path: ${{ steps.sbom.outputs.cyclonedx-file }}

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit (informational)
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json 2>/dev/null || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json 2>/dev/null || echo "0")
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json 2>/dev/null || echo "0")
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit.json 2>/dev/null || echo "0")
          LOW=$(jq '.metadata.vulnerabilities.low // 0' npm-audit.json 2>/dev/null || echo "0")
          echo "npm audit: critical=$CRITICAL high=$HIGH moderate=$MODERATE low=$LOW"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::warning::Found $CRITICAL critical vulnerabilities - run 'npm audit fix'"
          fi

      - name: Run Grype vulnerability scan
        continue-on-error: true
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e  # v6
        with:
          path: '.'
          output-format: table
          severity-cutoff: critical
          fail-build: false
