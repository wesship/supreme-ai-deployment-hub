name: Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/infrastructure-ci-cd.yml'
      - 'scripts/generate-tf-files.cjs'
      - 'policy/**'
      - 'tests/infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - 'policy/**'
      - 'scripts/generate-tf-files.cjs'
      - 'tests/infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        default: 'canary'
        type: choice
        options:
          - standard
          - canary
          - blue-green

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'
  TF_LOG: 'WARN'
  COMPLIANCE_STANDARDS: 'cis,gdpr,hipaa,pci'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ./src/data/manifest/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./src/data/manifest/terraform
        run: terraform init -reconfigure -backend=false

      - name: Terraform Validate
        working-directory: ./src/data/manifest/terraform
        run: terraform validate

      - name: Generate Terraform Documentation
        run: |
          curl -sSLo ./terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          if ! file terraform-docs.tar.gz | grep -q 'gzip compressed data'; then
            echo "ERROR: Downloaded file is not gzip format"
            exit 1
          fi
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/terraform-docs
          terraform-docs markdown ./src/data/manifest/terraform > TERRAFORM.md

      - name: Upload Terraform Documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-docs
          path: TERRAFORM.md
          retention-days: 30

  security-scan:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials (OIDC)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@a73ebc46fba54691e25cbe901656e7b205fb9bf2
        with:
          soft_fail: true
          format: sarif
          additional_args: --out tfsec.sarif

      - name: Run checkov
        uses: bridgecrewio/checkov-action@803f802e15372b44bfa1045780e9427936ab2f5b
        with:
          directory: ./src/data/manifest/terraform/azure
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: results.sarif

      - name: Upload tfsec SARIF results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always()
        with:
          sarif_file: ./tfsec.sarif
          category: tfsec

      - name: Upload checkov SARIF results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always()
        with:
          sarif_file: ./results.sarif
          category: checkov

      - name: Install OPA
        run: |
          curl -sSL -o opa \
            https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Terraform files from manifests
        run: node scripts/generate-tf-files.cjs

      - name: Generate Terraform Plan for OPA Evaluation
        continue-on-error: true
        working-directory: ./src/data/manifest/terraform
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: |
          terraform init -reconfigure
          terraform plan -out=tfplan -lock=false
          terraform show -json tfplan > tfplan_raw.json

      - name: Sanitize Terraform Plan
        continue-on-error: true
        working-directory: ./src/data/manifest/terraform
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          source = Path('tfplan_raw.json')
          if not source.exists():
              print('No plan JSON generated; skipping sanitization.')
              raise SystemExit(0)

          def redact(obj, depth=0):
              if depth > 50:
                  return obj
              if isinstance(obj, dict):
                  redact_keys = {
                      'sensitive_values', 'before_sensitive', 'after_sensitive',
                      'password', 'secret', 'token', 'key', 'private_key',
                      'access_key', 'secret_key', 'db_password'
                  }
                  return {
                      k: '[REDACTED]' if k in redact_keys else redact(v, depth + 1)
                      for k, v in obj.items()
                  }
              if isinstance(obj, list):
                  return [redact(i, depth + 1) for i in obj]
              return obj

          with source.open() as f:
              plan = json.load(f)
          with open('tfplan.json', 'w') as f:
              json.dump(redact(plan), f, indent=2)
          print('Plan sanitized - sensitive values redacted.')
          EOF

      - name: Run OPA Policy Checks
        continue-on-error: true
        working-directory: ./src/data/manifest/terraform
        run: |
          if [ ! -f tfplan.json ]; then
            echo "No sanitized plan found; skipping OPA evaluation."
            exit 0
          fi
          mkdir -p policy-results
          opa eval \
            --format pretty \
            --data ../../../policy/aws_rds_policy.rego \
            --input tfplan.json \
            "data.terraform.aws.rds" > policy-results/rds-policy-results.txt
          cat policy-results/rds-policy-results.txt

      - name: Upload OPA Policy Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: policy-check-results
          path: ./src/data/manifest/terraform/policy-results/
          retention-days: 14

  terraform-plan:
    name: Terraform Plan
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      id-token: write
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials (OIDC)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Terraform files from manifests
        run: node scripts/generate-tf-files.cjs

      - name: Terraform Init
        working-directory: ./src/data/manifest/terraform
        run: terraform init -reconfigure

      - name: Upload Terraform Lock File
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: terraform-lock
          path: src/data/manifest/terraform/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7

      - name: Upload Terraform Config Files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: terraform-config
          path: ./src/data/manifest/terraform/*.tf
          retention-days: 7

      - name: Terraform Plan
        working-directory: ./src/data/manifest/terraform
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        id: plan
        run: |
          set +e
          terraform plan \
            -out=tfplan \
            -lock=false \
            -detailed-exitcode 2>&1 | tee plan_output.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: terraform-plan
          path: ./src/data/manifest/terraform/tfplan
          retention-days: 1

      - name: Comment Plan Summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'src/data/manifest/terraform/plan_output.txt';
            const planText = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No Terraform plan output was generated.';
            const truncated = planText.length > 60000 ? planText.substring(0, 60000) + '\n...(truncated)' : planText;
            const body = [
              '## Terraform Plan Summary',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              `**Exit code:** \`${{ steps.plan.outputs.exitcode }}\``,
              '> 0 = no changes, 1 = error, 2 = changes pending',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production' &&
      needs.terraform-plan.outputs.plan_exit_code == '2'
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment:
      name: production
      url: https://devonn.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials (OIDC)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: terraform-plan
          path: ./src/data/manifest/terraform/

      - name: Terraform Apply
        working-directory: ./src/data/manifest/terraform
        env:
          TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: terraform apply -auto-approve tfplan
