name: Infrastructure CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/infrastructure-ci-cd.yml'
      - 'scripts/generate-tf-files.cjs'
      - 'policy/**'
      - 'tests/infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/data/manifest/terraform/**'
      - '.github/workflows/infrastructure-ci-cd.yml'
      - 'policy/**'
      - 'scripts/generate-tf-files.cjs'
      - 'tests/infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: production
        type: choice
        options: [development, staging, production]
      confirmation:
        description: Type APPLY_PRODUCTION to authorize a production plan and apply
        required: false
        type: string

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'
  CHECKOV_VERSION: '3.3.8'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Discover deployment Terraform root
        id: terraform-root
        shell: bash
        run: |
          set -euo pipefail
          root=''
          for candidate in src/data/manifest/terraform terraform; do
            if [ -d "$candidate" ] && find "$candidate" -type f -name '*.tf' -print -quit | grep -q .; then
              root="$candidate"
              break
            fi
          done

          if [ -z "$root" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files found; validation is neutral."
            exit 0
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Deployment Terraform root: $root"

      - name: Setup Terraform
        if: steps.terraform-root.outputs.present == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        if: steps.terraform-root.outputs.present == 'true'
        working-directory: ${{ steps.terraform-root.outputs.root }}
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        if: steps.terraform-root.outputs.present == 'true'
        working-directory: ${{ steps.terraform-root.outputs.root }}
        run: terraform init -reconfigure -backend=false

      - name: Terraform validate
        if: steps.terraform-root.outputs.present == 'true'
        working-directory: ${{ steps.terraform-root.outputs.root }}
        run: terraform validate

      - name: Record neutral validation result
        if: steps.terraform-root.outputs.present != 'true'
        run: echo "Terraform validation skipped neutrally because no .tf files were found."

  security-scan:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Discover Terraform files
        id: terraform-root
        shell: bash
        run: |
          set -euo pipefail
          if find terraform src/data/manifest/terraform -type f -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Terraform files found; Checkov will scan all configured roots from the repository root."
            exit 0
          fi

          echo "present=false" >> "$GITHUB_OUTPUT"
          cat > checkov-results.json <<'JSON'
          {
            "check_type": "terraform",
            "results": {"passed_checks": [], "failed_checks": [], "skipped_checks": [], "parsing_errors": []},
            "summary": {"passed": 0, "failed": 0, "skipped": 0, "parsing_errors": 0, "resource_count": 0},
            "neutral_reason": "No Terraform files were found in configured repository roots."
          }
          JSON
          cat > checkov-results.sarif <<'JSON'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool": {"driver": {"name": "Checkov", "informationUri": "https://www.checkov.io/", "rules": []}}, "results": []}]
          }
          JSON
          echo "No Terraform files found; Checkov result is neutral."

      - name: Setup Python
        if: steps.terraform-root.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned Checkov
        if: steps.terraform-root.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"

      - name: Run Checkov and produce JSON
        if: steps.terraform-root.outputs.present == 'true'
        id: checkov
        shell: bash
        run: |
          set +e
          checkov \
            --directory . \
            --framework terraform \
            --skip-download \
            --compact \
            --output json > checkov-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s checkov-results.json
          exit 0

      - name: Enforce Checkov results
        if: steps.terraform-root.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path('checkov-results.json').read_text(encoding='utf-8'))
          reports = payload if isinstance(payload, list) else [payload]
          failures = []
          parsing_errors = 0

          for report in reports:
              summary = report.get('summary', {}) or {}
              parsing_errors += int(summary.get('parsing_errors', 0) or 0)
              failures.extend((report.get('results', {}) or {}).get('failed_checks', []) or [])

          print(f'Checkov failures: {len(failures)}')
          print(f'Checkov parsing errors: {parsing_errors}')

          if parsing_errors or failures:
              for check in failures:
                  print(
                      f"::error file={check.get('file_path', 'unknown')}::"
                      f"{check.get('check_id', 'unknown')} - {check.get('check_name', 'unknown')}"
                  )
              sys.exit(1)
          PY

      - name: Generate and validate Checkov SARIF
        if: always() && steps.terraform-root.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf checkov-sarif-output
          checkov \
            --directory . \
            --framework terraform \
            --skip-download \
            --compact \
            --soft-fail \
            --output sarif \
            --output-file-path checkov-sarif-output >/dev/null
          mv checkov-sarif-output/results_sarif.sarif checkov-results.sarif
          test -s checkov-results.sarif
          python -m json.tool checkov-results.sarif >/dev/null

      - name: Upload Checkov SARIF when code scanning is enabled
        if: always() && hashFiles('checkov-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: checkov-results.sarif
          category: checkov-infrastructure

      - name: Preserve Checkov reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infrastructure-checkov-${{ github.run_id }}
          path: |
            checkov-results.json
            checkov-results.sarif
          if-no-files-found: error
          retention-days: 30

  terraform-plan:
    name: Terraform Plan
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.environment != 'production' || github.event.inputs.confirmation == 'APPLY_PRODUCTION')
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment: ${{ github.event.inputs.environment }}
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: src/data/manifest/terraform
        run: terraform init -reconfigure

      - name: Terraform plan
        id: plan
        working-directory: src/data/manifest/terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        shell: bash
        run: |
          set +e
          terraform plan -out=tfplan -lock=false -detailed-exitcode
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            sha256sum tfplan > tfplan.sha256
          fi
          exit 0

      - name: Upload reviewed Terraform plan
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            src/data/manifest/terraform/tfplan
            src/data/manifest/terraform/tfplan.sha256
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.environment == 'production' &&
      github.event.inputs.confirmation == 'APPLY_PRODUCTION' &&
      needs.terraform-plan.outputs.plan_exit_code == '2'
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment:
      name: production
      url: https://d3vonn.io
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: src/data/manifest/terraform
        run: terraform init -reconfigure

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: terraform-plan-${{ github.run_id }}
          path: src/data/manifest/terraform

      - name: Verify reviewed Terraform plan
        working-directory: src/data/manifest/terraform
        shell: bash
        run: |
          test -f tfplan
          test -f tfplan.sha256
          sha256sum --check tfplan.sha256

      - name: Apply reviewed Terraform plan
        working-directory: src/data/manifest/terraform
        run: terraform apply -lock-timeout=5m tfplan
