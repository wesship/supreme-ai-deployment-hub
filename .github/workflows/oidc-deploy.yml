name: OIDC Deployment Federation

# Demonstrates OIDC-based workload identity federation for cloud deployments.
# Replaces long-lived static credentials with short-lived OIDC tokens.
#
# Benefits:
# - No long-lived secrets stored in GitHub
# - Tokens expire after the job completes
# - Cloud audit logs show the exact workflow run that made changes
# - Supports AWS, Azure, GCP, and Cloudflare Workers
#
# Setup instructions per provider:
# AWS:    https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
# Azure:  https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-azure
# GCP:    https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-google-cloud-platform
# CF:     https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider to deploy to'
        required: true
        type: choice
        options: [aws, azure, gcp, cloudflare]
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write  # REQUIRED for OIDC token generation

jobs:
  # ── AWS OIDC Deployment ────────────────────────────────────────────────────
  deploy-aws:
    name: Deploy via AWS OIDC
    runs-on: ubuntu-latest
    if: inputs.provider == 'aws'
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-aws-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # No access-key-id or secret-access-key needed - OIDC handles auth

      - name: Verify AWS identity (no long-lived credentials)
        run: |
          aws sts get-caller-identity
          echo "Using short-lived OIDC credentials - no static secrets required"

      - name: Deploy to AWS (${{ inputs.environment }})
        run: |
          echo "Deploying to AWS ${{ inputs.environment }}..."
          # Example: ECS, Lambda, S3, CloudFront
          # aws ecs update-service --cluster devonn-${{ inputs.environment }} --service devonn-api --force-new-deployment
          echo "::notice::Configure AWS_OIDC_ROLE_ARN secret and deployment command"

  # ── Azure OIDC Deployment ──────────────────────────────────────────────────
  deploy-azure:
    name: Deploy via Azure OIDC
    runs-on: ubuntu-latest
    if: inputs.provider == 'azure'
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-azure-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Login to Azure via OIDC (Federated Identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # No client-secret needed - federated credential handles auth

      - name: Verify Azure identity
        run: |
          az account show --query "{name:name, id:id}" -o json
          echo "Using federated identity - no client secret required"

      - name: Deploy to Azure (${{ inputs.environment }})
        run: |
          echo "Deploying to Azure ${{ inputs.environment }}..."
          # Example: Azure Container Apps, App Service, AKS
          # az containerapp update --name devonn-${{ inputs.environment }} --resource-group devonn-rg
          echo "::notice::Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID secrets"

  # ── GCP OIDC Deployment ────────────────────────────────────────────────────
  deploy-gcp:
    name: Deploy via GCP Workload Identity
    runs-on: ubuntu-latest
    if: inputs.provider == 'gcp'
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-gcp-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # No service account key JSON needed - WIF handles auth

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2

      - name: Verify GCP identity
        run: |
          gcloud auth list
          echo "Using Workload Identity Federation - no service account key required"

      - name: Deploy to GCP (${{ inputs.environment }})
        run: |
          echo "Deploying to GCP ${{ inputs.environment }}..."
          # Example: Cloud Run, GKE, App Engine
          # gcloud run deploy devonn-${{ inputs.environment }} --image gcr.io/PROJECT/devonn:${{ github.sha }}
          echo "::notice::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets"

  # ── Cloudflare Workers OIDC Deployment ────────────────────────────────────
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: inputs.provider == 'cloudflare'
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-cf-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV="${{ inputs.environment }}"
          echo "Deploying to Cloudflare Workers ($ENV)..."
          # npx wrangler deploy --env $ENV
          # For OIDC-based auth (when available):
          # npx wrangler deploy --env $ENV --var GITHUB_SHA:${{ github.sha }}
          echo "::notice::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"
          echo "::notice::See: https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/"
