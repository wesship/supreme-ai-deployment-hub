name: Platform Self-Healing v2

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:
    inputs:
      healing_mode:
        description: 'Healing mode (auto|report-only)'
        required: false
        default: 'auto'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: self-healing
  cancel-in-progress: false

jobs:
  detect-and-heal:
    name: Detect Platform Drift & Auto-Heal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml --quiet

      - name: Detect platform drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, json, requests, yaml, glob
          from datetime import datetime, timezone

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          issues = []
          print("PLATFORM SELF-HEALING v2 - DRIFT DETECTION")
          print(f"Time: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}")
          print("=" * 55)

          # 1. Check for YAML-invalid workflows
          print("\n[1] Scanning workflow YAML validity...")
          yaml_errors = []
          for wf in glob.glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(wf).read())
              except yaml.YAMLError as e:
                  yaml_errors.append({"file": wf, "error": str(e)[:120]})
          if yaml_errors:
              issues.append({"type": "yaml_errors", "count": len(yaml_errors), "details": yaml_errors})
              print(f"  FAIL: {len(yaml_errors)} YAML errors found")
          else:
              wf_count = len(glob.glob(".github/workflows/*.yml"))
              print(f"  PASS: All {wf_count} workflows valid")

          # 2. Check for fake/repeating-byte SHA pins
          print("\n[2] Scanning for invalid SHA pins...")
          import re
          fake_sha_pattern = re.compile(r'([0-9a-f]{2})\1{8,}')
          sha_issues = []
          for wf in glob.glob(".github/workflows/*.yml"):
              content = open(wf).read()
              for line in content.split('\n'):
                  if 'uses:' in line and '@' in line:
                      sha_part = line.split('@')[-1].split('#')[0].strip()
                      if len(sha_part) == 40 and fake_sha_pattern.search(sha_part):
                          sha_issues.append({"file": wf, "line": line.strip()[:80]})
          if sha_issues:
              issues.append({"type": "fake_sha_pins", "count": len(sha_issues), "details": sha_issues[:5]})
              print(f"  FAIL: {len(sha_issues)} fake SHA pins detected")
          else:
              print("  PASS: No fake SHA pins found")

          # 3. Check recent workflow run health
          print("\n[3] Checking recent CI run health...")
          try:
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/actions/runs?per_page=20&branch=main",
                  headers=headers, timeout=15
              )
              if r.status_code == 200:
                  runs = r.json().get("workflow_runs", [])
                  failed = [x for x in runs if x.get("conclusion") == "failure"]
                  success = [x for x in runs if x.get("conclusion") == "success"]
                  failure_rate = len(failed) / len(runs) * 100 if runs else 0
                  print(f"  Recent runs: {len(runs)} total, {len(success)} success, {len(failed)} failed")
                  print(f"  Failure rate: {failure_rate:.1f}%")
                  if failure_rate > 50:
                      issues.append({"type": "high_failure_rate", "rate": failure_rate, "failed_count": len(failed)})
                      print(f"  WARN: High failure rate detected ({failure_rate:.1f}%)")
                  else:
                      print(f"  PASS: Failure rate within acceptable range")
          except Exception as e:
              print(f"  SKIP: Could not fetch run data: {e}")

          # 4. Check for missing critical files
          print("\n[4] Checking critical platform files...")
          critical_files = [
              "ARCHITECTURE.md",
              ".npmrc",
              "package.json",
              "package-lock.json",
              ".github/dependabot.yml",
              "policy/opa/workflow/workflow_standards.rego",
              "policy/falco/devonn-rules.yaml",
              "compliance/soc2/control-mapping.yaml",
          ]
          missing = [f for f in critical_files if not os.path.exists(f)]
          if missing:
              issues.append({"type": "missing_critical_files", "files": missing})
              print(f"  FAIL: {len(missing)} critical files missing: {missing}")
          else:
              print(f"  PASS: All {len(critical_files)} critical files present")

          # 5. Check npm audit
          print("\n[5] Checking dependency CVEs...")
          import subprocess
          result = subprocess.run(
              ["npm", "audit", "--legacy-peer-deps", "--json"],
              capture_output=True, text=True, timeout=60
          )
          try:
              audit = json.loads(result.stdout)
              vuln_count = audit.get("metadata", {}).get("vulnerabilities", {})
              critical = vuln_count.get("critical", 0)
              high = vuln_count.get("high", 0)
              if critical > 0 or high > 0:
                  issues.append({"type": "cve_vulnerabilities", "critical": critical, "high": high})
                  print(f"  FAIL: {critical} critical, {high} high CVEs found")
              else:
                  total = sum(vuln_count.values()) if isinstance(vuln_count, dict) else 0
                  print(f"  PASS: 0 critical/high CVEs (total: {total})")
          except Exception:
              print("  SKIP: Could not parse npm audit output")

          # Save drift report
          drift_report = {
              "generated": datetime.now(timezone.utc).isoformat(),
              "issues_found": len(issues),
              "issues": issues,
              "platform_healthy": len(issues) == 0,
          }
          with open("/tmp/drift-report.json", "w") as f:
              json.dump(drift_report, f, indent=2)

          print(f"\n{'='*55}")
          print(f"DRIFT SUMMARY: {len(issues)} issue(s) found")
          print(f"Platform healthy: {drift_report['platform_healthy']}")

          # Set output for next step
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as gh_out:
              gh_out.write(f"issues_found={len(issues)}\n")
              gh_out.write(f"platform_healthy={str(drift_report['platform_healthy']).lower()}\n")
          PYEOF

      - name: Auto-heal detected issues
        if: steps.drift.outputs.issues_found != '0' && inputs.healing_mode != 'report-only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os, json, requests
          from datetime import datetime, timezone

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          try:
              drift = json.load(open("/tmp/drift-report.json"))
          except Exception:
              print("No drift report found")
              exit(0)

          issues = drift.get("issues", [])
          if not issues:
              print("No issues to heal")
              exit(0)

          print(f"AUTO-HEALING {len(issues)} issue(s)...")

          # Create healing issue
          issue_lines = [
              "## Platform Self-Healing Report",
              "",
              f"Detected at: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              f"Issues found: {len(issues)}",
              "",
              "### Issues Detected",
              "",
          ]
          for issue in issues:
              itype = issue.get("type", "unknown")
              if itype == "yaml_errors":
                  issue_lines.append(f"- **YAML Errors**: {issue['count']} workflow(s) have invalid YAML")
              elif itype == "fake_sha_pins":
                  issue_lines.append(f"- **Fake SHA Pins**: {issue['count']} invalid SHA pin(s) detected")
              elif itype == "high_failure_rate":
                  issue_lines.append(f"- **High CI Failure Rate**: {issue['rate']:.1f}% of recent runs failed")
              elif itype == "missing_critical_files":
                  issue_lines.append(f"- **Missing Files**: {', '.join(issue['files'])}")
              elif itype == "cve_vulnerabilities":
                  issue_lines.append(f"- **CVEs**: {issue['critical']} critical, {issue['high']} high")

          issue_lines += [
              "",
              f"### Actions",
              "",
              "- [ ] Review and resolve each issue above",
              "- [ ] Re-run self-healing workflow to confirm resolution",
              "",
              f"Run: https://github.com/{repo}/actions/runs/{run_id}",
          ]

          r = requests.post(
              f"https://api.github.com/repos/{repo}/issues",
              headers=headers,
              json={
                  "title": f"[Self-Healing] Platform drift detected - {len(issues)} issue(s)",
                  "body": "\n".join(issue_lines),
                  "labels": ["self-healing", "automated", "platform-health"],
              },
              timeout=10
          )
          print(f"Healing issue created: HTTP {r.status_code}")
          if r.status_code == 201:
              print(f"Issue URL: {r.json().get('html_url')}")
          PYEOF

      - name: Upload drift report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: self-healing-report-${{ github.run_id }}
          path: /tmp/drift-report.json
          retention-days: 30

      - name: Platform health gate
        run: |
          python3 - << 'PYEOF'
          import json
          try:
              report = json.load(open("/tmp/drift-report.json"))
              issues = report.get("issues", [])
              # Only fail the workflow for critical issues (YAML errors or fake SHAs)
              critical = [i for i in issues if i.get("type") in ("yaml_errors", "fake_sha_pins")]
              if critical:
                  print(f"CRITICAL platform issues detected: {[i['type'] for i in critical]}")
                  exit(1)
              elif issues:
                  print(f"Non-critical issues detected ({len(issues)}): platform healthy enough to continue")
              else:
                  print("Platform health: EXCELLENT - no drift detected")
          except Exception as e:
              print(f"Could not evaluate health gate: {e}")
          PYEOF
