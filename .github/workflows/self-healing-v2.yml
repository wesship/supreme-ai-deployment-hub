name: Platform Self-Healing v2

on:
  workflow_dispatch:
    inputs:
      healing_mode:
        description: 'Healing mode (report-only recommended)'
        required: false
        default: 'report-only'
        type: choice
        options: [report-only, auto]

permissions:
  contents: read
  issues: write

concurrency:
  group: self-healing
  cancel-in-progress: false

jobs:
  self-healing-control:
    name: Manual Self-Healing Control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record requested mode
        run: |
          echo "Self-healing is manual-only to conserve GitHub Actions minutes."
          echo "Requested mode: ${{ github.event.inputs.healing_mode }}"
          echo "Use report-only unless a verified production incident requires intervention."
