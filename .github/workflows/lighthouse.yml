name: Lighthouse CI

# Runs performance, accessibility, SEO, and best-practices audits on every PR.
# Blocks merges if Lighthouse scores drop below the defined thresholds.
# The repo already has a lighthouse-config.json — this workflow activates it.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Serve production build
        run: |
          npm install -g serve
          serve -s dist -l 4173 &
          # Wait for server to be ready
          npx wait-on http://localhost:4173 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          # Use inline assertions instead of configPath to avoid startServerCommand conflict
          # (the server is already started above)
          assertConfig: |
            assertions:
              categories:performance:
                - warn
                - minScore: 0.7
              categories:accessibility:
                - warn
                - minScore: 0.8
              categories:best-practices:
                - warn
                - minScore: 0.8
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14
