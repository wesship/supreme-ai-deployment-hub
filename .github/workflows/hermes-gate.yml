name: Hermes Production Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/hermes/**"
      - "backend/ai_films/hermes_*.py"
      - "backend/tests/test_hermes_*.py"
      - "backend/tests/test_ai_films_hermes_mastering_bridge.py"
      - "supabase/migrations/*hermes*.sql"
      - "tests/test_hermes_*.py"
      - ".github/workflows/hermes-gate.yml"
      - ".github/workflows/hermes-v3-gate.yml"
  push:
    branches: [main]
    paths:
      - "backend/hermes/**"
      - "backend/ai_films/hermes_*.py"
      - "backend/tests/test_hermes_*.py"
      - "backend/tests/test_ai_films_hermes_mastering_bridge.py"
      - "supabase/migrations/*hermes*.sql"
      - "tests/test_hermes_*.py"
      - ".github/workflows/hermes-gate.yml"
      - ".github/workflows/hermes-v3-gate.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hermes-production-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Hermes contracts, recovery, workers, and database boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pinned backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Compile Hermes runtime
        run: python -m compileall -q backend/hermes backend/ai_films

      - name: Validate Hermes database and deployment boundary
        run: |
          python tests/test_hermes_production_gate.py
          python tests/test_hermes_upstream_release_gate.py

      - name: Run complete Hermes runtime suite
        env:
          REQUIRE_AUTH: "false"
          ALLOW_DEV_ADMIN_BYPASS: "false"
        run: >-
          python -m pytest -q
          backend/tests/test_hermes_*.py
          backend/tests/test_ai_films_hermes_mastering_bridge.py
