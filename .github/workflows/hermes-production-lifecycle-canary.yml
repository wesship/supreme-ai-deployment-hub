name: Hermes Production Lifecycle Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/hermes/**'
      - 'Dockerfile.hermes-worker'
      - 'supabase/migrations/*hermes*.sql'
      - 'scripts/hermes/production_lifecycle_canary.py'
      - '.github/workflows/hermes-production-lifecycle-canary.yml'

permissions:
  contents: read

concurrency:
  group: hermes-production-lifecycle-canary
  cancel-in-progress: false

jobs:
  certify:
    name: Persistent worker heartbeat, claim, lease, completion, release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_URL: 'https://tjygexesognbkwualywq.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_BASE_URL: 'https://api.d3vonn.io'
      HERMES_CANARY_TIMEOUT_SECONDS: '180'
      HERMES_CANARY_POLL_SECONDS: '5'
      HERMES_CANARY_MAX_HEARTBEAT_AGE_SECONDS: '120'
    steps:
      - name: Checkout certified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Require protected production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = "https://tjygexesognbkwualywq.supabase.co"
          test "$API_BASE_URL" = "https://api.d3vonn.io"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Run Hermes production lifecycle canary
        run: python scripts/hermes/production_lifecycle_canary.py
