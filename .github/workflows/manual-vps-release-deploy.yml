name: Manual VPS Release Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag or commit to deploy
        required: true
        default: v2.0.0
      run_diagnostics:
        description: Run 502 diagnostic after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-vps-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, d3vonn-vps]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate VPS runner
        run: |
          set -euo pipefail
          test -d /opt/supreme-ai-deployment-hub/.git || {
            echo "Missing deployment repository: /opt/supreme-ai-deployment-hub"
            exit 1
          }
          test -f /opt/supreme-ai-deployment-hub/deploy/vps/env/.env.production || {
            echo "Missing production environment file"
            exit 1
          }
          command -v docker >/dev/null
          docker compose version

      - name: Deploy release and validate
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail
          cd /opt/supreme-ai-deployment-hub

          git fetch --tags --prune
          git checkout --detach --force "$RELEASE_REF"

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            config >/dev/null

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            up -d --build

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            ps

          curl --fail --show-error --silent --max-time 20 \
            http://127.0.0.1:8000/health/ready
          echo

          curl --fail --show-error --silent --max-time 30 \
            https://api.d3vonn.io/health/ready
          echo

          if [ "$RUN_DIAGNOSTICS" = "true" ]; then
            bash deploy/vps/scripts/diagnose-502.sh \
              | tee /tmp/d3vonn-502-diagnosis.txt
          fi
