name: Manual VPS Release Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Semver tag (v1.2.3) or full 40-character commit SHA
        required: true
        default: v2.0.0
      run_diagnostics:
        description: Run 502 diagnostic after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-vps-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate deployment input and required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing production secret: VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing production secret: VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing production secret: VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "Missing production secret: VPS_SSH_KNOWN_HOSTS"; exit 1; }

          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
             && [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release_ref. Use a semver tag such as v2.0.0 or a full 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Configure SSH with pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Deploy release and validate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail

          printf -v release_ref_q '%q' "$RELEASE_REF"
          printf -v run_diagnostics_q '%q' "$RUN_DIAGNOSTICS"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- $release_ref_q $run_diagnostics_q" <<'REMOTE'
          set -euo pipefail

          RELEASE_REF="$1"
          RUN_DIAGNOSTICS="$2"
          readonly RELEASE_REF RUN_DIAGNOSTICS

          cd /opt/supreme-ai-deployment-hub

          git fetch --tags --prune
          git rev-parse --verify --end-of-options "${RELEASE_REF}^{commit}" >/dev/null
          RESOLVED_COMMIT="$(git rev-parse --verify --end-of-options "${RELEASE_REF}^{commit}")"
          git checkout --detach "$RESOLVED_COMMIT"

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            config >/dev/null

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            up -d --build

          docker compose \
            --env-file deploy/vps/env/.env.production \
            -f deploy/vps/docker-compose.yml \
            ps

          curl --fail --show-error --silent --max-time 20 \
            http://127.0.0.1:8000/health/ready
          echo

          curl --fail --show-error --silent --max-time 30 \
            https://api.d3vonn.io/health/ready
          echo

          if [ "$RUN_DIAGNOSTICS" = "true" ]; then
            bash deploy/vps/scripts/diagnose-502.sh \
              | tee /tmp/d3vonn-502-diagnosis.txt
          fi
          REMOTE
