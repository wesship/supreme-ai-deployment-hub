name: Manual VPS Release Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Protected main commit SHA, main, or release tag to deploy
        required: true
        default: main
      run_diagnostics:
        description: Run 502 diagnostic after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-vps-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy protected release on Hostinger
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate deployment request
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "main" ]] && \
             [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] && \
             [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be main, a full lowercase SHA, or a semver-style vX.Y.Z tag"
            exit 1
          fi
          [[ "$RUN_DIAGNOSTICS" == "true" || "$RUN_DIAGNOSTICS" == "false" ]]

      - name: Check out requested release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify release is reachable from protected main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release $release_sha is outside protected main; deployment denied."
            exit 1
          }
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "VERIFIED_MAIN_RELEASE $release_sha"

      - name: Validate restricted deployment wrapper
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release --check

      - name: Deploy release and validate
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release \
            "$GITHUB_WORKSPACE" "$RELEASE_SHA" "$RUN_DIAGNOSTICS"
