name: Manual VPS Release Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Protected main commit SHA or release tag to deploy
        required: true
        default: v2.0.0
      run_diagnostics:
        description: Run 502 diagnostic after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-vps-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, d3vonn-vps]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate deployment request
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] && \
             [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be a full lowercase commit SHA or semver-style vX.Y.Z tag"
            exit 1
          fi
          [[ "$RUN_DIAGNOSTICS" == "true" || "$RUN_DIAGNOSTICS" == "false" ]] || {
            echo "run_diagnostics must be true or false"
            exit 1
          }

      - name: Validate restricted deployment wrapper
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release --check

      - name: Deploy release and validate
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_DIAGNOSTICS: ${{ inputs.run_diagnostics }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/d3vonn-deploy-release \
            "$RELEASE_REF" "$RUN_DIAGNOSTICS"
