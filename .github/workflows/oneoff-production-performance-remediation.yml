name: One-off Production Performance Remediation

on:
  push:
    branches:
      - perf/production-performance-remediation

permissions:
  contents: read

concurrency:
  group: oneoff-production-performance-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: perf/production-performance-remediation
          fetch-depth: 0

      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp

      - name: Optimize Lighthouse-critical assets and contracts
        run: python3 tools/oneoff_production_perf_remediation.py

      - name: Validate optimized production assets
        run: |
          set -euo pipefail
          test -s public/films/sovereign-signal-keyframe.webp
          test -s public/films/building-d3vonn-keyframe.webp
          test -s public/films/inside-hermes-keyframe.webp
          test -s public/films/guardian-keyframe.webp
          test -s public/films/ai-workforce-keyframe.webp
          test -s public/films/genesis-protocol-keyframe.webp
          test -s public/d3vonn-enterprise-core.webp
          ! grep -q -- '-keyframe.png' src/features/ai-films/catalog.ts
          grep -q 'reportOnlyPolicy = cspFor(nonce, true)' middleware.ts
          git diff --check
          git diff -- src/features/ai-films/catalog.ts src/pages/Film.tsx tests/e2e/production-interaction-audit.spec.ts src/pages/Index.tsx src/components/Navbar.tsx src/pages/AIFilms.tsx middleware.ts lighthouse-config.json vercel.json > production-performance-remediation.patch
          du -h public/films/*-keyframe.webp public/d3vonn-enterprise-core.webp

      - name: Upload remediation payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-performance-remediation
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
          path: |
            src/features/ai-films/catalog.ts
            src/pages/Film.tsx
            tests/e2e/production-interaction-audit.spec.ts
            src/pages/Index.tsx
            src/components/Navbar.tsx
            src/pages/AIFilms.tsx
            middleware.ts
            lighthouse-config.json
            vercel.json
            public/films/sovereign-signal-keyframe.webp
            public/films/building-d3vonn-keyframe.webp
            public/films/inside-hermes-keyframe.webp
            public/films/guardian-keyframe.webp
            public/films/ai-workforce-keyframe.webp
            public/films/genesis-protocol-keyframe.webp
            public/d3vonn-enterprise-core.webp
            production-performance-remediation.patch
