name: AI FILMS Performance Transfer Canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_PERFORMANCE_CANARY to authorize one paid bounded canary'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-films-performance-transfer-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Protected one-shot performance-transfer canary
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      SUPABASE_PROJECT_REF: 'tjygexesognbkwualywq'
      SUPABASE_URL: 'https://tjygexesognbkwualywq.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      TWELVELABS_API_KEY: ${{ secrets.TWELVELABS_API_KEY }}
      TWELVELABS_KNOWLEDGE_STORE_ID: ${{ secrets.TWELVELABS_KNOWLEDGE_STORE_ID }}
      AI_FILMS_PERFORMANCE_CANARY_SOURCE_URL: ${{ secrets.AI_FILMS_PERFORMANCE_CANARY_SOURCE_URL }}
      AI_FILMS_PERFORMANCE_CANARY_PROJECT_ID: 'b2979e7c-1d28-4024-bf4f-8db90c174d5a'
      AI_FILMS_PERFORMANCE_CANARY_OWNER_ID: '80f20fbd-c1d0-4dde-9d6e-052d23edcb3f'
      AI_FILMS_PERFORMANCE_CANARY_REFERENCE_ASSET_ID: 'c48af5af-3fe0-442d-8f73-b6f183b69743'
      AI_FILMS_PERFORMANCE_CANARY_CHARACTER_ID: 'legend'
      AI_FILMS_PERFORMANCE_CANARY_MAX_SECONDS: '4'
      AI_FILM_REPLICATE_PERFORMANCE_MODEL: '24ca61404731a06db1bbe669fd90ea2f5f3de8969b01e75244c189442e636923'
      AI_FILM_REPLICATE_PERFORMANCE_INPUT_MAP_JSON: '{"driving_video_url":"video","reference_image_url":"image"}'
      AI_FILM_PERFORMANCE_AUTO_RETRY_ENABLED: 'false'
      AI_FILM_PERFORMANCE_QA_ENABLED: 'true'
      RAILWAY_ENVIRONMENT_NAME: 'production'
    steps:
      - name: Require explicit paid-canary confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PERFORMANCE_CANARY"

      - name: Checkout certified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Require protected production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "tjygexesognbkwualywq"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$REPLICATE_API_TOKEN"
          test -n "$TWELVELABS_API_KEY"
          test -n "$AI_FILMS_PERFORMANCE_CANARY_SOURCE_URL"
          test "$AI_FILM_PERFORMANCE_AUTO_RETRY_ENABLED" = "false"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Run exactly one bounded performance-transfer canary
        run: python scripts/ai_films/production_performance_transfer_canary.py
