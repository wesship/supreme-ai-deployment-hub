name: Dependabot Auto-Merge Guard

# Blocks auto-merge on risky major-version bumps. Allows patch/minor.
# Dangerous majors currently tracked: tailwindcss v3->v4, vite v5->v8,
# react-day-picker v8->v9, react 18->19, react-router-dom 6->7,
# @tanstack/react-query 4->5, zod 3->4.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: dependabot-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7  # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES:   ${{ steps.meta.outputs.dependency-names }}
        run: |
          echo "type=$UPDATE_TYPE deps=$DEP_NAMES"
          BLOCKLIST="tailwindcss vite react-day-picker react react-dom react-router react-router-dom @tanstack/react-query zod next typescript eslint"
          BLOCK=0
          REASON=""
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            BLOCK=1
            REASON="major version bump"
          fi
          for dep in $DEP_NAMES; do
            for bad in $BLOCKLIST; do
              if [ "$dep" = "$bad" ] && [ "$UPDATE_TYPE" != "version-update:semver-patch" ]; then
                BLOCK=1
                REASON="watched package ($dep) non-patch"
              fi
            done
          done
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Remove auto-merge label if risky
        if: steps.decide.outputs.block == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPOSITORY" --remove-label "auto-merge" || true
          gh pr edit "$PR" --repo "$REPOSITORY" --add-label "needs-manual-review" || true
          gh pr comment "$PR" --repo "$REPOSITORY" --body "🛑 Auto-merge blocked by **dependabot-auto-merge-guard**: ${{ steps.decide.outputs.reason }}. A maintainer must review and merge manually."

      - name: Approve safe patches
        if: steps.decide.outputs.block == '0' && steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPOSITORY" --add-label "auto-merge" || true
          gh pr comment "$PR" --repo "$REPOSITORY" --body "✅ Safe patch bump - auto-merge eligible."
