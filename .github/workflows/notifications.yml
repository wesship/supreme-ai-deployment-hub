name: Platform Notifications (Manual Only)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Custom alert message'
        required: false
        default: 'Manual notification test'
      severity:
        description: 'Severity (info/warning/critical)'
        required: false
        default: 'info'

permissions:
  contents: read

jobs:
  manual-notice:
    name: Manual notification status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "Platform Slack/Teams notifications are manual-only."
          echo "Railway, Vercel, production smoke checks, and Gmail monitoring remain active."
          echo "Message: ${{ github.event.inputs.message }}"
          echo "Severity: ${{ github.event.inputs.severity }}"
