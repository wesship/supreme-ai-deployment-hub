name: Auto-merge Snyk Security PRs (archived manual lane)

# Legacy Snyk auto-merge is disabled. Security dependency PRs must pass the
# canonical required gate and be reviewed before GitHub native auto-merge is
# enabled on that individual pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Explain Snyk merge policy
    runs-on: ubuntu-latest
    steps:
      - name: Security merge policy
        run: |
          echo "Snyk branch updates and repository-wide auto-merge are disabled."
          echo "Review the dependency diff and enable native auto-merge only after required checks pass."
          echo "Do not add pull_request triggers or write permissions to this workflow."
