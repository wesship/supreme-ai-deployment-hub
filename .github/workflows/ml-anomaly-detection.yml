name: ML-Based Anomaly Detection (Manual Only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Detection mode'
        required: false
        default: 'monitor'
        type: choice
        options: [monitor, retrain, report]

permissions:
  contents: read

jobs:
  anomaly-status:
    name: Anomaly detection status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "ML anomaly detection is manual-only to conserve GitHub Actions minutes."
          echo "Selected mode: ${{ github.event.inputs.mode }}"
