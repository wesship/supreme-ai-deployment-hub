name: AI Films Staging Preview Once

on:
  push:
    branches:
      - ops/ai-films-staging-preview-20260719
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-films-supabase-staging-preview-once
  cancel-in-progress: false

jobs:
  preview:
    name: Preview AI Films on staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate staging secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Supabase staging secret::${name} is not configured in the staging environment."
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify Supabase CLI version
        run: test "$(supabase --version)" = "2.109.1"

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Lint database schema
        run: supabase db lint --linked --level warning

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm preview-only execution
        run: echo "Preview complete. No migrations were applied and no Edge Function was deployed."
