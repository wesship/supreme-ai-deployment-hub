name: PRIMETIME Release 2 Security Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - '.github/workflows/primetime-release2-security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: primetime-release2-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0,AGPL-3.0

  grype:
    name: Grype High/Critical Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_VERSION: '0.112.0'
      GRYPE_LINUX_AMD64_SHA256: 'acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate repository SBOM
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b
        with:
          path: '.'
          format: spdx-json
          output-file: repository-sbom.spdx.json
          upload-artifact: false

      - name: Install pinned Grype CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${GRYPE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" grype
          install -m 0755 grype /usr/local/bin/grype

      - name: Scan and enforce high-severity threshold
        shell: bash
        run: |
          set -euo pipefail
          grype "sbom:repository-sbom.spdx.json" --output json > grype-results.json
          grype "sbom:repository-sbom.spdx.json" --output sarif > grype-results.sarif
          grype "sbom:repository-sbom.spdx.json" --fail-on high

      - name: Preserve Grype evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primetime-release2-grype-${{ github.run_id }}
          path: |
            repository-sbom.spdx.json
            grype-results.json
            grype-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload Grype SARIF
        if: always() && hashFiles('grype-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        with:
          sarif_file: grype-results.sarif
          category: primetime-release2-grype
