name: Playwright E2E Audit

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser scope to test
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

concurrency:
  group: e2e-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_API_URL: https://api.d3vonn.io
  VITE_SUPABASE_URL: https://tjygexesognbkwualywq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  e2e:
    name: Playwright E2E Audit (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate E2E Supabase configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "Missing required GitHub Actions secret: VITE_SUPABASE_PUBLISHABLE_KEY" >&2
            exit 1
          }

      - name: Install selected Playwright browser dependencies
        shell: bash
        run: |
          case "${{ inputs.browser }}" in
            chromium|firefox|webkit)
              pnpm exec playwright install --with-deps "${{ inputs.browser }}"
              ;;
            all)
              pnpm exec playwright install --with-deps chromium firefox webkit
              ;;
            *)
              echo "Unsupported browser selection: ${{ inputs.browser }}" >&2
              exit 1
              ;;
          esac

      - name: Build application
        run: pnpm run build

      - name: Run Playwright E2E tests
        shell: bash
        env:
          CI: "true"
        run: |
          if [ "${{ inputs.browser }}" = "all" ]; then
            pnpm exec playwright test
          else
            pnpm exec playwright test --project="${{ inputs.browser }}"
          fi

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-${{ inputs.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
