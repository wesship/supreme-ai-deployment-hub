name: Playwright E2E Audit

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser scope to test
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
  push:
    branches:
      - fix/supabase-readiness

concurrency:
  group: e2e-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Audit (${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install selected Playwright browser dependencies
        shell: bash
        run: |
          case "$TEST_BROWSER" in
            chromium|firefox|webkit)
              pnpm exec playwright install --with-deps "$TEST_BROWSER"
              ;;
            all)
              pnpm exec playwright install --with-deps chromium firefox webkit
              ;;
            *)
              echo "Unsupported browser selection: $TEST_BROWSER" >&2
              exit 1
              ;;
          esac

      - name: Build application
        run: pnpm run build
        env:
          VITE_API_URL: https://api.d3vonn.io
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Run Playwright local E2E tests
        shell: bash
        env:
          CI: "true"
          VITE_API_URL: https://api.d3vonn.io
          VITE_RUM_ENABLED: "false"
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
        run: |
          # This workflow certifies the locally served frontend only.
          # Do not add specs that assert Vercel/nginx headers, deployed /health,
          # production credentials, live providers, or backend runtime behavior.
          # Those belong in their dedicated deployment/production workflows.
          LOCAL_SPECS="tests/e2e/home.spec.ts tests/e2e/homepage-hash-deeplink.spec.ts tests/e2e/public-smoke.spec.ts tests/e2e/voice-studio-mount.spec.ts tests/e2e/specs/auth.spec.ts tests/e2e/specs/navbar-protected-routes.spec.ts tests/e2e/specs/public-site-reliability.spec.ts"
          if [ "$TEST_BROWSER" = "all" ]; then
            pnpm exec playwright test $LOCAL_SPECS
          else
            pnpm exec playwright test $LOCAL_SPECS --project="$TEST_BROWSER"
          fi

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e-${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all' }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
