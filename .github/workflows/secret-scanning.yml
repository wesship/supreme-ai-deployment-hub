name: Secret Scanning (Gitleaks)

# Full-history secret scanning runs weekly or on demand. The canonical required
# PR gate owns lightweight secret checks for ordinary pull requests.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks full-history scan
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --exit-code=1 \
            --report-format sarif \
            --report-path results.sarif

      - name: Upload Gitleaks report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-sarif-${{ github.sha }}
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload SARIF to GitHub code scanning
        if: always() && vars.ENABLE_GHAS_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9
        with:
          sarif_file: results.sarif
          category: gitleaks

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@8feb77b20aeb64366d106b08f2941287755c173b
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
