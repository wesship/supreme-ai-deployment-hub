name: AI Model Pipeline

# Validates, builds, and deploys AI model containers (Mistral-7B via HuggingFace TGI).
# Runs OPA governance policy checks before any model image is pushed or deployed.
#
# Required secrets:
#   AWS_ROLE_ARN           — OIDC role for ECR push
#   ECR_REGISTRY           — AWS ECR registry URI
#   HUGGINGFACE_TOKEN      — HuggingFace token for gated model access

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'policy/ai_model_governance.rego'
      - '.github/workflows/ai-model-pipeline.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'policy/ai_model_governance.rego'
  workflow_dispatch:
    inputs:
      model:
        description: "Model directory to build (e.g., llm/mistral-7b)"
        required: true
        default: "llm/mistral-7b"

concurrency:
  group: ai-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. OPA Governance Check ────────────────────────────────────────────────
  governance-check:
    name: OPA Governance Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Run AI governance policy against all model configs
        run: |
          FAIL=0
          for model_dir in models/llm/*/; do
            config_file="$model_dir/deployment.json"
            if [ ! -f "$config_file" ]; then
              echo "::warning::No deployment.json found in $model_dir — skipping governance check"
              continue
            fi
            echo "Checking governance policy for: $model_dir"
            RESULT=$(opa eval \
              --data policy/ai_model_governance.rego \
              --input "$config_file" \
              --format raw \
              "data.devonn.ai.governance.deny")
            DENIALS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
            if [ "$DENIALS" -gt "0" ]; then
              echo "::error::Governance policy DENIED for $model_dir:"
              echo "$RESULT" | python3 -c "import sys,json; [print('  ✗', r) for r in json.load(sys.stdin)]"
              FAIL=1
            else
              echo "  ✓ Governance check passed for $model_dir"
            fi
          done
          exit $FAIL

      - name: Run OPA policy tests
        run: |
          if ls policy/*_test.rego 1>/dev/null 2>&1; then
            opa test policy/ --verbose
          else
            echo "No OPA test files found — skipping"
          fi

  # ── 2. Build and Push Model Container ─────────────────────────────────────
  build-model:
    name: Build Model Container (${{ github.event.inputs.model || 'llm/mistral-7b' }})
    runs-on: ubuntu-latest
    needs: governance-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push model image
        uses: docker/build-push-action@v6
        with:
          context: models/${{ github.event.inputs.model || 'llm/mistral-7b' }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devonn-mistral-7b:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/devonn-mistral-7b:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}

      - name: Scan model image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/devonn-mistral-7b:${{ github.sha }}
          format: sarif
          output: trivy-model-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-model-results.sarif
