name: AI FILMS Production Mastering Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.railway'
      - 'Dockerfile.hermes-worker'
      - 'backend/Dockerfile'
      - 'backend/requirements.txt'
      - 'requirements.txt'
      - 'backend/ai_films/canary.py'
      - 'backend/ai_films/camera_color.py'
      - 'backend/ai_films/color_management.py'
      - 'backend/ai_films/frame_sequence.py'
      - 'backend/ai_films/mastering_worker.py'
      - 'backend/tests/test_ai_films_mastering_worker_binary_paths.py'
      - 'scripts/ai_films/production_mastering_canary.py'
      - '.github/workflows/ai-films-production-mastering-canary.yml'

permissions:
  contents: read

concurrency:
  group: ai-films-production-mastering-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Zero-cost production mastering control-plane canary
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      SUPABASE_PROJECT_REF: 'tjygexesognbkwualywq'
      SUPABASE_URL: 'https://tjygexesognbkwualywq.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_FILMS_CANARY_TIMEOUT_SECONDS: '900'
      AI_FILMS_CANARY_POLL_SECONDS: '5'
    steps:
      - name: Checkout certified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Require production control-plane credentials
        run: |
          test "$SUPABASE_PROJECT_REF" = "tjygexesognbkwualywq"
          test "$SUPABASE_URL" = "https://tjygexesognbkwualywq.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Run zero-provider-credit mastering canary
        run: python scripts/ai_films/production_mastering_canary.py
