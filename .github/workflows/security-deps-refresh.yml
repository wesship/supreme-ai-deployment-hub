name: Security Dependency Refresh

on:
  push:
    branches:
      - fix/supabase-readiness
    paths:
      - '.github/workflows/security-deps-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/supabase-readiness
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Refresh vulnerable dependency graph
        run: |
          pnpm up react-router-dom@7.18.3 @vitest/coverage-v8@4.1.10
          pnpm pkg set pnpm.overrides.fast-uri=3.1.6
          pnpm pkg set pnpm.overrides.esbuild=0.28.1
          pnpm install --no-frozen-lockfile
      - name: Show resulting versions
        run: |
          node -e "const p=require('./package.json'); console.log({reactRouterDom:p.dependencies['react-router-dom'], coverage:p.devDependencies['@vitest/coverage-v8'], overrides:p.pnpm?.overrides})"
          pnpm why react-router react-router-dom fast-uri esbuild @vitest/coverage-v8
      - name: Upload refreshed manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-dependency-refresh
          path: |
            package.json
            pnpm-lock.yaml
          retention-days: 1
      - name: Export refreshed manifests to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Dependency manifests already refreshed."
            exit 0
          fi
          git commit -m "fix(security): refresh vulnerable dependencies"
          git push --force origin HEAD:refs/heads/chore/security-deps-refresh-output
