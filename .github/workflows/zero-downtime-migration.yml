name: Zero-Downtime Migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/alembic/**'
      - 'supabase/migrations/**'
      - 'database/**'
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/alembic/**'
      - 'supabase/migrations/**'
      - 'database/**'
  workflow_dispatch:
    inputs:
      migration_target:
        description: 'Migration target (supabase|postgres|all)'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run only (true|false)'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write

concurrency:
  group: zero-downtime-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-migrations:
    name: Validate Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install migration tools
        run: pip install alembic sqlparse pyyaml --quiet

      - name: Collect changed migration files
        id: migration_files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$BEFORE_SHA"
              head="$CURRENT_SHA"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-parse "${head}^")"
              fi
              ;;
            workflow_dispatch)
              head="$CURRENT_SHA"
              base="$(git rev-parse "${head}^")"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "Comparing migration changes: $base..$head"
          git diff --name-only --diff-filter=ACMR "$base" "$head" -- \
            backend/migrations backend/alembic supabase/migrations database \
            | grep -E '^(backend/migrations/|backend/alembic/|supabase/migrations/|database/).+\.(sql|py)$' \
            | sort -u > /tmp/migration-files.txt || true

          count="$(wc -l < /tmp/migration-files.txt | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Migration files selected: $count"
          if [[ "$count" -gt 0 ]]; then
            cat /tmp/migration-files.txt
          fi

      - name: Scan migrations for data-loss operations
        id: migration_scan
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          print("ZERO-DOWNTIME MIGRATION SAFETY SCANNER")
          print(f"Time: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}")
          print("=" * 55)

          destructive_patterns = [
              (r'\bDROP\s+TABLE\b',        "CRITICAL", "DROP TABLE"),
              (r'\bDROP\s+COLUMN\b',       "CRITICAL", "DROP COLUMN"),
              (r'\bTRUNCATE\b',            "CRITICAL", "TRUNCATE"),
              (r'\bDELETE\s+FROM\b',       "HIGH",     "DELETE FROM (bulk)"),
              (r'\bDROP\s+INDEX\b',        "MEDIUM",   "DROP INDEX"),
              (r'\bALTER\s+COLUMN\b',      "MEDIUM",   "ALTER COLUMN (type change)"),
              (r'\bNOT\s+NULL\b',          "LOW",      "NOT NULL constraint added"),
              (r'\bDROP\s+CONSTRAINT\b',   "MEDIUM",   "DROP CONSTRAINT"),
          ]

          def strip_sql_comments(content: str) -> str:
              content = re.sub(r'/\*.*?\*/', ' ', content, flags=re.DOTALL)
              return re.sub(r'--[^\n]*', ' ', content)

          def normalize_non_destructive_sql(content: str) -> str:
              # ALTER PUBLICATION ... DROP TABLE removes a table from logical
              # replication; it does not delete the table or its data.
              content = re.sub(
                  r'\bALTER\s+PUBLICATION\s+\S+\s+DROP\s+TABLE\b',
                  'ALTER PUBLICATION __PUBLICATION__ REMOVE TABLE',
                  content,
                  flags=re.IGNORECASE,
              )
              # TRUNCATE is also a PostgreSQL table privilege. GRANT/REVOKE of
              # that privilege changes authorization only; it does not truncate
              # data. Normalize the privilege token before destructive scanning
              # while leaving executable TRUNCATE statements detectable.
              content = re.sub(
                  r'\b(REVOKE|GRANT)\s+TRUNCATE\b',
                  r'\1 __TRUNCATE_PRIVILEGE__',
                  content,
                  flags=re.IGNORECASE,
              )
              return content

          file_list = Path('/tmp/migration-files.txt')
          files = [
              Path(line.strip())
              for line in file_list.read_text().splitlines()
              if line.strip()
          ] if file_list.exists() else []

          all_issues = []
          files_scanned = 0

          for migration_file in files:
              if not migration_file.is_file():
                  print(f"  [WARNING] Changed migration file is unavailable: {migration_file}")
                  continue

              files_scanned += 1
              raw_content = migration_file.read_text(encoding='utf-8')
              scan_content = raw_content
              if migration_file.suffix.lower() == '.sql':
                  scan_content = strip_sql_comments(scan_content)
                  scan_content = normalize_non_destructive_sql(scan_content)
              scan_content = scan_content.upper()

              file_issues = []
              for pattern, severity, label in destructive_patterns:
                  if re.search(pattern, scan_content, re.IGNORECASE):
                      file_issues.append({"severity": severity, "operation": label})

              if migration_file.suffix.lower() == '.py' and 'def upgrade' in raw_content:
                  if 'def downgrade' not in raw_content:
                      file_issues.append({
                          "severity": "HIGH",
                          "operation": "Missing downgrade() function",
                      })
                  elif 'pass' in raw_content.split('def downgrade', 1)[1][:100]:
                      file_issues.append({
                          "severity": "MEDIUM",
                          "operation": "Empty downgrade() function",
                      })

              if file_issues:
                  all_issues.append({"file": str(migration_file), "issues": file_issues})
                  for issue in file_issues:
                      print(f"  [{issue['severity']}] {migration_file}: {issue['operation']}")

          critical_issues = [
              issue
              for file_issues in all_issues
              for issue in file_issues["issues"]
              if issue["severity"] == "CRITICAL"
          ]
          high_issues = [
              issue
              for file_issues in all_issues
              for issue in file_issues["issues"]
              if issue["severity"] == "HIGH"
          ]

          report = {
              "generated": datetime.now(timezone.utc).isoformat(),
              "scan_scope": "changed_migrations",
              "files_scanned": files_scanned,
              "files_with_issues": len(all_issues),
              "critical_count": len(critical_issues),
              "high_count": len(high_issues),
              "issues": all_issues,
              "safe_to_deploy": len(critical_issues) == 0,
          }

          with open('/tmp/migration-safety-report.json', 'w', encoding='utf-8') as report_file:
              json.dump(report, report_file, indent=2)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output_file:
              output_file.write(
                  f"safe_to_deploy={'true' if report['safe_to_deploy'] else 'false'}\n"
              )
              output_file.write(f"files_scanned={files_scanned}\n")

          print(f"\nFiles scanned: {files_scanned}")
          print(f"Files with issues: {len(all_issues)}")
          print(f"Critical issues: {len(critical_issues)}")
          print(f"High issues: {len(high_issues)}")
          print(f"Safe to deploy: {report['safe_to_deploy']}")

          if not files:
              print("\nNo changed migration files found - safety gate has nothing to evaluate")
          elif report['safe_to_deploy']:
              print("\nMigration safety scan completed without critical findings")
          else:
              print("\nCritical findings recorded; final gate will block after artifacts upload")
          PYEOF

      - name: Validate zero-downtime migration patterns
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          print("ZERO-DOWNTIME PATTERN VALIDATION")
          print("=" * 45)

          checks = {
              "expand_contract": False,
              "concurrent_indexes": False,
              "backward_compatible": True,
              "rollback_scripts": False,
          }

          file_list = Path('/tmp/migration-files.txt')
          files = [
              Path(line.strip())
              for line in file_list.read_text().splitlines()
              if line.strip()
          ] if file_list.exists() else []

          for migration_file in files:
              if not migration_file.is_file():
                  continue
              if 'rollback' in migration_file.name.lower() or 'down' in migration_file.name.lower():
                  checks['rollback_scripts'] = True
              if migration_file.suffix.lower() != '.sql':
                  continue
              content = migration_file.read_text(encoding='utf-8').upper()
              if re.search(r'CREATE\s+INDEX\s+CONCURRENTLY', content):
                  checks['concurrent_indexes'] = True
              if re.search(r'ADD\s+COLUMN|CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS', content):
                  checks['expand_contract'] = True

          print("\nZero-Downtime Best Practices:")
          for check, status in checks.items():
              icon = "OK" if status else "N/A"
              print(f"  [{icon}] {check.replace('_', ' ').title()}")

          print("\nMigration pattern validation: COMPLETE")
          PYEOF

      - name: Generate migration execution plan
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime, timezone

          print("MIGRATION EXECUTION PLAN")
          print("=" * 45)

          steps = [
              "1. Pre-migration health check (verify DB connectivity)",
              "2. Create point-in-time backup snapshot",
              "3. Run migration in READ-ONLY mode (dry run)",
              "4. Apply expand phase (additive changes only)",
              "5. Deploy new application version",
              "6. Monitor for 10 minutes (error rate, latency)",
              "7. Apply contract phase (remove old columns/tables)",
              "8. Verify data integrity checksums",
              "9. Update migration registry",
          ]

          print("\nExecution steps:")
          for step in steps:
              print(f"  {step}")

          plan = {
              "generated": datetime.now(timezone.utc).isoformat(),
              "strategy": "expand-contract",
              "estimated_downtime_seconds": 0,
              "rollback_window_minutes": 30,
              "steps": steps,
          }

          with open('/tmp/migration-plan.json', 'w', encoding='utf-8') as plan_file:
              json.dump(plan, plan_file, indent=2)

          print(f"\nEstimated downtime: {plan['estimated_downtime_seconds']}s")
          print(f"Rollback window: {plan['rollback_window_minutes']} minutes")
          PYEOF

      - name: Upload migration artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: migration-plan-${{ github.run_id }}
          path: |
            /tmp/migration-safety-report.json
            /tmp/migration-plan.json
          retention-days: 90

      - name: Enforce migration safety gate
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          report_path = Path('/tmp/migration-safety-report.json')
          if not report_path.exists():
              raise SystemExit('Migration safety report was not generated; deployment blocked.')

          report = json.loads(report_path.read_text(encoding='utf-8'))
          if not report.get('safe_to_deploy', False):
              print('ERROR: Critical migration issues detected in changed files. Deployment blocked.')
              for file_issue in report.get('issues', []):
                  for issue in file_issue.get('issues', []):
                      if issue.get('severity') == 'CRITICAL':
                          print(f"  [CRITICAL] {file_issue['file']}: {issue['operation']}")
              raise SystemExit(1)

          print('Migration safety gate: PASSED')
          PYEOF
