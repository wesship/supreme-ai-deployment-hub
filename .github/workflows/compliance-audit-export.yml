name: Compliance and Audit Export (Manual Only)

on:
  workflow_dispatch:
    inputs:
      export_type:
        description: 'Export type'
        required: false
        default: 'full'
        type: choice
        options: [full, soc2-evidence, provenance-chain, deployment-timeline, vulnerability-history]

permissions:
  contents: read

jobs:
  compliance-status:
    name: Compliance export status
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only mode
        run: |
          echo "SOC 2 and audit exports are manual-only."
          echo "Requested export: ${{ github.event.inputs.export_type }}"
