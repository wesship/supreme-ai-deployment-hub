name: Promotion Validation

on:
  push:
    branches:
      - 'release/**'
      - 'wave/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-promotion-candidate:
    name: Validate promotion candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_ENVIRONMENT: staging
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Validate promotion doctrine files
        run: |
          test -f docs/WAVE_31_PRODUCTION_FREEZE.md
          test -f docs/RELEASE_GOVERNANCE_MATRIX.md
          test -f docs/ROLLBACK_MANIFEST_TEMPLATE.md
          test -f docs/PRODUCTION_READINESS_MATRIX.md
          echo "Promotion validation passed"
