name: Deprecated api.devonn.ai Route 53 CNAME

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'This workflow is deprecated. Configure api.d3vonn.io in Hostinger/Railway instead.'
        required: false
        default: 'deprecated'

permissions:
  contents: read

jobs:
  deprecated:
    name: Deprecated API DNS workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop obsolete api.devonn.ai workflow
        run: |
          echo "This workflow is intentionally disabled."
          echo "devonn.ai is expired and no longer canonical."
          echo "Use api.d3vonn.io for the production API."
          echo "If the API remains on Railway, attach api.d3vonn.io in Railway first."
          echo "Then configure Hostinger DNS for api.d3vonn.io as Railway instructs."
          echo "Do not recreate Route 53 records for api.devonn.ai."
          exit 1
