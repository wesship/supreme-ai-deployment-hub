name: Certify Messari Production Configuration

on:
  pull_request:
    paths:
      - .github/workflows/activate-messari-production.yml
      - .github/scripts/certify_messari_production.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-messari-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify read-only Messari contract on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Certify live production health
        run: python3 .github/scripts/certify_messari_production.py

  certify:
    name: Certify protected Messari production health
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out certified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Certify live production health
        run: python3 .github/scripts/certify_messari_production.py
