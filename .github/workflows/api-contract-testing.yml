name: API Contract Testing

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - '.github/workflows/api-contract-testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openapi-spec:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest
      - name: Validate OpenAPI spec
        run: |
          redocly lint api/openapi.yaml --format=stylish
          echo "OpenAPI spec is valid"
      - name: Check for breaking changes (on PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:api/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null || true
          if [ -s /tmp/base-openapi.yaml ]; then
            npx @optic/api-checks@latest compare \
              --from /tmp/base-openapi.yaml \
              --to api/openapi.yaml \
              --check breaking-changes || \
              echo "::warning::Potential breaking changes detected in API spec"
          else
            echo "No base spec found - skipping breaking change detection"
          fi

  contract-test-live:
    name: Contract Tests (Configured Environment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set target environment
        id: target
        env:
          REQUESTED_ENV: ${{ github.event.inputs.environment || 'production' }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ "$REQUESTED_ENV" = "staging" ]; then
            API_BASE_URL="$STAGING_API_URL"
          else
            API_BASE_URL="${PRODUCTION_API_URL:-https://api.d3vonn.io}"
          fi
          if [ -z "$API_BASE_URL" ]; then
            echo "::notice::$REQUESTED_ENV API URL is not configured; skipping live contract tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "api_base_url=${API_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.target.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Dredd
        if: steps.target.outputs.skip != 'true'
        run: npm install -g dredd@latest
      - name: Run contract tests
        if: steps.target.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ steps.target.outputs.api_base_url }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$API_TOKEN" ]; then
            EXTRA_ARGS+=(--header "Authorization: Bearer $API_TOKEN")
          fi
          dredd api/openapi.yaml "$API_BASE_URL" \
            "${EXTRA_ARGS[@]}" \
            --reporter=xunit \
            --output=/tmp/dredd-results.xml
      - name: Upload contract test results
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-test-results-${{ github.run_id }}
          path: /tmp/dredd-results.xml
          if-no-files-found: ignore
          retention-days: 14

  schema-drift-detection:
    name: Schema Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Validate API spec completeness
        run: |
          python3 - <<'PYEOF'
          import sys
          import yaml

          with open("api/openapi.yaml", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)

          errors = []
          warnings = []
          for path, methods in spec.get("paths", {}).items():
              for method, operation in methods.items():
                  if method in {"get", "post", "put", "patch", "delete"}:
                      if not operation.get("operationId"):
                          errors.append(f"Missing operationId: {method.upper()} {path}")
                      if not operation.get("tags"):
                          warnings.append(f"Missing tags: {method.upper()} {path}")
                      if not operation.get("summary"):
                          warnings.append(f"Missing summary: {method.upper()} {path}")
                      if not operation.get("responses"):
                          errors.append(f"No responses documented: {method.upper()} {path}")

          schemas = spec.get("components", {}).get("schemas", {})
          for name, schema in schemas.items():
              if schema.get("type") == "object" and not schema.get("properties"):
                  warnings.append(f"Schema '{name}' has no properties defined")

          for warning in warnings:
              print(f"::warning::{warning}")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print(f"API spec validation passed: {len(spec.get('paths', {}))} paths, {len(schemas)} schemas")
          PYEOF
