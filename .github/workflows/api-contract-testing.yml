name: API Contract Testing

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - 'tests/api/**'
      - 'tests/contract/test_moneyhub_*.py'
      - 'supabase/migrations/*moneyhub*.sql'
      - '.github/workflows/api-contract-testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - 'tests/api/**'
      - 'tests/contract/test_moneyhub_*.py'
      - 'supabase/migrations/*moneyhub*.sql'
      - '.github/workflows/api-contract-testing.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openapi:
    name: Validate OpenAPI 3.1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml --format=stylish

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Validate operation metadata
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path('api/openapi.yaml').read_text(encoding='utf-8'))
          methods = {'get', 'post', 'put', 'patch', 'delete'}
          errors = []
          operation_ids = set()
          operation_count = 0

          for path, path_item in spec.get('paths', {}).items():
              for method, operation in path_item.items():
                  if method not in methods:
                      continue
                  operation_count += 1
                  for field in ('operationId', 'summary', 'responses'):
                      if not operation.get(field):
                          errors.append(f'{method.upper()} {path}: missing {field}')
                  operation_id = operation.get('operationId')
                  if operation_id:
                      if operation_id in operation_ids:
                          errors.append(f'Duplicate operationId: {operation_id}')
                      operation_ids.add(operation_id)

          if operation_count == 0:
              errors.append('No API operations are documented')

          for error in errors:
              print(f'::error::{error}')
          if errors:
              sys.exit(1)
          print(f'Validated {operation_count} operations with unique metadata')
          PY

      - name: Detect structural breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:api/openapi.yaml" > /tmp/base-openapi.yaml
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          base = yaml.safe_load(Path('/tmp/base-openapi.yaml').read_text(encoding='utf-8'))
          head = yaml.safe_load(Path('api/openapi.yaml').read_text(encoding='utf-8'))
          methods = {'get', 'post', 'put', 'patch', 'delete'}
          errors = []

          for path, base_item in base.get('paths', {}).items():
              if path not in head.get('paths', {}):
                  errors.append(f'Removed path: {path}')
                  continue
              head_item = head['paths'][path]
              for method, base_operation in base_item.items():
                  if method not in methods:
                      continue
                  if method not in head_item:
                      errors.append(f'Removed operation: {method.upper()} {path}')
                      continue
                  head_operation = head_item[method]
                  base_responses = set(base_operation.get('responses', {}))
                  head_responses = set(head_operation.get('responses', {}))
                  for status in sorted(base_responses - head_responses):
                      errors.append(f'Removed response {status}: {method.upper()} {path}')

                  def required_parameters(operation):
                      result = set()
                      for parameter in operation.get('parameters', []):
                          if parameter.get('required'):
                              result.add((parameter.get('in'), parameter.get('name')))
                      return result

                  newly_required = required_parameters(head_operation) - required_parameters(base_operation)
                  for location, name in sorted(newly_required):
                      errors.append(f'New required parameter {location}:{name}: {method.upper()} {path}')

          for error in errors:
              print(f'::error::{error}')
          if errors:
              sys.exit(1)
          print('No structural breaking changes detected')
          PY

  moneyhub-contracts:
    name: MoneyHub safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'

      - name: Run MoneyHub static safety contracts
        run: |
          python -m pytest -q \
            tests/api/test_moneyhub_router_contract.py \
            tests/contract/test_moneyhub_*.py

  contract-test-live:
    name: Schemathesis contract tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Schemathesis
        run: python -m pip install --disable-pip-version-check 'schemathesis==3.38.5'

      - name: Select configured target
        id: target
        env:
          REQUESTED_ENV: ${{ github.event.inputs.environment || 'staging' }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [[ "$REQUESTED_ENV" == 'production' ]]; then
            API_BASE_URL="$PRODUCTION_API_URL"
          else
            API_BASE_URL="$STAGING_API_URL"
          fi
          if [[ -z "$API_BASE_URL" ]]; then
            echo "::notice::$REQUESTED_ENV API URL is not configured; skipping live tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "api_base_url=${API_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run property-based contract tests
        if: steps.target.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ steps.target.outputs.api_base_url }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          args=(run api/openapi.yaml --base-url "$API_BASE_URL" --checks all --max-examples 25 --junit-xml schemathesis-results.xml)
          if [[ -n "$API_TOKEN" ]]; then
            args+=(--header "Authorization: Bearer $API_TOKEN")
          fi
          schemathesis "${args[@]}"

      - name: Upload contract-test results
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schemathesis-results-${{ github.run_id }}
          path: schemathesis-results.xml
          if-no-files-found: warn
          retention-days: 14
