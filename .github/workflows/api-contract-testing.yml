name: API Contract Testing

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - '.github/workflows/api-contract-testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - '.github/workflows/api-contract-testing.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openapi-spec:
    name: Validate OpenAPI specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Lint OpenAPI 3.1 specification
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml --format=stylish

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- api/openapi.yaml; then
            echo "OpenAPI specification is unchanged; skipping breaking-change comparison"
            exit 0
          fi

          git show "origin/${{ github.base_ref }}:api/openapi.yaml" > /tmp/base-openapi.yaml
          npx --yes @optic/api-checks@0.6.2 compare \
            --from /tmp/base-openapi.yaml \
            --to api/openapi.yaml \
            --check breaking-changes

  schema-completeness:
    name: Validate documented route coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Validate operation metadata
        run: |
          python - <<'PY'
          import sys
          import yaml
          from pathlib import Path

          spec = yaml.safe_load(Path('api/openapi.yaml').read_text(encoding='utf-8'))
          errors = []
          methods = {'get', 'post', 'put', 'patch', 'delete'}
          operations = 0
          for path, item in spec.get('paths', {}).items():
              for method, operation in item.items():
                  if method not in methods:
                      continue
                  operations += 1
                  for key in ('operationId', 'summary', 'responses'):
                      if not operation.get(key):
                          errors.append(f'{method.upper()} {path}: missing {key}')
          if operations == 0:
              errors.append('No API operations are documented')
          for error in errors:
              print(f'::error::{error}')
          if errors:
              sys.exit(1)
          print(f'Validated {operations} documented API operations')
          PY

  contract-test-live:
    name: Schemathesis contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Schemathesis
        run: python -m pip install --disable-pip-version-check 'schemathesis==3.38.5'

      - name: Select target
        id: target
        env:
          REQUESTED_ENV: ${{ github.event.inputs.environment || 'production' }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ "$REQUESTED_ENV" = 'staging' ]; then
            API_BASE_URL="$STAGING_API_URL"
          else
            API_BASE_URL="${PRODUCTION_API_URL:-https://api.d3vonn.io}"
          fi
          test -n "$API_BASE_URL"
          echo "api_base_url=${API_BASE_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Run property-based contract tests
        env:
          API_BASE_URL: ${{ steps.target.outputs.api_base_url }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          args=(run api/openapi.yaml --base-url "$API_BASE_URL" --checks all --max-examples 25 --junit-xml schemathesis-results.xml)
          if [ -n "$API_TOKEN" ]; then
            args+=(--header "Authorization: Bearer $API_TOKEN")
          fi
          schemathesis "${args[@]}"

      - name: Upload contract-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schemathesis-results-${{ github.run_id }}
          path: schemathesis-results.xml
          if-no-files-found: warn
          retention-days: 14
