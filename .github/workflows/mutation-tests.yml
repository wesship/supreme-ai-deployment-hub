name: Mutation Tests

on:
  schedule:
    - cron: "0 4 * * 1"   # Every Monday at 4 AM UTC
  workflow_dispatch:

concurrency:
  group: mutation-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutmut:
    name: Python Mutation Tests (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mutmut pytest pytest-asyncio

      - name: Run mutmut
        run: |
          mutmut run --paths-to-mutate=auth/,mesh/,tasks/ \
            --runner="python -m pytest tests/ -x -q" \
            --no-progress || true

      - name: Show mutation results
        continue-on-error: true
        run: mutmut results || echo '::warning::No mutation results (mutmut not run or no mutations found)'

      - name: Upload mutmut cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mutmut-results
          path: backend/.mutmut-cache
          retention-days: 7

  stryker:
    name: TypeScript Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --include=dev

      - name: Run Stryker
        run: npx stryker run || true

      - name: Upload Stryker report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7
