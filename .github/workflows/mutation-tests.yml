name: Mutation Tests

on:
  schedule:
    - cron: "0 4 * * 1"   # Every Monday at 4 AM UTC
  workflow_dispatch:

concurrency:
  group: mutation-tests
  cancel-in-progress: true

jobs:
  mutmut:
    name: Python Mutation Tests (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mutmut pytest pytest-asyncio

      - name: Run mutmut
        run: |
          mutmut run --paths-to-mutate=auth/,mesh/,tasks/ \
            --runner="python -m pytest tests/ -x -q" \
            --no-progress || true

      - name: Show mutation results
        continue-on-error: true
        run: mutmut results || echo '::warning::No mutation results (mutmut not run or no mutations found)'

      - name: Upload mutmut cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mutmut-results
          path: backend/.mutmut-cache
          retention-days: 7

  stryker:
    name: TypeScript Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Stryker
        run: npx stryker run || true

      - name: Upload Stryker report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7
