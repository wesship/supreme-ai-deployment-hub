version: '3.9'

# Devonn.AI — VPS/Local Docker Stack
#
# Important deployment note:
# Supabase migration files under ./supabase/migrations use Supabase-only auth helpers
# such as auth.uid(). A plain postgres container does not provide the Supabase
# auth schema, so those migrations must NOT be mounted into docker-entrypoint-initdb.d.
# Use the hosted Supabase project for Supabase migrations, or run the full Supabase
# local stack separately.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - devonn-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://devonn:devonn_secret@db:5432/devonn_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devonn-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devonn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonn_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devonn_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devonn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devonn} -d $${POSTGRES_DB:-devonn_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - devonn-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - devonn-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  devonn-net:
    driver: bridge
