name: devonn-staging

# Root staging foundation.
#
# This file defines the target runtime topology. The app services use
# ./services/* build contexts, which should be populated by the extraction PR.
# Until then, run only the infra profile:
#
#   docker compose up postgres redis qdrant
#
# After services are extracted:
#
#   docker compose --profile app up --build

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.staging.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: ./services/api
    profiles: ["app"]
    env_file:
      - .env.staging.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  orchestrator:
    build:
      context: ./services/orchestrator
    profiles: ["app"]
    env_file:
      - .env.staging.local
    ports:
      - "7373:7373"
      - "7374:7374"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/workers
    profiles: ["app"]
    env_file:
      - .env.staging.local
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./services/frontend
    profiles: ["app"]
    env_file:
      - .env.staging.local
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
