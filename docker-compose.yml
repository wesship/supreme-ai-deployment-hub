name: devonn-staging

# Root staging foundation.
#
# Cut 1 wires frontend and API as service adapters while preserving the
# current repo layout. The Docker build context stays at repo root and each
# service uses its own Dockerfile under services/*.
#
# Core app validation:
#
#   docker compose --profile app up --build frontend api postgres redis qdrant
#   curl -f http://localhost:8000/health
#   curl -f http://localhost:8000/ready

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.staging.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["app"]
    env_file:
      - .env.staging.local
    environment:
      ENVIRONMENT: staging
      AUTONOMY_MODE: guarded
      EXECUTION_MODE: dry-run
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  orchestrator:
    build:
      context: ./services/orchestrator
    profiles: ["app"]
    env_file:
      - .env.staging.local
    ports:
      - "7373:7373"
      - "7374:7374"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/workers
    profiles: ["app"]
    env_file:
      - .env.staging.local
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    profiles: ["app"]
    env_file:
      - .env.staging.local
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ORCHESTRATOR_URL: ${VITE_ORCHESTRATOR_URL:-http://localhost:7373}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
