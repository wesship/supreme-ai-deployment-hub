# SOC 2 Type II Control Mapping for D3VONN.IO Platform
# Maps CI/CD platform capabilities to SOC 2 Trust Service Criteria (TSC)
# Evidence is automatically generated by CI workflows and stored as artifacts.

metadata:
  standard: SOC 2 Type II
  version: 2017 Trust Services Criteria
  organization: D3VONN.IO (wesship/supreme-ai-deployment-hub)
  last_updated: "2026-05-20"
  evidence_retention_days: 365

# CC1: Control Environment
cc1:
  cc1.1:
    title: Integrity and Ethical Values
    description: Management demonstrates commitment to integrity and ethical values
    evidence_sources:
      - type: branch_protection
        workflow: security-hardening.yml
        artifact: branch-protection-verification-*
        frequency: weekly
      - type: code_review_requirement
        description: All changes require PR review (branch protection enforced)
        automated: true

  cc1.2:
    title: Board Independence and Oversight
    description: Board of directors demonstrates independence and exercises oversight
    evidence_sources:
      - type: deployment_approval
        workflow: deployment-promotion.yml
        artifact: deployment-approval-*
        frequency: per_deployment
        note: Manual approval required for production deployments

# CC2: Communication and Information
cc2:
  cc2.1:
    title: Information Quality
    description: Obtains or generates relevant, quality information to support internal controls
    evidence_sources:
      - type: sbom
        workflow: sbom-generation.yml
        artifact: sbom-cyclonedx-*
        frequency: per_release
      - type: vulnerability_scan
        workflow: sbom-generation.yml
        artifact: grype-vulnerability-report-*
        frequency: per_release
      - type: dependency_audit
        workflow: security-hardening.yml
        artifact: security-hardening-report-*
        frequency: weekly

# CC6: Logical and Physical Access Controls
cc6:
  cc6.1:
    title: Logical Access Security Software
    description: Implements logical access security software, infrastructure, and architectures
    evidence_sources:
      - type: oidc_federation
        workflow: oidc-deploy.yml
        description: No long-lived credentials; OIDC tokens used for cloud access
        automated: true
      - type: vault_secrets
        workflow: vault-secrets-injection.yml
        description: Ephemeral 1h TTL secrets via HashiCorp Vault OIDC
        automated: true
      - type: branch_protection
        workflow: security-hardening.yml
        artifact: branch-protection-verification-*
        frequency: weekly

  cc6.2:
    title: Prior to Issuing System Credentials
    description: Prior to issuing system credentials, the entity registers and authorizes new users
    evidence_sources:
      - type: action_pin_audit
        workflow: security-hardening.yml
        description: All GitHub Actions pinned to SHA (no mutable credentials via tags)
        automated: true

  cc6.3:
    title: Role-Based Access Control
    description: The entity authorizes, modifies, or removes access based on roles
    evidence_sources:
      - type: kyverno_admission
        workflow: kyverno-admission.yml
        artifact: kyverno-policy-report-*
        description: Kyverno ClusterPolicies enforce namespace-based RBAC at admission
        frequency: weekly

  cc6.6:
    title: Logical Access Security Measures
    description: Logical access security measures restrict access to information assets
    evidence_sources:
      - type: secret_scanning
        workflow: secrets-elimination.yml
        artifact: secrets-elimination-report-*
        frequency: daily
      - type: gitleaks_scan
        workflow: secrets-elimination.yml
        description: Full git history scanned for credential leaks
        frequency: daily

  cc6.7:
    title: Transmission of Data
    description: Restricts transmission of data to authorized users and processes
    evidence_sources:
      - type: artifact_signing
        workflow: cosign-sign-verify.yml
        description: All artifacts signed with Cosign; unsigned artifacts blocked
        automated: true
      - type: provenance_attestation
        workflow: artifact-provenance.yml
        artifact: promotion-approval-*
        frequency: per_deployment

  cc6.8:
    title: Prevention of Unauthorized Software
    description: Prevents or detects and acts upon introduction of unauthorized software
    evidence_sources:
      - type: signed_image_enforcement
        workflow: kyverno-admission.yml
        description: Kyverno blocks unsigned images at Kubernetes admission
        automated: true
      - type: distroless_enforcement
        workflow: kyverno-admission.yml
        description: Kyverno blocks non-distroless images in production namespace
        automated: true
      - type: falco_detection
        workflow: falco-runtime-detection.yml
        artifact: falco-validation-report-*
        description: Falco detects package manager execution in containers
        frequency: per_deployment

# CC7: System Operations
cc7:
  cc7.1:
    title: Detection and Monitoring Procedures
    description: Detects and monitors for new vulnerabilities on an ongoing basis
    evidence_sources:
      - type: vulnerability_scan
        workflow: sbom-generation.yml
        artifact: grype-vulnerability-report-*
        frequency: weekly
      - type: dependabot_alerts
        description: Automated Dependabot vulnerability alerts enabled
        automated: true
      - type: npm_audit
        workflow: security-hardening.yml
        frequency: per_pr

  cc7.2:
    title: Monitoring for Anomalies and Indicators of Compromise
    description: Monitors system components for anomalies and indicators of compromise
    evidence_sources:
      - type: falco_runtime
        workflow: falco-runtime-detection.yml
        description: 9 Falco rules covering RCE, privilege escalation, container escape
        automated: true
      - type: ebpf_telemetry
        workflow: ebpf-telemetry.yml
        artifact: ebpf-telemetry-*
        description: Cilium Tetragon process ancestry and syscall correlation
        frequency: weekly
      - type: chaos_engineering
        workflow: chaos-engineering.yml
        artifact: chaos-report-*
        frequency: weekly

  cc7.3:
    title: Evaluation of Security Events
    description: Evaluates security events to determine whether they could or have resulted in a failure
    evidence_sources:
      - type: autonomous_remediation
        workflow: autonomous-remediation.yml
        artifact: incident-INC-*
        description: Automated incident triage with 7-level decision matrix
        frequency: per_incident

  cc7.4:
    title: Incident Response
    description: Responds to identified security incidents by executing a defined incident response program
    evidence_sources:
      - type: incident_reports
        workflow: autonomous-remediation.yml
        artifact: incident-INC-*
        retention_days: 365
        frequency: per_incident
      - type: rollback_records
        workflow: autonomous-remediation.yml
        description: Automatic rollback with audit trail for critical incidents
        automated: true

# CC8: Change Management
cc8:
  cc8.1:
    title: Change Management Process
    description: Authorizes, designs, develops, tests, approves, and implements changes
    evidence_sources:
      - type: pr_reviews
        description: All changes require PR review (branch protection)
        automated: true
      - type: ci_gates
        workflow: hermes-gate.yml
        description: Hermes gate must pass before merge
        automated: true
      - type: deployment_promotion
        workflow: deployment-promotion.yml
        artifact: deployment-approval-*
        description: dev -> staging -> canary -> production promotion gates
        frequency: per_deployment
      - type: lockfile_integrity
        workflow: lockfile-integrity.yml
        description: Lockfile drift detection on every dependency change
        automated: true

# CC9: Risk Mitigation
cc9:
  cc9.1:
    title: Risk Mitigation Activities
    description: Identifies, selects, and develops risk mitigation activities
    evidence_sources:
      - type: policy_as_code
        workflow: policy-as-code.yml
        description: OPA/Conftest policies enforce workflow standards and deployment gates
        automated: true
      - type: kyverno_policies
        workflow: kyverno-admission.yml
        artifact: kyverno-policy-report-*
        description: 5 Kyverno ClusterPolicies enforce runtime security at admission
        frequency: weekly
      - type: reproducible_builds
        workflow: reproducible-builds.yml
        description: Hermetic builds with byte-for-byte verification
        automated: true
