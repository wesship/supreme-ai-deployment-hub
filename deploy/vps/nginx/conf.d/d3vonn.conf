# =============================================================================
# D3VONN.IO — VPS Virtual Host Configuration
# =============================================================================
# HTTP stays available for ACME challenges and redirects API traffic to HTTPS.
# HTTPS terminates TLS inside the VPS Nginx container and routes api.d3vonn.io
# directly to the FastAPI backend container.
#
# Expected certificate paths inside the Nginx container:
#   /etc/nginx/ssl/live/api.d3vonn.io/fullchain.pem
#   /etc/nginx/ssl/live/api.d3vonn.io/privkey.pem
# The docker-compose.yml mount maps deploy/vps/ssl/certs to /etc/nginx/ssl.
#
# NOTE: The HTTPS server blocks are guarded by a map so Nginx will start even
# when certificates have not yet been provisioned (first-boot / pre-SSL).
# Run deploy/vps/ssl/init-ssl.sh once to obtain certificates, then restart
# Nginx.  The certbot container handles automatic renewal thereafter.
# =============================================================================

# HTTP bootstrap + ACME + redirect for API domain.
server {
    listen 80;
    listen [::]:80;
    server_name api.d3vonn.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Allow plain-HTTP health checks before TLS is provisioned.
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location /health/live {
        access_log off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /health/ready {
        access_log off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API virtual host.
# This block is skipped if the certificate files do not yet exist.
# Run ssl/init-ssl.sh first, then recreate the nginx container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.d3vonn.io;

    ssl_certificate /etc/nginx/ssl/live/api.d3vonn.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.d3vonn.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Proxy buffering — disable for streaming / SSE endpoints.
    proxy_buffering off;
    proxy_request_buffering off;

    location /health {
        access_log off;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health/live {
        access_log off;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health/ready {
        access_log off;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# HTTP frontend virtual host — serves the React SPA.
server {
    listen 80;
    listen [::]:80;
    server_name d3vonn.io www.d3vonn.io;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.d3vonn.io https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /grafana/ {
        return 503 "Grafana is not enabled on this VPS stack.\n";
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|docker-compose|Dockerfile) {
        deny all;
        return 404;
    }
}

# Catch-all: return 444 for unknown vhosts (no server_name match).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
