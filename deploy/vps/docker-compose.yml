# =============================================================================
# D3VONN.IO — Production Docker Compose for Hostinger VPS
# =============================================================================
# Target: Ubuntu 24.04 LTS | 4 vCPU | 16 GB RAM | 200 GB NVMe SSD
#
# Production services only:
#   Nginx (reverse proxy + SSL) → React Frontend
#                                → FastAPI Backend
#   Redis (cache/queue broker)
#   Hermes Orchestrator
#   Celery Worker / Beat
#   Certbot renewal
#
# Placeholder agent containers were intentionally removed from production compose.
# Add dedicated agent services back only when they run real modules with real
# health/readiness behavior.
#
# External managed services (not containerized):
#   - Supabase (database/auth)
#   - Pinecone (vector database)
#   - OpenAI / Anthropic / Gemini APIs
#   - Twilio
#   - GitHub
#
# Usage:
#   docker compose --env-file env/.env.production -f docker-compose.yml up -d --build
#   docker compose --env-file env/.env.production -f docker-compose.yml logs -f
#   docker compose --env-file env/.env.production -f docker-compose.yml down
# =============================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: d3vonn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl/certs:/etc/nginx/ssl:ro
      - ./ssl/webroot:/var/www/certbot:ro
      - ./nginx/logs:/var/log/nginx
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - d3vonn-public
      - d3vonn-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  frontend:
    build:
      context: ../../
      dockerfile: Dockerfile.frontend
      target: builder
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.d3vonn.io}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_ANON_KEY}}
        - VITE_ENVIRONMENT=production
    container_name: d3vonn-frontend-builder
    volumes:
      - frontend_build:/output
    command: ["sh", "-c", "rm -rf /output/* && cp -r /app/dist/* /output/"]
    networks:
      - d3vonn-internal

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: d3vonn-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      # The application also runs on the production VPS, where the historical
      # Railway-specific worker guard is not injected automatically.
      - RAILWAY_ENVIRONMENT_NAME=production
      # ── Supabase ──────────────────────────────────────────────────────────
      - SUPABASE_URL=${SUPABASE_URL}
      # The VPS deployment provisioner stores the publishable key under the
      # VITE-prefixed name; this backend alias is required for RLS-scoped jobs.
      - SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # ── Redis / Celery ────────────────────────────────────────────────────
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      # ── AI Providers ──────────────────────────────────────────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      # ── AI Films production execution ────────────────────────────────────
      - AI_FILM_GENERATION_EXECUTION_ENABLED=${AI_FILM_GENERATION_EXECUTION_ENABLED:-true}
      - AI_FILM_GENERATED_SHOT_QA_ENABLED=${AI_FILM_GENERATED_SHOT_QA_ENABLED:-true}
      - AI_FILM_ASSEMBLY_WORKER_ENABLED=${AI_FILM_ASSEMBLY_WORKER_ENABLED:-true}
      - AI_FILM_EXECUTABLE_VIDEO_PROVIDERS=${AI_FILM_EXECUTABLE_VIDEO_PROVIDERS:-openai}
      - AI_FILM_OPENAI_VIDEO_MODEL=${AI_FILM_OPENAI_VIDEO_MODEL:-sora-2}
      - AI_FILM_RENDER_BUCKET=${AI_FILM_RENDER_BUCKET:-ai-film-renders}
      - TWELVELABS_API_KEY=${TWELVELABS_API_KEY:-}
      - TWELVELABS_KNOWLEDGE_STORE_ID=${TWELVELABS_KNOWLEDGE_STORE_ID:-}
      # ── Pinecone / RAG ────────────────────────────────────────────────────
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_INDEX=${PINECONE_INDEX_NAME:-devonn-rag}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-devonn-rag}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      # ── Auth / Security ───────────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_VAULT_SECRET=${API_KEY_VAULT_SECRET}
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN}
      # ── CORS ──────────────────────────────────────────────────────────────
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS_RAW:-https://d3vonn.io,https://www.d3vonn.io,https://app.d3vonn.io}
      - ALLOWED_ORIGINS_RAW=${ALLOWED_ORIGINS_RAW:-https://d3vonn.io,https://www.d3vonn.io,https://app.d3vonn.io}
      - CORS_ORIGINS=${ALLOWED_ORIGINS_RAW:-https://d3vonn.io,https://www.d3vonn.io,https://app.d3vonn.io}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-}
      # ── Optional integrations ─────────────────────────────────────────────
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - VITE_API_URL=${VITE_API_URL:-https://api.d3vonn.io}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d3vonn-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  hermes:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: d3vonn-hermes
    restart: unless-stopped
    command: ["python", "-m", "hermes.worker"]
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_INDEX=${PINECONE_INDEX_NAME:-devonn-rag}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-devonn-rag}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - HERMES_MODE=orchestrator
      - HERMES_MAX_CONCURRENT_TASKS=${HERMES_MAX_CONCURRENT_TASKS:-10}
      - HERMES_POLL_INTERVAL_SECONDS=${HERMES_POLL_INTERVAL_SECONDS:-10}
      - HERMES_MAX_TASKS_PER_TICK=${HERMES_MAX_TASKS_PER_TICK:-5}
      - HERMES_DEFAULT_AGENT=${HERMES_DEFAULT_AGENT:-TARS}
      - HERMES_PERSISTENT_WORKERS_ENABLED=${HERMES_PERSISTENT_WORKERS_ENABLED:-false}
      - HERMES_WORKER_ID=${HERMES_WORKER_ID:-d3vonn-hermes-vps}
      - HERMES_WORKER_REGION=${HERMES_WORKER_REGION:-vps}
      - HERMES_WORKER_CAPABILITIES=${HERMES_WORKER_CAPABILITIES:-task-dispatch}
      - HERMES_WORKER_HEARTBEAT_TIMEOUT_SECONDS=${HERMES_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-90}
      - HERMES_WORKER_LEASE_TTL_SECONDS=${HERMES_WORKER_LEASE_TTL_SECONDS:-300}
      # ── Auth / Security ───────────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_VAULT_SECRET=${API_KEY_VAULT_SECRET}
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - d3vonn-internal
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: d3vonn-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "tasks:celery", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=100"]
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_INDEX=${PINECONE_INDEX_NAME:-devonn-rag}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-devonn-rag}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # ── Auth / Security ───────────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_VAULT_SECRET=${API_KEY_VAULT_SECRET}
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d3vonn-internal
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "0.75"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: d3vonn-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "tasks:celery", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_VAULT_SECRET=${API_KEY_VAULT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d3vonn-internal
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    container_name: d3vonn-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    networks:
      - d3vonn-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: d3vonn-certbot
    volumes:
      - ./ssl/certs:/etc/letsencrypt
      - ./ssl/webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - d3vonn-public
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.1"

volumes:
  redis_data:
    driver: local
  frontend_build:
    driver: local

networks:
  d3vonn-public:
    driver: bridge
  d3vonn-internal:
    driver: bridge
