# =============================================================================
# D3VONN.IO — Alertmanager Configuration
# =============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "warning"
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://backend:8000/api/webhooks/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://backend:8000/api/webhooks/alerts"
        send_resolved: true
    # Uncomment and configure for email/Slack/PagerDuty:
    # email_configs:
    #   - to: "ops@d3vonn.io"
    #     from: "alerts@d3vonn.io"
    #     smarthost: "smtp.example.com:587"
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/..."
    #     channel: "#d3vonn-alerts"
    #     title: "{{ .GroupLabels.alertname }}"
    #     text: "{{ .CommonAnnotations.description }}"

  - name: "warning"
    webhook_configs:
      - url: "http://backend:8000/api/webhooks/alerts"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
