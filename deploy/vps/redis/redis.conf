# =============================================================================
# D3VONN.IO — Redis Production Configuration
# =============================================================================
# Optimized for 16 GB RAM VPS with multiple services sharing Redis

# Network
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence (AOF + RDB for durability)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Security
# requirepass is set via environment variable or command line
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Performance
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client limits
maxclients 1000

# Lua scripting timeout
lua-time-limit 5000
