# Environment: canary
# Managed by: GitOps (ArgoCD)
environment: canary

replicaCount: 1

image:
  repository: ghcr.io/wesship/devonn-api
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

logging:
  level: debug

featureFlags:
  newAIModels: false
  betaVoiceAPI: false
  experimentalMesh: false
